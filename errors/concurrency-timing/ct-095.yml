    label: 'GitHub Docs: Controlling the concurrency of workflows and jobs'
  - url: 'https://github.blog/changelog/2021-04-19-github-actions-limit-workflow-run-or-job-concurrency/'
    label: 'GitHub Changelog: Limit workflow run or job concurrency (April 2021)'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#concurrency'
    label: 'GitHub Docs: Workflow syntax — concurrency'
  - url: 'https://github.com/orgs/community/discussions/5435'
    label: 'GitHub Community #5435: Concurrency group cancels pull_request checks when pushing to PR branch'
