    label: "GitHub Docs — Defining the maximum number of concurrent jobs"
  - url: "https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs"
    label: "GitHub Docs — Control the concurrency of workflows and jobs"
  - url: "https://stackoverflow.com/questions/73441260/how-to-set-concurency-x-for-limiting-number-of-concurrent-workflows-in-github"
    label: "Stack Overflow #73441260 — Limiting concurrent GitHub Actions workflows"
  - url: "https://github.com/orgs/community/discussions/102771"
    label: "GitHub Community Discussion #102771 — max-parallel across multiple concurrent runs"
