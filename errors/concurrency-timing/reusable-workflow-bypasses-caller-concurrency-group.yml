    label: "GitHub Docs — Control the concurrency of workflows and jobs"
  - url: "https://docs.github.com/en/actions/sharing-automations/reusing-workflows"
    label: "GitHub Docs — Reusing workflows"
  - url: "https://stackoverflow.com/questions/77021903/how-can-i-stop-reusable-workflows-called-from-a-caller-workflow-in-github-action"
    label: "Stack Overflow #77021903 — Stop reusable workflows from racing with caller concurrency"
  - url: "https://github.com/orgs/community/discussions/30708"
    label: "GitHub Community Discussion #30708 — Reusable workflow concurrency group inheritance"
  - url: "https://github.com/orgs/community/discussions/88761"
    label: "GitHub Community Discussion #88761 — Concurrent callers and reusable workflow race conditions"
