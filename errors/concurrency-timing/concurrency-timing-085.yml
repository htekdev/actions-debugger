id: concurrency-timing-085
title: '`github.ref` in concurrency group of `workflow_run`-triggered workflow always evaluates to the listener''s default-branch ref — all downstream runs collapse into one slot'
category: concurrency-timing
severity: silent-failure
tags:
  - concurrency
  - workflow_run
  - github-ref
  - default-branch
  - group-collision
  - serialization
  - downstream-workflow
patterns:
  - regex: 'on:\s+workflow_run:'
    flags: 'si'
  - regex: 'concurrency.*github\.ref.*workflow_run|workflow_run.*concurrency.*github\.ref'
    flags: 'si'
  - regex: 'Canceling since a higher priority waiting request for ''[^'']+-refs/heads/(main|master)'' exists'
    flags: 'i'
error_messages:
  - 'Canceling since a higher priority waiting request for ''deploy-refs/heads/main'' exists'
  - 'All workflow_run-triggered runs share the same concurrency group — serialized to single slot'
root_cause: |
  When a workflow is triggered by the `workflow_run` event, the `github.ref` context
  variable evaluates to the ref of the **listener** workflow file — typically
  `refs/heads/main` (or whichever branch the listener workflow lives on) — NOT the
  head branch of the upstream workflow run that triggered it.

  A common concurrency pattern looks like:

  ```yaml
  on:
    workflow_run:
      workflows: [CI]
      types: [completed]

  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
  ```

  Because `github.ref` is always the listener's branch ref (e.g., `refs/heads/main`),
  every single `workflow_run`-triggered execution resolves the concurrency group to
  the same string, such as `deploy-refs/heads/main`. This means:

  1. **All downstream runs share one concurrency slot** — they are fully serialized.
  2. With `cancel-in-progress: true`, every new upstream CI completion cancels the
     currently-running downstream deploy job, even if the runs target completely
     different branches or PRs.
  3. The workflow author intended isolation per branch but gets global serialization.

  The correct context variable for differentiating by upstream branch is
  `github.event.workflow_run.head_branch`, which does reflect the branch that
  triggered the upstream workflow. However, that value is `null` for `schedule`- and
  `workflow_dispatch`-triggered upstream runs (documented separately in ct-055).

  Sources: GitHub Actions documentation on `workflow_run` event context variables;
  GitHub Community discussion #36606; actions/runner#1483.
fix: |
  Replace `github.ref` with `github.event.workflow_run.head_branch` to isolate
  concurrency groups by the upstream run's branch.

  Add a fallback for `schedule`/`workflow_dispatch`-triggered upstream runs where
  `head_branch` is null, to avoid collapsing all null-branch runs into one unnamed
  slot:

  ```yaml
  concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
    cancel-in-progress: true
  ```

  Using `github.event.workflow_run.id` as the fallback ensures each null-branch run
  gets its own unique slot rather than all collapsing together.
fix_code:
  - language: yaml
    label: 'Use github.event.workflow_run.head_branch instead of github.ref for per-branch concurrency isolation'
    code: |
      on:
        workflow_run:
          workflows: [CI]
          types: [completed]

      concurrency:
        # WRONG: github.ref is always the listener's branch — all runs share one slot
        # group: ${{ github.workflow }}-${{ github.ref }}

        # CORRECT: use the triggering workflow's head_branch for per-branch isolation
        # Fallback to workflow_run.id for schedule/dispatch-triggered parents (head_branch is null)
        group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
        cancel-in-progress: true

      jobs:
        deploy:
          runs-on: ubuntu-latest
          if: github.event.workflow_run.conclusion == 'success'
          steps:
            - name: Deploy
              run: echo "Deploying branch ${{ github.event.workflow_run.head_branch }}"
  - language: yaml
    label: 'Full example with per-PR isolation using head_sha as additional differentiator'
    code: |
      on:
        workflow_run:
          workflows: [CI]
          types: [completed]

      concurrency:
        group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
        cancel-in-progress: false   # Let each deploy complete; queue at most one per commit

      jobs:
        deploy:
          runs-on: ubuntu-latest
          if: github.event.workflow_run.conclusion == 'success'
          steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event.workflow_run.head_sha }}
            - run: ./deploy.sh
prevention:
  - 'Never use `github.ref` in the concurrency group of a `workflow_run`-triggered workflow — it always resolves to the listener workflow''s branch, not the upstream run''s branch.'
  - 'Use `github.event.workflow_run.head_branch` to scope concurrency groups by the upstream triggering branch.'
  - 'Add a null-safe fallback: `${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}` — `head_branch` is null when the upstream workflow was triggered by `schedule` or `workflow_dispatch`.'
  - 'Audit existing `workflow_run` workflows: search for `github.ref` in concurrency group expressions and replace with the appropriate `github.event.workflow_run.*` context.'
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run'
    label: 'GitHub Docs: workflow_run event — context variables and available properties'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/using-concurrency'
    label: 'GitHub Docs: Using concurrency in workflows'
  - url: 'https://github.com/orgs/community/discussions/36606'
    label: 'GitHub Community #36606: concurrency group in workflow_run-triggered workflow'
  - url: 'https://github.com/actions/runner/issues/1483'
    label: 'actions/runner #1483: github.ref context in workflow_run is the listener branch ref'
