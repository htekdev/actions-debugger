id: known-unsolved-103
title: 'checkout@v6 Credentials Fail Inside Docker Container Actions — No Workaround Available'
category: known-unsolved
severity: error
tags:
  - checkout
  - v6
  - docker
  - container-actions
  - credentials
  - git-auth
  - includeif
patterns:
  - regex: 'fatal: could not read Username for .https://github\.com.: No such device or address'
    flags: 'i'
  - regex: 'fatal: Authentication failed for .https://github\.com/'
    flags: 'i'
  - regex: 'remote: Repository not found\.'
    flags: 'i'
  - regex: 'git.*credential.*includeIf.*gitdir.*not.*found'
    flags: 'i'
error_messages:
  - "fatal: could not read Username for 'https://github.com': No such device or address"
  - "fatal: Authentication failed for 'https://github.com/org/repo.git'"
  - "remote: Repository not found."
  - "Error: The process '/usr/bin/git' failed with exit code 128"
root_cause: |
  actions/checkout@v6 changed the credential persistence mechanism from writing HTTP
  Authorization headers directly into .git/config (the v5 approach) to path-based
  includeIf.gitdir directives that reference a credentials file stored in $RUNNER_TEMP.

  The v6 release notes stated that this mechanism supports Docker container actions
  (steps using `uses: org/repo@version` where the action runs a Docker container)
  as long as the runner version is v2.329.0+. In practice, the credential resolver
  inside the container cannot find the credentials file because the path used in the
  includeIf directive references a host filesystem path that does not exist inside
  the container's namespace.

  Manual workarounds also fail: setting `persist-credentials: false` and manually
  writing credentials via `git config credential.helper store` or creating
  ~/.git-credentials does not persist into the Docker container action's isolated
  environment either, because each Docker container action runs in its own container
  with its own filesystem overlay.

  This is a fundamental incompatibility in checkout@v6's credential mechanism with
  Docker container actions. The issue was opened in January 2026 and remains open
  with no scheduled fix. The only working solution is to downgrade to checkout@v5,
  which uses Authorization headers written directly into .git/config — a mechanism
  that is visible inside Docker container action environments.
fix: |
  The only confirmed workaround is to pin to actions/checkout@v5 until GitHub fixes
  the v6 credential mechanism for Docker container actions. Do NOT attempt manual
  credential configuration — it will also fail.

  Downgrade to v5:
fix_code:
  - language: yaml
    label: 'Pin to actions/checkout@v5 until Docker container action support is fixed'
    code: |
      - name: Checkout repository
        uses: actions/checkout@v5   # v6 credential mechanism fails inside Docker container actions
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Docker container action that needs git auth
        uses: your-org/your-docker-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
prevention:
  - 'Avoid upgrading to checkout@v6 if any workflow step uses a Docker container action (steps where the action image uses `using: docker` in its action.yml)'
  - 'Check if your third-party actions are Docker container actions before upgrading checkout versions'
  - 'Monitor the upstream issue actions/checkout#2359 for a fix in a future v6 patch'
  - 'When evaluating checkout version upgrades, test on a branch with all Docker container action steps before rolling out'
docs:
  - url: 'https://github.com/actions/checkout/issues/2359'
    label: 'checkout@v6 credentials broken for Docker container actions (GitHub Issue)'
  - url: 'https://github.com/actions/checkout/releases/tag/v6.0.0'
    label: 'checkout@v6 release notes — Docker container action credential support claims'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-docker-container-action'
    label: 'GitHub Docs: Creating a Docker container action'
