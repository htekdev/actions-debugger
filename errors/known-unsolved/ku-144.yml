id: ku-144
title: '`background`, `parallel`, `wait`, and `cancel` Step Keywords Not Supported in Composite Actions'
category: known-unsolved
severity: limitation
tags:
  - composite-action
  - background
  - parallel
  - wait
  - cancel
  - parallel-steps
  - limitation
patterns:
  - regex: 'background is not supported'
    flags: 'i'
  - regex: 'background.*not supported.*composite'
    flags: 'i'
  - regex: 'parallel.*not supported.*composite'
    flags: 'i'
error_messages:
  - 'Error: background is not supported'
  - 'background is not supported in composite actions'
root_cause: |
  GitHub Actions added native parallel step execution on June 25, 2026, introducing
  four new keywords: `background: true`, `parallel:`, `wait`, and `cancel`. These
  keywords are only available in workflow-level step definitions
  (`jobs.<id>.steps[*]`). They are not available inside composite action
  `runs.steps[*]` definitions.

  Composite actions have a restricted feature set by design compared to JavaScript
  and Docker actions. Pre/post lifecycle hooks, background execution, and the new
  parallel step keywords are all unsupported in the composite action runtime. When
  you add `background: true` to a step inside a composite action, the runner throws
  "Error: background is not supported" at runtime — not at parse time — so the
  error only surfaces when the composite action is actually invoked.
fix: |
  Move the parallel step logic into the calling workflow YAML, not the composite
  action itself. Composite actions that need concurrency should be refactored into
  either a JavaScript action (which supports pre/post steps) or split into separate
  composite actions invoked via `parallel:` at the workflow level.

  There is no flag or workaround to enable these keywords inside a composite
  action — this is a platform-level limitation with no announced timeline for
  resolution as of June 2026.
fix_code:
  - language: yaml
    label: 'Move parallel execution to workflow level, not composite action'
    code: |
      # BAD: background: true inside composite action (.github/actions/my-action/action.yml)
      # runs:
      #   using: composite
      #   steps:
      #     - name: Build A
      #       background: true    # FAILS: background is not supported in composite
      #       run: ./build-a.sh
      #       shell: bash

      # GOOD: call composite actions from a parallel: block in the calling workflow
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - parallel:
                steps:
                  - name: Build A
                    uses: ./.github/actions/build-a
                  - name: Build B
                    uses: ./.github/actions/build-b
prevention:
  - 'Keep composite actions as pure sequential steps — move all concurrency orchestration to the calling workflow'
  - 'Use JavaScript actions (with pre/post lifecycle hooks) when you need cleanup steps tied to background work'
  - 'Run actionlint in CI — it flags unsupported keywords in composite action definitions'
docs:
  - url: 'https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/'
    label: 'GitHub Changelog — Actions steps can now be run in parallel (June 25, 2026)'
  - url: 'https://docs.github.com/en/actions/creating-actions/creating-a-composite-action'
    label: 'GitHub Docs — Creating a composite action'
  - url: 'https://github.com/actions/runner/issues/1478'
    label: 'actions/runner #1478 — Support pre and post steps in Composite Actions'
  - url: 'https://github.com/orgs/community/discussions/200172'
    label: 'Community Discussion — Parallel steps in composite actions'