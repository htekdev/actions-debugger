id: known-unsolved-119
title: 'Third-Party Action Repository Disabled or Deleted Causes "Unable to Resolve Action" — Supply-Chain Incident'
category: known-unsolved
severity: error
tags:
  - supply-chain
  - action-unavailable
  - third-party-action
  - miasma
  - azure
  - repository-disabled
  - ci-breakage
  - pin-sha
patterns:
  - regex: 'Unable to resolve action.*repository not found'
    flags: 'i'
  - regex: 'Error: An action could not be found at the URI.*github.com.*zipball'
    flags: 'i'
  - regex: 'Could not find.*action.*repository'
    flags: 'i'
  - regex: 'Action.*not found.*repository.*disabled'
    flags: 'i'
  - regex: 'fatal.*Could not read Username.*https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git'
    flags: 'i'
error_messages:
  - "Unable to resolve action 'Azure/functions-action@v1', repository not found."
  - "Error: An action could not be found at the URI 'https://api.github.com/repos/Azure/functions-action/zipball/v1'"
  - "##[error]Repository not found. Use actions that are publicly accessible."
root_cause: |
  A GitHub Actions workflow step references a third-party action (e.g. `uses: Azure/functions-action@v1`).
  If the upstream repository is disabled, deleted, made private, or renamed, the runner cannot download the
  action and the workflow fails immediately with "Unable to resolve action" or "repository not found."

  This is a known risk of using third-party actions pinned to mutable tags (e.g. @v1) rather than immutable
  commit SHAs. If the action repository is temporarily or permanently unavailable, there is no fallback.

  Real-world incident (June 5, 2026): The "Miasma" supply-chain attack targeted AI coding agents and caused
  GitHub to disable 73 Azure-owned repositories in rapid succession, including `Azure/functions-action`.
  Thousands of workflows failed simultaneously with repository-not-found errors for:
    - Azure/functions-action
    - Azure/webapps-deploy
    - Azure/container-apps-deploy
    - and 70+ additional Azure action repositories
  The repositories were restored within approximately 24–48 hours after investigation.

  Similar incidents have occurred previously (e.g. maintainer key compromise, copyright disputes, repo
  transfers) and will occur again with any third-party action ecosystem dependency.
fix: |
  **There is no workflow-level fix once the action repository becomes unavailable.** Options:

  1. **Wait**: If the repository was temporarily disabled (security incident, DMCA), wait for GitHub or the
     maintainer to restore it. Monitor the action's GitHub Issues and status pages.

  2. **Fork the action**: Fork the action to your own GitHub account or organization. Update your workflow
     to use your fork. Requires you to also maintain the fork going forward.

  3. **Pin to a commit SHA (prevention)**: Use the immutable full commit SHA instead of a mutable tag:
     `uses: Azure/functions-action@a1b2c3d4...` — even if the repository is disabled, a SHA-pinned
     reference may not be affected if the git objects are still available. However, if the repository
     is deleted, SHA references also fail.

  4. **Use a local composite action**: Copy the action's logic into a local `.github/actions/` directory
     in your repository, eliminating the external dependency entirely.
fix_code:
  - language: yaml
    label: 'Pin to immutable commit SHA instead of mutable tag'
    code: |
      steps:
        # Before: vulnerable to repo being disabled/renamed
        - uses: Azure/functions-action@v1
          with:
            app-name: my-func

        # After: pin to specific commit SHA (immutable)
        - uses: Azure/functions-action@3a0b1c2d4e5f6789abcdef01234567890abcdef0  # v1.5.2
          with:
            app-name: my-func
  - language: yaml
    label: 'Use a fork of the action in your own org as fallback'
    code: |
      steps:
        # Use your own fork if the upstream repo is unavailable
        - uses: my-org/functions-action-fork@v1
          with:
            app-name: my-func
prevention:
  - 'Always pin third-party actions to a full commit SHA (40 hex chars) rather than a mutable tag like @v1 or @main.'
  - 'Use StepSecurity or similar tools to automatically convert tags to pinned SHAs across your workflows.'
  - 'Fork critical third-party actions into your own org to retain control if upstream is disabled.'
  - 'Add Dependabot configuration to monitor action version updates and auto-PR SHA bumps.'
  - 'Run `gh api /repos/{owner}/{repo}` before relying on an action in production to verify repo availability.'
docs:
  - url: 'https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions'
    label: 'GitHub Docs: Security Hardening — Using Third-Party Actions'
  - url: 'https://github.com/Azure/functions-action/issues/363'
    label: 'Azure/functions-action#363: Post-Incident Transparency Request (Miasma, June 2026)'
  - url: 'https://docs.github.com/en/code-security/supply-chain-security/end-to-end-supply-chain/securing-your-workflow'
    label: 'GitHub Docs: Securing your GitHub Actions supply chain'
