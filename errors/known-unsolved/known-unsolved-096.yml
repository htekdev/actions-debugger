    label: "actions/runner#3819 — A lot of random 'A task was cancelled' errors (48 reactions, Apr 2025)"
  - url: "https://github.com/actions/runner/issues/3857"
    label: "actions/runner#3857 — An error occurred: Runner not found (ARC race condition)"
  - url: "https://github.com/actions/actions-runner-controller/issues/4091"
    label: "ARC#4091 — EphemeralRunner stuck in failed state after job cancellation"
  - url: "https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/monitoring-and-troubleshooting-self-hosted-runners"
    label: "Monitoring and troubleshooting self-hosted runners"
