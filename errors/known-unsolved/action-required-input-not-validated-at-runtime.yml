id: known-unsolved-130
title: 'action.yml required: true inputs not enforced — action runs with empty string'
category: known-unsolved
severity: silent-failure
tags:
  - action-yml
  - inputs
  - required
  - validation
  - silent-failure
  - composite-action
  - javascript-action
patterns:
  - regex: 'required:\s*true'
    flags: 'im'
  - regex: 'core\.getInput\([''"][\w-]+[''"]'
    flags: 'i'
error_messages:
  - 'Warning: Unexpected input(s) ..., valid inputs are [...]'
root_cause: |
  When an action defines `required: true` for an input in `action.yml`, the runner
  does NOT enforce this constraint before invoking the action. The action is called
  regardless of whether the required input was provided. If the caller omits the input,
  the action receives an empty string instead of failing with an informative error.

  This is a known runner limitation reported in actions/runner#1070 (90+ reactions).
  The `required` field in `action.yml` is advisory metadata for tooling and UI display,
  not a runtime enforcement mechanism. As of runner v2.321, no automatic validation
  occurs before the action's `main` script runs.

  Compounding the problem: the runner may emit a generic `Unexpected input` warning for
  unrecognized inputs passed to an action, but emits no warning for *missing* required
  inputs.
fix: |
  Since the runner does not enforce `required: true` at invocation time, action
  authors must validate inputs manually inside the action code:

  For JavaScript/TypeScript actions, throw immediately if a required input is missing:
  ```javascript
  const myInput = core.getInput('my-input', { required: true });
  // core.getInput with required: true throws if the input is empty
  ```

  For composite actions, add an explicit validation step:
  ```yaml
  - name: Validate required inputs
    shell: bash
    run: |
      if [ -z "${{ inputs.my-input }}" ]; then
        echo "::error::Required input 'my-input' was not provided."
        exit 1
      fi
  ```

  For callers: always check the action's README for required inputs, as the runner
  will not surface a clear error if you omit them.
fix_code:
  - language: javascript
    label: 'JavaScript action — use required: true in getInput to throw on missing input'
    code: |
      const core = require('@actions/core');
      // This throws "Input required and not supplied: my-input" if empty
      const myInput = core.getInput('my-input', { required: true });
  - language: yaml
    label: 'Composite action — explicit validation step for required inputs'
    code: |
      steps:
        - name: Validate required inputs
          shell: bash
          run: |
            if [ -z "${{ inputs.deploy-environment }}" ]; then
              echo "::error::Required input 'deploy-environment' was not provided."
              exit 1
            fi
prevention:
  - "In JavaScript/TypeScript actions, always pass `{ required: true }` to `core.getInput()` for inputs that must be present."
  - "In composite actions, add an explicit guard step that checks `inputs.<name>` and calls `exit 1` when empty."
  - "Document which inputs are required in the action README — callers cannot rely on the runner to enforce action.yml `required: true`."
  - "Consider adding CI tests for your action that verify it fails correctly when required inputs are missing."
docs:
  - url: 'https://github.com/actions/runner/issues/1070'
    label: 'runner#1070 — Validate required inputs before invoking action (90+ reactions, open since 2020)'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions#inputs'
    label: 'GitHub Docs — action.yml inputs metadata syntax'
  - url: 'https://github.com/actions/toolkit/tree/main/packages/core#inputsoptions'
    label: '@actions/core getInput with required option'
