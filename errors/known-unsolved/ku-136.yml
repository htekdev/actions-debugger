id: known-unsolved-136
title: '`winget` is not installed on `windows-11-arm` runners — community install scripts also unreliable'
category: known-unsolved
severity: limitation
tags:
  - windows-11-arm
  - winget
  - arm64
  - package-manager
  - windows
  - self-hosted
patterns:
  - regex: 'winget.*not recognized.*cmdlet|winget.*is not recognized as an internal'
    flags: 'i'
  - regex: "'winget'.*not recognized|winget.*command not found"
    flags: 'i'
error_messages:
  - "winget : The term 'winget' is not recognized as the name of a cmdlet, function, script file, or executable program."
  - "'winget' is not recognized as an internal or external command, operable program or batch file."
  - "The term 'winget' is not recognized"
root_cause: |
  The `windows-11-arm` GitHub-hosted runner image does not ship the Windows Package Manager
  (`winget`, App Installer) pre-installed. Unlike `windows-latest`/`windows-2025` runners
  where `winget` is available by default, the ARM64 runner image was bootstrapped without it.

  Community scripts such as `asheroto/winget-install` do not reliably install `winget` on
  `windows-11-arm` either, because the App Installer MSIX bundle has architecture-specific
  components that depend on the Windows Store infrastructure, which behaves differently in
  non-interactive GitHub Actions runner sessions.

  As of June 2026, GitHub has not added winget to the `windows-11-arm` image roadmap.
  There is no official workaround that installs a fully functional `winget` in the runner's
  non-interactive mode.
fix: |
  Replace `winget` install commands with `choco` (Chocolatey) or `scoop`, which are
  pre-installed on `windows-11-arm`. Most packages available via winget have Chocolatey
  equivalents.

  Alternatively, use `Invoke-WebRequest` or `curl` to download installer binaries directly
  from the vendor, then run them silently.
fix_code:
  - language: yaml
    label: 'Use Chocolatey instead of winget on windows-11-arm'
    code: |
      jobs:
        build:
          runs-on: windows-11-arm
          steps:
            - uses: actions/checkout@v4

            # Instead of: winget install --id Git.Git -e --source winget
            - name: Install Git via Chocolatey
              run: choco install git -y
              shell: pwsh

            # Instead of: winget install --id 7zip.7zip
            - name: Install 7-Zip via Chocolatey
              run: choco install 7zip -y
              shell: pwsh
  - language: yaml
    label: 'Use Scoop as an alternative on windows-11-arm'
    code: |
      jobs:
        build:
          runs-on: windows-11-arm
          steps:
            - uses: actions/checkout@v4

            - name: Install via Scoop
              shell: pwsh
              run: |
                Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
                Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
                scoop install nodejs
  - language: yaml
    label: 'Direct download installer as fallback'
    code: |
      - name: Install tool directly (no winget)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://example.com/tool-arm64.exe" -OutFile "tool.exe"
          Start-Process -FilePath ".\tool.exe" -ArgumentList "/S" -Wait
prevention:
  - "Audit any `runs-on: windows-11-arm` jobs for `winget` usage before migration"
  - "Use Chocolatey or Scoop for package installation on `windows-11-arm` — both are pre-installed"
  - "Track runner-images#14083 for progress on adding `winget` to `windows-11-arm` images"
  - "Use `actions/setup-*` official actions (setup-node, setup-python, setup-java, etc.) when available instead of installing via winget"
docs:
  - url: 'https://github.com/actions/runner-images/issues/14083'
    label: 'runner-images#14083 — Request to install winget on windows-11-arm'
  - url: 'https://github.com/actions/runner-images/blob/main/images/windows/Windows11Arm64-Readme.md'
    label: 'windows-11-arm image software list (winget not listed)'
  - url: 'https://community.chocolatey.org/packages'
    label: 'Chocolatey package directory — alternative to winget'
