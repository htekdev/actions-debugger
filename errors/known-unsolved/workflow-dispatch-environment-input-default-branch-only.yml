id: known-unsolved-100
title: 'workflow_dispatch type:environment input dropdown only shows environments from the default branch'
category: known-unsolved
severity: limitation
tags:
  - workflow-dispatch
  - environment
  - inputs
  - default-branch
  - dropdown
  - known-limitation
patterns:
  - regex: 'type:\s*environment'
    flags: 'i'
error_messages:
  - 'Environment dropdown does not show environments from the dispatched branch'
  - 'workflow_dispatch environment input missing branch-specific environments'
  - 'type: environment input only lists default branch environments'
root_cause: |
  When a workflow_dispatch event declares an input with type: environment, the GitHub
  UI renders a dropdown populated with the repository's deployment environments.
  However, this dropdown is always populated from the repository's DEFAULT branch,
  regardless of which branch or ref the workflow is being dispatched from.

  If a non-default branch defines new environments (e.g., a feature branch adds a
  "staging-v2" environment for testing), those environments will NOT appear in the
  dropdown when dispatching the workflow on that branch. The caller must either use
  an environment that already exists on the default branch, or type the environment
  name manually (which the type: environment input does not allow — it enforces
  selection from the dropdown only).

  This is a documented architectural limitation: the environments list is fetched
  server-side using the repository's default branch configuration at dispatch time.
  GitHub has not provided a timeline for fixing this behavior.
fix: |
  There is no direct fix for the dropdown limitation. The following workarounds are
  available depending on your use case:

  1. Use type: string instead of type: environment — allows free-text entry of any
     environment name. Users can type the environment name manually.

  2. Use type: choice with an explicit list of environment names — provides a dropdown
     but the list is static (defined in the workflow file on the dispatched branch).

  3. Ensure all environments needed for dispatch are also created on the default branch.
     Environments created on the default branch will always appear in the dropdown.

  4. Use REST API / GitHub CLI for dispatch — when using the REST API to trigger
     workflow_dispatch, the inputs value can be any string; the type: environment
     restriction only applies to the UI dropdown.
fix_code:
  - language: yaml
    label: 'Workaround: use type: string instead of type: environment'
    code: |
      on:
        workflow_dispatch:
          inputs:
            deploy_env:
              description: 'Target deployment environment'
              required: true
              type: string        # Free-text input — user types environment name manually
              # type: environment  # Avoid: dropdown only shows default-branch envs

      jobs:
        deploy:
          runs-on: ubuntu-latest
          environment: ${{ inputs.deploy_env }}
          steps:
            - run: echo "Deploying to ${{ inputs.deploy_env }}"
  - language: yaml
    label: 'Workaround: use type: choice with explicit environment list'
    code: |
      on:
        workflow_dispatch:
          inputs:
            deploy_env:
              description: 'Target deployment environment'
              required: true
              type: choice
              options:
                - production
                - staging
                - staging-v2      # Can include non-default-branch envs here
                - development

      jobs:
        deploy:
          runs-on: ubuntu-latest
          environment: ${{ inputs.deploy_env }}
          steps:
            - run: echo "Deploying to ${{ inputs.deploy_env }}"
prevention:
  - 'Prefer type: choice or type: string for environment inputs in workflows dispatched from non-default branches'
  - 'Create all commonly-used environments on the default branch so they appear in the type: environment dropdown'
  - 'Document for your team that the type: environment dropdown reflects default-branch environments only'
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onworkflow_dispatchinputsinput_idtype'
    label: 'workflow_dispatch inputs type — GitHub Docs'
  - url: 'https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-deployments/managing-environments-for-deployment'
    label: 'Managing environments for deployment — GitHub Docs'
