id: known-unsolved-091
title: 'Copilot code review silently consumes Actions minutes on private repos (June 1, 2026)'
category: known-unsolved
severity: silent-failure
tags:
  - copilot
  - billing
  - actions-minutes
  - code-review
  - private-repo
  - silent-cost
patterns:
  - regex: 'You have used.*GitHub Actions minutes'
    flags: 'i'
  - regex: 'Actions usage is paused.*spending limit'
    flags: 'i'
  - regex: 'Minute limit exceeded'
    flags: 'i'
error_messages:
  - 'Your GitHub Actions usage is paused because your spending limit has been reached'
  - 'You have used 100% of the included GitHub Actions minutes for this billing period'
  - 'Minute limit exceeded. Consider adding spending limit or upgrading plan.'
root_cause: |
  Starting June 1, 2026, each Copilot code review on a private repository consumes
  GitHub Actions minutes from the organization's plan entitlement, in addition to
  being billed as AI Credits under the usage-based billing model.

  Copilot code review runs on agentic tool-calling architecture on GitHub-hosted
  runners. Prior to June 1, 2026, this consumed only Copilot PRU (Premium Request
  Unit) allowance with no Actions minutes charged.

  The silent failure: Copilot code reviews do not appear as workflow runs in the
  Actions tab, so organizations have no per-review visibility into minute consumption.
  Repos with high PR volume (many Copilot reviews per day) can exhaust monthly
  Actions minutes without any obvious workflow activity visible in the UI.

  Affected plans: GitHub Copilot Pro, Pro+, Business, Enterprise. Public repos
  are not affected — Actions minutes remain free for public repositories.

  Source: GitHub Changelog, April 27 2026.
fix: |
  No opt-out exists while keeping Copilot code review enabled. Available mitigations:

  1. Set a GitHub Actions spending limit or budget to cap unexpected overage charges:
     Organization Settings → Billing → Spending Limits → GitHub Actions

  2. Disable Copilot code review for high-volume repos if Actions minutes are a concern:
     Repo Settings → GitHub Copilot → Code Review → Disable

  3. Switch to self-hosted runners for Copilot code review — self-hosted runners do
     not consume plan-included minutes (charged at different rates).

  4. Monitor usage via GitHub Actions metrics, GitHub Copilot usage metrics, and the
     Billing Usage Report to correlate minute consumption with Copilot review activity.

  5. For GitHub Teams/Enterprise: adjust organizational spending limits before
     high-PR-volume sprints.
fix_code:
  - language: yaml
    label: 'Set Actions spending limit via GitHub REST API (org admins)'
    code: |
      # No direct YAML fix — spending limit is managed in org billing settings.
      # Programmatic check for Actions usage via API:
      jobs:
        check-actions-budget:
          runs-on: ubuntu-latest
          steps:
            - name: Check Actions billing usage
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                # Billing API requires owner token, not GITHUB_TOKEN
                # Use a PAT with read:org scope:
                curl -H "Authorization: Bearer $PAT_TOKEN" \
                  "https://api.github.com/orgs/${{ github.repository_owner }}/settings/billing/actions"
prevention:
  - 'Set a GitHub Actions spending limit before enabling Copilot code review on private repos'
  - 'Monitor the Billing Usage Report monthly — correlate Actions minute spikes with PR review volume'
  - 'For high-PR-volume repos, use self-hosted runners for Copilot code review to avoid plan minute consumption'
  - 'Alert on Actions usage crossing 80% of plan entitlement — Copilot reviews can silently push this over the limit'
docs:
  - url: 'https://github.blog/changelog/2026-04-27-github-copilot-code-review-will-start-consuming-github-actions-minutes-on-june-1-2026/'
    label: 'GitHub Changelog: Copilot code review consumes Actions minutes from June 1, 2026'
  - url: 'https://docs.github.com/en/copilot/using-github-copilot/code-review/using-copilot-code-review'
    label: 'GitHub Docs: Using Copilot code review'
  - url: 'https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/about-billing-for-github-actions'
    label: 'GitHub Docs: About billing for GitHub Actions'
