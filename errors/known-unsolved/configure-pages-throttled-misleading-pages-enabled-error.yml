id: known-unsolved-124
title: 'configure-pages Shows "Verify Pages Is Enabled" Error When GitHub API Is Throttled'
category: known-unsolved
severity: error
tags:
  - actions/configure-pages
  - throttling
  - misleading-error
  - pages
  - rate-limit
  - incident
patterns:
  - regex: 'This endpoint is temporarily being throttled'
    flags: 'i'
  - regex: 'Get Pages site failed.*Please verify.*repository has Pages enabled.*temporarily being throttled'
    flags: 'is'
  - regex: 'Get Pages site failed.*Please verify.*enablement.*temporarily being throttled'
    flags: 'is'
error_messages:
  - "Error: Get Pages site failed. Please verify that the repository has Pages enabled and configured to build using GitHub Actions, or consider exploring the `enablement` parameter for this action. Error: This endpoint is temporarily being throttled. Please try again later."
  - "This endpoint is temporarily being throttled. Please try again later. For more on scraping GitHub and how it may affect your rights, please review our Terms of Service"
root_cause: |
  `actions/configure-pages` fetches your repository's Pages configuration from the
  GitHub REST API to verify it is enabled and to read the generator settings. During
  GitHub-wide degradation events or API-rate-limiting periods, this endpoint is
  temporarily throttled and returns a 429-like response with the message:

    "This endpoint is temporarily being throttled. Please try again later."

  The `configure-pages` action catches this error but wraps it inside the generic
  Pages-not-enabled guidance:

    "Get Pages site failed. Please verify that the repository has Pages enabled and
    configured to build using GitHub Actions, or consider exploring the `enablement`
    parameter for this action."

  The real underlying error (throttling) IS present, appended after the misleading
  guidance text, but it is easy to miss. Users spend time verifying their Pages
  configuration, checking GITHUB_TOKEN permissions, toggling the `enablement` input —
  all of which are irrelevant. The root cause is a transient GitHub infrastructure
  condition, not a misconfiguration.

  This limitation is tracked in actions/configure-pages#190 (opened 2026-02-10).
  The action does not currently distinguish between throttling errors and genuine
  Pages-not-found/not-enabled errors.

  Workaround: re-run the failed job after the GitHub incident clears. Check
  https://www.githubstatus.com for ongoing issues with "Pages" or "Actions".
fix: |
  This is a transient GitHub infrastructure error, not a workflow configuration problem.

  Immediate workaround:
    1. Check https://www.githubstatus.com for "GitHub Pages" or "API Requests" incidents.
    2. Wait for the incident to clear, then re-run the failed job.

  If the error is intermittent (not correlated with a githubstatus.com event):
    3. GitHub may be applying per-IP or per-repository rate limiting to the Pages
       configuration endpoint. Add a retry loop around the configure-pages step using
       `continue-on-error: true` + a subsequent explicit check, or use the `enablement`
       input to skip the initial API fetch when Pages is already known to be enabled.

  Long-term: the upstream fix requires actions/configure-pages to surface throttling
  errors distinctly from Pages-not-found errors. This has not been implemented as of
  June 2026.
fix_code:
  - language: yaml
    label: "Suppress the misleading error and re-run: check githubstatus.com first"
    code: |
      # When you see "This endpoint is temporarily being throttled":
      # 1. Check https://www.githubstatus.com
      # 2. Re-run the failed job once the incident clears
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # No changes needed in your workflow — the root cause is server-side
  - language: yaml
    label: "Use enablement: false to skip Pages config check when it is already enabled"
    code: |
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false   # skip Pages-enabled API check if Pages is already on
prevention:
  - "Subscribe to https://www.githubstatus.com alerts to be notified of API and Pages incidents before diagnosing locally"
  - "Read the full error message — if 'temporarily being throttled' appears at the end, the fix is to wait and re-run, not to reconfigure Pages"
  - "Use `enablement: false` in configure-pages when Pages is already known-enabled; this skips the API call that can be throttled"
  - "Do not modify GITHUB_TOKEN permissions or Pages settings in response to this error — they are not the cause"
docs:
  - url: "https://github.com/actions/configure-pages/issues/190"
    label: "actions/configure-pages #190 — 'This endpoint is temporarily being throttled' should be handled specially (opened 2026-02-10)"
  - url: "https://www.githubstatus.com"
    label: "GitHub Status — check for active Pages/API incidents"
  - url: "https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api"
    label: "GitHub REST API rate limits"
