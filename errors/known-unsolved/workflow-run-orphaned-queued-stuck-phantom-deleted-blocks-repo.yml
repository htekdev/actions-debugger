    label: 'GitHub Community: GitHub Actions run stuck queued for 12+ hours and blocks new workflow runs (6 upvotes)'
  - url: 'https://github.com/orgs/community/discussions/197048'
    label: 'GitHub Community: Phantom deleted workflow blocks all Actions runs in private repo'
  - url: 'https://support.github.com/contact'
    label: 'GitHub Support — file a ticket for orphaned run/workflow removal'
  - url: 'https://docs.github.com/en/rest/actions/workflow-runs?apiVersion=2022-11-28#force-cancel-a-workflow-run'
    label: 'Force-cancel a workflow run — REST API docs'
