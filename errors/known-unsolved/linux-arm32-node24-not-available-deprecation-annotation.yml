id: known-unsolved-097
title: 'Linux ARM32 Runners Show Node 24 Deprecation Warning — No Node 24 Binary Available for arm/v6 or arm/v7'
category: known-unsolved
severity: warning
tags:
  - linux-arm32
  - arm-v6
  - arm-v7
  - node24
  - deprecation
  - self-hosted
  - runner
  - known-limitation
patterns:
  - regex: 'Linux ARM32 runners are deprecated.*no longer be supported'
    flags: 'i'
  - regex: 'following actions are running on.*arm32.*deprecated'
    flags: 'i'
  - regex: 'Please migrate.*supported platform.*arm32|arm32.*migrate.*supported'
    flags: 'i'
  - regex: 'Node\.js 24 is not available.*arm32|arm32.*no.*node.*24'
    flags: 'i'
error_messages:
  - 'Linux ARM32 runners are deprecated and will no longer be supported after [date]. Please migrate to a supported platform.'
  - 'The following actions are running on a Linux ARM32 runner which is deprecated: ...'
root_cause: |
  As part of the GitHub Actions Node.js 24 migration (enforced from runner v2.333.0 onward),
  actions declaring `using: node20` are automatically upgraded to run on Node.js 24 when the
  `UseNode24ByDefault` feature flag is enabled on the server side.

  However, **no Node.js 24 binary is distributed for the Linux ARM32 architecture**
  (arm/v6 and arm/v7). The upstream Node.js project does not produce official ARM32 builds
  for Node 24+. Because the runner cannot upgrade ARM32 actions to Node 24, it emits a
  deprecation warning annotation instead:

    "Linux ARM32 runners are deprecated and will no longer be supported after {date}.
     Please migrate to a supported platform."

  This warning appears as a yellow annotation in the workflow run logs. The affected actions
  continue to run on Node.js 20 for now (via the `actions_runner_deprecate_linux_arm32`
  feature flag path in the runner), but a second kill-switch flag (`actions_runner_kill_linux_arm32`)
  exists to hard-fail these jobs when GitHub decides to end ARM32 support entirely.

  **Who is affected:**
  - Self-hosted runners on Raspberry Pi Zero, Pi 1, or any ARMv6/ARMv7 32-bit Linux device
  - Custom ARC (Actions Runner Controller) deployments targeting armhf/arm32 nodes
  - GitHub-hosted runners are not ARM32; this is self-hosted only

  **This is a known limitation with no fix** — Node.js 24 has no ARM32 build and GitHub has
  not announced a timeline for producing one. The only mitigation is migration.
fix: |
  There is no fix that preserves ARM32 runners and Node 24 compatibility. The options are:

  1. **Migrate to ARM64** (recommended): Replace 32-bit ARM runners with 64-bit ARM64
     hardware or VMs. Node.js 24 has full ARM64 support. GitHub-hosted `ubuntu-24.04-arm`
     and `windows-11-arm` runners are ARM64.

  2. **Keep running on Node 20 until kill-switch is activated**: The deprecation warning is
     currently non-blocking. Actions continue to run on Node 20. This is a temporary reprieve
     only — expect ARM32 support to be killed at a future runner release.

  3. **Containerize with QEMU** (workaround): Use `docker/setup-qemu-action` to emulate ARM64
     on an x86_64 runner for cross-compilation tasks, avoiding the need for physical ARM32
     hardware in CI.
fix_code:
  - language: yaml
    label: 'Migrate self-hosted ARM32 runner label to ARM64'
    code: |
      jobs:
        build:
          # Before — targeting ARM32 self-hosted runner:
          # runs-on: [self-hosted, linux, arm32]

          # After — targeting ARM64 self-hosted runner:
          runs-on: [self-hosted, linux, arm64]

          steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                node-version: '24'    # Node 24 is available on ARM64
  - language: yaml
    label: 'Cross-compile ARM32 using QEMU emulation on x86_64 (no physical ARM32 needed)'
    code: |
      jobs:
        build-arm32:
          runs-on: ubuntu-latest   # x86_64 GitHub-hosted runner

          steps:
            - uses: actions/checkout@v6

            - name: Set up QEMU for ARM32 emulation
              uses: docker/setup-qemu-action@v3
              with:
                platforms: arm

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build for linux/arm/v7
              uses: docker/build-push-action@v6
              with:
                platforms: linux/arm/v7
                push: false
                tags: my-image:arm32
prevention:
  - 'Audit self-hosted runner labels for arm32/armhf/armv7 and plan migration to ARM64 hardware before the runner kill-switch is activated.'
  - 'Subscribe to github.blog/changelog and actions/runner release notes to track when the ARM32 kill-switch (`actions_runner_kill_linux_arm32`) is enabled.'
  - 'For cross-compilation CI (building ARM32 binaries), prefer QEMU emulation on x86_64 over maintaining physical ARM32 runner hardware.'
docs:
  - url: 'https://github.com/actions/runner/pull/4303'
    label: 'actions/runner PR #4303: Node 24 enforcement + Linux ARM32 deprecation support'
  - url: 'https://nodejs.org/en/about/previous-releases'
    label: 'Node.js release schedule — ARM32 not supported in Node 24+'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners#supported-architectures-and-operating-systems-for-self-hosted-runners'
    label: 'GitHub Docs: Supported architectures for self-hosted runners'
