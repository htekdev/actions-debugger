id: known-unsolved-126
title: '`windows-11-arm` runner: WSL2 and WSL1 both unavailable — nested virtualization not supported'
category: known-unsolved
severity: limitation
tags:
  - windows-11-arm
  - arm64
  - wsl
  - wsl2
  - virtualization
  - known-limitation
  - nested-virtualization
patterns:
  - regex: 'WslRegisterDistribution failed.*0x80370102|Please enable.*Virtual Machine Platform|ensure virtualization is enabled in the BIOS'
    flags: 'i'
  - regex: 'windows-11-arm.*wsl.*not.*work|wsl.*arm.*virtualization.*disabled|wsl.*arm64.*endpoint.*mapper'
    flags: 'i'
  - regex: 'There are no more endpoints available from the endpoint mapper'
    flags: 'i'
error_messages:
  - "WslRegisterDistribution failed with error: 0x80370102"
  - "Please enable the Virtual Machine Platform Windows feature and ensure virtualization is enabled in the BIOS."
  - "Installing: Windows Subsystem for Linux\nThere are no more endpoints available from the endpoint mapper."
  - "An error occurred mounting one of your file systems. Please run 'dmesg' for more details."
root_cause: |
  The `windows-11-arm` GitHub-hosted runner does not support nested virtualization. WSL2 requires
  Hyper-V / Virtual Machine Platform (nested virtualization), which is not available on the ARM64
  runner infrastructure.

  WSL1 also fails due to missing kernel module support for the ARM64 runner's Hyper-V environment:
  mounting the WSL1 filesystem fails at the kernel level (`dmesg` shows mount errors), and `wsl
  --update` fails with error 0x80004005 ("There are no more endpoints available from the endpoint
  mapper").

  This is a hard platform limitation and not a configuration issue. There is no workaround that
  enables WSL on the current `windows-11-arm` runner generation. The x64 (`windows-latest`,
  `windows-2025`) runners support WSL2 because they run on hardware with nested virtualization
  enabled; the ARM64 runner VMs do not have this capability at this time.
fix: |
  There is no fix. WSL is not available on `windows-11-arm` runners.

  Workarounds:
  1. Run Linux steps in a separate job using an Ubuntu runner instead of WSL.
  2. Use Docker containers for cross-platform steps — Docker is available on `windows-11-arm`.
  3. Pin WSL-dependent jobs to `windows-latest` (x64) and use `windows-11-arm` only for
     ARM64-specific native Windows builds.
fix_code:
  - language: yaml
    label: 'Route WSL steps to x64 runner, ARM-native steps to arm runner'
    code: |
      jobs:
        linux-steps:
          runs-on: ubuntu-24.04-arm  # or ubuntu-latest for x64
          steps:
            - run: bash ./linux-script.sh

        windows-arm-build:
          runs-on: windows-11-arm
          steps:
            # Only native Windows steps here — no WSL
            - run: cmake --build . --config Release
              shell: cmd
  - language: yaml
    label: 'Use Docker container instead of WSL on windows-11-arm'
    code: |
      jobs:
        cross-platform:
          runs-on: windows-11-arm
          steps:
            - name: Run Linux tool via Docker
              run: docker run --rm alpine:latest sh -c "echo hello from Linux"
prevention:
  - "Do not use `wsl` commands on `windows-11-arm` runners"
  - "Avoid `setup-wsl` action on `windows-11-arm` — WSL is not functional"
  - "Check runner OS before invoking WSL: `if [ '${{ runner.os }}' = 'Windows' ] && [ '${{ runner.arch }}' = 'ARM64' ]`"
  - "Document which jobs require WSL and route them to x64 Windows runners"
docs:
  - url: 'https://github.com/actions/runner-images/issues/14076'
    label: 'runner-images#14076: WSL not working on windows-11-arm'
  - url: 'https://learn.microsoft.com/en-us/windows/wsl/troubleshooting#error-0x80370102'
    label: 'WSL error 0x80370102 — virtualization not enabled'
  - url: 'https://github.com/Vampire/setup-wsl/issues/74'
    label: 'setup-wsl#74: action fails on windows-11-arm runner'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners'
    label: 'GitHub-hosted runners — available runner types'
