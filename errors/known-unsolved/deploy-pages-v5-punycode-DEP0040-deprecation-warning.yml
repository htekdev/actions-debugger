id: known-unsolved-118
title: 'deploy-pages@v5 emits DEP0040 punycode DeprecationWarning on every run — no workaround'
category: known-unsolved
severity: warning
tags:
  - deploy-pages
  - punycode
  - DEP0040
  - node24
  - deprecation-warning
  - actions-artifact
patterns:
  - regex: '\[DEP0040\] DeprecationWarning: The punycode module is deprecated'
    flags: 'i'
  - regex: 'punycode.*DeprecationWarning.*deploy.pages'
    flags: 'i'
  - regex: 'at node:punycode:\d+:\d+'
    flags: ''
error_messages:
  - "(node:6488) [DEP0040] DeprecationWarning: The punycode module is deprecated. Please use a userland alternative instead."
  - "DeprecationWarning: The punycode module is deprecated. Please use a userland alternative instead."
root_cause: |
  `actions/deploy-pages@v5` (released 2026-03-25) pins `@actions/artifact` at
  `^2.1.8` in its `package.json`. This version of `@actions/artifact` loads Node's
  built-in `punycode` module, which has been deprecated since Node.js v17 and emits
  `[DEP0040]` on every load.

  The punycode deprecation warning was fixed in `@actions/artifact` v6.0.0
  (December 2025), but `actions/deploy-pages` has not updated its dependency.
  Because the warning is embedded in the `ncc`-bundled `dist/index.js`, it fires
  even when `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true` is set — the warning is not
  from the Node version mismatch path but from the bundled dependency itself.

  The warning does not cause the deployment to fail but annotates every run with a
  yellow warning in the step output, which can obscure real warnings in noisy CI
  output.

  As of June 2026, the `actions/deploy-pages` `main` branch has not been updated
  since the v5.0.0 tag (2026-03-25), so SHA-pinning does not help. Only a
  maintainer-side `@actions/artifact` version bump and `dist/` rebuild will
  silence the warning.
fix: |
  There is no consumer-side workaround that fully suppresses the warning.

  1. **Suppress at the Node level** — set `NODE_NO_WARNINGS=1` as a step-level or
     workflow-level env var. This silences ALL Node warnings in the step including
     DEP0040, but also hides legitimate future warnings:

     ```yaml
     env:
       NODE_NO_WARNINGS: 1
     ```

  2. **Wait for an upstream patch** — watch actions/deploy-pages for a v5.0.1 or
     v5.1.0 release that bumps `@actions/artifact` to v6.x. Track issue #413.

  3. **Accept the warning** — the deployment still succeeds; the warning is cosmetic
     noise only.
fix_code:
  - language: yaml
    label: 'Suppress Node.js deprecation warnings for the deploy step (blunt instrument)'
    code: |
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        env:
          # Suppress DEP0040 punycode warning from @actions/artifact v2.x bundled in deploy-pages@v5.
          # Remove once deploy-pages bumps @actions/artifact to v6+.
          NODE_NO_WARNINGS: 1
prevention:
  - "Track actions/deploy-pages#413 for the upstream fix — when a new release is tagged, remove the `NODE_NO_WARNINGS` workaround."
  - "When using `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true`, be aware that DEP0040 from bundled transitive deps is NOT suppressed by that flag."
  - "Pin `actions/deploy-pages` to a SHA rather than a major tag if you need deterministic warnings — though for this specific issue no newer commit exists on `main` yet."
docs:
  - url: 'https://github.com/actions/deploy-pages/issues/413'
    label: 'Bundled punycode DEP0040 warning persists in v5 (actions/deploy-pages#413)'
  - url: 'https://nodejs.org/api/deprecations.html#DEP0040'
    label: 'Node.js DEP0040 — punycode module deprecated'
  - url: 'https://github.com/actions/upload-artifact/issues/744'
    label: '@actions/artifact v6.0.0 punycode fix (actions/upload-artifact#744)'
