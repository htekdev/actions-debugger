id: known-unsolved-086
title: "GitHub-Hosted Runner Images Cannot Be Pinned to a Specific Version"
category: known-unsolved
severity: limitation
tags:
  - runner-images
  - pinning
  - reproducibility
  - weekly-update
  - non-deterministic
  - ubuntu
  - windows
  - macos
patterns:
  - regex: 'runs-on:\s*(ubuntu|windows|macos)-'
    flags: 'i'
  - regex: 'runner.tool_cache|RUNNER_TOOL_CACHE'
    flags: 'i'
error_messages:
  - "(build broke after runner image was silently updated — no scheduling-time error)"
  - "(tool version changed between two runs of the same workflow with no code changes)"
root_cause: |
  GitHub-hosted runner images (`ubuntu-24.04`, `windows-2022`, `macos-15`, etc.) are
  updated on a **weekly cadence**. There is no mechanism to pin a workflow to a specific
  image version or digest. Every job run on a given label gets whatever image version
  was deployed most recently.

  This means:
  - Pre-installed tool versions (CMake, Node.js, Python, Java, Go, etc.) can change
    between two runs of the same workflow even with no code changes.
  - Workflows that rely on pre-installed tool versions rather than `setup-*` actions
    are silently affected by upstream image updates.
  - Image updates roll out progressively over 2–3 days, so two runs on the same day
    may use different image versions during the deployment window.
  - The `runner.tool_cache` layout and available tool versions can change at any update.

  GitHub has explicitly declined to implement version pinning for standard runner labels.
  The feature request was rejected as not technically feasible at this time
  (actions/runner-images#13034: "Unfortunately, I'm forced to reject this feature
  request. There's no technical feasibility for implementation yet").

  Larger Runners with custom images (GitHub Team/Enterprise) provide a workaround but
  are not available on standard Free/Pro/Team plans for hosted runners.
fix: |
  There is no fix — version pinning for standard hosted runner labels is not supported.
  Use these mitigations:

  1. **Explicit `setup-*` actions** — install tool versions yourself instead of relying
     on pre-installed versions: `actions/setup-node`, `actions/setup-python`, etc.
  2. **Pin exact versions, not major ranges** — use `node-version: '20.18.1'` not `'20'`.
  3. **Container jobs** — pin a Docker image by digest for complete OS/tool reproducibility.
  4. **Log the image version** — add `echo "Image: $ImageVersion"` (Linux/macOS) or
     check the `Set up job` step log for the `Runner Image` line to record which image
     version was used in a failing run.
  5. **Subscribe to runner-images releases** — GitHub typically announces default-version
     changes 2 weeks before deployment.
  6. **Larger Runners + custom images** (Team/Enterprise) — build and pin a specific
     image for full control.
fix_code:
  - language: yaml
    label: "Pin tool versions with setup actions — never rely on pre-installed versions"
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4

            # Explicit versions — unaffected by runner image updates
            - uses: actions/setup-node@v4
              with:
                node-version: '20.18.1'   # Exact pin, not '20' or '20.x'

            - uses: actions/setup-python@v5
              with:
                python-version: '3.12.7'  # Exact pin

            - name: Log runner image for debugging
              run: echo "Runner image: $ImageVersion"

            - name: Build
              run: npm ci && npm run build
  - language: yaml
    label: "Container job with pinned Docker image digest for full reproducibility"
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          container:
            # Pin by digest — image content never changes for this run
            image: node:20.18.1-bookworm
          steps:
            - uses: actions/checkout@v4
            - run: npm ci && npm run build
prevention:
  - "Never rely on pre-installed runner tool versions — always use `setup-*` actions with pinned exact versions."
  - "Subscribe to `actions/runner-images` releases for 2-week advance notice of upcoming default-version changes."
  - "Log `$ImageVersion` (Linux/macOS) in a setup step so you can correlate failures with specific image deployments."
  - "For compliance or supply-chain-sensitive workloads, use container jobs with digest-pinned images or self-hosted runners."
docs:
  - url: "https://github.com/actions/runner-images"
    label: "actions/runner-images — runner image release notes and preinstalled software lists"
  - url: "https://github.com/actions/runner-images/issues/13034"
    label: "actions/runner-images#13034 — Feature request: pin image to specific version (rejected)"
  - url: "https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners"
    label: "GitHub Docs — About GitHub-hosted runners and weekly update cadence"
  - url: "https://docs.github.com/en/actions/using-github-hosted-runners/using-larger-runners/about-larger-runners"
    label: "GitHub Docs — About Larger Runners with custom images (Team/Enterprise)"
