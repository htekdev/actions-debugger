id: known-unsolved-112
title: "copilot-setup-steps: jobs.<id>.uses Reusable Workflow Call Silently Not Supported"
category: known-unsolved
severity: silent-failure
tags:
  - copilot-setup-steps
  - reusable-workflow
  - workflow-call
  - copilot-cloud-agent
  - limitation
  - silent-failure
patterns:
  - regex: 'copilot-setup-steps.*uses:|jobs\.copilot-setup-steps\.uses:'
    flags: 'i'
  - regex: 'copilot.setup.steps.*reusable|reusable.*workflow.*copilot.setup'
    flags: 'i'
error_messages:
  - "copilot-setup-steps job ignores jobs.<id>.uses — reusable workflow is not executed"
root_cause: |
  The `copilot-setup-steps.yml` workflow configures the development environment for
  GitHub Copilot cloud coding agents. GitHub's Copilot agent runtime only processes the
  `steps:` block under the `copilot-setup-steps` job; it does not support calling
  reusable workflows via `jobs.<id>.uses`.

  A user authoring:

    jobs:
      copilot-setup-steps:
        uses: ./.github/workflows/shared-setup.yml

  will find the reusable workflow is silently ignored or produces unexpected behavior.
  The Copilot agent runtime only reads inline steps, permissions, runs-on, services,
  snapshot, and timeout-minutes. The `uses` key at the job level is not in the supported
  property set.

  This is a documented GitHub limitation affecting anyone who tries to DRY up their
  Copilot environment setup by extracting it into a shared reusable workflow.
fix: |
  Replace `jobs.<id>.uses` with a composite action called inside a step.

  A composite action reference inside `steps:` IS supported. Extract shared setup logic
  into a composite action (e.g., `.github/actions/shared-setup/action.yml`) and call it
  as a step:

    jobs:
      copilot-setup-steps:
        runs-on: ubuntu-latest
        steps:
          - uses: ./.github/actions/shared-setup  # composite action — supported

  Alternatively, inline all setup logic directly in the `copilot-setup-steps.yml` file.
fix_code:
  - language: yaml
    label: 'Wrong — jobs.<id>.uses not supported in copilot-setup-steps'
    code: |
      # ❌ This does NOT work in copilot-setup-steps
      jobs:
        copilot-setup-steps:
          uses: ./.github/workflows/shared-setup.yml
          with:
            node-version: '22'
  - language: yaml
    label: 'Correct — use a composite action inside steps: instead'
    code: |
      # ✅ Use a composite action inside steps — this DOES work
      jobs:
        copilot-setup-steps:
          runs-on: ubuntu-latest
          steps:
            - uses: ./.github/actions/shared-setup
              with:
                node-version: '22'
  - language: yaml
    label: 'Alternative — inline the setup steps directly'
    code: |
      # ✅ Inline the steps directly — always works
      jobs:
        copilot-setup-steps:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/setup-node@v6
              with:
                node-version: '22'
            - run: npm ci
prevention:
  - 'Never use jobs.<id>.uses inside copilot-setup-steps.yml — use composite actions or inline steps instead.'
  - 'The supported job-level properties for copilot-setup-steps are: steps, permissions, runs-on, services, snapshot, timeout-minutes.'
  - 'Test copilot-setup-steps.yml with workflow_dispatch before relying on it for Copilot cloud agents.'
docs:
  - url: 'https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment'
    label: 'GitHub Docs — Customize the Copilot cloud agent environment'
  - url: 'https://github.com/github/docs/issues/44493'
    label: 'github/docs #44493 — Clarify limitations of copilot-setup-steps concerning reusable workflows'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action'
    label: 'GitHub Docs — Creating a composite action'
