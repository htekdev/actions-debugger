id: known-unsolved-088
title: 'Workflow reruns are hard-capped at 50 — automation retrying beyond this limit fails'
category: known-unsolved
severity: error
tags:
  - rerun
  - retry
  - automation
  - limit
  - check-suite
patterns:
  - regex: 'exceeded.*maximum.*reruns'
    flags: 'i'
  - regex: 'rerun.*limit.*50'
    flags: 'i'
  - regex: 'This workflow cannot be re-run'
    flags: 'i'
error_messages:
  - 'This workflow has exceeded the maximum number of reruns (50)'
  - 'exceeded the maximum number of reruns'
  - 'This workflow cannot be re-run'
root_cause: |
  As of April 10, 2026, GitHub Actions enforces a hard limit of 50 reruns per
  workflow run. Any attempt to rerun a given workflow (via the UI, API, or gh CLI)
  after 50 total reruns — including both full reruns and subset-of-jobs reruns —
  results in a failed check suite with an annotation indicating the limit has been
  hit.

  This limit was introduced in response to automation that attempted hundreds of
  retries on a given workflow, adding load to the GitHub Actions infrastructure.
  The limit applies globally: once a workflow run ID has been rerun 50 times,
  no further reruns are possible for that run ID.

  Affected patterns include:
  - Flaky test retry loops using gh run rerun or the REST API
  - CI bots that automatically rerun on network timeouts
  - Developer scripts that poll-and-retry until green
  - External retry orchestrators (e.g., Atlantis, Renovate retry logic)
fix: |
  No workaround exists for a run that has hit the 50-rerun limit. The only
  option is to trigger a new workflow run rather than rerunning the same run ID.

  For automation that retries on failure:
  1. Replace "rerun same run ID" logic with a new workflow_dispatch trigger
     or a new push/commit to re-trigger the workflow from scratch.
  2. Cap your retry loop to fewer than 50 attempts to avoid the limit.
  3. Fix the root cause of flakiness rather than relying on retries as a
     long-term mitigation — this limit makes retry loops a non-sustainable pattern.

  To trigger a fresh run via API instead of rerunning:
    gh workflow run <workflow-file> --ref <branch>
fix_code:
  - language: yaml
    label: 'Trigger a fresh run instead of rerunning (avoids 50-rerun limit)'
    code: |
      # Instead of: gh run rerun <run-id>
      # Use: gh workflow run to dispatch a fresh run
      jobs:
        retry-on-failure:
          runs-on: ubuntu-latest
          if: failure()
          steps:
            - name: Dispatch fresh run instead of rerunning
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh workflow run ci.yml --ref ${{ github.ref_name }}
                echo "Dispatched fresh workflow run — avoids the 50 rerun hard cap"
  - language: yaml
    label: 'Bounded retry loop that stays under the 50-rerun limit'
    code: |
      # In external automation / scripts
      MAX_RETRIES=10  # well under the 50-rerun hard limit
      ATTEMPT=0
      while [ $ATTEMPT -lt $MAX_RETRIES ]; do
        gh run rerun "$RUN_ID" --failed
        sleep 60
        STATUS=$(gh run view "$RUN_ID" --json conclusion -q .conclusion)
        if [ "$STATUS" = "success" ]; then break; fi
        ATTEMPT=$((ATTEMPT + 1))
      done
      if [ $ATTEMPT -ge $MAX_RETRIES ]; then
        echo "Max retries reached — dispatching fresh run"
        gh workflow run ci.yml --ref main
      fi
prevention:
  - 'Cap automation retry loops well below 50 (recommended max: 5-10 retries before giving up)'
  - 'Prefer dispatching fresh workflow runs over rerunning the same run ID in retry automation'
  - 'Track rerun counts in your CI bot and switch to fresh dispatch after 10 reruns'
  - 'Fix the root cause of flaky workflows rather than relying on retry loops'
  - 'Set up alerting when a workflow is rerun more than 5 times — it indicates a systemic issue'
docs:
  - url: 'https://github.blog/changelog/2026-04-10-actions-workflows-are-limited-to-50-reruns/'
    label: 'GitHub Changelog: Actions workflows are limited to 50 reruns (April 10, 2026)'
  - url: 'https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/re-running-workflows-and-jobs'
    label: 'GitHub Docs: Re-running workflows and jobs'
  - url: 'https://docs.github.com/en/rest/actions/workflow-runs#re-run-a-workflow'
    label: 'GitHub REST API: Re-run a workflow'
