id: known-unsolved-089
title: "GitHub Actions Outage Surfaces \"Sorry. Your account was suspended\" False Error"
category: known-unsolved
severity: error
tags:
  - outage
  - account-suspended
  - control-plane
  - authentication
  - false-error
  - incident
patterns:
  - regex: 'Sorry\. Your account was suspended'
    flags: 'i'
  - regex: 'Your account was suspended'
    flags: 'i'
  - regex: 'HttpError: Sorry\. Your account was suspended'
    flags: 'i'
  - regex: 'Unexpected error fetching GitHub release.*account was suspended'
    flags: 'i'
error_messages:
  - "HttpError: Sorry. Your account was suspended"
  - "Unexpected error fetching GitHub release for tag refs/heads/master: HttpError: Sorry. Your account was suspended"
  - "Error: Sorry. Your account was suspended"
root_cause: |
  During GitHub Actions control-plane authentication outages, the platform erroneously
  surfaces the message "Sorry. Your account was suspended" to CI workflows. This is a
  platform-side bug in the error response path — the account is NOT actually suspended.

  The message originates from an authentication failure in GitHub's internal broker
  service. When the control plane cannot validate tokens or route requests during an
  incident, some code paths return a generic "account suspended" HTTP error that was
  intended for a different scenario (actual account suspension enforcement), not for
  infrastructure failure.

  The May 26, 2026 incident (1057–1318 UTC) produced this exact message for many
  workflows worldwide when GitHub Actions experienced "degraded performance for Actions
  and Pages" due to an authentication failure in the control plane. GitHub confirmed
  the message was inaccurate.

  Key characteristics that distinguish a platform outage from an actual suspension:
  - The error is transient and clears once the outage resolves
  - All workflows fail simultaneously (org-wide or account-wide, not just one repo)
  - Other unrelated workflows and repos are also failing at the same time
  - GitHub's status page (githubstatus.com) shows Actions degradation
  - Re-running the workflow once the incident resolves succeeds immediately
  - Personal account dashboard, billing, and repo access remain fully functional
fix: |
  There is no fix on the workflow author's side. This is a platform-level outage error.

  Immediate steps:
  1. Check https://githubstatus.com for any ongoing Actions incident
  2. Check the GitHub community forum and social channels for corroborating reports
  3. Wait for GitHub to resolve the underlying authentication/control-plane issue
  4. Re-run failed workflows once the incident is resolved — they will succeed without
     any changes to the workflow YAML

  If githubstatus.com shows no incident but your workflows are all failing with this
  exact message, open a GitHub Support ticket — a localized incident may be underway
  that hasn't been officially acknowledged yet.
fix_code:
  - language: yaml
    label: "No workflow change needed — wait for incident resolution and re-run"
    code: |
      # This error requires no workflow changes.
      # After the outage clears, simply re-run the failed workflows:
      #
      #   gh run rerun <run-id> --repo owner/repo
      #
      # Or click "Re-run all jobs" in the GitHub Actions UI.
      #
      # Optional: add a status-check step to provide better failure messages:
      - name: Notify on failure
        if: failure()
        run: |
          echo "Workflow failed. Check https://githubstatus.com for ongoing incidents."
          echo "Error may be a transient platform issue, not an account problem."
prevention:
  - "Always check https://githubstatus.com when seeing alarming authentication or account errors in GitHub Actions logs — many scary-looking errors are platform incidents"
  - "Set up GitHub status page notifications (RSS or webhook) to get alerts when Actions is degraded, so on-call teams aren't alarmed by false account suspension messages"
  - "In incident response runbooks, add a step to check githubstatus.com before escalating an 'account suspended' CI failure to security or billing teams"
  - "Do NOT attempt to appeal an account suspension or contact billing/support immediately — verify the platform status first"
docs:
  - url: "https://githubstatus.com"
    label: "GitHub Status Page — official incident tracker"
  - url: "https://www.devclass.com/development/2026/05/28/github-actions-outage-told-devs-your-account-is-suspended/5247065"
    label: "DevClass: GitHub Actions outage told devs 'your account is suspended' (May 28, 2026)"
  - url: "https://docs.github.com/en/actions/monitoring-and-troubleshooting-workflows/troubleshooting-workflows/about-troubleshooting"
    label: "GitHub Actions: About troubleshooting workflows"
