    label: "runner-images #14096: windows-latest runner's g++ first compilation extremely slow (May 2026)"
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-where-your-workflow-runs/choosing-the-runner-for-a-job'
    label: 'GitHub Docs: Choosing the runner for a job'
