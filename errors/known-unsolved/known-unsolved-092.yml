id: known-unsolved-092
title: 'workflow_dispatch UI branch dropdown never shows Copilot agent branches'
category: known-unsolved
severity: limitation
tags:
  - workflow-dispatch
  - copilot
  - copilot-agent
  - branch-dropdown
  - manual-trigger
  - known-limitation
patterns:
  - regex: 'Cannot trigger workflows manually targeting a copilot.*(agent|workspace) branch'
    flags: 'i'
error_messages:
  - 'No branches visible for copilot/agent workflow_dispatch trigger'
  - 'Copilot agent branch missing from branch dropdown'
root_cause: |
  GitHub Copilot autonomous agents create branches with names like
  `copilot/fix-123-some-description`. The GitHub Actions `workflow_dispatch` UI
  branch dropdown filters the branch list and deliberately excludes Copilot agent
  branches from the selectable options.

  This is a platform-level filtering decision: Copilot agent branches are treated
  as ephemeral working branches owned by the Copilot agent, not as user-selectable
  deployment targets. The `workflow_dispatch` dropdown populates from the refs API
  but applies branch type exclusions — Copilot branches are excluded from this list.

  There is no error message shown. The branch is simply absent from the dropdown,
  leading developers to believe the workflow is not present on the branch (it may
  or may not be, depending on whether the agent committed a workflow file). The
  exclusion applies to both the GitHub.com UI and the GitHub CLI `gh workflow run`
  interactive selector.

  The REST API trigger (`POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/
  dispatches`) IS able to target Copilot branches by specifying `ref` directly.
fix: |
  Use the GitHub CLI or REST API to trigger workflow_dispatch targeting a Copilot
  branch directly — bypassing the UI dropdown:

    gh workflow run workflow.yml --ref copilot/fix-123-some-description

  Or with the REST API:
    curl -X POST \
      -H "Authorization: Bearer $GH_TOKEN" \
      -H "Accept: application/vnd.github+json" \
      https://api.github.com/repos/OWNER/REPO/actions/workflows/WORKFLOW_ID/dispatches \
      -d '{"ref":"copilot/fix-123-some-description"}'

  There is no UI workaround — the branch cannot be made to appear in the dropdown.
  Track actions/runner#4246 for a fix or official acknowledgment.
fix_code:
  - language: yaml
    label: 'Trigger workflow on a Copilot branch via GitHub CLI (bypasses UI limitation)'
    code: |
      # Run from your local machine or another workflow
      - name: Trigger workflow on Copilot branch
        run: |
          gh workflow run ci.yml \
            --repo ${{ github.repository }} \
            --ref copilot/fix-${{ github.event.issue.number }}-my-task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  - language: yaml
    label: 'Auto-trigger workflow on Copilot branches via push trigger instead'
    code: |
      on:
        push:
          branches:
            - 'copilot/**'   # triggers automatically on every Copilot agent commit
        workflow_dispatch:   # still works via CLI/API even though UI dropdown hides the branch
prevention:
  - 'Design CI workflows to trigger automatically on push to copilot/** branches rather than relying on manual workflow_dispatch targeting.'
  - 'Use gh workflow run --ref <branch> from the CLI when you need to manually trigger on a Copilot branch.'
  - 'Document this limitation in your team runbook so developers do not waste time searching for a missing branch in the UI.'
docs:
  - url: 'https://github.com/actions/runner/issues/4246'
    label: 'GitHub Issue: Cannot trigger workflows manually targeting a copilot agent branch (runner#4246)'
  - url: 'https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/manually-running-a-workflow'
    label: 'GitHub Docs: Manually running a workflow'
  - url: 'https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event'
    label: 'GitHub REST API: Create a workflow dispatch event'
