id: runner-environment-258
title: 'Docker 29 containerd image store pushes OCI manifest index to registries that require Docker Schema v2 — platform shows as unknown or manifest invalid'
category: runner-environment
severity: silent-failure
tags:
  - docker
  - docker-29
  - oci-manifest
  - containerd
  - registry
  - runner-image-update
  - platform-unknown
patterns:
  - regex: 'image with reference.*was found but does not provide any platform'
    flags: 'i'
  - regex: 'error from registry: manifest invalid'
    flags: 'i'
  - regex: 'unknown.*platform.*amd64|platform.*unknown.*linux'
    flags: 'i'
  - regex: 'no matching manifest for linux/amd64.*manifest list'
    flags: 'i'
error_messages:
  - "Error: image with reference registry.example.com/v2/IMAGE:TAG was found but does not provide any platform"
  - "error from registry: manifest invalid"
  - "##[error]Failed to push :IMAGE_TAG"
  - "Retrying \"registry.example.com/v2/IMAGE:TAG\" after 2.0s (1 of 2) due to: Error: image with reference registry.example.com/v2/IMAGE:TAG was found but does not provide any platform"
root_cause: |
  Docker 29 enables the **containerd image store** by default (via
  `containerd-snapshotter: true` in daemon config). The containerd image store
  uses **OCI Image Index format (OCI manifest list)** when pushing images,
  even for single-platform builds. This is different from Docker 27/28's default
  behavior of pushing a plain **Docker Image Manifest Schema v2** for
  single-platform images.

  Registries that do not fully support OCI Image Index format respond in various
  ways when a Docker 29 runner pushes a single-platform image:

  1. **"platform unknown" error** — registries that validate manifest media types
     (e.g., Balena Cloud, some private Harbor instances, self-hosted Quay) return
     a structured error indicating the pushed manifest does not declare a platform,
     because OCI Image Index wraps the inner manifest differently than Docker
     Schema v2.

  2. **`manifest invalid` error** — registries that strictly validate manifest
     content type headers return HTTP 400/422 `manifest invalid` when they receive
     `application/vnd.oci.image.index.v1+json` instead of the expected
     `application/vnd.docker.distribution.manifest.v2+json`.

  3. **Silent deployment failure** — some registries accept the OCI manifest
     index push silently but then fail at image pull / container start time
     because the consumer (e.g., AWS Lambda container runtime, older Kubernetes
     admission webhooks) cannot parse the OCI Image Index format.

  **Important distinction from re-130 (build-push-action provenance)**:
  - `runner-environment-130` covers the OCI index generated by
    `docker/build-push-action`'s `provenance: true` default — the fix there is
    setting `provenance: false` in the action input.
  - This entry (re-258) covers the case where the Docker **daemon itself** (v29)
    generates an OCI manifest index during a plain `docker push`, even when using
    `docker push` directly or via `docker/build-push-action` with
    `provenance: false`. The daemon-level change affects ALL push paths.

  **Affected runners (as of June 2026):**
  - Ubuntu 22.04 — Docker 29.x NOT yet deployed (Ubuntu 22.04 kept on Docker 28)
  - Ubuntu 24.04 — Docker 29.x rolled back, re-deployment pending (re-tracked in #14105)
  - Windows Server 2022 / 2025 — Docker 29.1.5 deployed February 9, 2026 ✅ AFFECTED
fix: |
  **Option 1 (recommended): Disable the containerd image store to revert to Docker
  Schema v2 push behavior**

  Add a step before the build to set `containerd-snapshotter: false` in the Docker
  daemon configuration:

  ```yaml
  - name: Disable Docker containerd image store (restore Schema v2 push)
    run: |
      echo '{"containerd-snapshotter": false}' | sudo tee /etc/docker/daemon.json
      sudo systemctl restart docker
  ```

  **Option 2: Use `--output type=docker` in buildx to force Docker Schema v2**

  If you are using `docker buildx`, force Docker Schema v2 manifest output:

  ```bash
  docker buildx build --output type=docker -t myapp:latest .
  docker push myapp:latest
  ```

  **Option 3: Use `docker save | crane push` to push OCI-incompatible registries**

  Use `crane` (google/go-containerregistry) to push the image as Docker Schema v2:

  ```bash
  docker save myapp:latest | crane push - registry.example.com/myapp:latest
  ```

  **Option 4: Upgrade the target registry to support OCI Image Index**
  Update Harbor, Quay, or your private registry to a version that handles OCI
  Image Index format. Most registries 2022+ support OCI manifest indexes.
fix_code:
  - language: yaml
    label: 'Disable containerd image store before build to restore Docker Schema v2 push behavior'
    code: |
      jobs:
        push:
          runs-on: ubuntu-latest  # or windows-latest
          steps:
            - uses: actions/checkout@v4

            - name: Disable Docker containerd image store (Docker 29 compat fix)
              # Reverts Docker 29's default OCI manifest index push to Docker Schema v2
              # Required for registries that do not support OCI Image Index format
              run: |
                echo '{"containerd-snapshotter": false}' | sudo tee /etc/docker/daemon.json
                sudo systemctl restart docker
              # On Windows runners, restart Docker Desktop instead:
              # Restart-Service docker

            - name: Build image
              run: docker build -t myapp:${{ github.sha }} .

            - name: Push to registry
              run: |
                docker login registry.example.com -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }}
                docker push myapp:${{ github.sha }}
  - language: yaml
    label: 'Use docker buildx with --output type=docker to force Docker Schema v2 manifest'
    code: |
      jobs:
        push:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3

            - name: Build image (forced Docker Schema v2, no OCI manifest index)
              run: |
                docker buildx build \
                  --output type=docker \
                  --tag myapp:${{ github.sha }} \
                  .

            - name: Push (Docker Schema v2 manifest)
              run: |
                docker login registry.example.com -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }}
                docker push myapp:${{ github.sha }}
prevention:
  - 'Validate image pushes to private or non-standard registries after any Docker daemon upgrade — Docker 29 changes the default manifest format from Docker Schema v2 to OCI Image Index.'
  - 'If your registry is self-hosted (Harbor, Quay, Gitea Container Registry), verify it supports OCI Image Index (`application/vnd.oci.image.index.v1+json`) before upgrading runners to Docker 29.'
  - 'Add a post-push validation step that pulls the image back from the registry and verifies the platform is correctly reported: `docker manifest inspect registry.example.com/myapp:TAG | jq .mediaType`'
  - 'Use `docker/build-push-action` with `provenance: false` and `sbom: false` for all private/non-standard registries to minimize manifest format surprises from both the action and the daemon.'
docs:
