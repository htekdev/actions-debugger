    label: 'Docker docs — containerd image store (Docker 29 default)'
  - url: 'https://github.com/opencontainers/image-spec/blob/main/image-index.md'
    label: 'OCI Image Index specification — multi-platform manifest format'
  - url: 'https://docs.docker.com/engine/release-notes/29.0/'
    label: 'Docker Engine 29.0 release notes — containerd image store enabled by default'
