    label: 'runner-images commit 9e3319d — [ubuntu-26] Adjust installed software (May 2026)'
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md'
    label: 'ubuntu-26.04 image README — full software list including Java 25 default'
  - url: 'https://github.com/actions/setup-java'
    label: 'actions/setup-java — pin Java version in GitHub Actions'
  - url: 'https://adoptium.net/support/'
    label: 'Eclipse Temurin support roadmap — Java 21 LTS vs Java 25 non-LTS'
