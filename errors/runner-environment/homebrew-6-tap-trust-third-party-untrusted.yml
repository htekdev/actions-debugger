id: runner-environment-507
title: 'Homebrew 6.0 Requires Explicit Trust for Third-Party Taps — aws/tap, azure/bicep Blocked by Default'
category: runner-environment
severity: warning
tags:
  - homebrew
  - macos
  - tap-trust
  - aws-tap
  - azure-bicep
  - homebrew-6
  - third-party
  - breaking-change
patterns:
  - regex: 'Warning: The following taps are not trusted:'
    flags: 'i'
  - regex: 'Error: Tap .* is not trusted\.'
    flags: 'i'
  - regex: 'brew.*tap.*untrust|untrusted.*brew.*tap'
    flags: 'i'
error_messages:
  - "Warning: The following taps are not trusted:\n  aws/tap\n  azure/bicep"
  - "Error: Tap aws/tap is not trusted. Run `brew trust aws/tap` to trust it."
root_cause: |
  Homebrew 6.0.0 (released June 11, 2026) introduced mandatory tap trust for all
  non-official taps. Previously, tapping a third-party repository automatically
  allowed Homebrew to evaluate and run all of its Ruby formulae/casks. Under
  Homebrew 6.0, every tap outside the official `homebrew/` and `cask/` namespaces
  must be explicitly trusted before Homebrew will evaluate or execute its code.

  GitHub-hosted macOS runners ship with many pre-tapped third-party repositories
  (aws/tap, azure/bicep, hashicorp/tap, etc.). These taps are all marked untrusted
  after the Homebrew 6.0 upgrade because they were added before the trust mechanism
  existed. Workflows that install formulae from these taps by short name (e.g.
  `brew install aws-sam-cli` after `brew tap aws/tap`) will see a warning — and in
  future Homebrew releases, a hard error — before the install proceeds.

  The `brew doctor` command also surfaces untrusted taps as warnings. CI workflows
  that run `brew doctor` as a lint step will fail if they treat any output as an error.

  The runner-images team has been requested to pre-trust common third-party taps in
  the image build (runner-images#14232), but until that image update ships, workflows
  relying on short-name installs from pre-tapped third-party repos are affected.

  Installing by fully-qualified name (`brew install aws/tap/aws-sam-cli`) bypasses
  the restriction by trusting only that specific item — no whole-tap trust needed.
fix: |
  Option 1 (recommended) — Use the fully-qualified formula name. This trusts only
  the specific formula you need without granting whole-tap access:

    brew install aws/tap/aws-sam-cli   # no separate trust step needed

  Option 2 — Explicitly trust the tap before installing by short name:

    brew trust aws/tap
    brew install aws-sam-cli

  Option 3 — Trust a specific formula before installing it by short name:

    brew trust --formula aws/tap/aws-sam-cli
    brew install aws-sam-cli

  Add the trust step as the first step of any macOS job that uses pre-tapped
  third-party repositories.
fix_code:
  - language: yaml
    label: 'Install by fully-qualified name — no separate trust step needed'
    code: |
      - name: Install AWS SAM CLI
        run: brew install aws/tap/aws-sam-cli   # fully-qualified: trusts this item only
  - language: yaml
    label: 'Explicitly trust the tap before installing by short name'
    code: |
      - name: Trust third-party tap and install
        run: |
          brew trust aws/tap
          brew install aws-sam-cli
  - language: yaml
    label: 'Trust multiple common taps at workflow start (if many tools needed)'
    code: |
      - name: Trust pre-tapped third-party repositories for Homebrew 6.0
        run: |
          brew trust aws/tap
          brew trust azure/bicep
          brew trust hashicorp/tap
prevention:
  - 'Prefer fully-qualified formula names (`brew install vendor/tap/formula`) over short names — trusts only the specific item without opening the whole tap.'
  - 'Add `brew trust vendor/tap` as the first step in any macOS job that uses third-party tap formulae by short name.'
  - 'Audit existing macOS workflows for `brew install <short-name>` calls that rely on a previously-tapped third-party repo when upgrading to Homebrew 6.0.'
  - 'Monitor runner-images releases — the runner team may pre-trust common taps in image builds (runner-images#14232), removing the need for manual trust steps.'
  - 'If your workflow runs `brew doctor` and treats any output as an error, add `--quiet` or filter out the untrusted-tap warning line.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14232'
    label: 'runner-images#14232 — Request to pre-trust third-party taps for Homebrew 6.0 (June 14, 2026)'
  - url: 'https://brew.sh/2026/06/11/homebrew-6.0.0/'
    label: 'Homebrew 6.0.0 release announcement (June 11, 2026)'
  - url: 'https://docs.brew.sh/Tap-Trust'
    label: 'Homebrew — Tap Trust documentation'
