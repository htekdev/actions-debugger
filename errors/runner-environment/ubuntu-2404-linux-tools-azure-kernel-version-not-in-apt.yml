    label: 'runner-images#14203 — Cannot install bpftool in ubuntu-latest runner'
  - url: 'https://github.com/libbpf/bpftool'
    label: 'libbpf/bpftool — Build bpftool from source'
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md'
    label: 'Ubuntu 24.04 runner image — preinstalled software README'
