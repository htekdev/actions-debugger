id: runner-environment-296
title: "ubuntu-24.04 PHP 8.3 default — php8.1-* and php8.2-* apt packages unavailable"
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - php
  - apt
  - version-bump
  - php-extensions
patterns:
  - regex: "Package 'php8\\.[012]-\\w+' has no installation candidate"
    flags: i
  - regex: 'E: Package .php8\.[012]-.+. has no installation candidate'
    flags: i
  - regex: 'Unable to load dynamic library.*php/202108|Unable to load dynamic library.*php/202009'
    flags: i
error_messages:
  - "E: Package 'php8.1-cli' has no installation candidate"
  - "E: Package 'php8.2-curl' has no installation candidate"
  - "PHP Warning: PHP Startup: Unable to load dynamic library 'imagick.so' (tried: /usr/lib/php/20210902/imagick.so"
root_cause: |
  ubuntu-22.04 ships PHP 8.1 as default; ubuntu-24.04 ships PHP 8.3 as default. The
  ubuntu-24.04 standard apt repositories do not include versioned PHP 8.1 or 8.2
  packages (php8.1-cli, php8.1-fpm, php8.1-curl, php8.2-mbstring, etc.) — only
  PHP 8.3 packages are available without adding a third-party PPA.

  Workflows that install a specific older PHP version via `apt-get install php8.1-*`
  fail immediately with "has no installation candidate".

  Additionally, PHP extensions use PHP API version dates in their shared library paths:
  PHP 8.1 uses /usr/lib/php/20210902/, PHP 8.3 uses /usr/lib/php/20230831/. If a
  workflow installs extensions compiled for one PHP version but runs them with another,
  the extension cannot be found at the expected path, producing PHP startup warnings
  and extensions silently failing to load.
fix: |
  For a specific PHP version on ubuntu-24.04, add the ondrej/php PPA which provides
  all PHP versions. For portable PHP version management across runner OS versions,
  use the shivammathur/setup-php action which abstracts the installation details.
fix_code:
  - language: yaml
    label: "Use shivammathur/setup-php for portable PHP version management"
    code: |
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, intl, imagick
          tools: composer
  - language: yaml
    label: "Install a specific PHP version via ondrej/php PPA on ubuntu-24.04"
    code: |
      - name: Add ondrej/php PPA and install PHP 8.2
        run: |
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install -y php8.2-cli php8.2-curl php8.2-mbstring php8.2-xml
prevention:
  - "Use shivammathur/setup-php@v2 to pin PHP version portably across runner OS versions."
  - "Avoid hardcoded php8.1-* or php8.2-* apt package names — unavailable on ubuntu-24.04."
  - "Never mix PHP versions and extensions from different sources (default apt vs PPA)."
  - "Test your PHP workflow on ubuntu-24.04 before retiring ubuntu-22.04 from your matrix."
docs:
  - url: "https://github.com/shivammathur/setup-php"
    label: "shivammathur/setup-php — PHP environment setup for GitHub Actions"
  - url: "https://launchpad.net/~ondrej/+archive/ubuntu/php"
    label: "ondrej/php PPA — PHP versions for Ubuntu"
  - url: "https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md"
    label: "ubuntu-24.04 runner image — default PHP version"
