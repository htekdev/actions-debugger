id: runner-environment-430
title: 'windows-11-arm64 Image 20260608 — Az PowerShell Module Jumps Three Major Versions (12.5.0 → 15.6.1)'
category: runner-environment
severity: warning
tags:
  - windows-11-arm64
  - az-module
  - powershell
  - breaking-change
  - major-version-bump
  - runner-images
patterns:
  - regex: 'Az.*12\..*to.*15\.|Az.*15\..*windows.*arm|windows-11-arm.*Az.*major'
    flags: 'i'
  - regex: 'The term.*is not recognized|Az\..*not.*loaded|Import-Module.*Az\.'
    flags: 'i'
error_messages:
  - 'Az 12.5.0 → 15.6.1 (windows-11-arm64 image 20260608.69.1)'
  - 'BreakingChangeAttributeException'
  - 'The term ''*-Az*'' is not recognized as a name of a cmdlet'
root_cause: |
  The windows-11-arm64 runner image updated from version 20260525.56.1 to
  20260608.69.1 (released June 8, 2026), jumping the Az PowerShell module from
  12.5.0 directly to 15.6.1 — a span of three major versions.

  All other runners (ubuntu-*, windows-2022, windows-2025, macos-*) went from
  Az 14.6.0 → 15.6.1 (one major version bump). Only windows-11-arm64 had this
  anomalous three-major-version skip, because the prior Az 13.x and 14.x
  versions were never shipped to that runner image, leaving a gap that
  accumulated three cycles of breaking changes.

  Breaking changes accumulated across Az 13, 14, and 15 include:
  - Az.Compute: renamed parameters in Set-AzVMDiskEncryptionExtension
  - Az.Network: removed deprecated Load Balancer SKU aliases
  - Az.Storage: changed default TLS version for storage accounts
  - Az.Accounts: updated Connect-AzAccount interactive flow
  - Az.Resources: renamed New-AzResourceGroupDeployment parameters

  Workflows that passed on other runners (which had incremental upgrades) may
  fail immediately on windows-11-arm64 due to the compounded breaking changes.

  Source: actions/runner-images#14207 (June 9, 2026).
fix: |
  1. **Pin the Az module version** at the start of your job to avoid the
     system-installed version:
       Install-Module -Name Az -RequiredVersion 14.6.0 -Force -AllowClobber -Scope CurrentUser
  2. **Test your workflow on windows-11-arm64 specifically** — don't assume
     it passes because it passes on windows-latest or ubuntu-latest.
  3. **Update Az usage** to the new cmdlet names and parameters per the
     Az 13, 14, and 15 migration guides.
  4. **Switch to a different runner** (windows-2025/windows-latest) for Az-heavy
     workflows if arm64 is not required, as those runners had gradual upgrades.
fix_code:
  - language: yaml
    label: 'Workaround: pin Az module version to avoid three-major-jump'
    code: |
      jobs:
        deploy:
          runs-on: windows-11-arm64
          steps:
            - name: Pin Az module version
              shell: pwsh
              run: |
                # Pin to last known-good version before the jump
                Install-Module -Name Az -RequiredVersion 14.6.0 `
                  -Force -AllowClobber -Scope CurrentUser -Repository PSGallery
                Import-Module Az -RequiredVersion 14.6.0

            - name: Deploy
              shell: pwsh
              run: |
                Connect-AzAccount -Identity
                # ... your Az commands
  - language: yaml
    label: 'Alternative: use windows-latest instead of windows-11-arm64 for Az workflows'
    code: |
      jobs:
        deploy:
          # Use windows-latest (gradual Az upgrades) instead of windows-11-arm64
          runs-on: windows-latest  # was: windows-11-arm64
          steps:
            - uses: azure/login@v2
            - run: Get-AzResourceGroup
              shell: pwsh
prevention:
  - 'Always specify exact Az module versions in workflows rather than relying on runner-baked versions'
  - 'Test on windows-11-arm64 separately — it may lag behind other runners on tool versions'
  - 'Subscribe to runner-images release notes (GitHub RSS or Watch) to track breaking tool updates'
  - 'Use Install-Module with -RequiredVersion in CI to decouple from image tool versions'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14207'
    label: 'runner-images#14207: Windows Desktop 11 Arm64 20260608 Image Update'
  - url: 'https://learn.microsoft.com/en-us/powershell/azure/migrate-az-14.0.0'
    label: 'Microsoft Docs: Migration guide from Az 13.x to Az 14.x'
  - url: 'https://learn.microsoft.com/en-us/powershell/azure/migrate-az-15.0.0'
    label: 'Microsoft Docs: Migration guide from Az 14.x to Az 15.x'