    label: 'lobehub#15026: Upstream Sync workflow fails — actions-cool disabled after supply chain attack (May 2026)'
  - url: 'https://github.com/lobehub/lobehub/pull/14956'
    label: 'lobehub#14956: Remove compromised actions-cool/issues-helper@v3'
  - url: 'https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions'
    label: 'GitHub Docs: Security hardening — third-party actions best practices'
  - url: 'https://github.com/step-security/harden-runner'
    label: 'StepSecurity Harden-Runner: detect and prevent supply chain attacks in Actions'