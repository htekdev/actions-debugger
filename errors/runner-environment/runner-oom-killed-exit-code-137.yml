id: runner-environment-061
title: "Build Step Killed with Exit Code 137 (OOM Kill) on GitHub-Hosted Runner"
category: runner-environment
severity: error
tags:
  - oom
  - exit-code-137
  - memory
  - npm-install
  - gradle
  - node-heap
  - ubuntu-latest
  - linux-kernel
patterns:
  - regex: "Process completed with exit code 137"
    flags: "i"
  - regex: "^Killed\\s*$"
    flags: "im"
  - regex: "fatal error: Reached heap limit.*Allocation failed"
    flags: "i"
  - regex: "FATAL ERROR:.*JavaScript heap out of memory"
    flags: "i"
error_messages:
  - "Process completed with exit code 137."
  - "Killed"
  - "FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory"
  - "fatal error: Reached heap limit - Allocation failed"
root_cause: |
  Exit code 137 on Linux means the process was killed by the **OOM (Out-Of-Memory) killer** —
  the Linux kernel's mechanism for reclaiming memory when the system is critically low. GitHub-
  hosted `ubuntu-latest` runners have approximately 7 GB of usable RAM. Memory-intensive steps
  that exceed this ceiling are killed by the kernel; the application receives no opportunity to
  write an error message, resulting in "Process completed with exit code 137" or just "Killed"
  with no other output.

  The build works locally because developer machines typically have 16–32 GB RAM.

  **Common triggers:**
  - **Node.js builds** (Webpack, Vite, Next.js, esbuild): V8's default heap limit is ~1.5–2 GB.
    Large bundles exceed this and print "FATAL ERROR: Reached heap limit Allocation failed" before
    the process is OOM-killed.
  - **npm install / yarn / pnpm**: Large monorepo dependency trees with postinstall native module
    compilation can consume several GB during the link phase.
  - **Gradle / Android builds**: Gradle daemon JVM default heap grows unboundedly; large projects
    or multi-module Android apps commonly OOM on default runner sizes.
  - **Rust / C++ compilation**: Large codebases with many parallel compile units saturate RAM
    when `make -j` parallelism is not capped.
fix: |
  **Node.js JavaScript heap OOM:** Set `NODE_OPTIONS=--max-old-space-size=4096` to increase
  the V8 heap ceiling to 4 GB, staying within the 7 GB runner budget.

  **Gradle / Android JVM OOM:** Add `GRADLE_OPTS=-Xmx4g -Xms512m` as an env variable or set
  `org.gradle.jvmargs=-Xmx4096m` in `gradle.properties`.

  **Rust / C++ parallel compile OOM:** Cap parallelism with `make -j$(nproc --ignore=2)` or
  set `CARGO_BUILD_JOBS` to half the available CPU count.

  **All cases — free preinstalled tooling first:** GitHub-hosted runners come with large
  preinstalled tool caches (Android SDK, .NET, Haskell, etc.) that consume GB of disk AND
  memory pressure. Use `jlumbroso/free-disk-space` to reclaim this before memory-intensive steps.

  **Upgrade runner:** For builds that structurally require more than 7 GB, upgrade to a
  larger GitHub-hosted runner (16-core = 64 GB RAM) or a self-hosted runner.
fix_code:
  - language: yaml
    label: "Increase Node.js V8 heap for JavaScript heap OOM"
    code: |
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
  - language: yaml
    label: "Cap Gradle JVM heap for Android / Java OOM"
    code: |
      - name: Build with Gradle
        env:
          GRADLE_OPTS: -Xmx4g -Xms512m -XX:+HeapDumpOnOutOfMemoryError
        run: ./gradlew assembleRelease --no-daemon
  - language: yaml
    label: "Free preinstalled tool cache before memory-intensive build"
    code: |
      - name: Free runner overhead (Android SDK, .NET, Haskell, etc.)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      # Alternative: upgrade to 64 GB runner
      # runs-on: ubuntu-latest-16-cores  # 16 vCPU, 64 GB RAM
prevention:
  - "Set `NODE_OPTIONS=--max-old-space-size=4096` as a job-level env var for all Node.js build workflows."
  - "Set `GRADLE_OPTS=-Xmx4g` in workflow env or `org.gradle.jvmargs` in gradle.properties for Android/Java builds."
  - "Run `jlumbroso/free-disk-space` before large builds to reclaim memory occupied by preinstalled tooling."
  - "Use `--no-daemon` with Gradle in CI to prevent daemon heap accumulation across steps."
  - "Profile peak memory usage locally using `/usr/bin/time -v` or `valgrind --tool=massif` before scaling in CI."
