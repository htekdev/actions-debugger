id: runner-environment-409
title: 'npm v12 --allow-git Defaults to None — Git URL and GitHub Tarball Dependencies Blocked in CI'
category: runner-environment
severity: error
tags:
  - npm
  - npm-v12
  - allow-git
  - allow-remote
  - git-dependencies
  - breaking-change
  - tarball
  - github-packages
patterns:
  - regex: 'npm warn.*git dependency|git dependencies are not allowed|--allow-git|allow-git.*none'
    flags: 'i'
  - regex: 'npm warn.*remote dependency|remote dependencies are not allowed|--allow-remote|allow-remote.*none'
    flags: 'i'
  - regex: 'git\+https?://.*blocked|github\.com.*tarball.*not allowed'
    flags: 'i'
error_messages:
  - "npm warn git dependency \"git+https://github.com/org/repo\" is not allowed by default in the next major version"
  - "npm error git dependencies are not allowed. Use --allow-git to install git dependencies."
  - "npm warn remote dependency \"https://...tarball...\" is not allowed by default in the next major version"
  - "npm error remote dependencies are not allowed. Use --allow-remote to install remote URL dependencies."
root_cause: |
  npm v12 (estimated July 2026) introduces two new security-hardened defaults that
  affect common GitHub Actions CI patterns:

  1. `--allow-git` defaults to `none`: `npm install` will no longer resolve
     Git URL dependencies (e.g., `"package": "git+https://github.com/org/repo"`)
     or transitive git dependencies. This closes a code-execution path where a
     git dependency's `.npmrc` could override the git executable.

  2. `--allow-remote` defaults to `none`: `npm install` will no longer resolve
     dependencies from remote HTTPS URLs (e.g., tarball URLs like
     `"package": "https://github.com/org/repo/tarball/v1.0.0"`).

  Both patterns are common in GitHub Actions workflows:
  - Installing unreleased versions from GitHub branches/forks as git URL deps
  - Installing pre-release artifacts via tarball URLs in `package.json`
  - Transitive dependencies that pull in git or HTTP URL sources

  Starting with npm 11.10.0+, CI logs will show warnings for each affected
  dependency. After npm v12 ships, the same installs will fail with an error.

  The related `--allow-file` and `--allow-directory` flags are NOT changing in v12.

  Documented in the GitHub Changelog (2026-06-09):
  https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/
fix: |
  **Preferred fix — migrate away from git/URL dependencies:**
  1. Publish the package to npm registry (even as a scoped/private package).
  2. Replace `"git+https://github.com/org/repo"` with a semver range from the
     registry. This is the most secure and reproducible approach.

  **If git URL deps are required in CI:**
  Pass `--allow-git=all` (or a comma-separated list of allowed packages) to
  `npm install`:
    `npm install --allow-git=all`
  Or set in `.npmrc`:
    `allow-git=all`

  **If remote URL (tarball) deps are required in CI:**
  Pass `--allow-remote=all` to `npm install`:
    `npm install --allow-remote=all`

  **Check which packages are affected now (npm 11.10.0+):**
  Run `npm install` and observe warnings about `git dependency` or
  `remote dependency` — these will become errors in npm v12.
fix_code:
  - language: yaml
    label: "CI workaround — allow git and remote URL dependencies explicitly"
    code: |
      - name: Install dependencies
        run: npm install --allow-git=all --allow-remote=all
        # ⚠️ Review git/URL deps and migrate to registry packages when possible
  - language: yaml
    label: "Preferred fix — replace git URL dep with published version"
    code: |
      # In package.json, replace:
      #   "my-util": "git+https://github.com/org/my-util"
      # With a published registry version:
      #   "my-util": "^1.2.3"
      #
      # Then in your workflow:
      - name: Install dependencies
        run: npm install
        # No flags needed — uses registry packages only
prevention:
  - "Audit `package.json` for git URL and HTTPS tarball dependencies now — run `npm install` with npm 11.10.0+ to see warnings."
  - "Publish internal/fork packages to a private npm registry or GitHub Packages to avoid git URL dependencies entirely."
  - "Pin npm version in CI to avoid unexpected upgrades to v12 before you have migrated: `npm install -g npm@11.x`"
  - "Use Dependabot or `npm outdated` regularly so internal packages can be consumed via proper semver from a registry."
docs:
  - url: "https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/"
    label: "GitHub Changelog — Upcoming breaking changes for npm v12 (2026-06-09)"
  - url: "https://docs.npmjs.com/cli/v11/using-npm/config#allow-git"
    label: "npm config — allow-git"
  - url: "https://docs.npmjs.com/cli/v11/using-npm/config#allow-remote"
    label: "npm config — allow-remote"
