id: runner-environment-273
title: "actions/setup-node Fails to Parse .nvmrc With Inline Comments or Empty Comment Lines"
category: runner-environment
severity: error
tags:
  - setup-node
  - nvmrc
  - node-version-file
  - comments
  - version-parsing
patterns:
  - regex: 'Unable to find Node version .{0,5}#'
    flags: 'i'
  - regex: 'Unable to find Node version.*# '
    flags: 'i'
  - regex: "Unable to find Node version '#"
    flags: 'i'
error_messages:
  - "Error: Unable to find Node version '# comment' for platform linux and architecture x64."
  - "Error: Unable to find Node version 'v24 # use LTS' for platform linux and architecture x64."
  - "Error: Unable to find Node version '#' for platform linux and architecture x64."
root_cause: |
  `actions/setup-node` reads `.nvmrc` files when `node-version-file: .nvmrc` is configured, but its
  internal regex parser (in `src/util.ts`) does not correctly strip comments as specified by
  nvm v0.40.0+ comment syntax rules.

  Since nvm v0.40.0, `.nvmrc` files may legally contain:
    - Full-line comments:   `# This project requires Node 20`
    - Inline comments:      `v24 # LTS codename Iron`
    - Empty comment lines:  `#` or `##` (used for spacing/formatting)
    - Trailing whitespace on the version line when comments are present

  The `setup-node` regex fails in the following specific cases, all confirmed in
  actions/setup-node#1119 (Jan 2026 comment by @sodic):

  1. **Inline comments**: `v24 # comment` — the entire line including `# comment` is read as the
     version string. Lookup fails: "Unable to find Node version 'v24 # comment' ...".

  2. **Leading empty comment lines**: a file starting with `#` (bare hash, no text) causes the
     parser to match `#` as the version. Lookup fails: "Unable to find Node version '#' ...".

  3. **Comment + trailing whitespace on version**: when comments appear above a version line that
     has trailing spaces, the regex matches the entire file content (comments + version + spaces)
     as the version string — producing a multi-line literal in the error message.

  Common scenario: a developer adds a comment to `.nvmrc` (e.g., generated by tooling or added for
  documentation), and CI starts failing with a confusing "Unable to find Node version" error that
  looks like a network or toolcache issue rather than a file-format problem.
fix: |
  Remove all comments from the `.nvmrc` file used in CI. Keep `.nvmrc` to a single line containing
  only the version number (with optional leading `v`), no comments, and no trailing whitespace.

  If you need to document the version choice, add a comment to the workflow YAML file instead.

  Alternatively, bypass `.nvmrc` entirely and specify the version directly in the workflow with
  `node-version:` — eliminating the dependency on `.nvmrc` comment-parsing correctness.
fix_code:
  - language: yaml
    label: "WRONG — .nvmrc with comment causes setup-node to read the comment as the version"
    code: |
      # .nvmrc content that FAILS:
      # (inline comment)
      # v24 # LTS Iron
      #
      # (leading empty comment line before version)
      # #
      # 20.17.0
      #
      # (leading full comment line)
      # # Node.js LTS for this project
      # 20.17.0

      # Workflow step — all of the above .nvmrc formats cause failure:
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
  - language: yaml
    label: "CORRECT — .nvmrc with version only (no comments, no trailing whitespace)"
    code: |
      # .nvmrc content that WORKS:
      # 20.17.0
      # (just the version number, nothing else)

      # Workflow step:
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
  - language: yaml
    label: "ALTERNATIVE — specify version directly in workflow to avoid .nvmrc parsing"
    code: |
      - uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'   # no dependency on .nvmrc comment-parsing behavior
prevention:
  - "Keep `.nvmrc` to a single version-only line with no comments, no inline comments, and no trailing whitespace."
  - "Add a CI validation step to verify `.nvmrc` format: `grep -P '^v?[0-9]+' .nvmrc || (echo '.nvmrc has unsupported content' && exit 1)`."
  - "If your `.nvmrc` is generated by tooling that adds comments (nvm v0.40.0+ format), pre-process it in CI before setup-node reads it."
  - "Track actions/setup-node#1119 — a fix improving comment-stripping may land in a future release."
docs:
  - url: "https://github.com/actions/setup-node/issues/1119"
    label: "actions/setup-node#1119 — .nvmrc with nvm v0.40.0 comments not parsed correctly"
  - url: "https://github.com/nvm-sh/nvm/blob/master/README.md#nvmrc"
    label: "nvm .nvmrc format — comment syntax specification"
  - url: "https://github.com/actions/setup-node/blob/main/src/util.ts"
    label: "setup-node util.ts — version-file parsing regex"
