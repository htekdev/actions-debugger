id: runner-environment-286
title: "windows-2025-vs2026 VSTO Office add-in builds fail — MSB4018 VerifyClickOnceSigningSettings / Microsoft.VisualStudio.Tools.Applications.Hosting not found"
category: runner-environment
severity: error
tags:
  - visual-studio-2026
  - windows-latest
  - vsto
  - msbuild
  - office-addin
  - breaking-change
  - clickonce
patterns:
  - regex: 'The "VerifyClickOnceSigningSettings" task failed unexpectedly'
    flags: 'i'
  - regex: 'Could not load file or assembly.*Microsoft\.VisualStudio\.Tools\.Applications\.Hosting'
    flags: 'i'
  - regex: 'MSB4018.*VerifyClickOnceSigningSettings'
    flags: 'i'
  - regex: 'VSTO.*FileNotFoundException.*Microsoft\.VisualStudio\.Tools\.Applications'
    flags: 'i'
error_messages:
  - "error MSB4018: The \"VerifyClickOnceSigningSettings\" task failed unexpectedly."
  - "System.IO.FileNotFoundException: Could not load file or assembly 'Microsoft.VisualStudio.Tools.Applications.Hosting, Version=10.0.0.0, Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a'"
  - "error MSB4018: The \"VerifyClickOnceSigningSettings\" task failed unexpectedly. System.IO.FileNotFoundException: Could not load file or assembly 'Microsoft.VisualStudio.Tools.Applications.Hosting, Version=10.0.0.0'"
root_cause: |
  GitHub Actions migrated `windows-latest` and `windows-2025` to use Visual Studio 2026
  (v145 toolset) over June 8-15, 2026. Visual Studio Tools for Office (VSTO) 4.0 Runtime
  projects depend on `Microsoft.VisualStudio.Tools.Applications.Hosting.dll` (v10.0.0.0),
  a .NET assembly that was part of the VSTO SDK in VS2022 and earlier.

  Visual Studio 2026 does not include the VSTO 4.0 Runtime SDK assembly in its installation
  path. The MSBuild task `VerifyClickOnceSigningSettings` (from
  `Microsoft.VisualStudio.Tools.Office.targets`) attempts to load this assembly at build
  time and fails with `System.IO.FileNotFoundException`, surfacing as `MSB4018`.

  Affected project types:
  - Word / Excel / Outlook / PowerPoint VSTO add-ins
  - Projects targeting `VSTO 4.0 Runtime`
  - Any `.csproj` that imports `Microsoft.VisualStudio.Tools.Office.targets`

  The VS2026 installer installs `Microsoft.VisualStudio.Component.VSTO` as an optional
  component. Without it, the VSTO targets are partially installed (msbuild targets present)
  but the hosting assembly (`Hosting.dll`) is missing.
fix: |
  **Option 1 — Pin to windows-2022 (immediate workaround):**
  Update `runs-on` to `windows-2022` to stay on Visual Studio 2022, which includes
  the full VSTO SDK.

  **Option 2 — Install the VSTO component in the VS2026 image:**
  Use `choco install` or `vs_installer.exe` to add
  `Microsoft.VisualStudio.Component.VSTO` to the runner. This takes several
  minutes but allows continued use of `windows-latest`.

  **Option 3 — Migrate from VSTO to Office Add-in (Web) model:**
  Microsoft's long-term recommendation is to migrate VSTO add-ins to the modern
  Office Add-in (formerly Office Web Add-in) model using JavaScript/TypeScript.
  VSTO is a legacy technology with limited future VS support.
fix_code:
  - language: yaml
    label: "Pin to windows-2022 (immediate fix)"
    code: |
      jobs:
        build:
          runs-on: windows-2022  # VS2022 includes full VSTO 4.0 Runtime SDK
          steps:
            - uses: actions/checkout@v4
            - name: Build VSTO add-in
              run: msbuild MyOfficeAddin.sln /p:Configuration=Release
  - language: yaml
    label: "Install VSTO component on windows-latest VS2026 (adds ~5 min)"
    code: |
      jobs:
        build:
          runs-on: windows-latest  # VS2026
          steps:
            - name: Install VSTO component
              shell: pwsh
              run: |
                $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
                & $installer modify `
                  --installPath "C:\Program Files\Microsoft Visual Studio\2026\Enterprise" `
                  --add Microsoft.VisualStudio.Component.VSTO `
                  --quiet --norestart
            - uses: actions/checkout@v4
            - name: Build VSTO add-in
              run: msbuild MyOfficeAddin.sln /p:Configuration=Release
prevention:
  - "VSTO-based Office add-ins require the Microsoft.VisualStudio.Component.VSTO component, which is optional in VS2026"
  - "Test VS2026 compatibility before the June 8-15, 2026 migration window by temporarily using runs-on: windows-2025-vs2026"
  - "Consider migrating VSTO add-ins to the modern Office Add-in (web) model — Microsoft's long-term direction"
  - "Subscribe to actions/runner-images release notes for breaking changes during major VS version upgrades"
docs:
  - url: "https://github.com/actions/runner-images/issues/14017"
    label: "actions/runner-images#14017 — windows-latest VS2026 migration tracking issue"
  - url: "https://learn.microsoft.com/en-us/visualstudio/vsto/visual-studio-tools-for-office-runtime-overview"
    label: "Microsoft Docs — Visual Studio Tools for Office Runtime overview"
  - url: "https://learn.microsoft.com/en-us/office/dev/add-ins/overview/office-add-ins"
    label: "Microsoft Docs — Office Add-ins (modern replacement for VSTO)"
  - url: "https://github.com/blog/changelog/2026-05-14-github-actions-upcoming-image-migrations/"
    label: "GitHub Changelog — Upcoming image migrations (VS2026 rollout June 8-15, 2026)"
