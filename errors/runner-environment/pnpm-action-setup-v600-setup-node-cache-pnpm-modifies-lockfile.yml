id: runner-environment-317
title: "pnpm/action-setup v6.0.0 + setup-node cache:pnpm Silently Modifies pnpm-lock.yaml Breaking --frozen-lockfile"
category: runner-environment
severity: error
tags:
  - pnpm
  - setup-node
  - cache
  - lockfile
  - node
  - action-setup
  - breaking-change
patterns:
  - regex: 'ERR_PNPM_LOCKFILE_CONFIG_MISMATCH'
    flags: "i"
  - regex: 'Cannot proceed with the frozen installation.*configuration.*doesn.t match.*lockfile'
    flags: "si"
  - regex: 'pnpm install --frozen-lockfile.*error.*lockfile'
    flags: "si"
  - regex: 'Update your lockfile using "pnpm install --no-frozen-lockfile"'
    flags: "i"
error_messages:
  - " ERR_PNPM_LOCKFILE_CONFIG_MISMATCH  Cannot proceed with the frozen installation. The current \"overrides\" configuration doesn't match the value found in the lockfile"
  - "Update your lockfile using \"pnpm install --no-frozen-lockfile\""
  - "Process completed with exit code 1."
root_cause: |
  `pnpm/action-setup@v6.0.0` (released ~April 2026) introduced a bug where, when
  used alongside `actions/setup-node` with `cache: "pnpm"`, the action prepends
  extra lockfile metadata to `pnpm-lock.yaml`. The added content includes a
  `lockfileVersion: '9.0'` header and configuration sections (importers,
  packageManagerDependencies) that were not originally in the lockfile.

  Because the modified lockfile is now written to disk before the `pnpm install`
  step runs, `pnpm install --frozen-lockfile` sees a config mismatch between the
  in-memory package configuration and the now-altered on-disk lockfile. It exits
  with `ERR_PNPM_LOCKFILE_CONFIG_MISMATCH`.

  The failure is silent — no warning is emitted when the lockfile is modified.
  Developers see a confusing "configuration doesn't match" error that points to
  the lockfile, not to the action version.

  This affects the combination:
  - `pnpm/action-setup@v6.0.0` exactly (NOT v5.x, NOT v6.0.1+)
  - `actions/setup-node` with `cache: "pnpm"` enabled
  - Any `pnpm install --frozen-lockfile` step

  Fixed in `pnpm/action-setup@v6.0.1` (see issue #228).
  Source: pnpm/action-setup#226 (April 2026, 16 👍, closed).
fix: |
  **Primary fix — upgrade pnpm/action-setup to v6.0.1 or later:**
  The bug was fixed in v6.0.1. Update your workflow to use at minimum v6.0.1.

  **Temporary rollback — downgrade to v5:**
  If you cannot upgrade immediately, pin to `pnpm/action-setup@v5` (last known-good
  major version).

  **Diagnosis — check for unexpectedly modified pnpm-lock.yaml:**
  Add a `git diff pnpm-lock.yaml` step after `setup-node` to detect whether the
  lockfile was silently changed.
fix_code:
  - language: yaml
    label: "Upgrade pnpm/action-setup to v6.0.1+ to get the fix"
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6       # v6.0.1+ contains the fix
              with:
                version: 10
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
                cache: pnpm
            - run: pnpm install --frozen-lockfile
  - language: yaml
    label: "Detect lockfile modification (diagnosis step)"
    code: |
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify pnpm-lock.yaml not modified
        run: |
          git diff --exit-code pnpm-lock.yaml || \
            (echo "pnpm-lock.yaml was modified by action setup!" && exit 1)
      - run: pnpm install --frozen-lockfile
prevention:
  - "Always pin action versions with a minor + patch (e.g., `pnpm/action-setup@v6.0.1`) rather than a bare major tag during the period following a major version bump."
  - "Add a `git diff pnpm-lock.yaml` check in CI to catch unexpected lockfile mutations before `--frozen-lockfile` fails."
  - "Subscribe to pnpm/action-setup release notes when upgrading major versions."
  - "Test the `pnpm/action-setup` + `setup-node cache:pnpm` combination in a branch before rolling out to all workflows."
docs:
  - url: "https://github.com/pnpm/action-setup/issues/226"
    label: "pnpm/action-setup#226 — v6.0.0 cache:pnpm modifies pnpm-lock.yaml"
  - url: "https://github.com/pnpm/action-setup/issues/228"
    label: "pnpm/action-setup#228 — fix confirmed for v6.0.1"
  - url: "https://github.com/pnpm/action-setup/releases/tag/v6.0.1"
    label: "pnpm/action-setup v6.0.1 release notes"
  - url: "https://pnpm.io/cli/install#--frozen-lockfile"
    label: "pnpm --frozen-lockfile documentation"
