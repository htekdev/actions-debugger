id: runner-environment-419
title: 'Runner Image Ships pnpm 11 System-Wide — Corepack Intercepts action-installed pnpm 10, Rejects LockfileVersion 9'
category: runner-environment
severity: error
tags:
  - pnpm
  - corepack
  - runner-image
  - pnpm-11
  - pnpm-10
  - lockfile
  - action-setup
  - ubuntu
patterns:
  - regex: 'ERR_PNPM_LOCKFILE_CONFIG_MISMATCH|lockfileVersion.*9.*not.*compatible|pnpm.*v11.*requires.*lockfile'
    flags: 'i'
  - regex: 'corepack.*pnpm.*intercept|pnpm.*v11.*installed.*corepack'
    flags: 'i'
  - regex: 'ERR_UNSUPPORTED_LOCKFILE_VERSION.*9|lockfile.*version.*9.*broken'
    flags: 'i'
error_messages:
  - "ERR_PNPM_LOCKFILE_CONFIG_MISMATCH"
  - "This version of pnpm requires a lockfile version 10 or higher"
  - "ERR_UNSUPPORTED_LOCKFILE_VERSION"
root_cause: |
  Starting with runner image build **20260406.80.1**, GitHub-hosted Ubuntu and
  macOS 26 runner images ship **pnpm 11.x system-wide** (installed outside of
  corepack's control). Corepack is also pre-installed on these images.

  When a workflow uses `pnpm/action-setup@v6` to install pnpm 10.x (e.g., because
  `packageManager: "pnpm@10.29.3"` is in `package.json`), the action correctly
  installs pnpm 10.x into the tool cache. However, the system-wide corepack
  intercepts the `pnpm` binary:

  1. Corepack sees `pnpm` called and checks the active version.
  2. Since pnpm 11 is installed system-wide in corepack's registry, it routes the
     `pnpm` command to pnpm 11 instead of the pnpm 10.x installed by action-setup.
  3. pnpm 11 reads the `pnpm-lock.yaml`, which has `lockfileVersion: '9.0'` (the
     format generated by pnpm 10.x).
  4. pnpm 11 requires `lockfileVersion: '10.0'` or higher and rejects the existing
     lockfile with an incompatibility error.

  The confusion arises because `pnpm/action-setup@v6` appears to succeed
  (the install step passes), but subsequent `pnpm install` or `pnpm ci` steps
  fail with lockfile version errors even though the lockfile was generated by
  the correct pnpm 10.x version.

  This is distinct from `pnpm-action-setup-v600-setup-node-cache-pnpm-modifies-lockfile.yml`
  (re-317), which is about setup-node's cache mechanism modifying pnpm-lock.yaml.
  This issue is about corepack routing the `pnpm` command to the wrong version.

  This also differs from `setup-node-v5-corepack-pnpm-not-found.yml` (re-060),
  which is about corepack failing to find pnpm at all.
fix: |
  **Disable the corepack pnpm shim immediately after pnpm/action-setup:**

    - uses: pnpm/action-setup@v6
      with:
        version: 10
    - name: Disable corepack pnpm shim
      run: corepack disable pnpm

  This prevents corepack from intercepting the `pnpm` binary and lets
  the action-installed pnpm 10.x handle all `pnpm` commands.

  **Alternative — use pnpm/action-setup with `pnpm-shim: false`:**
  Some versions of the action support a flag to skip corepack shim creation.
  Check the action's README for the exact flag name in your version.

  **Alternative — pin to pnpm 11 and update lockfile:**
  If your project can migrate to pnpm 11, update `packageManager` in
  `package.json` to `pnpm@11.x.x` and regenerate `pnpm-lock.yaml`.
fix_code:
  - language: yaml
    label: 'Disable corepack pnpm shim after pnpm/action-setup to prevent intercept'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                version: 10        # or from package.json packageManager field

            - name: Disable corepack pnpm shim
              run: corepack disable pnpm   # prevents pnpm 11 intercept

            - uses: actions/setup-node@v6
              with:
                node-version: 22
                cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
  - language: yaml
    label: 'Pin to pnpm 11 and update the lockfile (migration path)'
    code: |
      # In package.json, update the packageManager field:
      # "packageManager": "pnpm@11.x.x"
      #
      # Then regenerate the lockfile locally:
      #   pnpm install  (regenerates pnpm-lock.yaml with lockfileVersion: '10.0')
      # Commit the updated lockfile.
      #
      # Workflow needs no special changes after migrating to pnpm 11.
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                version: 11
            - uses: actions/setup-node@v6
              with:
                node-version: 22
                cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
prevention:
  - 'When upgrading runner images or action versions, verify which pnpm version corepack routes to before assuming action-setup controls the `pnpm` binary.'
  - 'Run `which pnpm && pnpm --version` in a diagnostic step to confirm the action-installed pnpm is being used, not the system corepack version.'
  - 'If corepack is enabled on the runner image, always explicitly disable it for any package manager you are controlling via action-setup.'
  - 'Monitor runner image release notes for pnpm version changes that may affect corepack routing behavior.'
docs:
  - url: 'https://github.com/pnpm/action-setup'
    label: 'pnpm/action-setup GitHub repository'
  - url: 'https://github.com/actions/runner-images'
    label: 'GitHub Actions runner-images — release notes for tool version changes'
  - url: 'https://nodejs.org/api/corepack.html'
    label: 'Node.js Corepack documentation'
  - url: 'https://pnpm.io/package_json#packagemanager'
    label: 'pnpm docs — packageManager field in package.json'
