id: runner-environment-284
title: "Self-Hosted Runner Config/Registration Blocked — Below Minimum Version v2.329.0"
category: runner-environment
severity: error
tags:
  - self-hosted
  - runner
  - minimum-version
  - registration
  - config-sh
  - arc
  - version-enforcement
patterns:
  - regex: 'Runner version.*does not meet the minimum required version'
    flags: 'i'
  - regex: 'minimum.*version.*required.*config|config.*blocked.*minimum'
    flags: 'i'
  - regex: 'must be v2\.329\.0 or later|must be.*2\.329|minimum.*2\.329'
    flags: 'i'
  - regex: 'Configuration failed.*version.*requirement|registration.*blocked.*version'
    flags: 'i'
error_messages:
  - "Runner version does not meet the minimum required version. Please upgrade to v2.329.0 or later."
  - "Configuration failed: runner version does not meet minimum version requirement"
  - "Registration blocked: runner is below minimum version v2.329.0"
root_cause: |
  Starting March 16, 2026, GitHub.com permanently blocks the configuration and
  registration (./config.sh) of self-hosted runners older than v2.329.0 (released
  October 15, 2025).

  This is distinct from the runtime deprecation error ("Runner version vX.X.X is
  deprecated and cannot receive messages") which affects runners that are already
  registered but too old to pick up new jobs. This enforcement blocks the initial
  config/registration step before a runner ever starts listening for jobs.

  Teams affected include:
  - Self-hosted runners built from Docker images or VM snapshots containing old runner
    binaries (especially ARC — Actions Runner Controller — custom runner images)
  - Infrastructure-as-code pipelines that download a pinned runner version during setup
  - Teams that provision ephemeral runners with a hardcoded runner release URL
  - Self-hosted runners that auto-upgrade to a version below v2.329.0 and then
    attempt to re-register

  GitHub Enterprise Server (GHES) customers are NOT affected by this enforcement —
  it applies to github.com only.

  A brownout period ran from February 23 to March 15, 2026 with temporary 2-hour
  registration blocks to warn teams. Full enforcement began March 16, 2026.
fix: |
  Update all self-hosted runner installations to v2.329.0 or later before running
  ./config.sh:

  1. Download the latest runner release from https://github.com/actions/runner/releases
  2. Update installation scripts, Dockerfiles, or Packer templates that pin a runner
     version to reference v2.329.0 or later
  3. For ARC (Actions Runner Controller): update the runner container image to one that
     ships runner v2.329.0+; pull recent official ARC runner images
  4. Rebuild/redeploy any VM images, AMIs, or container images that bake in the runner
  5. For ephemeral runners: update the provisioning automation to download the latest
     release at provision time rather than a hardcoded version URL
fix_code:
  - language: yaml
    label: "Fix: always download latest runner release during provisioning"
    code: |
      # In your runner setup script, use the latest release instead of a pinned version:
      - name: Download latest GitHub Actions runner
        run: |
          # Fetch latest version dynamically
          RUNNER_VERSION=$(curl -s https://api.github.com/repos/actions/runner/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          curl -L -o actions-runner-linux-x64.tar.gz \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
          tar xzf ./actions-runner-linux-x64.tar.gz
  - language: yaml
    label: "Fix for ARC: pin runner image to version that ships v2.329.0+"
    code: |
      # In your RunnerDeployment or AutoscalingRunnerSet spec:
      apiVersion: actions.summerwind.dev/v1alpha1
      kind: RunnerDeployment
      spec:
        template:
          spec:
            image: ghcr.io/actions/actions-runner:latest  # ✅ Always use latest official image
            # OR pin to a specific recent tag:
            # image: ghcr.io/actions/actions-runner:2.329.0
prevention:
  - "Never pin a runner binary to a specific old version URL — always pull the latest runner release during provisioning"
  - "Add a CI check or alerting on your runner provisioning pipeline to detect when the bundled runner version is nearing deprecation"
  - "For ARC users: subscribe to actions/runner releases (watch the repo) to get notified of new versions and update custom runner images promptly"
  - "Monitor the GitHub Changelog (github.blog/changelog) for runner version enforcement announcements — GitHub announces enforcement timelines months in advance with brownout periods"
docs:
  - url: "https://github.blog/changelog/2026-02-05-github-actions-self-hosted-runner-minimum-version-enforcement-extended"
    label: "GitHub Changelog: Self-hosted runner minimum version enforcement extended (Feb 2026)"
  - url: "https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners#requirements-for-self-hosted-runner-machines"
    label: "GitHub Docs: Requirements for self-hosted runner machines"
  - url: "https://github.com/actions/runner/releases"
    label: "actions/runner releases — download latest runner version"
