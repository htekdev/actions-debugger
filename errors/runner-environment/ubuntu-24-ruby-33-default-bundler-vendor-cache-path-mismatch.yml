id: runner-environment-294
title: "ubuntu-24.04 Ruby 3.3 default — Bundler vendor cache path incompatible with Ruby 3.1"
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - ruby
  - bundler
  - cache
  - vendor
  - version-bump
patterns:
  - regex: 'vendor/bundle/ruby/3\.1\.0/gems'
    flags: i
  - regex: 'Could not find .+ in locally installed gems\.'
    flags: i
  - regex: 'Your bundle is locked to .+, but that version could not be found'
    flags: i
error_messages:
  - "Could not find gem 'X' in locally installed gems."
  - "Run `bundle install` to install missing gems."
  - "Your bundle is locked to bundler (2.x.y), but that version could not be found in any of the sources listed in your Gemfile."
root_cause: |
  ubuntu-22.04 ships Ruby 3.1.x as default; ubuntu-24.04 ships Ruby 3.3.x. Bundler
  stores gems under vendor/bundle/ruby/<RUBY_ABI_VERSION>/, where the ABI version
  matches the installed Ruby major.minor.teeny. When a workflow caches vendor/bundle
  from a ubuntu-22.04 runner (path: vendor/bundle/ruby/3.1.0/) and restores it on
  ubuntu-24.04 (Ruby 3.3.x), Bundler cannot find the gems at the expected 3.3.x path
  and either falls back to a full reinstall or exits with "Could not find gem" errors.

  If the CI step uses --deployment or BUNDLE_DEPLOYMENT=1, Bundler strictly requires
  the lockfile to match the installed gems and refuses to reinstall, producing hard
  failures. Native extension gems (nokogiri, ffi, puma, etc.) compiled for Ruby 3.1
  are also ABI-incompatible with Ruby 3.3 even if the cache path matches.
fix: |
  Include the Ruby version in your cache key so the cache is invalidated when the
  runner's default Ruby version changes. Use ruby/setup-ruby or a .ruby-version file
  to pin the Ruby version explicitly, ensuring consistency across environments.
fix_code:
  - language: yaml
    label: "Pin Ruby version and use versioned cache key via ruby/setup-ruby"
    code: |
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'          # pin explicitly — never rely on runner default
          bundler-cache: true          # handles versioned vendor/bundle caching automatically
  - language: yaml
    label: "Include Ruby version in manual cache key"
    code: |
      - name: Set Ruby version env var
        run: echo "RUBY_VERSION=$(ruby -e 'puts RUBY_VERSION')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ env.RUBY_VERSION }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-${{ env.RUBY_VERSION }}-
prevention:
  - "Never cache vendor/bundle without including the Ruby version in the cache key."
  - "Use ruby/setup-ruby with bundler-cache: true — it handles versioned caching automatically."
  - "Explicitly pin ruby-version in your workflow instead of relying on runner defaults."
  - "Add a .ruby-version file to your repo to document and enforce the expected Ruby version."
docs:
  - url: "https://github.com/ruby/setup-ruby#caching-bundle-install-automatically"
    label: "ruby/setup-ruby — automatic Bundler caching with versioned paths"
  - url: "https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md"
    label: "ubuntu-24.04 runner image — installed Ruby version"
  - url: "https://bundler.io/man/bundle-config.1.html#path"
    label: "Bundler path configuration documentation"
