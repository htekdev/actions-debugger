id: runner-environment-440
title: '@actions/glob v0.7.0 crashes ESM actions — Minimatch not a named export in minimatch v10'
category: runner-environment
severity: error
tags:
  - actions-glob
  - minimatch
  - esm
  - node24
  - toolkit
  - breaking-change
patterns:
  - regex: 'SyntaxError: The requested module .minimatch. does not provide an export named .Minimatch.'
    flags: 'i'
  - regex: 'import \{ Minimatch \} from .minimatch.'
    flags: ''
  - regex: '@actions/glob.*internal-pattern\.js.*SyntaxError'
    flags: 'i'
error_messages:
  - "SyntaxError: The requested module 'minimatch' does not provide an export named 'Minimatch'"
  - "file:///…/node_modules/@actions/glob/lib/internal-pattern.js:5\nimport { Minimatch } from 'minimatch';\n         ^^^^^^^^^\nSyntaxError: The requested module 'minimatch' does not provide an export named 'Minimatch'"
root_cause: |
  `@actions/glob` v0.7.0 upgraded its peer dependency from `minimatch` v3 to v10
  (PR #2355 in actions/toolkit). However, the action's `lib/internal-pattern.js` still
  imports `Minimatch` as a named export (`import { Minimatch } from 'minimatch'`).

  In `minimatch` v10, `Minimatch` is no longer a named export — it was reorganised
  and is now a default export or uses a different API surface. Any Node.js action
  running as ESM (`using: node24` or `.mts` source) that depends on `@actions/glob`
  v0.7.0 will hit this `SyntaxError` at module instantiation time, before any
  workflow logic runs.

  CommonJS actions are not affected because the require path resolves differently
  and the error surfaces differently (if at all). ESM actions crash immediately.
fix: |
  Pin `@actions/glob` to v0.6.0 (the last version with `minimatch` v3) in your
  action's `package.json` until the toolkit ships a patched v0.7.1+ that corrects
  the import statement.

  If you maintain a custom action that uses `@actions/glob`, update your import
  to use the `minimatch` v10 API (default export or the renamed class) and bump
  to v0.7.0+ after the fix lands.
fix_code:
  - language: json
    label: 'Pin @actions/glob to unaffected version in package.json'
    code: |
      {
        "dependencies": {
          "@actions/glob": "0.6.0"
        }
      }
  - language: typescript
    label: 'Updated import for minimatch v10 (once toolkit patches internal-pattern.js)'
    code: |
      // minimatch v10 — Minimatch is a default export, not a named export
      import Minimatch from 'minimatch';
      // or use the newer API:
      // import { minimatch } from 'minimatch';
prevention:
  - "Lock `@actions/glob` to a known-good version (0.6.0) until the toolkit ships a patch."
  - "Before upgrading any `@actions/toolkit` package in an ESM action, run `node --input-type=module` to verify named exports still exist."
  - "Watch the actions/toolkit CHANGELOG for `@actions/glob` patch releases that address the minimatch v10 import."
  - "When writing ESM actions, test with `--experimental-vm-modules` or a fresh runner run before releasing a new dependency bump."
docs:
  - url: 'https://github.com/actions/toolkit/issues/2408'
    label: '@actions/glob v0.7.0 breaks ESM actions: Minimatch is not a named export in minimatch v10'
  - url: 'https://www.npmjs.com/package/@actions/glob'
    label: '@actions/glob npm package (version history)'
  - url: 'https://github.com/isaacs/node-minimatch/releases'
    label: 'minimatch release notes — v10 breaking changes'
