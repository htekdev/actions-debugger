id: runner-environment-092
title: 'macos-latest migrates to macOS 26 Tahoe starting June 15, 2026'
category: runner-environment
severity: error
tags:
  - macos
  - runner-image
  - migration
  - macos-latest
  - breaking-change
patterns:
  - regex: 'xcrun: error: SDK.*cannot be located'
    flags: 'i'
  - regex: 'dyld\[.*\]: Library not loaded'
    flags: 'i'
  - regex: 'ld: warning: ignoring file.*built for macOS'
    flags: 'i'
  - regex: 'error: The specified iOS distribution certificate does not match'
    flags: 'i'
error_messages:
  - 'xcrun: error: SDK "iphonesimulator18" cannot be located'
  - 'dyld[12345]: Library not loaded: /usr/lib/libssl.1.1.dylib'
  - 'ld: warning: ignoring file /path/to/lib.a, building for macOS-arm64 but attempting to link with file built for macOS-arm64'
  - 'error: The specified iOS distribution certificate does not match any installed certificate'
root_cause: |
  Starting June 15, 2026, the macos-latest runner label is being migrated from
  macOS 15 (Sequoia) to macOS 26 (Tahoe). The rollout takes 30 days to complete,
  meaning workflows will begin hitting macOS 26 at an increasing rate during that
  window. There is no opt-out — any workflow using macos-latest will silently
  change OS version without any configuration change.

  macOS 26 Tahoe ships with a new default Xcode version (26.5, changed from 26.4.1
  on June 8, 2026), new system library versions, and a different simulator runtime
  lineup. Workflows that depend on specific SDK paths, iOS simulator versions,
  Homebrew formulas relying on system frameworks, or App Store submission tooling
  targeting earlier iOS SDK versions are at risk of silent failures or hard errors.

  Source: GitHub Changelog, May 14 2026; actions/runner-images#14167; actions/runner-images#14172.
fix: |
  Pin workflows to an explicit macOS version to stop receiving automatic OS upgrades:

    runs-on: macos-15   # stays on macOS 15 Sequoia indefinitely

  To test compatibility with macOS 26 before the migration window:

    runs-on: macos-26   # opt in early to macOS 26 Tahoe

  For Xcode-dependent workflows, pin the Xcode version explicitly using
  xcodes or the DEVELOPER_DIR environment variable to decouple from the
  default Xcode selection on the runner image.
fix_code:
  - language: yaml
    label: 'Pin to macOS 15 to avoid migration'
    code: |
      jobs:
        build:
          # Explicit version — immune to macos-latest migrations
          runs-on: macos-15
          steps:
            - uses: actions/checkout@v4
            - run: xcodebuild -scheme MyApp -sdk iphoneos build
  - language: yaml
    label: 'Pin Xcode version independently of runner image'
    code: |
      jobs:
        build:
          runs-on: macos-15
          env:
            DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
          steps:
            - uses: actions/checkout@v4
            - run: xcodebuild -scheme MyApp -sdk iphoneos build
  - language: yaml
    label: 'Matrix to test both macOS versions during migration window'
    code: |
      jobs:
        build:
          strategy:
            matrix:
              os: [macos-15, macos-26]
          runs-on: ${{ matrix.os }}
          steps:
            - uses: actions/checkout@v4
            - run: xcodebuild -scheme MyApp -sdk iphoneos build
prevention:
  - 'Never use macos-latest in workflows that depend on specific macOS APIs, SDK paths, or simulator versions'
  - 'Subscribe to github.blog/changelog and actions/runner-images announcements for upcoming migrations'
  - 'Test on the target macOS version using explicit labels before GitHub migrates macos-latest'
  - 'Use a matrix to validate on both current and upcoming macOS versions during migration windows'
  - 'Pin Xcode versions with DEVELOPER_DIR rather than relying on runner image defaults'
docs:
  - url: 'https://github.blog/changelog/2026-05-14-github-actions-upcoming-image-migrations/'
    label: 'GitHub Changelog: Upcoming image migrations (May 14, 2026)'
  - url: 'https://github.com/actions/runner-images/issues/14167'
    label: 'runner-images#14167: macos-latest will use macos-26 in June 2026'
  - url: 'https://github.com/actions/runner-images/issues/14172'
    label: 'runner-images#14172: Default Xcode on macOS 26 changing to 26.5 on June 8, 2026'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners'
    label: 'GitHub Docs: About GitHub-hosted runners — runner image labels'
