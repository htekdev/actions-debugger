id: runner-environment-282
title: 'ubuntu-24.04 Default Go Changed from 1.21 to 1.23 — `go.sum` Needs Update, `-mod=readonly` Fails in CI'
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - golang
  - go-modules
  - go-sum
  - setup-go
  - migration
  - ubuntu-latest
  - go-toolchain
patterns:
  - regex: 'go: updates to go\.sum needed; to update it'
    flags: 'i'
  - regex: 'go: .*go\.mod.*requires go >= 1\.2[23]; running go 1\.21'
    flags: 'i'
  - regex: 'GOTOOLCHAIN=local.*go1\.23.*incompatible.*go1\.21'
    flags: 'i'
  - regex: 'verifying .*: checksum mismatch.*go\.sum'
    flags: 'i'
error_messages:
  - 'go: updates to go.sum needed; to update it run: go mod download'
  - 'go: updates to go.sum needed, disabled by -goflags=-mod=readonly'
  - 'verifying github.com/pkg/example@v1.0.0: checksum mismatch'
root_cause: |
  Ubuntu 24.04 GitHub-hosted runners ship with **Go 1.23** as the pre-installed
  default. Ubuntu 22.04 shipped with **Go 1.21** as default (confirmed in
  runner-images#9848: "Go 1.21 → 1.23" for ubuntu-22.04 → ubuntu-24.04).

  When a workflow migrates from ubuntu-22.04 to ubuntu-24.04 (or when `ubuntu-latest`
  switched), the Go toolchain used implicitly upgrades from 1.21 to 1.23.

  The most common breakage: Go 1.22 changed how `go.sum` tracks indirect
  dependency checksums and workspace entries. A `go.sum` file generated by
  `go mod tidy` with Go 1.21 may be missing entries that Go 1.23 considers
  required for `-mod=readonly` mode (the CI default since Go 1.16).

  When Go 1.23 runs against a project where `go.sum` was last updated by Go 1.21,
  it may detect that additional checksums need to be added and fail with:
    "go: updates to go.sum needed; to update it run: go mod download"

  This only manifests when:
  - The project commits `go.sum` to VCS (standard practice)
  - `go.sum` was last generated by Go 1.21 and not regenerated after upgrading
  - CI runs without `actions/setup-go` explicitly pinning `go-version: '1.21'`

  Note: This is NOT a backward-compatibility issue in the Go language itself —
  existing Go 1.21 code compiles correctly with Go 1.23. The failure is purely
  in the module verification layer.
fix: |
  Option 1 — Pin Go version with actions/setup-go (recommended for reproducibility):
  Specify an explicit `go-version` in your workflow to decouple from runner image
  changes.

  Option 2 — Update go.sum locally with Go 1.23 and commit:
  Run `go mod tidy` or `go mod download` locally with Go 1.23, commit the updated
  `go.sum`, then the CI will pass without needing to update.

  Option 3 — Add a `go mod download` step before the build:
  This regenerates `go.sum` entries at runtime (less reproducible but quick fix).
fix_code:
  - language: yaml
    label: 'Pin Go version with setup-go (most portable)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.21'      # Pin to exact version
                # OR: go-version-file: 'go.mod'  # Read from go.mod

            - name: Build
              run: go build ./...

            - name: Test
              run: go test ./...
  - language: yaml
    label: 'Regenerate go.sum at CI time (quick but less reproducible)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version-file: 'go.mod'  # Use version from go.mod

            - name: Update go.sum if needed
              run: go mod download  # Adds any missing checksums

            - name: Build
              run: go build ./...
prevention:
  - 'Always use `actions/setup-go` with an explicit `go-version` or `go-version-file: go.mod` — never rely on the runner default.'
  - 'After upgrading Go locally, run `go mod tidy && go mod download` and commit the updated `go.sum` to avoid CI failures.'
  - 'Update the `go` directive in `go.mod` to match the Go version you are actually using (`go mod tidy` does this automatically).'
  - 'Treat `go.sum` regeneration as part of any Go version upgrade — it is not automatically forward-compatible across minor versions.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/9848'
    label: 'runner-images#9848 — Ubuntu 24.04 available: Go default changed from 1.21 to 1.23'
  - url: 'https://github.com/actions/setup-go'
    label: 'actions/setup-go — Official action to pin Go version in workflows'
  - url: 'https://go.dev/ref/mod#go-sum-files'
    label: 'Go module reference — go.sum files and checksum verification'
  - url: 'https://go.dev/doc/toolchain'
    label: 'Go toolchain documentation — GOTOOLCHAIN, toolchain directive, version selection'
