    label: 'GitHub Docs — About self-hosted runners'
  - url: 'https://github.com/actions/runner/issues/3526'
    label: 'actions/runner#3526 — Runner Online/Idle not picking up jobs (session conflict pattern)'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/configuring-the-self-hosted-runner-application-as-a-service'
    label: 'GitHub Docs — Configuring self-hosted runner as a service'
