id: runner-environment-381
title: "geckodriver 0.37.0 removes --enable-crash-reporter flag — workflows passing it fail immediately"
category: runner-environment
severity: error
tags:
  - geckodriver
  - firefox
  - selenium
  - webdriver
  - runner-image-update
  - breaking-change
  - crash-reporter
patterns:
  - regex: 'error.*unrecognized.*argument.*enable-crash-reporter|unknown.*flag.*enable-crash-reporter'
    flags: 'i'
  - regex: 'geckodriver.*0\.37|geckodriver.*--enable-crash-reporter'
    flags: 'i'
  - regex: 'Found argument.*enable-crash-reporter.*which wasn.*expected'
    flags: 'i'
error_messages:
  - "error: Found argument '--enable-crash-reporter' which wasn't expected, or isn't valid in this context"
  - "geckodriver: unrecognized argument: --enable-crash-reporter"
root_cause: |
  geckodriver 0.37.0 (released 2026-06-03) removed the deprecated `--enable-crash-reporter`
  command-line argument. This flag was used to enable crash minidump collection by directing
  geckodriver to preserve Firefox crash files. It was deprecated in favour of the
  MINIDUMP_SAVE_PATH environment variable.

  The flag was removed in geckodriver 0.37.0, which was deployed to ubuntu-24.04 and
  ubuntu-22.04 runner images on 2026-06-07. Any CI workflow that starts geckodriver
  directly (outside of Selenium/WebDriver bindings that abstract the binary invocation)
  and passes `--enable-crash-reporter` will receive an "unrecognized argument" error and
  geckodriver will exit with a non-zero code before any browser session is established.

  Affected workflows include:
  - Direct geckodriver invocations in shell scripts: `geckodriver --enable-crash-reporter &`
  - Docker entrypoints or test harness scripts that pass the flag explicitly
  - Wrappers that read geckodriver flags from config files and pass them through

  Workflows that rely solely on Selenium WebDriver bindings (Python selenium, Java
  Selenium, etc.) to start geckodriver are NOT affected — those bindings do not pass
  `--enable-crash-reporter` by default.

fix: |
  Remove `--enable-crash-reporter` from all geckodriver invocations. To preserve crash
  dump files (the original purpose of the flag), set the MINIDUMP_SAVE_PATH environment
  variable to the desired directory. geckodriver 0.37.0 and later will write crash
  minidumps to that path without needing a command-line flag.

fix_code:
  - language: yaml
    label: "Remove --enable-crash-reporter and use MINIDUMP_SAVE_PATH env var instead"
    code: |
      # Broken — geckodriver 0.37.0 rejects this flag:
      - name: Start geckodriver
        run: |
          geckodriver --port 4444 --enable-crash-reporter &

      # Fixed — remove the flag; use MINIDUMP_SAVE_PATH for crash dumps:
      - name: Start geckodriver
        env:
          MINIDUMP_SAVE_PATH: ${{ github.workspace }}/crash-dumps
        run: |
          mkdir -p ${{ github.workspace }}/crash-dumps
          geckodriver --port 4444 &

  - language: yaml
    label: "Pin geckodriver to 0.36.0 as short-term workaround"
    code: |
      # Short-term workaround: download and use geckodriver 0.36.0 explicitly
      # instead of relying on the runner image's geckodriver binary
      - name: Install pinned geckodriver 0.36.0
        run: |
          wget -q https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          tar -xzf geckodriver-v0.36.0-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/geckodriver-0.36.0
          # Use geckodriver-0.36.0 instead of the system geckodriver

prevention:
  - "Avoid passing deprecated geckodriver flags — check the geckodriver changelog when upgrading"
  - "Subscribe to mozilla/geckodriver releases to learn about flag removals before they land on runner images"
  - "Use MINIDUMP_SAVE_PATH env var for crash dump collection rather than the now-removed --enable-crash-reporter flag"
  - "Prefer Selenium/WebDriver bindings to manage geckodriver lifecycle — they abstract away flag changes"
  - "Pin geckodriver version explicitly in workflows that rely on specific flags rather than using the runner image binary"
docs:
  - url: "https://github.com/mozilla/geckodriver/releases/tag/v0.37.0"
    label: "geckodriver 0.37.0 release notes: --enable-crash-reporter removed"
  - url: "https://firefox-source-docs.mozilla.org/testing/geckodriver/Usage.html"
    label: "geckodriver usage documentation: MINIDUMP_SAVE_PATH environment variable"
  - url: "https://github.com/actions/runner-images/releases/tag/ubuntu24%2F20260607.184"
    label: "ubuntu-24.04 20260607.184 release notes: geckodriver 0.36.0 → 0.37.0"
