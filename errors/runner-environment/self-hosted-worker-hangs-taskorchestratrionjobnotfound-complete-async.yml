    label: 'actions/runner#4418 — Self-hosted Worker hangs after CompleteJobAsync hits
      workflow instance not found (May 2026, open)'
  - url: 'https://github.com/actions/runner/issues/3862'
    label: 'actions/runner#3862 — Earlier "lost communication: NotFound" report (May
      2025)'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/monitoring-and-troubleshooting-self-hosted-runners'
    label: 'GitHub Docs — Monitoring and troubleshooting self-hosted runners'
