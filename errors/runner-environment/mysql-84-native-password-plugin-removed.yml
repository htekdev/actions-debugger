id: runner-environment-264
title: "MySQL 8.4 LTS removes mysql_native_password plugin — \"Client does not support authentication protocol\""
category: runner-environment
severity: error
tags:
  - mysql
  - mysql-84
  - native-password
  - authentication
  - service-container
  - lts
patterns:
  - regex: 'Client does not support authentication protocol requested by server'
    flags: 'i'
  - regex: 'ER_NOT_SUPPORTED_AUTH_MODE'
    flags: 'i'
  - regex: "Authentication plugin 'mysql_native_password' cannot be loaded"
    flags: 'i'
  - regex: 'The server requested authentication method unknown to the client'
    flags: 'i'
error_messages:
  - 'Client does not support authentication protocol requested by server; consider upgrading MySQL client'
  - 'Error: ER_NOT_SUPPORTED_AUTH_MODE: Client does not support authentication protocol requested by server'
  - "Authentication plugin 'mysql_native_password' cannot be loaded: /usr/lib64/mysql/plugin/mysql_native_password.so"
  - 'The server requested authentication method unknown to the client [caching_sha2_password]'
root_cause: |
  MySQL 8.4 LTS (released April 2024) removed `mysql_native_password` as a built-in
  authentication plugin entirely. In MySQL 8.0, `mysql_native_password` was deprecated
  but still available and configurable as the default via
  `--default-authentication-plugin=mysql_native_password`. In MySQL 8.4 that option
  was removed and the plugin cannot be loaded at all.

  When `ubuntu-latest` migrated to Ubuntu 24.04 and workflows use `image: mysql:latest`
  in service containers, Docker began pulling MySQL 8.4 LTS instead of 8.0. Any
  workflow that:
  - Uses Node.js `mysql` package (v2 and below) or `mysql2` < v3
  - Uses Python `mysqlclient` or `PyMySQL` < 1.1 built against old libmysqlclient
  - Uses Ruby `mysql2` gem < 0.5.6 or Rails < 7 ActiveRecord MySQL adapter
  - Uses PHP PDO MySQL with native_password configured
  - Relies on the `--default-authentication-plugin` flag in mysql service command:

  will fail with:
    "Error: ER_NOT_SUPPORTED_AUTH_MODE: Client does not support authentication
     protocol requested by server"

  The root cause is that MySQL 8.4 defaults to `caching_sha2_password` exclusively,
  and does not fall back to native password auth. Older clients that do not implement
  the SHA2 challenge-response exchange cannot authenticate at all.

  Source: MySQL 8.4 release notes, dev.mysql.com/doc/refman/8.4/en/upgrading-from-previous-series.html,
  mysql/mysql-server GitHub issue tracker, widely reported on Stack Overflow.
fix: |
  **Option 1 (recommended for legacy projects): Pin service container to mysql:8.0**
  MySQL 8.0 still supports `mysql_native_password` and accepts the
  `--default-authentication-plugin` command flag.

  **Option 2: Upgrade MySQL client drivers to support caching_sha2_password**
  - Node.js: `mysql2` >= v3.0 supports SHA2 auth
  - Python: `mysqlclient` >= 2.2, `PyMySQL` >= 1.1, `mysql-connector-python` >= 8.4
  - Ruby: `mysql2` gem >= 0.5.6 with libmysqlclient 8.4

  **Option 3: Re-create user with mysql_native_password on MySQL 8.4**
  Not possible on MySQL 8.4 — the plugin is removed entirely.
  Migrate all connection code to caching_sha2_password.
fix_code:
  - language: yaml
    label: 'Wrong — mysql:latest now pulls MySQL 8.4 which removed mysql_native_password'
    code: |
      services:
        mysql:
          image: mysql:latest   # MySQL 8.4+ removed mysql_native_password
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: testdb
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
            --health-interval=10s
            --health-retries=5
      # Error: ER_NOT_SUPPORTED_AUTH_MODE: Client does not support authentication protocol
  - language: yaml
    label: 'Fixed — pin to mysql:8.0 with native password enabled (legacy apps)'
    code: |
      services:
        mysql:
          image: mysql:8.0   # 8.0 supports mysql_native_password
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: testdb
          # --default-authentication-plugin still works in mysql:8.0
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
            --health-interval=10s
            --health-retries=5
  - language: yaml
    label: 'Fixed — use mysql:8.4 with upgraded Node.js mysql2 v3 driver'
    code: |
      services:
        mysql:
          image: mysql:8.4   # pin major version to avoid 9.x surprises
          env:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: testdb
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
            --health-interval=10s
            --health-retries=5

      steps:
        - name: Install deps
          run: npm install mysql2@^3   # v3+ supports caching_sha2_password
prevention:
  - 'Pin service container image versions (mysql:8.0 or mysql:8.4 not mysql:latest) to avoid surprise auth protocol changes'
  - 'Upgrade to mysql2 v3+, PyMySQL 1.1+, or mysql-connector-python 8.4+ which support caching_sha2_password'
  - 'Audit your MySQL client driver versions before migrating from mysql:8.0 to mysql:8.4'
  - 'Add a matrix test against both MySQL 8.0 and 8.4 when planning migrations'
docs:
  - url: 'https://dev.mysql.com/doc/relnotes/mysql/8.4/en/'
    label: 'MySQL 8.4 Release Notes — authentication plugin changes'
  - url: 'https://dev.mysql.com/doc/refman/8.4/en/upgrading-from-previous-series.html'
    label: 'MySQL 8.4 — Upgrading from Previous Series (native_password removal)'
  - url: 'https://hub.docker.com/_/mysql'
    label: 'mysql Docker Hub image documentation'
  - url: 'https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services/creating-mysql-service-containers'
    label: 'GitHub Docs — Creating MySQL service containers'
