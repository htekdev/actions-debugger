id: runner-environment-353
title: 'setup-java Installs glibc-Based JDK — "java: not found" in Alpine (musl libc) Container Jobs'
category: runner-environment
severity: error
tags:
  - java
  - setup-java
  - alpine
  - musl
  - glibc
  - container
  - job-container
  - java-not-found
patterns:
  - regex: 'java:\s*not found'
    flags: 'i'
  - regex: 'error.*java.*no such file or directory'
    flags: 'i'
  - regex: 'setup-java.*alpine\|alpine.*setup-java'
    flags: 'i'
error_messages:
  - "/__w/_temp/xxx.sh: line N: java: not found"
  - "java: not found"
  - "No such file or directory"
root_cause: |
  actions/setup-java downloads JDK distributions (Temurin, Corretto, Zulu, Microsoft, etc.)
  that are compiled against the GNU C Library (glibc). When a workflow uses a container
  job (jobs.<job>.container) with an Alpine Linux-based image such as:

    - alpine:3.x
    - semgrep/semgrep
    - docker:cli
    - python:3.x-alpine

  ...the JDK binaries installed by setup-java cannot execute because Alpine uses musl libc,
  which is incompatible with glibc binaries. The dynamic linker cannot resolve the shared
  libraries required by the Java executable.

  Symptoms:
  - The Java binary exists on disk and JAVA_HOME is set correctly.
  - `which java` returns a path.
  - Executing `java -version` or any Java binary fails with "java: not found" or
    "No such file or directory" even when using an absolute path like $JAVA_HOME/bin/java.
  - chmod +x on the binary has no effect — it is not a permissions problem.

  This is a fundamental libc incompatibility, not a PATH or installation issue.

  Source: actions/setup-java#840 (May 2025), actions/setup-java#678 (Aug 2024).
fix: |
  Three approaches depending on the workflow's requirements:

  1. **Switch to a glibc-based container image** — any Ubuntu, Debian, or CentOS/RHEL-based
     container works with setup-java. This is the simplest fix.

  2. **Remove the container section** — run on the GitHub-hosted runner directly (ubuntu-latest),
     then call setup-java normally. Use Docker CLI steps if Docker is still needed.

  3. **Install Java via Alpine's package manager** inside the Alpine container — do NOT use
     setup-java. Use `apk add openjdk21` (or the required version) instead:

     Note: apk provides OpenJDK, not Temurin/Corretto. If a specific distribution is required,
     switch to a glibc-based image instead.
fix_code:
  - language: yaml
    label: 'Option 1: switch to Ubuntu-based container (recommended)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          container:
            image: ubuntu:22.04    # glibc-based — setup-java works correctly
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
            - run: java -version
  - language: yaml
    label: 'Option 2: remove container section, run on hosted runner directly'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          # No container: section — runs directly on the GitHub-hosted runner
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
            - run: java -version
  - language: yaml
    label: 'Option 3: if Alpine is required, install Java via apk (not setup-java)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          container:
            image: alpine:3.20
          steps:
            - uses: actions/checkout@v4
            # Do NOT use actions/setup-java with Alpine
            - name: Install Java via apk
              run: apk add --no-cache openjdk21
            - run: java -version
prevention:
  - 'Check container image base OS before using setup-java — Alpine-based images are not compatible.'
  - 'Common Alpine-based images that will fail with setup-java: alpine:*, docker:cli, docker:latest, python:x.y-alpine, node:x-alpine, semgrep/semgrep.'
  - 'When in doubt, use ubuntu:22.04 or ubuntu:24.04 as the container image for Java workflows.'
  - 'The java binary existing on disk with correct permissions does NOT guarantee it will execute — always verify the container libc compatibility.'
docs:
  - url: 'https://github.com/actions/setup-java/issues/840'
    label: 'setup-java#840 — Java executable not found in Alpine container (May 2025)'
  - url: 'https://github.com/actions/setup-java/issues/678'
    label: 'setup-java#678 — Java installed in container but fails to execute (Aug 2024)'
  - url: 'https://wiki.musl-libc.org/functional-differences-from-glibc.html'
    label: 'musl libc — Functional differences from glibc'
