id: runner-environment-465
title: 'ubuntu-26.04 system Python is 3.14 — PEP 594 deprecated stdlib modules removed in Python 3.13'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - python
  - python-3.14
  - deprecated-modules
  - pep-594
  - runner-image
  - migration
  - breaking-change
patterns:
  - regex: 'ModuleNotFoundError: No module named ''(cgi|aifc|audioop|chunk|crypt|imghdr|mailcap|nntplib|ossaudiodev|pipes|sndhdr|sunau|telnetlib|uu|xdrlib|cgitb|msilib|nis|spwd)'''
    flags: 'i'
  - regex: 'ImportError.*cannot import name.*from.*(cgi|telnetlib|aifc|audioop|pipes|sunau)'
    flags: 'i'
  - regex: 'cannot import name .* from .*(cgi|telnetlib)'
    flags: 'i'
error_messages:
  - "ModuleNotFoundError: No module named 'cgi'"
  - "ModuleNotFoundError: No module named 'telnetlib'"
  - "ModuleNotFoundError: No module named 'aifc'"
  - "ModuleNotFoundError: No module named 'audioop'"
  - "ModuleNotFoundError: No module named 'pipes'"
  - "ModuleNotFoundError: No module named 'crypt'"
  - "ModuleNotFoundError: No module named 'imghdr'"
  - "ModuleNotFoundError: No module named 'nntplib'"
  - "ModuleNotFoundError: No module named 'sndhdr'"
  - "ModuleNotFoundError: No module named 'sunau'"
  - "ModuleNotFoundError: No module named 'telnetlib'"
  - "ModuleNotFoundError: No module named 'uu'"
  - "ModuleNotFoundError: No module named 'xdrlib'"
root_cause: |
  ubuntu-26.04 ships with Python 3.14.4 as the system Python (the `python3` and `python`
  commands in PATH). This is a major upgrade from Python 3.12.3 on ubuntu-24.04.

  Python 3.13 removed 19 deprecated standard library modules that had been marked for
  removal since Python 3.11 (PEP 594):
    aifc, audioop, cgi, cgitb, chunk, crypt, imghdr, mailcap, msilib, nis,
    nntplib, ossaudiodev, pipes, sndhdr, spwd, sunau, telnetlib, uu, xdrlib

  Any Python script or dependency that imports one of these modules will fail with
  `ModuleNotFoundError` on ubuntu-26.04 but succeed on ubuntu-24.04 (Python 3.12).

  Common CI scenarios affected:
  - Legacy `cgi` module usage in test utilities
  - `telnetlib`-based network probing or health-check scripts
  - Tools or libraries that import `crypt` for password hashing
  - Older versions of `paramiko`, `fabric`, or similar packages that used `cgi`
  - Any `pip install` of a package that has a transitive import of these modules

  Note: This affects the *system* Python only. Using `actions/setup-python` to install
  an explicit Python version is not affected (setup-python downloads the requested
  version, not the system Python 3.14).
fix: |
  1. **Use `actions/setup-python`** to pin a specific Python version for your workflow
     instead of relying on the system Python. This avoids the 3.14 version entirely
     for workflows that aren't ready for it.

  2. **Replace removed modules** with their modern equivalents:
     - `cgi` → use `urllib.parse` or a WSGI framework
     - `telnetlib` → use `socket` directly or `asyncio.open_connection`
     - `crypt` → use `hashlib` or the `bcrypt` package
     - `imghdr` → use `filetype`, `python-magic`, or PIL/Pillow
     - `pipes` → use `shlex` and `subprocess`
     - `audioop` → use `array` module or a DSP library

  3. **Install backport packages** for some modules (e.g. `pip install legacy-cgi`)

  4. **Pin to ubuntu-24.04** temporarily for workflows that depend on these modules.
fix_code:
  - language: yaml
    label: 'Pin Python version to avoid system Python 3.14 on ubuntu-26.04'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'  # Pin to Python 3.12 to avoid 3.14 module removals
            - run: python -m pip install -r requirements.txt
  - language: yaml
    label: 'Replace telnetlib usage in workflow scripts'
    code: |
      # OLD (breaks on Python 3.14):
      # import telnetlib
      # tn = telnetlib.Telnet("host", 23)
      #
      # NEW:
      # import socket
      # with socket.create_connection(("host", 23), timeout=5) as s:
      #     data = s.recv(1024)
  - language: yaml
    label: 'Use ubuntu-24.04 as fallback while upgrading Python dependencies'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04  # Temporarily pin to avoid Python 3.14 on ubuntu-26.04
          # TODO: migrate to ubuntu-26.04 once legacy stdlib imports are removed
prevention:
  - 'Audit your Python scripts and dependencies for any import of PEP 594 removed modules before migrating to ubuntu-26.04.'
  - 'Run `python3 -c "import cgi; import telnetlib; import aifc"` against Python 3.14 locally to surface immediate failures.'
  - 'Always use `actions/setup-python` to pin an explicit Python version rather than relying on the system Python.'
  - 'Check transitive dependencies with `pip show <package>` to identify libraries that still import removed modules.'
docs:
  - url: 'https://peps.python.org/pep-0594/'
    label: 'PEP 594 — Removing dead batteries from the standard library'
  - url: 'https://docs.python.org/3.13/whatsnew/3.13.html#removed'
    label: 'Python 3.13 What''s New: Removed modules'
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md'
    label: 'ubuntu-26.04 runner image README (shows Python 3.14.4 as system Python)'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources'
    label: 'GitHub Docs: Supported runners and hardware resources'
