    label: 'runner-images#13271 — unattended-upgrades not properly disabled on ubuntu-24.04'
  - url: 'https://github.com/servo/ci-runners/issues/57'
    label: 'servo/ci-runners#57 — exact error: Could not get lock /var/lib/dpkg/lock-frontend (unattended-upgr)'
  - url: 'https://manpages.ubuntu.com/manpages/noble/man8/unattended-upgrade.8.html'
    label: 'Ubuntu Noble — unattended-upgrade man page'
