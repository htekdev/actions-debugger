id: runner-environment-310
title: 'workflow_dispatch inputs no longer shown in "Set Up Job" log after runner v2.325'
category: runner-environment
severity: silent-failure
tags:
  - workflow-dispatch
  - inputs
  - set-up-job
  - runner-version
  - debugging
  - logs
patterns:
  - regex: 'Inputs.*Set Up Job.*missing|Set Up Job.*no.*inputs.*expandable'
    flags: 'i'
  - regex: 'runner.*2\.3(2[5-9]|[3-9]\d).*inputs.*not.*show|inputs.*not.*visible.*runner'
    flags: 'i'
error_messages:
  - '"Inputs" section missing from "Set Up Job" step log'
  - 'workflow_dispatch inputs no longer visible in job setup logs'
root_cause: |
  Runner v2.325 removed the "Inputs" expandable section from the "Set Up Job" step log.
  Prior to v2.325, when a workflow was triggered via workflow_dispatch, the job's "Set Up Job"
  step showed an expandable "Inputs" table listing every input name and its runtime value.
  This table was removed in v2.325 and has not been restored as of v2.331+.

  The inputs themselves continue to function correctly — workflow steps receive the correct
  values via ${{ inputs.name }}. Only the log visibility is affected. This makes it
  significantly harder to diagnose input-related failures because there is no native way
  to see which input values were passed at runtime without adding an explicit echo step.

  Affected: all runner types (GitHub-hosted ubuntu, windows, macOS; self-hosted).
  Source: actions/runner#3907 (open Jun 2025, unresolved as of Jan 2026).
fix: |
  Add an explicit step to echo all relevant inputs at the beginning of each job.
  This restores the debuggability that was lost in v2.325.

  For sensitive inputs (passwords, tokens) use masked variables via
  the add-mask workflow command instead of plain echo.
fix_code:
  - language: yaml
    label: 'Echo all inputs at job start for debugging visibility'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            # Restore input visibility lost in runner v2.325
            - name: 'Debug: print inputs'
              run: |
                echo "environment : ${{ inputs.environment }}"
                echo "version     : ${{ inputs.version }}"
                echo "dry-run     : ${{ inputs.dry_run }}"
  - language: yaml
    label: 'Mask sensitive input before printing'
    code: |
      steps:
        - name: 'Debug: print inputs (mask secrets)'
          run: |
            echo "::add-mask::${{ inputs.secret_token }}"
            echo "token       : ${{ inputs.secret_token }}"
            echo "environment : ${{ inputs.environment }}"
prevention:
  - 'Add an explicit "print inputs" step to every workflow_dispatch job until GitHub restores the Set Up Job expandable'
  - 'Use ${{ toJSON(inputs) }} in a single echo step to dump all inputs at once'
  - 'Pin known-good runner versions via runner groups on self-hosted if log visibility is critical'
docs:
  - url: 'https://github.com/actions/runner/issues/3907'
    label: 'actions/runner#3907: Inputs no longer show in logs after runner v2.325'
  - url: 'https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_dispatchinputs'
    label: 'GitHub Docs: workflow_dispatch inputs syntax'
  - url: 'https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#masking-a-value-in-a-log'
    label: 'GitHub Docs: Masking a value in a log'
