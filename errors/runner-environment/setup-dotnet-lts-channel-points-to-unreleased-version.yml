    label: 'actions/setup-dotnet#711 — dotnet-version: 10.0.x tries to download non-existent
      version 10.0.5 (Mar 2026)'
  - url: 'https://github.com/actions/setup-dotnet/issues/712'
    label: 'actions/setup-dotnet#712 — Failure to setup 10.0.x on linux runner (Mar
      2026)'
  - url: 'https://github.com/dotnet/install-scripts'
    label: 'dotnet/install-scripts — the install.sh LTS pointer that triggers this
      race'
  - url: 'https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-net'
    label: 'GitHub Docs — Building and testing .NET with GitHub Actions'
