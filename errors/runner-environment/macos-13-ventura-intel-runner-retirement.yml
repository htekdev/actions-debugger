id: runner-environment-269
title: "macOS 13 (Ventura) Intel runner retired — workflows must migrate to Apple Silicon macos-14+"
category: runner-environment
severity: error
tags:
  - macos-13
  - intel
  - runner-retirement
  - apple-silicon
  - macos-14
  - deprecation
  - x86_64
patterns:
  - regex: 'No hosted runner matching.*macos-13'
    flags: 'i'
  - regex: 'macos-13.*deprecated|macos-13.*will be retired'
    flags: 'i'
  - regex: 'macos-ventura.*runner.*retired|macos-13.*runner.*unavailable'
    flags: 'i'
error_messages:
  - "No hosted runner matching the label 'macos-13' was found"
  - "The macOS 13 runner image is deprecated. Please migrate to macos-14 or macos-latest."
  - "DEPRECATION NOTICE: The macos-13 image will be deprecated on <DATE>."
root_cause: |
  macOS 13 Ventura was the last Intel (x86_64) macOS runner in the GitHub-hosted runner fleet.
  GitHub announced its retirement as part of the broader migration to Apple Silicon (ARM64)
  runners. macOS 14 Sonoma and later run exclusively on Apple Silicon M1-class hardware.

  The retirement means:
  - Workflows that explicitly pinned to `macos-13` fail with "No hosted runner found" after the
    retirement date.
  - Workflows using `macos-latest` were silently moved from macos-14 (ARM64) in early 2025 —
    any x86_64-specific binaries or brew bottles were already breaking for these users.
  - The `macos-13-xlarge` (Intel, 12-core) variant was also retired on the same timeline.

  The architecture change is significant: Apple Silicon uses ARM64, not x86_64. x86_64-only
  binaries fail with "Bad CPU type in executable" (covered separately by macos-arm64-rosetta-
  not-installed). Rosetta 2 is NOT pre-installed on GitHub-hosted macOS runners.
fix: |
  Migrate `runs-on: macos-13` to `runs-on: macos-14` or `runs-on: macos-latest`. Before
  migrating, verify your toolchain supports ARM64:

  1. Homebrew: All modern Homebrew formulae provide arm64 bottles. Legacy/cask-only tools may
     not. Test with `arch -arm64 brew install <package>`.
  2. Binary tools: Any pre-built x86_64 binaries downloaded in CI scripts need arm64 versions.
  3. Docker: Docker Desktop with ARM64 emulation is not available on GitHub-hosted macOS runners.
     Use `--platform linux/amd64` only for Linux Docker builds, not macOS-native.
  4. Cross-compilation: If you were using macos-13 to build iOS/macOS x86_64 simulators,
     use `ARCHS="arm64"` or update your Xcode scheme settings.
  5. Rust/Go/Python: All three install arm64 toolchains by default; no changes needed if using
     setup-go, setup-python, or rustup.
fix_code:
  - language: yaml
    label: "Migrate from macos-13 to macos-latest (Apple Silicon)"
    code: |
      jobs:
        build:
          # Before: runs-on: macos-13
          runs-on: macos-latest   # now maps to macos-15 (Apple Silicon M1)
          steps:
            - uses: actions/checkout@v4
  - language: yaml
    label: "Matrix to test arm64 and retain x86_64 via self-hosted if needed"
    code: |
      jobs:
        build:
          strategy:
            matrix:
              include:
                - os: macos-14      # Apple Silicon (arm64)
                  arch: arm64
                - os: self-hosted   # only if you maintain Intel self-hosted runners
                  arch: x86_64
          runs-on: ${{ matrix.os }}
          steps:
            - uses: actions/checkout@v4
prevention:
  - "Avoid pinning to a specific macOS version number. Use macos-latest to follow GitHub's current recommended image."
  - "Audit any CI scripts that download pre-built binaries — verify they support arm64 before migrating to macos-14+."
  - "Test Homebrew tool availability with `brew info <tool>` — check the 'Bottle' section for 'arm64_sequoia' or 'arm64_sonoma' availability."
  - "If you ship macOS x86_64 app builds, invest in a self-hosted Intel runner or move builds to a macOS CI service that still offers Intel hardware."
docs:
  - url: "https://github.blog/changelog/2024-09-25-github-actions-macos-14-is-now-latest/"
    label: "GitHub Changelog: macOS 14 becomes macos-latest"
  - url: "https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md"
    label: "macOS 15 runner image installed software"
  - url: "https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources"
    label: "GitHub Docs: Supported GitHub-hosted runners"
