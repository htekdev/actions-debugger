id: runner-environment-446
title: 'setup-go version not in manifest falls back to direct Google download and fails with HTTP 403'
category: runner-environment
severity: error
tags:
  - setup-go
  - go
  - golang
  - version-manifest
  - 403
  - toolcache
  - version-not-found
  - fallback

patterns:
  - regex: 'Failed to resolve version .+ from manifest'
    flags: 'i'
  - regex: 'Not found in manifest\.\s+Falling back to download directly from Go'
    flags: 'i'
  - regex: 'Unexpected HTTP response: 403'
    flags: 'i'
  - regex: 'Failed to download version .+: Error: Unexpected HTTP response: 403'
    flags: 'i'

error_messages:
  - 'Failed to resolve version 1.25.5 from manifest'
  - 'Attempting to download 1.25.5...'
  - 'Not found in manifest.  Falling back to download directly from Go'
  - 'Acquiring go1.25.5 from https://storage.googleapis.com/golang/go1.25.5.linux-amd64.tar.gz'
  - 'Error: Failed to download version 1.25.5: Error: Unexpected HTTP response: 403'

root_cause: |
  actions/setup-go resolves versions through a hosted manifest JSON file that lists
  available Go releases. When a specified version is not yet in the manifest (e.g., a
  very new patch release, a pre-release version, or a mistyped version number), the
  action falls back to constructing a direct download URL against Google's Go storage
  bucket (storage.googleapis.com/golang/).

  If the constructed URL points to a file that does not exist — because the version was
  never released, was specified incorrectly, or was specified before the release was
  published — Google's storage bucket returns HTTP 403 (Forbidden) instead of 404. This
  is a storage bucket access policy behavior: unauthenticated requests to non-existent
  objects receive 403 rather than 404.

  Common causes:
  - Specifying a Go version before it has been officially released (e.g., go1.25.5 when
    only go1.25.4 is released)
  - Typos in the version number (e.g., 1.25.15 instead of 1.25.5)
  - Pinning to a future minor version before it ships (e.g., 1.26.0 during 1.25.x era)
  - The manifest file having a propagation delay for freshly-released Go versions

fix: |
  1. Verify the exact version is available at https://go.dev/dl/ before pinning it.
  2. Use a version range instead of a pinned patch version: `go-version: '1.25.x'`
     (setup-go will resolve the latest available 1.25.x from the manifest).
  3. If you need the absolute latest release, use: `go-version-file: go.mod` and
     update go.mod to the desired version.
  4. If the manifest has propagation lag for a just-released version, wait a few
     hours and re-run the workflow.

fix_code:
  - language: yaml
    label: 'Use version range instead of pinned patch version'
    code: |
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'   # resolves latest 1.25.x from manifest
  - language: yaml
    label: 'Derive Go version from go.mod (avoids manual version pinning)'
    code: |
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'   # reads `go X.Y.Z` directive from go.mod
  - language: yaml
    label: 'Use stable shorthand to always get the latest stable release'
    code: |
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'   # always resolves the latest stable Go version

prevention:
  - 'Prefer go-version-file: go.mod over an explicit version number — ensures the workflow always matches the module requirements.'
  - 'Use version ranges (e.g., 1.25.x) instead of pinning patch versions to avoid specifying versions not yet in the manifest.'
  - 'Verify the Go release exists at https://go.dev/dl/ before pinning it in CI.'
  - 'Do not bump the Go version in CI before merging the corresponding go.mod update — they should be atomic.'

docs:
  - url: 'https://github.com/actions/setup-go/issues/688'
    label: 'actions/setup-go#688 — Failing to download latest go version 1.25.5 (Dec 2025, 13 reactions)'
  - url: 'https://github.com/actions/setup-go#supported-version-syntax'
    label: 'actions/setup-go — Supported version syntax'
  - url: 'https://go.dev/dl/'
    label: 'Go Downloads — Official list of available Go releases'
