id: runner-environment-385
title: 'ubuntu-26.04 Helm 4 — helm list -a / --all flag removed, unknown flag error'
category: runner-environment
severity: error
tags:
  - helm
  - helm-4
  - ubuntu-26
  - tool-upgrade
  - flag-removed
  - breaking-change
patterns:
  - regex: "unknown flag: --all"
    flags: 'i'
  - regex: "unknown shorthand flag: 'a' in -a"
    flags: 'i'
  - regex: 'helm list.*--all.*flag|helm list.*-a.*unknown'
    flags: 'i'
error_messages:
  - "Error: unknown flag: --all"
  - "Error: unknown shorthand flag: 'a' in -a"
root_cause: |
  Helm 4 changed the default behavior of `helm list` to show all releases — including
  deployed, failed, superseded, and uninstalled — without requiring any flag. As a result,
  the `-a` / `--all` flag was removed as redundant. However, this removal was not
  documented in the Helm 4 release notes as a breaking change, and no deprecation warning
  was emitted in Helm 3 to alert users.

  CI scripts and workflows that call `helm list -a` or `helm list --all` (commonly used to
  check whether a release exists in any state) will fail immediately with "unknown flag"
  errors on ubuntu-26.04, which pre-installs Helm 4.

  A secondary behavioral impact: scripts that previously relied on bare `helm list` (without
  `-a`) to show only deployed/active releases will now also see failed, superseded, and
  uninstalled releases, which can break logic that parses or counts `helm list` output.

  Tracked in helm/helm#31784 (February 2026, open). The Helm maintainers acknowledged the
  flag removal was not called out in release notes.
fix: |
  Remove the `-a` / `--all` flag from all `helm list` invocations. In Helm 4 `helm list`
  shows all releases by default. If you need to filter to specific release states, use
  the explicit status flags:

  ```bash
  # Helm 3 — show ALL releases (any state)
  helm list -a --all-namespaces
  helm list --all --all-namespaces

  # Helm 4 — -a/--all removed; all releases shown by default
  helm list --all-namespaces

  # Helm 4 — filter to only deployed releases
  helm list --deployed --all-namespaces

  # Helm 4 — filter to only failed releases
  helm list --failed --all-namespaces
  ```

  For "check if release exists" patterns:
  ```bash
  # Works on both Helm 3 and Helm 4 (no -a needed)
  helm status my-release --namespace my-ns 2>/dev/null
  # or
  helm list --all-namespaces --filter '^my-release$' --short
  ```
fix_code:
  - language: yaml
    label: 'Fix helm list -a usage for Helm 4 on ubuntu-26.04'
    code: |
      - name: Check if release exists
        run: |
          # Helm 3 style — BREAKS on Helm 4 (ubuntu-26.04):
          # helm list -a --all-namespaces | grep my-release

          # Helm 4 fix — -a is gone; all releases shown by default:
          helm list --all-namespaces | grep my-release

          # Or more robust: use helm status
          if helm status my-release -n my-namespace &>/dev/null; then
            echo "Release exists"
          else
            echo "Release not found"
          fi

      - name: List only deployed releases
        run: |
          # On Helm 4, use --deployed to filter (bare helm list shows everything)
          helm list --deployed --all-namespaces
prevention:
  - 'Remove all -a and --all flags from helm list commands before migrating to ubuntu-26.04 (Helm 4).'
  - 'With Helm 4, bare helm list already shows all releases — rely on explicit --deployed / --failed filters instead.'
  - 'Use helm status <release> -n <ns> to check existence rather than parsing helm list output.'
  - 'Run `helm list --help` against a Helm 4 binary to audit available flags before migration.'
docs:
  - url: 'https://github.com/helm/helm/issues/31784'
    label: 'helm/helm #31784 — Breaking change to helm list cli command in v4 (February 2026)'
  - url: 'https://helm.sh/docs/helm/helm_list/'
    label: 'Helm docs — helm list command reference'
  - url: 'https://github.com/actions/runner-images/commit/9e3319d6b4acc306925295853d0ff41ddd5c40f0'
    label: 'runner-images commit 9e3319d — ubuntu-26.04 installs Helm 4 (get-helm-4 installer)'
