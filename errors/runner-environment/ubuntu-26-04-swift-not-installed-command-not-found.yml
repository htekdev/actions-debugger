id: runner-environment-456
title: 'ubuntu-26.04 Swift Not Installed — swift and swiftc Commands Not Found'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - swift
  - swiftc
  - command-not-found
  - runner-image
  - breaking-change
  - linux-swift
patterns:
  - regex: '(swift|swiftc):\s+(command not found|not found)'
    flags: 'i'
  - regex: '/usr/bin/env:\s+''?swift''?:\s+No such file or directory'
    flags: 'i'
  - regex: 'error:.*cannot find.*swiftc|swift.*not.*available.*ubuntu-26'
    flags: 'i'
error_messages:
  - 'swift: command not found'
  - 'swiftc: command not found'
  - '/usr/bin/env: swift: No such file or directory'
  - '/usr/bin/env: swiftc: No such file or directory'
root_cause: |
  Swift was pre-installed on ubuntu-22.04 and ubuntu-24.04 GitHub Actions hosted
  runner images. On ubuntu-26.04, Swift is **not yet available** — the Swift toolchain
  for Ubuntu 26.04 (Resolute Raccoon) has not been validated and packaged by the Swift
  team as of the public preview release on June 11, 2026.

  The official runner-images#14226 announcement explicitly notes:

  > Swift | latest available | - | Not yet available for Ubuntu 26.04. Will be added later

  Affected workflows:
  - Any step calling `swift`, `swiftc`, or `swift test` directly.
  - Steps using tools that depend on Swift (e.g., `swift package`, `swift build`).
  - Server-side Swift applications (Vapor, Hummingbird) built on Linux CI.

  This affects workflows that migrate from `ubuntu-24.04` to `ubuntu-26.04` without
  realizing Swift is absent.
fix: |
  Pin the affected job to `ubuntu-24.04` (or `ubuntu-22.04`) until Swift is available
  on ubuntu-26.04:

  ```yaml
  jobs:
    build-swift:
      runs-on: ubuntu-24.04  # swift not yet available on ubuntu-26.04
  ```

  Alternatively, install Swift manually from swift.org if early ubuntu-26.04 adoption
  is required:

  ```yaml
  - name: Install Swift
    run: |
      SWIFT_VERSION=6.1.1
      wget -q https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz
      tar xzf swift-*.tar.gz
      echo "$PWD/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
  ```

  For macOS-only Swift projects, use a macOS runner where Swift is always available:

  ```yaml
  jobs:
    build-swift:
      runs-on: macos-latest
  ```
fix_code:
  - language: yaml
    label: 'Pin to ubuntu-24.04 until Swift is available on ubuntu-26.04'
    code: |
      jobs:
        build:
          # Swift not pre-installed on ubuntu-26.04 as of public preview (June 2026)
          # Track: https://github.com/actions/runner-images/issues/14226
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - name: Build Swift package
              run: swift build -c release
  - language: yaml
    label: 'Use matrix to test multiple platforms when ubuntu-26.04 Swift support arrives'
    code: |
      jobs:
        build:
          strategy:
            matrix:
              os: [ubuntu-24.04, macos-latest]
              # Add ubuntu-26.04 once Swift is available there
          runs-on: ${{ matrix.os }}
          steps:
            - uses: actions/checkout@v4
            - name: Build Swift package
              run: swift build -c release
prevention:
  - 'Check the runner-images changelog before migrating jobs to ubuntu-26.04; Swift is absent in the public preview.'
  - 'Pin Swift-dependent jobs to a specific ubuntu LTS image rather than ubuntu-latest to avoid automatic runtime upgrades.'
  - 'Monitor https://github.com/actions/runner-images/issues/14226 for Swift availability on ubuntu-26.04.'
  - 'For server-side Swift projects, consider using macOS runners for broader toolchain availability.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226 — Ubuntu 26.04 public preview announcement (June 11, 2026)'
  - url: 'https://www.swift.org/install/linux/'
    label: 'Swift.org — Install Swift on Linux'
  - url: 'https://github.com/swiftlang/swift/releases'
    label: 'Swift releases — manual installation tarballs'
