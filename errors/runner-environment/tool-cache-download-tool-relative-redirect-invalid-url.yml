id: runner-environment-449
title: "tool-cache downloadTool fails with TypeError: Invalid URL on relative redirect"
category: runner-environment
severity: error
tags:
  - tool-cache
  - downloadTool
  - redirect
  - TypeError
  - javascript-action
  - http-client
patterns:
  - regex: 'TypeError: Invalid URL'
    flags: i
  - regex: 'downloadTool.*TypeError|tool.cache.*Invalid.*URL'
    flags: i
error_messages:
  - "TypeError: Invalid URL"
  - "Error: TypeError: Invalid URL"
root_cause: |
  When a download server responds to a `tc.downloadTool()` request with an HTTP
  302/303 redirect that uses a **relative** `Location` header (e.g. `Location: bytes/35`
  instead of `Location: https://example.com/bytes/35`), the `@actions/http-client`
  package attempts to parse the relative URL as an absolute URL with:

    new URL(redirectUrl)   // ← throws TypeError when redirectUrl is relative

  Relative redirects are valid per RFC 7231 §7.1.2 and used by some CDNs and
  download servers, but the Actions http-client does not resolve them against the
  original request URL. The fix (`new URL(redirectUrl, requestUrl)`) is a one-line
  change in http-client/src/index.ts, but was unfixed as of toolkit v2.226+.
fix: |
  **Workaround until upstream fix is shipped:**

  Resolve the redirect manually before calling `tc.downloadTool`:

  ```javascript
  const http = require('https');

  function resolveRedirect(url) {
    return new Promise((resolve, reject) => {
      http.get(url, res => {
        if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
          const loc = res.headers.location;
          // Resolve relative redirect against original URL
          resolve(new URL(loc, url).toString());
        } else {
          resolve(url);
        }
      }).on('error', reject);
    });
  }

  const resolvedUrl = await resolveRedirect(originalUrl);
  const path = await tc.downloadTool(resolvedUrl);
  ```

  Alternatively, add the domain to `NO_PROXY` if you control the download server
  and can ensure it always returns absolute redirects.
fix_code:
  - language: yaml
    label: "Workaround: pre-resolve redirect before calling downloadTool"
    code: |
      - name: Download tool (redirect-safe)
        uses: actions/github-script@v7
        with:
          script: |
            const tc = require('@actions/tool-cache');
            const https = require('https');

            const originalUrl = 'https://example.com/download/tool';

            // Resolve redirect manually because http-client can't handle relative redirects
            const resolvedUrl = await new Promise((resolve, reject) => {
              https.get(originalUrl, res => {
                if (res.statusCode >= 300 && res.statusCode < 400) {
                  resolve(new URL(res.headers.location, originalUrl).toString());
                } else {
                  resolve(originalUrl);
                }
              }).on('error', reject);
            });

            const toolPath = await tc.downloadTool(resolvedUrl);
            core.addPath(toolPath);
prevention:
  - "Use download URLs that return absolute redirect locations rather than relative ones"
  - "Pre-test download URLs manually to detect relative redirects before adding them to workflows"
  - "Check if your CDN/mirror uses relative Location headers and configure absolute redirects if possible"
  - "File an upstream issue at actions/toolkit to track when the one-line fix is merged"
docs:
  - url: "https://github.com/actions/toolkit/issues/2226"
    label: "actions/toolkit#2226 — tool-cache downloadTool does not support relative redirects"
  - url: "https://github.com/actions/toolkit/blob/main/packages/http-client/src/index.ts"
    label: "actions/http-client source — redirect handling"
  - url: "https://www.rfc-editor.org/rfc/rfc7231#section-7.1.2"
    label: "RFC 7231 §7.1.2 — Relative references in Location header"
