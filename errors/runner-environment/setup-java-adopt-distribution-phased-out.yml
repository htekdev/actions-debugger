id: runner-environment-313
title: "setup-java `adopt` Distribution Phased Out — Version Not Found for Java 20+"
category: runner-environment
severity: error
tags:
  - setup-java
  - adopt
  - adoptopenjdk
  - temurin
  - distribution
  - eol
patterns:
  - regex: 'Could not find satisfied version for SemVer .*(2[0-9]|21)\.'
    flags: "i"
  - regex: 'Could not find satisfied version for SemVer.*Available versions:.*19\.'
    flags: "i"
  - regex: 'distribution.*adopt.*could not find satisfied version'
    flags: "i"
error_messages:
  - "Error: Could not find satisfied version for SemVer '21'. Available versions: 19.0.2+7, 19.0.1+10, 19.0.0+36, 18.0.2+101, ..."
  - "Error: Could not find satisfied version for SemVer '20'. Available versions: 19.0.2+7, ..."
  - "Trying to resolve the latest version from remote\nError: Could not find satisfied version for SemVer '21'."
root_cause: |
  AdoptOpenJDK was migrated to the Eclipse Adoptium project (rebranded as Temurin) in 2021.
  The `adopt` distribution in actions/setup-java fetches its version manifest from the old
  AdoptOpenJDK API, which stopped receiving updates for Java 20 and later. When
  `distribution: adopt` is used with `java-version: 21` (or any 20+), setup-java finds no
  matching entry in the manifest and fails. Even for Java 17, the `adopt` API has become
  intermittently unreliable. GitHub's setup-java documentation explicitly recommends
  migrating all workflows from `adopt` to `temurin`.
fix: |
  Replace `distribution: adopt` (or `adopt-hotspot`) with `distribution: temurin`.
  Eclipse Adoptium Temurin is the direct successor to AdoptOpenJDK, provides identical
  HotSpot JVM builds, and receives ongoing updates for all current Java versions. No other
  changes to the workflow step are required.
fix_code:
  - language: yaml
    label: "Migrate from adopt to temurin"
    code: |
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # was: 'adopt' or 'adopt-hotspot'
          java-version: '21'
          cache: 'gradle'           # or 'maven', or omit
prevention:
  - "Audit all workflows for `distribution: adopt` or `distribution: adopt-hotspot` and replace with `temurin`"
  - "Never use `adopt` for new workflows — AdoptOpenJDK is phased out and the manifest is no longer maintained"
  - "Use `distribution: temurin` for all new workflows — it is the official successor and supported by the Eclipse Foundation"
  - "Specify only the major Java version (e.g., `java-version: '21'`) rather than pinned full versions to reduce future maintenance"
docs:
  - url: "https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#adopt"
    label: "setup-java: Adopt distribution migration note"
  - url: "https://adoptium.net/blog/2021/08/goodbye-adoptopenjdk-hello-adoptium/"
    label: "Goodbye AdoptOpenJDK, Hello Adoptium"
  - url: "https://github.com/actions/setup-java/issues/784"
    label: "actions/setup-java#784: Cant find version 21 jdk for adopt"
  - url: "https://github.com/actions/setup-java/issues/692"
    label: "actions/setup-java#692: Java 17 failing with adopt distribution"
