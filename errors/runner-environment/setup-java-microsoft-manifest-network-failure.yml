id: runner-environment-316
title: "setup-java Microsoft Distribution Manifest Network Failure — Status Code Undefined"
category: runner-environment
severity: error
tags:
  - setup-java
  - microsoft
  - manifest
  - network
  - proxy
  - self-hosted
patterns:
  - regex: 'Could not load manifest for Microsoft Build of OpenJDK'
    flags: "i"
  - regex: 'Http request for microsoft-openjdk-versions\.json failed with status code: undefined'
    flags: "i"
  - regex: 'Java setup process failed due to: Available version not found'
    flags: "i"
error_messages:
  - "Error: Could not load manifest for Microsoft Build of OpenJDK"
  - "##[debug]Http request for microsoft-openjdk-versions.json failed with status code: undefined"
  - "Java setup process failed due to: Available version not found"
  - "Trying to resolve the latest version from remote\nError: Could not load manifest for Microsoft Build of OpenJDK"
root_cause: |
  actions/setup-java uses a per-distribution JSON manifest hosted on GitHub's CDN to resolve
  available Java versions. For the `microsoft` distribution, this manifest is fetched from
  `https://aka.ms/download-jdk/microsoft-openjdk-versions.json`. When this request fails
  (network timeout, corporate proxy blocking the `aka.ms` domain, GHES instance without
  external internet access, or a transient CDN outage), the action receives no HTTP status
  code (undefined) and immediately throws an error without retrying.
  This behavior was improved in setup-java PR #946 (released in v4.6.0) which added retry
  logic and better error diagnostics. Older versions of the action fail immediately with
  no diagnostic context about the network failure.
fix: |
  Upgrade to actions/setup-java@v4 (v4.6.0 or later) which includes retry logic for
  manifest fetches. For self-hosted runners behind a corporate proxy, ensure the
  `aka.ms` domain and `github.com/actions/setup-java` release assets are allowed.
  As a workaround, switch to `distribution: temurin` which fetches its manifest from
  GitHub releases (more proxy-friendly) or use `check-latest: false` with a preinstalled
  JDK on self-hosted runners.
fix_code:
  - language: yaml
    label: "Upgrade to latest setup-java@v4 (includes retry)"
    code: |
      - name: Set up JDK 21 (Microsoft)
        uses: actions/setup-java@v4   # v4.6.0+ has retry for manifest failures
        with:
          distribution: 'microsoft'
          java-version: '21'
  - language: yaml
    label: "Switch to temurin if microsoft domain is blocked by proxy"
    code: |
      - name: Set up JDK 21 (Temurin — proxy-friendly alternative)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'    # fetches from github.com releases
          java-version: '21'
  - language: yaml
    label: "Skip manifest fetch on self-hosted with preinstalled JDK"
    code: |
      - name: Set up JDK 21 (use preinstalled toolcache)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
          check-latest: false        # use toolcache, skip remote manifest check
prevention:
  - "Upgrade to `actions/setup-java@v4` (v4.6.0+) which adds retry and improved error diagnostics"
  - "On self-hosted runners, verify `aka.ms` and `github.com` manifest URLs are not blocked by proxy"
  - "For air-gapped runners, use `check-latest: false` with a preinstalled JDK in the toolcache"
  - "Consider `distribution: temurin` as an alternative when `microsoft` manifest is inaccessible"
docs:
  - url: "https://github.com/actions/setup-java/issues/645"
    label: "actions/setup-java#645: Sometimes throws 'Could not load manifest for Microsoft Build of OpenJDK'"
  - url: "https://github.com/actions/setup-java/issues/897"
    label: "actions/setup-java#897: Manifest network failure (PR#946 fix)"
  - url: "https://github.com/actions/setup-java/pull/946"
    label: "actions/setup-java PR#946: Add retry logic for remote manifest resolution"
