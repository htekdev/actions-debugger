id: runner-environment-266
title: 'Node.js 18 (EOL April 2025) removed from ubuntu-24.04 toolcache — setup-node fallback download failures'
category: runner-environment
severity: error
tags:
  - node18
  - nodejs-18
  - eol
  - toolcache
  - setup-node
  - ubuntu-24
patterns:
  - regex: 'Unable to find Node version 18\.'
    flags: 'i'
  - regex: 'Downloading and installing node v18\.'
    flags: 'i'
  - regex: 'Error: Unable to find Node.js version 18'
    flags: 'i'
  - regex: 'Node.js version 18.*has been deprecated.*recommend.*upgrading'
    flags: 'i'
error_messages:
  - 'Unable to find Node version 18.x.x in hostedtoolcache'
  - 'Attempting to download node version 18.x.x from GitHub CDN ...'
  - 'Error: Unable to find Node.js version 18.x.x. Please check that the specified Node.js version is correct.'
  - 'Warning: Node.js 18 is End of Life (EOL). Please consider upgrading to an active LTS version.'
root_cause: |
  Node.js 18 reached End of Life (EOL) on April 30, 2025. GitHub removes EOL Node.js
  versions from the pre-installed toolcache on ubuntu-24.04 runners as part of the
  image maintenance cycle. When the toolcache entry for Node.js 18 is absent,
  `actions/setup-node` falls back to downloading the version from the Node.js
  distribution server (dist.nodejs.org).

  This fallback causes two problems:

  1. **Slow downloads on every job**: Each run now downloads ~40MB of Node.js binaries
     instead of using the pre-cached version. On shared runners, this adds 30-60 seconds
     of download time per job.

  2. **Hard failures in restricted environments**: Self-hosted runners without outbound
     internet access to dist.nodejs.org, or GitHub-hosted runners during dist.nodejs.org
     CDN disruptions, fail outright with "Unable to find Node.js version 18.x.x".

  Additionally, `actions/setup-node` emits a deprecation annotation warning about
  Node.js 18 being EOL. Workflows that treat annotations as errors (via
  `::error::` processing or strict action configurations) may fail on this annotation.

  This pattern is parallel to the previously-documented Node.js 20 toolcache removal
  (node-20-toolcache-removal.yml), which followed the same lifecycle: EOL → toolcache
  removal → download fallback → eventual setup-node manifest removal.

  Source: Node.js release schedule (nodejs.org/en/about/previous-releases), GitHub
  runner-images changelog, setup-node issue tracker, community reports of slow job
  startup after ubuntu-24.04 migration.
fix: |
  **Option 1 (recommended): Upgrade to an active LTS Node.js version**
  Node.js 20 LTS (EOL April 2026) or Node.js 22 LTS (Active LTS) are pre-cached on
  ubuntu-24.04 and do not require downloading. Upgrading is the correct long-term fix.

  **Option 2: Specify exact Node.js 18 patch version (temporary)**
  Pinning an exact patch version (e.g., `18.20.4`) may help the toolcache lookup but
  does NOT add the version back to the toolcache — the download fallback still applies.

  **Option 3: Use .nvmrc or .node-version file with node-version-file**
  This is good hygiene but does not solve the EOL toolcache removal — the download
  fallback still applies if the file specifies Node.js 18.
fix_code:
  - language: yaml
    label: 'Wrong — Node.js 18 removed from toolcache, causes slow download on every job'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest   # ubuntu-24.04; Node.js 18 not in toolcache
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '18'   # EOL April 2025 — not in toolcache on ubuntu-24.04
                cache: 'npm'
            # Warning: Node.js 18 is End of Life
            # Downloading and installing node v18.20.4... (adds 30-60s per job)
  - language: yaml
    label: 'Fixed — upgrade to Node.js 22 LTS (Active LTS, pre-cached)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'   # Active LTS, pre-cached on ubuntu-24.04
                cache: 'npm'
            - run: npm ci
            - run: npm test
  - language: yaml
    label: 'Fixed — use node-version-file with modern version in .nvmrc'
    code: |
      # .nvmrc file containing: 22
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'   # ensure .nvmrc specifies Node 20 or 22
                cache: 'npm'
prevention:
  - 'Subscribe to Node.js EOL announcements at nodejs.org/en/about/previous-releases and plan upgrades before EOL'
  - 'Use a node-version matrix to test compatibility with LTS versions before the mandatory upgrade'
  - 'Replace node-version: 18 with node-version: 22 (current Active LTS) before the GitHub runner toolcache removal'
  - 'Monitor job startup times — a sudden increase of 30-60s often signals a toolcache miss due to EOL removal'
docs:
  - url: 'https://nodejs.org/en/about/previous-releases'
    label: 'Node.js Release Schedule — EOL dates and LTS status'
  - url: 'https://github.com/actions/setup-node'
    label: 'actions/setup-node — supported Node.js versions'
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md'
    label: 'ubuntu-24.04 runner image README — pre-installed software list'
