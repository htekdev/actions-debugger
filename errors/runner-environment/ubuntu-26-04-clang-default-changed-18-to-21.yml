id: runner-environment-436
title: 'ubuntu-26.04 Default Clang Changed from 18 to 21 — Clang 16/17/18 Not Pre-installed'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - clang
  - llvm
  - compiler
  - c-cpp
  - breaking-change
  - runner-image
  - migration
  - clang-18
  - clang-21
patterns:
  - regex: 'clang-1[678]:\s*(command not found|not found)'
    flags: 'i'
  - regex: '/usr/bin/clang-1[678]:\s*No such file or directory'
    flags: 'i'
  - regex: 'cannot find.*clang-1[678]|clang-1[678].*not installed'
    flags: 'i'
  - regex: 'error: unable to execute command.*clang-1[678]'
    flags: 'i'
  - regex: "llvm-config-1[678].*not found|llvm.*1[678].*command not found"
    flags: 'i'
error_messages:
  - 'clang-18: command not found'
  - 'clang-17: command not found'
  - 'clang-16: command not found'
  - '/usr/bin/clang-18: No such file or directory'
  - 'error: unable to execute command: No such file or directory (clang-18)'
  - 'llvm-config-18: command not found'
  - 'llvm-ar-18: command not found'
root_cause: |
  The ubuntu-26.04 GitHub Actions hosted runner image ships Clang/LLVM versions
  20, 21, and 22, with Clang 21 set as the default. This is a significant jump from
  ubuntu-24.04, which shipped Clang 16, 17, and 18 (default: Clang 18).

  From runner-images/images/ubuntu/toolsets/toolset-2604.json:
    "clang": {
      "versions": ["20", "21", "22"],
      "default_version": "21"
    }

  From toolset-2404.json:
    "clang": {
      "versions": ["16", "17", "18"],
      "default_version": "18"
    }

  Workflows that hardcode `clang-18`, `clang-17`, or `clang-16` will fail
  with "command not found" on ubuntu-26.04. Common patterns:

  - `CC=clang-18 CXX=clang++-18` environment variables
  - CMake `-DCMAKE_C_COMPILER=clang-18`
  - LLVM toolchain references like `llvm-config-18`, `llvm-ar-18`, `llvm-nm-18`
  - Rust build scripts that invoke `clang-18` as a linker
  - C/C++ projects that use sanitizers via `clang-18 -fsanitize=address`

  Additionally, the Xcode-provided Clang on the macOS-26 runner is Apple Clang 21
  (up from Apple Clang 17 on macOS-15), which parallels this trend but has
  separate documentation (macos-26-apple-clang-21-*).

  Behavioral differences in Clang 21 vs Clang 18 that can also break builds:
  - Clang 21 enforces `-Werror=implicit-function-declaration` by default in C23 mode
  - New `-Wunsafe-buffer-usage` warnings promoted in Clang 20+
  - Changes to `-fno-stack-protector` behavior
  - LLVM bitcode format version bumped (IR generated by clang-18 may not load in clang-21 tools)
fix: |
  Option 1 — Update compiler references to Clang 20 or 21 (recommended):
  ubuntu-26.04 has Clang 20, 21, and 22 pre-installed. Update all references
  from clang-18/clang-17/clang-16 to clang-21 (or clang-20 for more conservative migration).

  Option 2 — Use the unversioned `clang` / `clang++` symlinks:
  On ubuntu-26.04, `clang` and `clang++` point to clang-21. This avoids hardcoding
  a version. Remove explicit version suffixes from your build scripts.

  Option 3 — Install the specific Clang version via apt (llvm.sh or LLVM APT repo):
  LLVM provides apt packages for older Clang versions via apt.llvm.org. Install
  clang-18 explicitly if upgrading is not feasible:
    wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 18

  Option 4 — Pin to ubuntu-24.04:
  If Clang 18 is required for binary compatibility or specific features, stay on
  ubuntu-24.04 which has Clang 18 pre-installed.
fix_code:
  - language: yaml
    label: 'Update CC/CXX to use Clang 21 on ubuntu-26.04'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04
          env:
            CC: clang-21
            CXX: clang++-21
          steps:
            - uses: actions/checkout@v4
            - name: Configure with Clang 21
              run: |
                cmake \
                  -DCMAKE_C_COMPILER=clang-21 \
                  -DCMAKE_CXX_COMPILER=clang++-21 \
                  -DCMAKE_AR=/usr/bin/llvm-ar-21 \
                  -DCMAKE_NM=/usr/bin/llvm-nm-21 \
                  -DCMAKE_RANLIB=/usr/bin/llvm-ranlib-21 \
                  -B build .
            - name: Build
              run: cmake --build build

  - language: yaml
    label: 'Use unversioned clang symlink to avoid hardcoding (recommended pattern)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04  # Clang 21 default
          steps:
            - uses: actions/checkout@v4
            # Use unversioned clang — points to default (21 on ubuntu-26.04, 18 on ubuntu-24.04)
            - name: Build with default Clang
              run: clang++ -std=c++20 -O2 -o myapp main.cpp

  - language: yaml
    label: 'Matrix across Clang versions to cover ubuntu-24.04 and ubuntu-26.04'
    code: |
      jobs:
        build:
          strategy:
            matrix:
              include:
                - os: ubuntu-24.04
                  clang: '18'
                - os: ubuntu-26.04
                  clang: '21'
          runs-on: ${{ matrix.os }}
          steps:
            - uses: actions/checkout@v4
            - name: Build with Clang ${{ matrix.clang }}
              run: |
                CC=clang-${{ matrix.clang }} \
                CXX=clang++-${{ matrix.clang }} \
                cmake -B build . && cmake --build build

  - language: yaml
    label: 'Install Clang 18 from LLVM APT on ubuntu-26.04 (compatibility workaround)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4
            - name: Install Clang 18 from LLVM APT
              run: |
                wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
            - name: Build with Clang 18
              run: CC=clang-18 CXX=clang++-18 make

prevention:
  - 'Use unversioned `clang`/`clang++` in build scripts — the default symlinks are updated with each Ubuntu image generation, avoiding "command not found" errors.'
  - 'Parameterize the Clang version in your build matrix so migrating to a new runner only requires changing one variable.'
  - 'Test on ubuntu-26.04 with Clang 21 before ubuntu-latest aliases ubuntu-26.04 to catch new warnings promoted to errors in Clang 21 (e.g., `-Wunsafe-buffer-usage`).'
  - 'If using LLVM tools (llvm-ar, llvm-nm, llvm-ranlib), also update their version suffix alongside the Clang version.'
docs:
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/toolsets/toolset-2604.json'
    label: 'ubuntu-26.04 toolset — Clang versions 20/21/22 installed (default: 21)'
  - url: 'https://github.com/actions/runner-images/blob/main/images/ubuntu/toolsets/toolset-2404.json'
    label: 'ubuntu-24.04 toolset — Clang versions 16/17/18 installed (default: 18)'
  - url: 'https://apt.llvm.org/'
    label: 'LLVM APT repository — install older Clang versions on Ubuntu'
  - url: 'https://github.com/actions/runner-images/issues/13964'
    label: 'runner-images #13964: Add Ubuntu 26.04 LTS'
