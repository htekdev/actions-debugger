id: runner-environment-278
title: 'setup-python Fails in ubuntu:26.04 Container — Python Versions Not Yet in Manifest'
category: runner-environment
severity: error
tags:
  - setup-python
  - ubuntu-26.04
  - container
  - manifest
  - python-versions
  - self-hosted
  - version-not-found
patterns:
  - regex: 'version.*not found.*ubuntu.*26|ubuntu.*26.*not found.*version'
    flags: 'i'
  - regex: 'The version .* with architecture .* was not found for this operating system'
    flags: 'i'
  - regex: 'Failing to fetch version from manifest.*ubuntu.*26|manifest.*ubuntu.*26.*missing'
    flags: 'i'
error_messages:
  - "Error: The version '3.13' with architecture 'x64' was not found for this operating system."
  - "Error: The version '3.12' with architecture 'x64' was not found for this operating system."
  - 'Failing to fetch version from manifest when using Ubuntu 26.04'
  - 'The list of all available versions can be found here: https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json'
root_cause: |
  The actions/python-versions release pipeline publishes pre-built Python binaries
  for each supported Ubuntu LTS version as separate artifacts
  (e.g., python-3.13.x-linux-24.04-x64.tar.gz). When setup-python downloads a
  Python version on a runner or container that reports a NEW Ubuntu release (e.g.,
  ubuntu:26.04 / "Resolute Raccoon"), it looks for a matching entry in the
  versions-manifest.json. If no entry for ubuntu 26.04 exists yet, the action
  fails with "version not found for this operating system."

  This is a recurring pattern every Ubuntu LTS release cycle:
  - ubuntu:22.04 was unsupported in setup-python until mid-2022 (issue #854)
  - ubuntu:26.04 hit the same gap in May 2026 (issue #1309)

  The failure only manifests when Python must actually be DOWNLOADED — i.e., when:
  1. Using a self-hosted runner that does not have Python pre-cached, OR
  2. Using ubuntu:26.04 as a job container on a self-hosted runner

  GitHub-hosted runners using ubuntu-latest (backed by ubuntu-24.04 at the time
  of writing) with ubuntu:26.04 as a container image may not trigger the failure
  because setup-python resolves Python from the host runner's pre-populated
  toolcache rather than downloading. This creates confusing behavior where the
  same workflow succeeds on GitHub-hosted but fails on self-hosted runners.

  Ubuntu 26.04 (Resolute Raccoon) support will be added to python-versions once
  the ubuntu-26.04 runner image becomes generally available in runner-images.

  Source: actions/setup-python#1309 (open May 2026); parallel issue setup-python#854 (2022).
fix: |
  Option 1 — Use ubuntu-24.04 container (recommended until ubuntu-26.04 support ships):
  Replace `container: ubuntu:latest` or `container: ubuntu:26.04` with
  `container: ubuntu:24.04` for jobs that use setup-python. This targets a
  supported OS with pre-built Python binaries in the manifest.

  Option 2 — Pre-install Python before setup-python:
  Use apt to install the required Python version before invoking setup-python.
  setup-python will detect the pre-installed version and skip the download.

  Option 3 — Use a pre-built Python container image:
  Use `python:3.13-slim` (or similar) instead of `ubuntu:26.04` as the container
  base image. Python is already available without setup-python.

  Option 4 — Wait for manifest support:
  Monitor actions/setup-python#1309 and actions/python-versions for ubuntu-26.04
  entries to be published.
fix_code:
  - language: yaml
    label: 'Pin container to ubuntu:24.04 until ubuntu-26.04 is in the Python manifest'
    code: |
      jobs:
        test:
          runs-on: [self-hosted]
          # ubuntu:26.04 (latest) is not yet in setup-python's versions manifest.
          # Pin to 24.04 until actions/setup-python#1309 is resolved.
          container: ubuntu:24.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v6
              with:
                python-version: '3.13'
            - run: python -m pytest
  - language: yaml
    label: 'Use a Python base image instead of ubuntu:26.04 to avoid the manifest gap'
    code: |
      jobs:
        test:
          runs-on: [self-hosted]
          # Use official Python image instead of ubuntu:26.04 to avoid setup-python
          # manifest gap (actions/setup-python#1309).
          container: python:3.13-slim
          steps:
            - uses: actions/checkout@v4
            - run: pip install -r requirements.txt
            - run: pytest
  - language: yaml
    label: 'Pre-install Python via apt before setup-python as a workaround'
    code: |
      jobs:
        test:
          runs-on: [self-hosted]
          container: ubuntu:26.04
          steps:
            - uses: actions/checkout@v4
            - name: Pre-install Python (workaround for manifest gap)
              run: |
                apt-get update && apt-get install -y python3.13 python3-pip
            - uses: actions/setup-python@v6
              with:
                python-version: '3.13'   # detects pre-installed, skips download
            - run: python -m pytest
prevention:
  - 'When adopting a new Ubuntu LTS container, verify Python version support in setup-python before migrating'
  - 'Use `container: ubuntu:24.04` (explicit version) rather than `ubuntu:latest` — latest shifts to 26.04 without warning'
  - 'Track actions/setup-python#1309 for ubuntu-26.04 manifest support'
  - 'For self-hosted runners using newer Ubuntu containers, keep ubuntu:24.04 as a fallback while new OS support is being added to setup-python'
docs:
  - url: 'https://github.com/actions/setup-python/issues/1309'
    label: 'actions/setup-python#1309: Failing to fetch version from manifest when using Ubuntu 26.04 container (open May 2026)'
  - url: 'https://github.com/actions/setup-python/issues/854'
    label: 'actions/setup-python#854: Same gap when ubuntu-24.04 was first released (2022)'
  - url: 'https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json'
    label: 'Python versions manifest — check for ubuntu-26.04 entries here'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-jobs-in-a-container'
    label: 'GitHub Docs: Running jobs in a container'
