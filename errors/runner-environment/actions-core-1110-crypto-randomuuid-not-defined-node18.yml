id: re-482
title: '@actions/core@1.11.0 Fails with ReferenceError: crypto is not defined on Node.js 18'
category: runner-environment
severity: error
tags:
  - actions-core
  - nodejs
  - crypto
  - javascript-action
  - node18
  - randomUUID
  - dependency-version
patterns:
  - regex: 'ReferenceError: crypto is not defined'
    flags: 'i'
  - regex: 'crypto\.randomUUID is not a function'
    flags: 'i'
  - regex: 'at prepareKeyValueMessage.*file-command\.js'
    flags: 'i'
error_messages:
  - "ReferenceError: crypto is not defined"
  - "ReferenceError: crypto is not defined\n    at prepareKeyValueMessage (/home/runner/work/_actions/.../node_modules/@actions/core/lib/file-command.js:47:39)\n    at Object.setOutput (/home/runner/work/_actions/.../node_modules/@actions/core/lib/core.js:168:105)"
  - "crypto.randomUUID is not a function"
root_cause: |
  @actions/core version 1.11.0 introduced a call to `crypto.randomUUID()` in
  `file-command.js` to generate unique delimiter strings for GITHUB_OUTPUT and
  GITHUB_ENV heredoc blocks. However, `crypto` was not available as a bare global
  in Node.js until version 19. In Node.js 16 and 18 (the runtimes used by
  `using: node16` and `using: node18` actions), `crypto` must be explicitly
  required: `const { randomUUID } = require('crypto')`.

  Any custom JavaScript action that bundles @actions/core@1.11.0 and declares
  `using: node16` or `using: node18` in its action.yml will fail with this error
  whenever `core.setOutput()` or `core.exportVariable()` is called, because
  @actions/core@1.11.0 uses the bare `crypto` global which does not exist.

  The bug was introduced in @actions/core 1.11.0 and fixed in a subsequent patch
  release. Re-bundling the action with a newer version of @actions/core resolves it.
fix: |
  Option 1 (recommended): Upgrade the action's runtime to Node.js 20+. Change
  the action's `action.yml` to `using: node20` and re-bundle with Node.js 20.
  The `crypto` global exists in Node.js 19+.

  Option 2: If you maintain the action, pin @actions/core to a version ≥ 1.11.1
  (where the bug is fixed) or ≤ 1.10.1 (before the bug was introduced), then
  re-bundle and release a new version.

  Option 3 (caller workaround): In your workflow, add a step before the failing
  action step to set up Node.js 20:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
  This does NOT help if the action is already bundled — it only works for
  workflow-level Node.js usage. For bundled actions, the author must fix
  the bundle itself.
fix_code:
  - language: yaml
    label: 'Upgrade the action runtime in action.yml to node20'
    code: |
      # In your action's action.yml — change from:
      runs:
        using: node16   # or node18
        main: dist/index.js

      # To:
      runs:
        using: node20
        main: dist/index.js
  - language: yaml
    label: 'Caller workaround — pre-install Node 20 before using the failing action'
    code: |
      steps:
        - name: Set up Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Run the affected action
          uses: my-org/my-action@v1
prevention:
  - 'Keep bundled dependencies up to date — run `npm audit` and update @actions/core regularly.'
  - 'Prefer `using: node20` for new actions; node16/node18 are deprecated.'
  - 'Pin @actions/core to ≥ 1.11.1 or a version before 1.11.0 until you can upgrade the runtime.'
  - 'Test actions locally against the same Node.js version declared in action.yml before publishing.'
docs:
  - url: 'https://github.com/actions/toolkit/issues/1841'
    label: '@actions/core 1.11.0 — ReferenceError: crypto is not defined (actions/toolkit#1841)'
  - url: 'https://nodejs.org/docs/latest-v18.x/api/crypto.html'
    label: 'Node.js 18 crypto module — requires explicit require()'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions#runs-for-javascript-actions'
    label: 'GitHub Actions — runs for JavaScript actions (node20 recommended)'
