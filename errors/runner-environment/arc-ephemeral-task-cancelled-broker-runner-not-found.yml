id: runner-environment-401
title: 'ARC Scale-Set Ephemeral Runner Job Cancelled Mid-Execution With "A task was canceled" After Broker RunnerNotFound'
category: runner-environment
severity: error
tags:
  - arc
  - scale-set
  - ephemeral
  - task-cancelled
  - broker
  - runner-not-found
  - operation-canceled
  - self-hosted
patterns:
  - regex: 'Error: A task was canceled\.'
    flags: 'i'
  - regex: 'System\.OperationCanceledException.*ProcessInvoker'
    flags: 'i'
  - regex: 'Runner will be shutdown for UserCancelled'
    flags: 'i'
error_messages:
  - 'Error: A task was canceled.'
  - 'Error: The operation was canceled.'
  - '[INFO HostContext] Runner will be shutdown for UserCancelled'
  - 'System.OperationCanceledException: The operation was canceled.'
root_cause: |
  On ARC (Actions Runner Controller) scale-set ephemeral runners and regular self-hosted
  runners using the V2 broker flow, a job is cancelled mid-execution with "Error: A task
  was canceled." without any user-initiated cancellation. Retrying the job usually succeeds.

  Root cause: the broker API endpoint returns "RunnerNotFound" while the job is actively
  running. Since actions/runner#3536 (merged 2025), the runner immediately shuts down on
  "RunnerNotFound" instead of retrying — the running job receives a cancellation token,
  causing ProcessInvoker to throw OperationCanceledException.

  This is distinct from the startup-time "An error occurred: Runner not found" (re-090)
  which occurs before the job starts. This pattern happens during execution, sometimes
  minutes into a running job.

  Broker "RunnerNotFound" mid-job can occur when:
  - The broker loses session state for the runner during a rolling deploy or load-balancing
    event on GitHub's infrastructure.
  - A high volume of scale-set jobs causes transient broker-side state inconsistency.
  - The runner's V2 broker session ID is no longer recognized after an infrastructure event.

  The debug log shows: "Runner will be shutdown for UserCancelled" followed by
  System.OperationCanceledException in GitHub.Runner.Worker.Handlers.ScriptHandler.RunAsync.
  Source: actions/runner#3819 (48 reactions, open April 2025 through Jan 2026).
fix: |
  1. Retry the failed job — the error is transient. Most retries succeed immediately.
  2. Switch from replace-mode ephemeral runners to JIT (Just-In-Time) runner tokens;
     JIT tokens have a pre-assigned job binding that reduces broker session races.
  3. If using ARC Helm chart < 0.12.1, upgrade — broker session handling was improved.
  4. Keep runner version current (v2.334.0+).
  5. Enable ACTIONS_STEP_DEBUG=true to capture broker session IDs in logs and distinguish
     this pattern from genuine user cancellations or concurrency-group cancellations.
fix_code:
  - language: yaml
    label: 'ARC RunnerScaleSet with JIT mode to reduce broker session races'
    code: |
      # values.yaml for gha-runner-scale-set Helm chart (>= 0.12.1)
      githubConfigUrl: https://github.com/myorg/myrepo
      githubConfigSecret: gh-token-secret
      runnerScaleSetName: arc-runner-set
      ephemeral: true         # One job per runner pod
      template:
        spec:
          containers:
            - name: runner
              image: ghcr.io/actions/actions-runner:latest
  - language: yaml
    label: 'Add retry logic in workflow to recover from transient broker cancellations'
    code: |
      jobs:
        build:
          runs-on: [self-hosted, arc-runner-set]
          steps:
            - uses: actions/checkout@v4
            - name: Build with retry on cancellation
              uses: nick-fields/retry@v3
              with:
                timeout_minutes: 60
                max_attempts: 3
                retry_on: error
                command: make build
prevention:
  - 'Keep ARC gha-runner-scale-set Helm chart at 0.12.1+ for improved broker session handling'
  - 'Use JIT runner tokens instead of replace-mode ephemeral registration'
  - 'Keep self-hosted runner version at v2.334.0+ for latest broker compatibility fixes'
  - 'Do not confuse "A task was canceled" with user-initiated or concurrency-group cancellations — check _diag logs for RunnerNotFound vs CancellationToken source'
  - 'Enable debug logging (ACTIONS_STEP_DEBUG) to capture broker session state in failure logs'
docs:
  - url: 'https://github.com/actions/runner/issues/3819'
    label: 'actions/runner #3819: A lot of random "A task was cancelled" errors (48 reactions, open Apr 2025)'
  - url: 'https://github.com/actions/runner/pull/3536'
    label: 'actions/runner #3536: Change that removed broker RunnerNotFound retry (merged 2025)'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/autoscaling-with-self-hosted-runners#using-just-in-time-runners'
    label: 'GitHub Docs: Just-in-time runners (JIT)'
  - url: 'https://github.com/actions/actions-runner-controller/releases'
    label: 'ARC gha-runner-scale-set releases — upgrade to 0.12.1+ for session improvements'