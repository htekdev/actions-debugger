id: runner-environment-329
title: 'Node.js 22.22.2 Toolcache npm 10.9.7 Missing promise-retry — MODULE_NOT_FOUND on Any npm Install Command'
category: runner-environment
severity: error
tags:
  - nodejs
  - npm
  - toolcache
  - setup-node
  - ubuntu-24.04
  - regression
  - promise-retry
patterns:
  - regex: 'Cannot find module .promise-retry.'
    flags: 'i'
  - regex: 'npm error Cannot find module.*promise-retry'
    flags: 'i'
  - regex: '@npmcli/arborist.*rebuild\.js.*Cannot find module|arborist.*lib.*Cannot find module.*promise-retry'
    flags: 'is'
  - regex: 'npm error code MODULE_NOT_FOUND\s*npm error Cannot find module'
    flags: 'im'
error_messages:
  - 'npm error code MODULE_NOT_FOUND'
  - "npm error Cannot find module 'promise-retry'"
  - 'npm error Require stack:'
  - 'npm error - /opt/hostedtoolcache/node/22.22.2/x64/lib/node_modules/npm/node_modules/@npmcli/arborist/lib/arborist/rebuild.js'
root_cause: |
  Node.js 22.22.2 was shipped in the GitHub Actions toolcache (ubuntu-24.04 image
  20260329.72.1 through approximately 20260524) with a broken npm 10.9.7 installation.
  The `promise-retry` module is missing from npm's own internal dependency tree —
  specifically from `@npmcli/arborist` at:

    /opt/hostedtoolcache/node/22.22.2/x64/lib/node_modules/npm/node_modules/promise-retry/

  Any npm command that invokes `@npmcli/arborist` (including `npm install -g`, `npm install`,
  `npm ci`, and other install-like commands) fails immediately with `MODULE_NOT_FOUND`.

  Affected workflows:
  - Any job that runs `npm install -g npm@latest` (common for upgrading npm to 11.5.1+
    required for OIDC Trusted Publishing / npm provenance)
  - Any npm command that triggers the arborist rebuild phase

  The broken package exists only in the toolcache version 22.22.2. Image 20260323.65.1
  with Node 22.22.1 works correctly. The regression originates from an upstream Node.js
  packaging bug (nodejs/node#62425) that was fixed in Node 22.22.3.

  Fixed: Node.js 22.22.3 was deployed in the ubuntu-24.04 image on May 25, 2026
  (actions/runner-images#13883 closed). Runners receiving updated images no longer
  exhibit this bug.
fix: |
  Primary fix: Use Node.js 24 for any job that self-upgrades npm or requires npm 11+.
  Node.js 24 ships with npm 11+ which supports OIDC Trusted Publishing natively and does
  not require a self-upgrade step.

  Short-term workaround: Pin to Node 22.22.1 in setup-node to skip the broken 22.22.2.

  Alternative: Use corepack to install npm instead of `npm install -g npm@latest`.
  Corepack installs npm as a standalone binary without invoking @npmcli/arborist from the
  broken toolcache installation.

  Long-term: Runners receiving updated images now ship Node 22.22.3 (fixed). Simply
  not pinning to 22.22.2 resolves the issue on updated runners.
fix_code:
  - language: yaml
    label: 'Preferred fix — use Node.js 24 (ships with npm 11+, no self-upgrade needed)'
    code: |
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # npm 11+ ships with Node 24; no npm install -g needed
      - run: npm publish --provenance
  - language: yaml
    label: 'Workaround — pin to Node 22.22.1 to skip broken 22.22.2 toolcache entry'
    code: |
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'   # pin exact patch; skip broken 22.22.2

      - run: npm install -g npm@latest   # works on 22.22.1
  - language: yaml
    label: 'Alternative — use corepack to install npm (bypasses arborist rebuild)'
    code: |
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: |
          corepack enable
          corepack use npm@11.5.1
          npm --version   # verify 11.5.1
prevention:
  - 'Use Node.js 24 (current LTS) for any workflow that publishes to npm with OIDC Trusted Publishing — Node 24 includes npm 11+ without a self-upgrade step.'
  - 'Avoid `npm install -g npm@latest` as a workflow step; prefer pinning the Node.js version that ships with the npm version you need.'
  - 'When toolcache regressions occur, pinning to a specific patch version in setup-node (e.g. node-version: 22.22.1) is a reliable emergency workaround until the image is updated.'
  - 'Monitor actions/runner-images issues when workflows suddenly fail after an image update — toolcache regressions are reported there first.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/13883'
    label: 'runner-images#13883 — npm 22.22.2 toolcache broken promise-retry (closed May 2026)'
  - url: 'https://github.com/nodejs/node/issues/62425'
    label: 'nodejs/node#62425 — upstream: promise-retry missing from npm bundled with Node 22.22.2'
  - url: 'https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-nodejs-packages'
    label: 'GitHub Docs — Publishing Node.js packages'
