id: runner-environment-347
title: 'node-gyp <=12.3 does not recognize VS2026 — native module builds fail on windows-latest after June 2026'
category: runner-environment
severity: error
tags:
  - windows
  - visual-studio
  - node-gyp
  - npm
  - native-addon
  - runner-image
  - breaking-change
patterns:
  - regex: 'could not find a version of Visual Studio that satisfies the requirements'
    flags: 'i'
  - regex: 'gyp ERR.*find VS.*could not find|No valid MS build tools installation found'
    flags: 'i'
  - regex: 'gyp ERR.*stack.*Could not find any Visual Studio'
    flags: 'i'
error_messages:
  - "gyp ERR! find VS could not find a version of Visual Studio that satisfies the requirements."
  - "gyp ERR! find VS You need to install a version of MS build tools."
  - "could not find a version of Visual Studio that satisfies the requirements."
  - "gyp ERR! stack Error: Could not find any Visual Studio installation to use"
root_cause: |
  node-gyp detects Visual Studio installations by scanning the registry for specific version
  ranges. VS2026 reports itself as major version 18; node-gyp <=12.3 only searched for
  VS versions 15–17 (VS2017–VS2022) and silently skips version 18.

  With windows-latest and windows-2025 migrating to VS2026 exclusively on June 8–15, 2026,
  there is no VS2022 left on those runners for older node-gyp to find.

  Affected version combinations:
  - Node 22 LTS ships npm 10.9.x bundling node-gyp 11.5.0 — does NOT support VS2026
  - npm <=11.6.2 bundles node-gyp <=12.3 — does NOT support VS2026
  - npm >=11.6.3 bundles node-gyp >=12.4 — added VS2026 (version 18) support

  Affects any npm install step that compiles native addons: better-sqlite3, bcrypt,
  canvas, sharp, sqlite3, hnswlib-node, robotjs, and others.
fix: |
  Option 1 (recommended) — Upgrade npm before native module install:
    npm install -g npm@latest   # brings node-gyp >=12.4 supporting VS2026

  Option 2 — Use the MSVC v143 shim that VS2026 ships:
    npm install --msvs_version=2022   # forces VS2022 toolset detection via shim

  Option 3 — Rollback to windows-2022:
    runs-on: windows-2022   # still ships VS2022; node-gyp 11.x works fine
fix_code:
  - language: yaml
    label: 'Upgrade npm before native module install to get node-gyp >=12.4'
    code: |
      jobs:
        build:
          runs-on: windows-latest   # VS2026 after June 2026
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - name: Upgrade npm for VS2026 node-gyp support
              run: npm install -g npm@latest   # node-gyp >=12.4 recognizes VS 18
            - name: Install dependencies
              run: npm ci
  - language: yaml
    label: 'Force MSVC v143 toolset via npm_config_msvs_version env var'
    code: |
      jobs:
        build:
          runs-on: windows-latest
          env:
            npm_config_msvs_version: '2022'   # uses v143 shim in VS2026
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - run: npm ci
prevention:
  - 'Add an explicit npm upgrade step before native module compilation on Windows runners after June 2026.'
  - 'Test Windows native addon builds against windows-2025-vs2026 before June 15, 2026.'
  - 'Check bundled node-gyp version with npm list node-gyp — ensure >=12.4 for VS2026 support.'
  - 'For electron-builder workflows, confirm that the internal npmRebuild phase uses node-gyp >=12.4.'
docs:
  - url: 'https://github.com/nodejs/node-gyp/pull/3240'
    label: 'node-gyp PR #3240: Add Visual Studio 2026 (version 18) support'
  - url: 'https://github.com/actions/runner-images/issues/14017'
    label: 'GitHub Announcement: windows-latest migrates to Visual Studio 2026 (June 2026)'
  - url: 'https://nodejs.github.io/node-gyp/'
    label: 'node-gyp installation documentation'
