  - url: 'https://github.com/actions/runner-images/issues/6697'
    label: 'actions/runner-images#6697 — Missing OpenSSL 1.1.1 Dependency on ubuntu-22.04'
  - url: 'https://github.com/nodkz/mongodb-memory-server/issues?q=libcrypto'
    label: 'mongodb-memory-server — libcrypto.so.1.1 issues tracker'
