id: runner-environment-295
title: "windows-2025 MSYS2 not pre-installed — pacman and MinGW tools unavailable"
category: runner-environment
severity: error
tags:
  - windows-2025
  - windows-latest
  - msys2
  - mingw
  - version-bump
  - missing-tool
patterns:
  - regex: "'pacman' is not recognized as an internal or external command"
    flags: i
  - regex: 'spawn C:\\\\msys64\\\\usr\\\\bin\\\\bash\\.exe ENOENT'
    flags: i
  - regex: 'The system cannot find the path specified.*msys64'
    flags: i
  - regex: 'mingw32-make.*not recognized|mingw32-make.*command not found'
    flags: i
error_messages:
  - "'pacman' is not recognized as an internal or external command, operable program or batch file."
  - "Error: spawn C:\\msys64\\usr\\bin\\bash.exe ENOENT"
  - "The system cannot find the path specified: C:\\msys64"
  - "'mingw32-make' is not recognized as an internal or external command, operable program or batch file."
root_cause: |
  MSYS2 (including the MinGW-w64 toolchain, pacman package manager, and Unix
  utilities) was pre-installed at C:\msys64 on windows-2022 runner images. When
  windows-2025 became the windows-latest target, MSYS2 was removed from the image.
  Workflows that assumed MSYS2 availability — directly calling pacman, running bash
  via C:\msys64\usr\bin\bash.exe, using MinGW gcc/make, or specifying
  `shell: msys2 {0}` without the setup step — fail with path-not-found or
  command-not-recognized errors.

  Common affected scenarios include: C/C++ projects using MinGW gcc, native Ruby gem
  builds requiring the DevKit (which used MSYS2 internally), Node.js native addons
  invoking node-gyp with the MinGW toolchain, and workflows using `shell: msys2 {0}`
  syntax which requires the msys2/setup-msys2 action to register the shell handler.
fix: |
  Add msys2/setup-msys2@v2 before any step that requires MSYS2 tools. The action
  installs MSYS2, updates the package database, installs requested packages, and adds
  the chosen environment (MINGW64, UCRT64, etc.) to PATH.
fix_code:
  - language: yaml
    label: "Install MSYS2 with MinGW64 toolchain via setup-msys2"
    code: |
      jobs:
        build:
          runs-on: windows-latest   # windows-2025
          steps:
            - uses: actions/checkout@v4
            - uses: msys2/setup-msys2@v2
              with:
                msystem: MINGW64
                update: true
                install: >-
                  mingw-w64-x86_64-gcc
                  mingw-w64-x86_64-make
            - name: Build with MinGW
              shell: msys2 {0}
              run: mingw32-make all
prevention:
  - "Never assume MSYS2 is pre-installed on windows-2025 or windows-latest."
  - "Use msys2/setup-msys2@v2 to explicitly install MSYS2 and the required packages."
  - "Audit the runner image README before migrating from windows-2022 to windows-2025."
  - "Test MSYS2-dependent steps on windows-2025 in a matrix before switching windows-latest."
docs:
  - url: "https://github.com/msys2/setup-msys2"
    label: "msys2/setup-msys2 — official MSYS2 setup action for GitHub Actions"
  - url: "https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md"
    label: "windows-2025 runner image README — installed software"
  - url: "https://github.com/actions/runner-images/releases"
    label: "runner-images release notes — windows-2025 changes"
