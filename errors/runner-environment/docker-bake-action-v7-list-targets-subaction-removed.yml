id: runner-environment-406
title: '`docker/bake-action` `list-targets` Subaction Removed in v7 — "Action not found" Error'
category: runner-environment
severity: error
tags:
  - docker
  - bake-action
  - docker-bake
  - action-upgrade
  - breaking-change
  - subaction
  - matrix
patterns:
  - regex: 'Unable to resolve action.*docker/bake-action/subaction/list-targets'
    flags: 'i'
  - regex: "Can't find.*list-targets.*bake-action|bake-action.*list-targets.*not found"
    flags: 'i'
  - regex: 'Error: docker/bake-action/subaction/list-targets@v7.*does not exist'
    flags: 'i'
  - regex: 'docker/bake-action.*list-targets.*deprecated|list-targets.*removed.*bake'
    flags: 'i'
error_messages:
  - "##[error]Unable to resolve action `docker/bake-action/subaction/list-targets@v7`, unable to find the action in the repository."
  - "Error: Cannot find Action 'docker/bake-action/subaction/list-targets'"
  - "Error: docker/bake-action/subaction/list-targets@v7 not found"
root_cause: |
  In `docker/bake-action@v7.0.0` (released March 5, 2026), the `list-targets` subaction
  (`docker/bake-action/subaction/list-targets`) was **permanently removed**. Workflows that
  use this subaction to enumerate Bake targets for a dynamic matrix will fail with
  "Action not found" when using v7 or any later version.

  The `list-targets` subaction was deprecated in favour of the **`matrix` subaction**
  (`docker/bake-action/subaction/matrix`), which was introduced as its replacement in an
  earlier version. The `matrix` subaction provides the same target enumeration functionality
  with a slightly different output format.

  Workflows that dynamically build a JSON list of Bake targets (e.g., for `fromJSON` in a
  matrix strategy) and that have been bumped to `docker/bake-action@v7` via Dependabot or
  Renovate will break immediately.

  Source: docker/bake-action v7.0.0 release notes
  https://github.com/docker/bake-action/releases/tag/v7.0.0
fix: |
  Replace `docker/bake-action/subaction/list-targets` with
  `docker/bake-action/subaction/matrix` in all workflow files.

  The `matrix` subaction produces the same array of bake target names. The step's `targets`
  output is a JSON array string such as `["app","worker","nginx"]`, usable directly with
  `fromJSON` in a matrix strategy.

  **Before (deprecated):**
  ```yaml
  - id: list
    uses: docker/bake-action/subaction/list-targets@v6
    with:
      target: default
  - name: Build
    strategy:
      matrix:
        target: ${{ fromJSON(steps.list.outputs.targets) }}
  ```

  **After (v7+):**
  ```yaml
  - id: targets
    uses: docker/bake-action/subaction/matrix@v7
    with:
      target: default
  - name: Build
    strategy:
      matrix:
        target: ${{ fromJSON(steps.targets.outputs.matrix) }}  # note: output key is 'matrix'
  ```
fix_code:
  - language: yaml
    label: "Replace list-targets with matrix subaction for docker/bake-action@v7"
    code: |
      jobs:
        # Step 1: enumerate bake targets
        list:
          runs-on: ubuntu-latest
          outputs:
            matrix: ${{ steps.targets.outputs.matrix }}
          steps:
            - uses: actions/checkout@v4

            # WRONG — list-targets was removed in v7
            # - id: targets
            #   uses: docker/bake-action/subaction/list-targets@v7

            # CORRECT — use matrix subaction instead
            - id: targets
              uses: docker/bake-action/subaction/matrix@v7
              with:
                target: default   # bake target group to enumerate

        # Step 2: build each target in parallel using the matrix
        build:
          needs: list
          runs-on: ubuntu-latest
          strategy:
            matrix:
              target: ${{ fromJSON(needs.list.outputs.matrix) }}
          steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/bake-action@v7
              with:
                targets: ${{ matrix.target }}
                push: true

  - language: yaml
    label: "Pin to v6 if immediate migration to matrix subaction is not feasible"
    code: |
      jobs:
        list:
          runs-on: ubuntu-latest
          outputs:
            targets: ${{ steps.list.outputs.targets }}
          steps:
            - uses: actions/checkout@v4

            # Pin to last v6 release while preparing migration
            - id: list
              uses: docker/bake-action/subaction/list-targets@v6.10.0
prevention:
  - "When Dependabot or Renovate bumps docker/bake-action to v7+, search all workflows for `bake-action/subaction/list-targets` and replace with `bake-action/subaction/matrix`."
  - "Note that the matrix subaction output key changed from `targets` (list-targets) to `matrix` (matrix subaction) — update any `fromJSON(steps.x.outputs.targets)` references accordingly."
  - "Review the full v7 release notes before merging Dependabot PRs for docker/bake-action — multiple breaking changes were introduced simultaneously."
  - "Add actionlint or a custom check to detect uses of the removed list-targets subaction path."
docs:
  - url: "https://github.com/docker/bake-action/releases/tag/v7.0.0"
    label: "docker/bake-action v7.0.0 release notes (full breaking changes)"
  - url: "https://github.com/docker/bake-action/pull/370"
    label: "PR #370: Remove deprecated list-targets subaction"
  - url: "https://github.com/docker/bake-action/tree/master/subaction/matrix"
    label: "docker/bake-action matrix subaction (replacement for list-targets)"
