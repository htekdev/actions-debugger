    label: 'runner-images #13474 — Docker 29.1.5 upgrade announcement (42 reactions, 63 comments)'
  - url: 'https://github.com/actions/runner-images/issues/14105'
    label: 'runner-images #14105 — Ubuntu 24.04 Docker v29 rollback and re-deployment tracking'
  - url: 'https://docs.podman.io/en/latest/markdown/podman-system-service.1.html'
    label: 'Podman docs — podman system service (socket emulation mode)'
  - url: 'https://docs.docker.com/engine/release-notes/29.0/'
    label: 'Docker Engine 29.0 release notes — API version minimum raised to 1.44'
