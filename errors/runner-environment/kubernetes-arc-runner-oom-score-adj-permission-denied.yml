    label: 'actions/runner PR#4478: Allow skipping oom_score_adj write via ACTIONS_RUNNER_DISABLE_OOM_SCORE_ADJ env var (v2.335.x)'
  - url: 'https://github.com/actions/actions-runner-controller/issues/3132'
    label: 'actions-runner-controller#3132: Related ARC oom_score_adj issue'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners'
    label: 'GitHub Docs: About self-hosted runners'
