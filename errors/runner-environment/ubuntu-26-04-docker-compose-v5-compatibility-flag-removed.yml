id: runner-environment-455
title: 'ubuntu-26.04 Ships Docker Compose v5.1.3 — --compatibility Flag Removed and docker-compose Binary Absent'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - docker-compose
  - docker-compose-v5
  - compatibility-flag
  - runner-image
  - breaking-change
  - migration
patterns:
  - regex: 'unknown flag:?\s+--compatibility'
    flags: 'i'
  - regex: 'docker-compose:\s+(command not found|not found)'
    flags: 'i'
  - regex: 'flag\s+provided\s+but\s+not\s+defined:\s+--compatibility'
    flags: 'i'
  - regex: 'Error response from daemon.*docker-compose.*unknown.*flag'
    flags: 'i'
error_messages:
  - 'unknown flag: --compatibility'
  - 'flag provided but not defined: --compatibility'
  - 'docker-compose: command not found'
  - 'unknown shorthand flag: ''c'' in -c'
root_cause: |
  The ubuntu-26.04 runner image ships **Docker Compose v5.1.3** (up from v2.38.2 on
  ubuntu-24.04). This is a major version jump with several breaking changes:

  **1. `--compatibility` flag is removed**
  Docker Compose v2.24.0 (December 2023) removed the `--compatibility` flag, which was
  used to run Compose v1 configurations in a backward-compatibility mode. Docker Compose
  v5 fully removes it. Any CI command like `docker compose --compatibility up -d` will
  fail with `unknown flag: --compatibility`.

  **2. `docker-compose` (hyphenated) binary absent**
  On ubuntu-24.04, a shim at `/usr/local/bin/docker-compose` forwarded v1-style calls
  to the v2 Compose plugin. On ubuntu-26.04 with Docker Compose v5, this compatibility
  shim is not installed. Scripts invoking `docker-compose up` (with a hyphen) instead
  of `docker compose up` (plugin form) will get `command not found`.

  **3. `version` top-level key is fully ignored (no warning)**
  Docker Compose v5 silently ignores the `version:` field in docker-compose.yml files
  (e.g., `version: "3.9"`). This is a silent change — the key is dropped with no error
  or warning message. Workflows relying on version-specific behavior may break silently.

  The ubuntu-26.04 announcement (runner-images#14226, June 11, 2026) lists:
  > docker compose | 2.38.2 (ubuntu-24.04) → 5.1.3 (ubuntu-26.04)
fix: |
  Remove `--compatibility` from all `docker compose` invocations. Replace
  `docker-compose` (hyphenated) with `docker compose` (space-separated):

  ```yaml
  # Before (breaks on ubuntu-26.04)
  - run: docker-compose --compatibility up -d

  # After
  - run: docker compose up -d
  ```

  To validate your compose file without starting services, use:

  ```yaml
  - run: docker compose config --quiet
  ```

  If you need the `--compatibility` flag (deploying swarm configs via Compose), pin
  to `ubuntu-24.04` and install docker-compose v2.x explicitly:

  ```yaml
  - name: Pin Docker Compose v2 for compatibility
    run: |
      sudo curl -L "https://github.com/docker/compose/releases/download/v2.38.2/docker-compose-linux-x86_64" \
        -o /usr/local/bin/docker-compose
      sudo chmod +x /usr/local/bin/docker-compose
  ```
fix_code:
  - language: yaml
    label: 'Replace docker-compose (v1 style) with docker compose (v5 plugin form)'
    code: |
      steps:
        - name: Start services
          # Use "docker compose" (space) not "docker-compose" (hyphen) on ubuntu-26.04
          run: docker compose up -d

        - name: Run tests against services
          run: docker compose exec app npm test

        - name: Stop services
          if: always()
          run: docker compose down --volumes
  - language: yaml
    label: 'Remove --compatibility flag and pin to ubuntu-24.04 if swarm/compatibility mode required'
    code: |
      jobs:
        compose-job:
          # Pin to ubuntu-24.04 until --compatibility use case is migrated
          # docker-compose v5 on ubuntu-26.04 removes --compatibility entirely
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - name: Deploy stack
              # Remove --compatibility once Compose file is updated to current spec
              run: docker compose up -d
prevention:
  - 'Always use `docker compose` (space, plugin form) instead of `docker-compose` (hyphen, v1 form).'
  - 'Remove the `--compatibility` flag from all compose invocations — it has been deprecated since v2.24 and is removed in v5.'
  - 'Remove or ignore the `version:` top-level key in docker-compose.yml files; v5 silently ignores it.'
  - 'Run `docker compose config` in CI to validate your compose file before running services.'
  - 'Test your compose setup on ubuntu-26.04 before migrating from ubuntu-24.04.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226 — Ubuntu 26.04 public preview announcement (June 11, 2026)'
  - url: 'https://docs.docker.com/compose/releases/migrate/'
    label: 'Docker Compose — Migrate to Compose v5 guide'
  - url: 'https://docs.docker.com/compose/releases/release-notes/'
    label: 'Docker Compose release notes — v5.x changelog'
