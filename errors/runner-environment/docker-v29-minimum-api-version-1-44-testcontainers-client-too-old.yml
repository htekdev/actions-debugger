    label: 'Stack Overflow (91 votes, Nov 2025) — Sudden Docker error: client version too old, minimum supported API version is 1.44'
  - url: 'https://github.com/testcontainers/testcontainers-java/issues/11212'
    label: 'testcontainers-java#11212 — Docker 29 raises minimum API version to 1.44 (fix in 1.21.4 / 2.0.2)'
  - url: 'https://www.docker.com/blog/docker-engine-version-29/'
    label: 'Docker Engine v29 release blog — breaking change: minimum API version raised to v1.44'
  - url: 'https://github.com/moby/moby/releases/tag/docker-v29.0.0'
    label: 'moby/moby v29.0.0 release notes — minimum supported API version v1.44'
