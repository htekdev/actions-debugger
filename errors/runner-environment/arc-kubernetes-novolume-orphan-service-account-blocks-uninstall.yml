id: runner-environment-292
title: 'ARC kubernetes-novolume Mode Orphan No-Permission ServiceAccount Blocks helm uninstall (pre-v0.14.2)'
category: runner-environment
severity: error
tags:
  - arc
  - actions-runner-controller
  - kubernetes
  - helm
  - kubernetes-novolume
  - service-account
  - finalizer
  - helm-uninstall
  - argo-cd
patterns:
  - regex: 'no-permission.*ServiceAccount.*finalizer|cleanup-protection.*finalizer.*stuck'
    flags: 'i'
  - regex: 'gha-rs-no-permission.*finalizer|actions\.github\.com\/cleanup-protection.*ServiceAccount'
    flags: 'i'
  - regex: 'helm.*uninstall.*hang|helm.*delete.*stuck.*ServiceAccount'
    flags: 'i'
error_messages:
  - "Error: deletion of namespace blocked by finalizer on ServiceAccount: actions.github.com/cleanup-protection"
  - "helm uninstall hangs indefinitely — ServiceAccount <release>-gha-rs-no-permission retains finalizer"
  - "argocd app delete stuck: ServiceAccount with finalizer actions.github.com/cleanup-protection not removed"
root_cause: |
  When ARC gha-runner-scale-set is deployed with `containerMode.type: kubernetes-novolume`,
  the Helm chart (v0.14.0 / v0.14.1) renders a `<release>-gha-rs-no-permission`
  ServiceAccount that the runner pods **do not use** in this mode (they use the
  `kube-mode` ServiceAccount instead).

  The orphan ServiceAccount is created with the `actions.github.com/cleanup-protection`
  finalizer. The finalizer is intended to be removed by the controller's
  `autoscalingRunnerSetFinalizerDependencyCleaner.removeNoPermissionServiceAccountFinalizer`
  function — but this function only runs when the AutoscalingRunnerSet has a
  `cleanup-no-permission-service-account-name` annotation. In `kubernetes-novolume`
  mode this annotation is never set, so the function skips the cleanup entirely.

  On `helm uninstall` (or ArgoCD app deletion):
  1. Helm deletes all chart resources
  2. The `gha-rs-no-permission` ServiceAccount enters deletion
  3. Its `actions.github.com/cleanup-protection` finalizer blocks actual removal
  4. The controller reconciler never removes the finalizer (annotation absent)
  5. `helm uninstall` reports success but the ServiceAccount remains forever
  6. If the namespace is then deleted, it hangs indefinitely on the stuck SA

  Fixed in ARC v0.14.2 by adding `kubernetes-novolume` to the exclusion condition
  in the chart template:

  ```diff
  -{{- if and (ne $containerMode.type "kubernetes") (not .Values.template.spec.serviceAccountName) }}
  +{{- if and (ne $containerMode.type "kubernetes") (ne $containerMode.type "kubernetes-novolume") (not .Values.template.spec.serviceAccountName) }}
  ```

  Source: actions/actions-runner-controller#4455, PR#4455 (April 16, 2026),
  released in ARC v0.14.2 (May 22, 2026).
fix: |
  **Immediate fix (pre-v0.14.2): Manually remove the finalizer**

  Find and patch the orphan ServiceAccount to remove the blocking finalizer:

  ```bash
  NAMESPACE=<runner-namespace>
  RELEASE=<helm-release-name>

  # Identify the stuck ServiceAccount
  kubectl get serviceaccount -n ${NAMESPACE} | grep no-permission

  # Remove the finalizer so the SA can be deleted
  kubectl patch serviceaccount ${RELEASE}-gha-rs-no-permission \
    -n ${NAMESPACE} \
    --type=json \
    -p '[{"op":"remove","path":"/metadata/finalizers"}]'

  # Verify deletion completes
  kubectl get serviceaccount -n ${NAMESPACE} | grep no-permission
  ```

  **If the namespace itself is stuck:**

  ```bash
  # Get the namespace JSON and remove the finalizer
  kubectl get namespace ${NAMESPACE} -o json | \
    jq '.spec.finalizers = []' | \
    kubectl replace --raw "/api/v1/namespaces/${NAMESPACE}/finalize" -f -
  ```

  **Permanent fix: Upgrade to ARC v0.14.2+**

  The chart template is fixed in v0.14.2 to not render the no-permission
  ServiceAccount in kubernetes-novolume mode at all.
fix_code:
  - language: yaml
    label: 'Upgrade ARC Helm chart to v0.14.2+ (permanent fix)'
    code: |
      # Upgrade gha-runner-scale-set to v0.14.2
      helm upgrade <release> \
        oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
        --version 0.14.2 \
        --namespace <runner-namespace> \
        -f runner_scale_set_values.yaml
  - language: yaml
    label: 'Manual: remove cleanup-protection finalizer from orphan ServiceAccount'
    code: |
      # Find the orphan ServiceAccount
      kubectl get serviceaccount -n <runner-namespace> | grep no-permission
      # Output: <release>-gha-rs-no-permission

      # Patch to remove finalizer
      kubectl patch serviceaccount <release>-gha-rs-no-permission \
        -n <runner-namespace> \
        --type=json \
        -p '[{"op":"remove","path":"/metadata/finalizers"}]'
prevention:
  - "Use ARC v0.14.2+ for all kubernetes-novolume deployments to avoid the orphan ServiceAccount"
  - "Before running helm uninstall on ARC in kubernetes-novolume mode on v0.14.0/v0.14.1, check for and remove orphan no-permission ServiceAccounts"
  - "When deploying via ArgoCD or Flux, set cascadeDeletion: true and verify finalizers are not blocking deletion after app sync"
  - "After helm install in kubernetes-novolume mode, verify the no-permission ServiceAccount does NOT exist (it should not in v0.14.2+)"
docs:
  - url: 'https://github.com/actions/actions-runner-controller/pull/4455'
    label: 'ARC PR#4455 — Fix orphan no-permission ServiceAccount in kubernetes-novolume mode'
  - url: 'https://github.com/actions/actions-runner-controller/releases/tag/gha-runner-scale-set-0.14.2'
    label: 'ARC v0.14.2 Release Notes (includes this fix)'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller/deploying-runner-scale-sets-with-actions-runner-controller'
    label: 'ARC Deploying Runner Scale Sets Docs'
