id: runner-environment-378
title: 'Rust 1.96.0 / Cargo 1.96: RUSTFLAGS=-Awarnings No Longer Hides #[deny(...)] Lints'
category: runner-environment
severity: error
tags:
  - rust
  - cargo
  - rustflags
  - linting
  - deny
  - unexpected-cfgs
  - runner-update
patterns:
  - regex: 'error\[E[0-9]+\].*\n.*=.*note.*`#\[deny'
    flags: 'im'
  - regex: 'error: deny\(([^)]+)\) active'
    flags: 'i'
  - regex: 'RUSTFLAGS.*-A warnings.*error\['
    flags: 'is'
  - regex: 'error\[E0[0-9]+\].*unexpected `cfg` condition'
    flags: 'i'
error_messages:
  - 'error[E0...]: ...'
  - 'note: `#[deny(unexpected_cfgs)]` on by default'
  - 'error: deny(unexpected_cfgs) active'
  - 'the lint level is defined here'
root_cause: |
  Cargo 1.96.0 (shipping with Rust 1.96.0, released 2026-05-28 and deployed to runner images
  in the June 2026 image update) fixed a bug where `build.warnings = "allow"` (or the
  environment-variable equivalent `RUSTFLAGS=-Awarnings`) would incorrectly suppress ALL
  diagnostics, including ones explicitly denied with `#[deny(...)]` or `cargo::rustc-check-cfg`
  in `build.rs`.

  **Before Cargo 1.96**: `RUSTFLAGS=-Awarnings` silenced every warning-level lint, but also
  inadvertently silenced `deny`-level lints, masking real errors.

  **After Cargo 1.96**: `RUSTFLAGS=-Awarnings` only allows (silences) warn-level lints.
  `deny`-level lints (e.g., `unexpected_cfgs` which Cargo enables as `deny` by default since
  1.80) propagate as hard errors even when `-Awarnings` is set.

  A very common CI pattern is:
  ```
  env:
    RUSTFLAGS: "-Awarnings"   # suppress warning noise in CI
  ```
  After Cargo 1.96, if the codebase has any `#[cfg(foo)]` where `foo` is not declared via
  `cargo::rustc-check-cfg`, or any other explicitly denied lint, the build will now fail
  where it previously succeeded.

  The fix was merged in rust-lang/cargo#16824 (merged April 2026, shipped in Cargo 1.96.0).
  Runner images updated Rust from 1.95.0 to 1.96.0 starting with:
  - ubuntu-24.04 ≥ 20260607.184.1
  - windows-2025 ≥ 20260607.161.1

  This is not a regression in user code; it reveals pre-existing lint violations that were
  previously masked. The fix is to either declare the cfgs properly or suppress only the
  specific lints you intend to silence.
fix: |
  **Option A (correct): Declare your `cfg` conditions explicitly in `build.rs`.**

  Instead of relying on `-Awarnings` to hide `unexpected_cfgs`, use `cargo::rustc-check-cfg`
  in your `build.rs` to declare valid cfg conditions:

  ```rust
  // build.rs
  fn main() {
      println!("cargo::rustc-check-cfg=cfg(foo, values(\"bar\", \"baz\"))");
  }
  ```

  **Option B: Suppress only the specific deny-level lint in code.**
  Add `#[allow(unexpected_cfgs)]` to the specific location, or add it at the crate root
  if it's widespread.

  **Option C: Use `-Awarnings -Aunexpected-cfgs` together in RUSTFLAGS.**
  If you want to suppress unexpected_cfgs specifically (not recommended for new code):
  ```
  RUSTFLAGS: "-Awarnings -Aunexpected-cfgs"
  ```

  **Option D: Pin Rust to 1.95.0 temporarily** while addressing the underlying lint issues.
fix_code:
  - language: yaml
    label: 'Declare cfg conditions in build.rs to fix unexpected_cfgs'
    code: |
      # build.rs
      fn main() {
          // Declare all cfg flags your crate uses
          println!("cargo::rustc-check-cfg=cfg(foo)");
          println!("cargo::rustc-check-cfg=cfg(feature, values(\"my_feature\"))");
      }
  - language: yaml
    label: 'Workflow YAML: suppress only unexpected_cfgs if you need a quick fix'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          env:
            # RUSTFLAGS: "-Awarnings"     # ❌ No longer hides deny-level lints on Cargo 1.96+
            RUSTFLAGS: "-Awarnings -Aunexpected-cfgs"  # ✅ Explicit: suppress warnings + unexpected_cfgs
          steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo test --all-features
  - language: yaml
    label: 'Pin Rust toolchain to 1.95 temporarily while fixing lint violations'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: 1.95.0  # Pin until unexpected_cfgs violations are fixed
            - run: cargo test --all-features
prevention:
  - 'Always declare cfg conditions via `cargo::rustc-check-cfg` in `build.rs` for every custom `#[cfg(...)]` you use'
  - 'Do not rely on RUSTFLAGS=-Awarnings to hide deny-level lints; treat them as errors'
  - 'Run `cargo check` with a nightly toolchain in CI to catch new lints before they become stable denies'
  - 'Subscribe to Rust release notes — lint level promotions are documented in each release'
docs:
  - url: 'https://github.com/rust-lang/cargo/pull/16824'
    label: 'Cargo PR #16824: fix(compile): build.warnings=allow should not hide denied diagnostics'
  - url: 'https://doc.rust-lang.org/cargo/reference/build-scripts.html#rustc-check-cfg'
    label: 'Cargo Book: rustc-check-cfg — how to declare valid cfg conditions'
  - url: 'https://blog.rust-lang.org/2024/05/06/check-cfg.html'
    label: 'Rust Blog: Checking conditional compilation at compile time (check-cfg)'
