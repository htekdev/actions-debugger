id: runner-environment-383
title: 'Rust 1.96.0 / Cargo 1.96: RUSTFLAGS=-Awarnings No Longer Hides #[deny(...)] Lints'
category: runner-environment
severity: error
tags:
  - rust
  - cargo
  - rustflags
  - linting
  - deny
  - unexpected-cfgs
  - runner-update
patterns:
  - regex: 'error: deny\(([^)]+)\) active'
    flags: 'i'
  - regex: 'note: `#\[deny\(unexpected_cfgs\)\]`'
    flags: 'i'
  - regex: 'error\[E[0-9]+\].*unexpected `cfg` condition'
    flags: 'i'
  - regex: 'unexpected `cfg` condition name: `[^`]+`'
    flags: 'i'
error_messages:
  - 'note: `#[deny(unexpected_cfgs)]` on by default'
  - 'error: deny(unexpected_cfgs) active'
  - 'unexpected `cfg` condition name: `foo`'
  - 'the lint level is defined here'
root_cause: |
  Cargo 1.96.0 (shipping with Rust 1.96.0, released 2026-05-28 and deployed to runner images
  in the June 2026 image updates) fixed a bug where `build.warnings = "allow"` (or the
  equivalent environment variable `RUSTFLAGS=-Awarnings`) would incorrectly suppress ALL
  diagnostics, including ones explicitly denied with `#[deny(...)]`.

  Before Cargo 1.96: `RUSTFLAGS=-Awarnings` silenced warning-level lints but also
  inadvertently silenced `deny`-level lints, masking real errors.

  After Cargo 1.96: `RUSTFLAGS=-Awarnings` only silences warn-level lints. Deny-level
  lints (such as `unexpected_cfgs`, which Cargo enables as `deny` by default since 1.80)
  propagate as hard errors even when `-Awarnings` is set.

  A very common CI pattern is:
    env:
      RUSTFLAGS: "-Awarnings"   # suppress warning noise in CI

  After Cargo 1.96, if the codebase has any `#[cfg(foo)]` where `foo` is not declared via
  `cargo::rustc-check-cfg`, or any other explicitly denied lint, the build will now fail
  where it previously succeeded silently.

  The fix was merged in rust-lang/cargo#16824 (merged April 2026, milestone: 1.96.0).
  Runner images updated Rust from 1.95.0 to 1.96.0 starting with:
  - ubuntu-24.04 >= 20260607.184.1
  - windows-2025 >= 20260607.161.1

  This is not a regression in user code — it reveals pre-existing lint violations that were
  previously masked by the `-Awarnings` workaround.
fix: |
  **Option A (correct): Declare cfg conditions explicitly in build.rs.**

  Use `cargo::rustc-check-cfg` to declare every custom `#[cfg(foo)]` condition so Cargo
  knows they are valid and stops emitting `unexpected_cfgs` errors:

    // build.rs
    fn main() {
        println!("cargo::rustc-check-cfg=cfg(foo)");
    }

  **Option B: Suppress the specific deny-level lint explicitly.**
  If you intentionally use undeclared cfgs, suppress only that lint:
    RUSTFLAGS: "-Awarnings -Aunexpected-cfgs"

  **Option C: Add `#[allow(unexpected_cfgs)]` at the crate root** if the cfgs are
  intentional and widespread.

  **Option D: Pin Rust to 1.95.0** temporarily while fixing underlying lint violations.
fix_code:
  - language: yaml
    label: 'Declare cfg conditions in build.rs to fix unexpected_cfgs errors'
    code: |
      # build.rs — declare all cfg flags your crate uses
      fn main() {
          // Tell Cargo these are valid cfg conditions
          println!("cargo::rustc-check-cfg=cfg(foo)");
          println!("cargo::rustc-check-cfg=cfg(feature, values(\"my_feature\"))");
      }
  - language: yaml
    label: 'Workflow YAML: explicitly suppress unexpected_cfgs if intentional'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          env:
            # RUSTFLAGS: "-Awarnings"     # No longer hides deny-level lints on Cargo 1.96+
            RUSTFLAGS: "-Awarnings -Aunexpected-cfgs"  # Suppress warnings + specific denied lint
          steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - run: cargo test --all-features
  - language: yaml
    label: 'Temporary toolchain pin to 1.95 while fixing lint violations'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: 1.95.0  # Temporary pin until unexpected_cfgs violations are fixed
            - run: cargo test --all-features
prevention:
  - 'Declare cfg conditions via `cargo::rustc-check-cfg` in build.rs for every custom `#[cfg(...)]`'
  - 'Do not rely on RUSTFLAGS=-Awarnings to hide deny-level lints; fix them properly'
  - 'Run `cargo check` with a nightly toolchain in a separate CI job to catch new lints early'
  - 'Review Rust release notes for lint level promotions in each stable release'
docs:
  - url: 'https://github.com/rust-lang/cargo/pull/16824'
    label: 'Cargo PR #16824: fix(compile): build.warnings=allow should not hide denied diagnostics'
  - url: 'https://doc.rust-lang.org/cargo/reference/build-scripts.html#rustc-check-cfg'
    label: 'Cargo Book: rustc-check-cfg — declaring valid cfg conditions'
  - url: 'https://blog.rust-lang.org/2024/05/06/check-cfg.html'
    label: 'Rust Blog: Checking conditional compilation at compile time (check-cfg)'
