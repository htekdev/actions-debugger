id: runner-environment-461
title: 'Ubuntu 26.04 Ruby Toolcache Only Contains 3.3 — setup-ruby Downloads 3.2/3.4/4.0 from Web'
category: runner-environment
severity: warning
tags:
  - ubuntu-26.04
  - ruby
  - toolcache
  - setup-ruby
  - runner-image
  - slow-ci
  - cache-miss
patterns:
  - regex: 'Downloading Ruby [34]\.[024]\.[0-9]+ - ubuntu-26|ruby [34]\.[024].*not.*found.*toolcache'
    flags: 'i'
  - regex: 'Install Ruby [34]\.[024]\.[0-9]+.*downloading|ruby.*version.*[34]\.[024].*not.*preinstalled'
    flags: 'i'
error_messages:
  - "Downloading Ruby 3.2.x from https://github.com/ruby/ruby-builder/releases/..."
  - "Downloading Ruby 4.0.x"
  - "Ruby 3.2 not found in toolcache"
  - "No pre-built Ruby 3.4.x found; building from source may take several minutes"
root_cause: |
  Ubuntu 26.04 runner images at public preview launch (June 11, 2026) only
  pre-cache Ruby 3.3.x in the toolcache. The following Ruby versions are NOT
  pre-cached and require a live download at runtime:
    - Ruby 3.2.x
    - Ruby 3.4.x
    - Ruby 4.0.x

  By contrast, ubuntu-24.04 pre-caches Ruby 3.2.x (default), 3.3.x, 3.4.x,
  and 4.0.x. Workflows that pin `ruby-version: '3.2'` (or 3.4 / 4.0) via
  `ruby/setup-ruby` on ubuntu-26.04 will trigger a live download on every job
  run, adding 2-5 minutes to CI time and creating a dependency on external
  network availability.

  The download itself generally succeeds, but will:
  - Slow every CI run until the version is toolcache-cached across workers
  - Fail during ruby.org or GitHub release server disruptions
  - Increase CI costs proportional to download time on paid runners

  Source: actions/runner-images#14226 (Ubuntu 26.04 public preview announcement,
  June 11, 2026) — Ruby toolcache row shows only "3.3.* (default)" for ubuntu-26.04.
fix: |
  Pin `ruby-version: '3.3'` (the only pre-cached version on ubuntu-26.04) to
  avoid download overhead. If you require an older or newer version, use
  `ruby/setup-ruby` with caching options and accept the download on first run.
fix_code:
  - language: yaml
    label: 'Pin Ruby 3.3 — pre-cached on ubuntu-26.04 (fastest)'
    code: |
      jobs:
        test:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4

            # Ruby 3.3 is the only pre-cached version on ubuntu-26.04
            # 3.2/3.4/4.0 require a live download (~2-5 minutes extra)
            - uses: ruby/setup-ruby@v1
              with:
                ruby-version: '3.3'
                bundler-cache: true   # caches gems in vendor/bundle

            - run: bundle exec rspec

  - language: yaml
    label: 'Accept download for non-3.3 versions (with gem caching)'
    code: |
      jobs:
        test:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4

            # 3.2 / 3.4 / 4.0 not pre-cached on ubuntu-26.04; download occurs once
            # bundler-cache: true caches gems to reduce total overhead
            - uses: ruby/setup-ruby@v1
              with:
                ruby-version: '3.2'
                bundler-cache: true

            - run: bundle exec rspec

prevention:
  - 'On ubuntu-26.04, pin `ruby-version: ''3.3''` to use the pre-cached toolchain — other versions require a live download at job start.'
  - 'Monitor actions/runner-images announcements for updates to the ubuntu-26.04 Ruby toolcache — additional versions are added as the image matures beyond public preview.'
  - 'Use `ruby/setup-ruby` with `bundler-cache: true` to cache gem dependencies regardless of Ruby version, reducing overall CI time.'
  - 'If your project requires a specific Ruby version not cached on ubuntu-26.04, consider staying on ubuntu-24.04 until the toolcache is populated.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226: Ubuntu 26.04 public preview — Ruby toolcache differences table'
  - url: 'https://github.com/ruby/setup-ruby'
    label: 'ruby/setup-ruby — Ruby version management in GitHub Actions'
