id: runner-environment-345
title: 'setup-python: Older Python Versions Not in arm64 Toolcache on ubuntu-24.04-arm Runner'
category: runner-environment
severity: error
tags:
  - setup-python
  - arm64
  - ubuntu-24.04-arm
  - toolcache
  - architecture
  - python-version
  - runner-image
patterns:
  - regex: 'Version \d+\.\d+[\.\d]* with arch arm64 was not found in the local cache'
    flags: 'i'
  - regex: 'The version ''\d+\.\d+[\.\d]*'' with architecture ''arm64'' was not found'
    flags: 'i'
  - regex: 'setup-python.*arm64.*not found|arm64.*setup-python.*not.*found'
    flags: 'i'
  - regex: 'No toolcache found for Python.*arm64'
    flags: 'i'
error_messages:
  - "Version 3.8 with arch arm64 was not found in the local cache or online."
  - "The version '3.9' with architecture 'arm64' was not found for Ubuntu 24.04"
  - "Error: Version 3.8.20 with arch arm64 was not found in the local cache"
  - "No toolcache found for Python 3.8. Trying to find it in hostedtoolcache releases..."
root_cause: |
  GitHub-hosted `ubuntu-24.04-arm` and `ubuntu-22.04-arm` runners run on arm64 (aarch64)
  hardware. The `actions/setup-python` action resolves Python versions from the runner's
  pre-installed toolcache and falls back to downloading from the `hostedtoolcache` release
  manifest.

  Older Python versions (especially 3.8 and some 3.9.x patch releases) were not included in
  the initial arm64 toolcache manifest when arm64 standard runners became GA in January 2026.
  The toolcache only contains arm64 builds for Python 3.10, 3.11, 3.12, and 3.13. Requesting
  Python 3.8 (EOL October 2024) on arm64 produces a "not found" error because:

  1. Python 3.8 is not pre-installed on arm64 runner images.
  2. The hosted toolcache manifest (`python-versions.json`) does not include arm64 builds for
     Python 3.8 — no pre-built aarch64 binary is available to download.
  3. The action does not fall back to building from source; it fails with a version-not-found
     error.

  Users migrating x86-64 workflows to arm64 runners by changing `runs-on` often hit this
  when their workflow pins Python 3.8 or early 3.9 patch versions.
  Tracked in actions/setup-python#705 and #1187.
fix: |
  **Option 1 (recommended)**: Upgrade to a Python version with arm64 support (3.10, 3.11, 3.12,
  or 3.13). Python 3.8 is end-of-life; migrating to 3.11 or 3.12 is the best long-term fix.

  **Option 2**: Use the `pyenv`-based workaround to build Python from source if 3.8 is
  absolutely required. Install pyenv in a pre-step and bypass setup-python.

  **Option 3**: Run the job on `ubuntu-24.04` (x86-64) for the Python 3.8 steps and use arm64
  runners only for steps that benefit from native arm64 execution.
fix_code:
  - language: yaml
    label: 'Upgrade pinned Python version to one supported on arm64 toolcache'
    code: |
      jobs:
        test:
          runs-on: ubuntu-24.04-arm   # arm64 runner
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'   # ✅ available in arm64 toolcache
                # python-version: '3.8' ❌ not in arm64 toolcache
  - language: yaml
    label: 'Use matrix to run arm64 on supported versions only'
    code: |
      jobs:
        test:
          strategy:
            matrix:
              include:
                - runs-on: ubuntu-24.04
                  python-version: '3.8'   # x86-64 for legacy Python
                - runs-on: ubuntu-24.04-arm
                  python-version: '3.12'  # arm64 for modern Python
          runs-on: ${{ matrix.runs-on }}
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
  - language: yaml
    label: 'Build Python from source via pyenv for unsupported versions on arm64'
    code: |
      jobs:
        test:
          runs-on: ubuntu-24.04-arm
          steps:
            - uses: actions/checkout@v4
            - name: Install Python 3.8 via pyenv (arm64 workaround)
              run: |
                curl https://pyenv.run | bash
                export PATH="$HOME/.pyenv/bin:$PATH"
                eval "$(pyenv init -)"
                pyenv install 3.8.20
                pyenv global 3.8.20
                python --version
prevention:
  - 'Before migrating a workflow to `ubuntu-24.04-arm`, verify that the pinned Python version is available in the arm64 toolcache (3.10+).'
  - 'Avoid pinning EOL Python versions (3.8, 3.9) in new workflows — they have incomplete toolcache coverage on arm64.'
  - 'Use `python-version: "3.x"` (latest 3.x) or `python-version: "3.12"` instead of pinning to EOL patch versions.'
  - 'Check the actions/setup-python toolcache manifest for arm64 availability before changing `runs-on` to an arm64 runner.'
docs:
  - url: 'https://github.com/actions/setup-python/issues/705'
    label: 'actions/setup-python#705 — setup-python does not work with ARC runners on arm64'
  - url: 'https://github.com/actions/setup-python/issues/1187'
    label: 'actions/setup-python#1187 — win32-arm64 missing toolcache and permissions errors'
  - url: 'https://github.blog/changelog/2026-01-29-arm64-standard-runners-are-now-available-in-private-repositories'
    label: 'GitHub Changelog: arm64 standard runners GA — January 2026'
  - url: 'https://github.com/actions/python-versions'
    label: 'actions/python-versions — Python toolcache builds (check arm64 availability)'
