id: runner-environment-158
title: 'actions/setup-java@v4 requires distribution input — no longer defaults to zulu'
category: runner-environment
severity: error
tags:
  - setup-java
  - distribution
  - zulu
  - temurin
  - breaking-change
  - v4
patterns:
  - regex: "The `distribution` input is required"
    flags: 'i'
  - regex: 'distribution.*input.*required'
    flags: 'i'
error_messages:
  - "The `distribution` input is required for actions/setup-java@v4"
  - "Error: The `distribution` input is required"
  - "Input required and not supplied: distribution"
root_cause: |
  In actions/setup-java@v3 and earlier, the distribution input defaulted to
  zulu (Azul Zulu JDK). This default was removed in setup-java@v4 to encourage
  developers to make an explicit, informed choice about their JDK distribution.
  Workflows that upgrade the action reference from @v3 to @v4 without adding a
  distribution field immediately fail at the action's input validation step with
  a hard error (exit code 1). The error occurs before any Java toolchain setup
  begins, making it easy to diagnose but blocking all Java workflows on the
  upgrade. Supported distributions include: temurin, zulu, adopt, liberica,
  microsoft, corretto, semeru, oracle, and dragonwell.
fix: |
  Add distribution: temurin to the setup-java step. Eclipse Temurin (formerly
  AdoptOpenJDK) is the community-recommended open-source default and is
  pre-installed on GitHub-hosted runners. If your team has a specific JDK
  vendor requirement, choose the appropriate distribution value.
fix_code:
  - language: yaml
    label: 'Add required distribution input (temurin recommended)'
    code: |
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # Required in v4; temurin is the open-source default
          java-version: '21'
  - language: yaml
    label: 'Matrix across multiple distributions'
    code: |
      strategy:
        matrix:
          distribution: [temurin, zulu]
          java-version: [17, 21]
      steps:
        - uses: actions/setup-java@v4
          with:
            distribution: ${{ matrix.distribution }}
            java-version: ${{ matrix.java-version }}
prevention:
  - 'Always specify distribution when using setup-java@v4 or later'
  - 'Use Dependabot version updates to pin major action versions and review changelogs before bumping'
  - 'Run actionlint to catch missing required inputs before pushing to remote'
docs:
  - url: 'https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md'
    label: 'actions/setup-java advanced usage — supported distributions'
  - url: 'https://github.com/actions/setup-java/releases/tag/v4.0.0'
    label: 'setup-java v4.0.0 release notes — distribution now required'
  - url: 'https://adoptium.net/'
    label: 'Eclipse Temurin (formerly AdoptOpenJDK) — recommended community JDK'
