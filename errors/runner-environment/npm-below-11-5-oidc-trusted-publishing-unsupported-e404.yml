id: runner-environment-416
title: 'npm < 11.5.1 Does Not Support OIDC Trusted Publishing — Silently Fails with E404 or ENEEDAUTH'
category: runner-environment
severity: error
tags:
  - npm-trusted-publishing
  - oidc
  - npm-version
  - node-22
  - setup-node
  - E404
  - ENEEDAUTH
  - runner-image
patterns:
  - regex: 'npm (error|ERR!) code E404.*publish|404 Not Found - PUT.*registry\.npmjs\.org'
    flags: 'i'
  - regex: 'npm (error|ERR!) code ENEEDAUTH.*need auth.*logged in'
    flags: 'i'
error_messages:
  - "npm error 404 Not Found - PUT https://registry.npmjs.org/pkg-name - Not found"
  - "npm error 404 'pkg-name@x.y.z' is not in this registry."
  - "npm ERR! code ENEEDAUTH"
  - "npm ERR! need auth This command requires you to be logged in to https://registry.npmjs.org/"
root_cause: |
  npm OIDC trusted publishing (introduced in npm 11.5.1, October 2025) is not supported
  by older npm versions. When a workflow uses `actions/setup-node` with `node-version: 22`
  (or `node-version: 20`), the bundled npm version is too old to negotiate OIDC tokens
  with the npm registry.

  npm attempts to publish but cannot authenticate via OIDC because it lacks the trusted
  publishing handshake code. npm then reports the failure as a generic E404 ("not in this
  registry") or ENEEDAUTH ("run npm adduser"), neither of which points to the npm version
  as the root cause.

  Node.js version to bundled npm version mapping:
  - Node 20.x → npm 10.x → OIDC trusted publishing NOT supported
  - Node 22.x → npm 10.x–11.x (exact version depends on Node patch) → may NOT be supported
  - Node 24.x (via setup-node@v6) → npm >= 11.5.1 → OIDC trusted publishing SUPPORTED

  The minimum requirement is **npm 11.5.1 or later**. Workflows that explicitly upgrade
  npm via `npm install -g npm@latest` before publishing also resolve this.

  Sources: npm/cli#8976, npm/cli#9088, SO #79952803 (June 2026), hundreds of "fix(ci):
  upgrade to Node 24 for npm OIDC" PRs in May–June 2026.
fix: |
  Use Node 24 via `actions/setup-node@v6` to get a bundled npm >= 11.5.1, which supports
  OIDC trusted publishing. Alternatively, explicitly upgrade npm before publishing.
fix_code:
  - language: yaml
    label: Use Node 24 (recommended — ships npm >= 11.5.1)
    code: |
      - name: Setup Node.js 24 for npm OIDC trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do NOT set registry-url (it writes _authToken and blocks OIDC)

      - name: Publish to npm via OIDC
        run: npm publish --access public

  - language: yaml
    label: Explicitly upgrade npm when pinned to Node 22 or earlier
    code: |
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do NOT set registry-url

      - name: Upgrade npm to support OIDC trusted publishing
        run: npm install -g npm@latest
        # Ensure npm >= 11.5.1

      - name: Publish to npm via OIDC
        run: npm publish --access public

  - language: yaml
    label: Pin minimum npm version
    code: |
      # Explicit version pin to ensure minimum for OIDC:
      - run: npm install -g npm@11.5.1
prevention:
  - "Always use `actions/setup-node@v6` with `node-version: 24` for npm OIDC trusted publishing workflows."
  - "Verify the npm version in CI: `npm --version` must be >= 11.5.1 before `npm publish` with OIDC."
  - "Do not set `registry-url` on `actions/setup-node` for OIDC-only publish workflows (it adds `_authToken` placeholder that overrides OIDC)."
  - "If you see E404 or ENEEDAUTH during trusted publishing and the package exists and OIDC config is correct, check `npm --version` first."
docs:
  - url: https://github.com/npm/cli/issues/9088
    label: "npm/cli #9088: Trusted publishing failures report misleading 404/ENEEDAUTH"
  - url: https://github.com/npm/cli/issues/8976
    label: "npm/cli #8976: OIDC trusted publishing E404 (comprehensive analysis)"
  - url: https://stackoverflow.com/questions/79952803
    label: "Stack Overflow: 404 when using Trusted Publishing to publish from GitHub Actions to npm (Jun 2026)"
  - url: https://docs.npmjs.com/trusted-publishers
    label: "npm docs: Trusted publishers (GitHub Actions)"
  - url: https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#publishing-to-npm-with-trusted-publisher-oidc
    label: "actions/setup-node docs: Publishing to npm with Trusted Publisher OIDC"
