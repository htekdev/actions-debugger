id: runner-environment-447
title: 'setup-python pip fails intermittently with "ModuleNotFoundError: No module named http" on self-hosted runners — toolcache Python stdlib path conflict'
category: runner-environment
severity: error
tags:
  - setup-python
  - pip
  - self-hosted
  - toolcache
  - stdlib
  - module-not-found
  - urllib3
  - six
  - intermittent

patterns:
  - regex: 'ModuleNotFoundError: No module named .?http.?'
    flags: 'i'
  - regex: 'from pip\._vendor\.urllib3\.packages\.six import'
    flags: 'i'
  - regex: 'six\.py.*load_module.*_resolve.*No module named.*http'
    flags: 'i'
  - regex: 'from pip\._vendor import urllib3.*ModuleNotFoundError'
    flags: 'i'

error_messages:
  - 'ModuleNotFoundError: No module named ''http'''
  - 'File ".../site-packages/pip/_vendor/urllib3/packages/six.py", line 87, in _import_module'
  - '    __import__(name)'
  - 'ModuleNotFoundError: No module named ''http'''
  - 'from pip._vendor.requests.__init__ import ... urllib3'

root_cause: |
  actions/setup-python installs Python from the toolcache (e.g.,
  /opt/hostedtoolcache/Python/3.11.9/x64/) which has its own pip installation
  containing vendored urllib3 and its dependency six.py.

  six.py uses a lazy module loader that dynamically imports standard library modules
  (such as http.client) by calling __import__(name). On some self-hosted runner
  environments — particularly those with non-standard Python installations, concurrent
  runs, or toolcache directory permission race conditions — the stdlib path for the
  toolcache Python may not be in sys.path when pip starts executing. This causes
  six.py's lazy importer to fail with:
    ModuleNotFoundError: No module named 'http'

  The error is intermittent because:
  - It depends on timing of PATH/PYTHONPATH environment setup
  - It is more common on self-hosted runners (e.g., Buildjet, custom cloud images)
    where the Python toolcache layout differs from GitHub-hosted runners
  - Concurrent workflow runs on the same runner may cause toolcache path conflicts
  - The issue does not reproduce consistently; re-running the workflow often succeeds

  The root cause is a combination of pip's vendored urllib3/six using dynamic stdlib
  imports and the toolcache Python not having its stdlib directory properly registered
  in sys.path during the very early stage of pip startup.

fix: |
  1. Re-run the workflow — this intermittent error usually self-resolves on retry.
  2. Upgrade pip immediately after setup-python before installing other packages:
       pip install --upgrade pip
     This replaces the toolcache pip with a fresh version that may not have the
     six/urllib3 conflict.
  3. Use a virtual environment to isolate the Python environment:
       python -m venv .venv
       source .venv/bin/activate
       pip install ...
  4. Switch to GitHub-hosted runners if consistently hitting this on self-hosted.
  5. Ensure only one workflow job uses the same toolcache Python at a time on
     self-hosted runners (use job concurrency groups).

fix_code:
  - language: yaml
    label: 'Upgrade pip immediately after setup-python to avoid toolcache pip conflict'
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip before installing packages
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt
  - language: yaml
    label: 'Use virtual environment to isolate pip from toolcache Python'
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

prevention:
  - 'Always run `pip install --upgrade pip` as the first pip operation after actions/setup-python on self-hosted runners.'
  - 'Avoid running multiple concurrent jobs that use the same Python version from the toolcache on the same self-hosted runner.'
  - 'Use actions/setup-python with cache: pip to reduce toolcache operations that might expose path race conditions.'
  - 'Consider using virtual environments (python -m venv) on self-hosted runners to fully isolate the Python environment from the toolcache.'

docs:
