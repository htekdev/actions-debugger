id: runner-environment-340
title: 'ubuntu-24.04 apt-get update 404 When arm64 Architecture Added — azure.archive.ubuntu.com Missing arm64 Packages'
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - apt
  - arm64
  - cross-compilation
  - azure-mirror
  - multi-arch
  - dpkg
  - noble
patterns:
  - regex: '404.*Not Found.*azure\.archive\.ubuntu\.com.*arm64'
    flags: 'i'
  - regex: 'Failed to fetch http://azure\.archive\.ubuntu\.com/ubuntu.*binary-arm64'
    flags: 'i'
  - regex: 'E: Some index files failed to download.*azure.*arm64|azure.*archive.*ubuntu.*arm64.*404'
    flags: 'i'
  - regex: 'dpkg --add-architecture arm64.*E: Failed to fetch'
    flags: 'im'
error_messages:
  - "E: Failed to fetch http://azure.archive.ubuntu.com/ubuntu/dists/noble/main/binary-arm64/Packages  404  Not Found"
  - "E: Failed to fetch http://azure.archive.ubuntu.com/ubuntu/dists/noble-updates/main/binary-arm64/Packages  404  Not Found"
  - "E: Failed to fetch http://azure.archive.ubuntu.com/ubuntu/dists/noble-security/main/binary-arm64/Packages  404  Not Found"
  - "E: Some index files failed to download. They have been ignored, or old ones used instead."
root_cause: |
  The `azure.archive.ubuntu.com` mirror used by GitHub-hosted ubuntu-24.04 runners
  (Ubuntu 24.04 LTS, codename "noble") does NOT host arm64 binary packages. It only
  carries amd64 packages. When a workflow adds arm64 as a supported architecture via
  `sudo dpkg --add-architecture arm64` and then runs `sudo apt-get update`, APT
  attempts to fetch arm64 package indexes from `azure.archive.ubuntu.com` and receives
  HTTP 404 for every `binary-arm64/Packages` path.

  This is a known architectural limitation of the Azure-region APT mirror: it is an
  amd64-only mirror. Ubuntu 22.04 runners used a different mirror configuration where
  arm64 packages were accessible, so workflows migrating from ubuntu-22.04 to
  ubuntu-24.04 encounter this failure.

  Affected workflows include:
  - Cross-compilation (installing gcc-aarch64-linux-gnu, binutils-aarch64-linux-gnu)
  - Multi-arch Docker builds that install arm64 native libraries inside containers
  - Any workflow calling dpkg --add-architecture arm64 followed by apt-get update

  Ubuntu 24.04 uses the deb822 source format (/etc/apt/sources.list.d/ubuntu.sources)
  instead of the legacy /etc/apt/sources.list format, which changes the syntax for
  restricting architectures per-source.
fix: |
  Restrict the azure.archive.ubuntu.com APT source to amd64 only, and add a separate
  arm64 source pointing to ports.ubuntu.com/ubuntu-ports.

  For Ubuntu 24.04 (deb822 format), edit /etc/apt/sources.list.d/ubuntu.sources to
  add `Architectures: amd64` to each existing stanza, then add arm64-specific stanzas
  using ports.ubuntu.com/ubuntu-ports.

  Use a sed one-liner to restrict the existing azure mirror to amd64, then append
  the arm64 ports sources in your workflow step.
fix_code:
  - language: yaml
    label: "Fix: restrict azure mirror to amd64, add arm64 ports source"
    code: |
      - name: Add arm64 architecture with correct APT sources
        run: |
          sudo dpkg --add-architecture arm64

          # Restrict existing azure mirror entries to amd64 only (deb822 format)
          sudo sed -i 's/^Architectures: amd64$/Architectures: amd64/' \
            /etc/apt/sources.list.d/ubuntu.sources || true
          sudo sed -i '/^Types: deb/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources

          # Add arm64-specific sources from ports.ubuntu.com
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-arm64-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          EOF

          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
  - language: yaml
    label: "Alternative: use sed to patch sources file in place"
    code: |
      - name: Configure multi-arch APT sources for ubuntu-24.04
        run: |
          sudo dpkg --add-architecture arm64

          # Ubuntu 24.04 uses deb822 format — add Architectures: amd64 restriction
          sudo sed -i '/^Types: deb/{n; /^URIs: http:\/\/azure\.archive\.ubuntu\.com/{ N; N; N; N; s/\n/\nArchitectures: amd64/1 }}' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || \
          sudo sed -i 's|deb http://azure.archive.ubuntu.com|deb [arch=amd64] http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true

          # Add arm64 ports source
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" \
            | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.list

          sudo apt-get update -y
prevention:
  - "Pin runs-on to ubuntu-22.04 if your workflow uses dpkg --add-architecture arm64 and has not been updated for 24.04"
  - "Always restrict azure.archive.ubuntu.com to [arch=amd64] before calling apt-get update on ubuntu-24.04 with multi-arch enabled"
  - "Use ports.ubuntu.com/ubuntu-ports for arm64 packages on ubuntu-24.04 runners"
  - "If cross-compiling, consider using a native ubuntu-24.04-arm runner for the arm64 leg instead of dpkg --add-architecture"
docs:
  - url: 'https://github.com/actions/runner-images/issues/10901'
    label: 'runner-images #10901 — apt update fails on Ubuntu 24.04 if arm64 is enabled'
  - url: 'https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#p-99950-deb822-sources-management'
    label: 'Ubuntu 24.04 deb822 sources management'
  - url: 'https://help.ubuntu.com/community/Repositories/CommandLine'
    label: 'Ubuntu APT sources documentation'
