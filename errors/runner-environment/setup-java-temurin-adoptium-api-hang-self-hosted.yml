    label: 'actions/setup-java#897 — Intermittent hang at "Trying to resolve the latest version from remote" (28 reactions)'
  - url: 'https://github.com/actions/setup-java/issues/923'
    label: 'actions/setup-java#923 — Error: Java setup failed due to network issue or timeout: read ECONNRESET'
  - url: 'https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#hosted-tool-cache'
    label: 'setup-java advanced usage — Hosted Tool Cache for self-hosted runners'
  - url: 'https://adoptium.net/installation/linux/'
    label: 'Eclipse Temurin — Install JDK on Linux (for pre-baking into runner images)'
