id: runner-environment-427
title: '@actions/http-client@2.2.1 Does Not URL-Decode Proxy Credentials — 407 Authentication Failure for Special-Character Passwords'
category: runner-environment
severity: error
tags:
  - proxy
  - http-client
  - authentication
  - self-hosted
  - corporate-proxy
  - checkout
  - url-encoding
patterns:
  - regex: '407 Proxy Authentication Required'
    flags: 'i'
  - regex: 'Proxy authentication required|proxyAuth.*failed|proxy.*auth.*407'
    flags: 'i'
  - regex: 'connect ECONNRESET.*proxy|tunneling socket could not be established.*proxy'
    flags: 'i'
  - regex: 'Failed to connect to proxy|Unable to tunnel through proxy'
    flags: 'i'
error_messages:
  - 'Error: 407 Proxy Authentication Required'
  - 'Error: tunneling socket could not be established, cause=407 Proxy Authentication Required'
  - 'Error: connect ECONNRESET — proxy returned 407'
  - 'Error: Failed to connect to proxy: 407 Proxy Authentication Required'
  - 'ProxyError: 407 Proxy Authentication Required — username or password contains unrecognized characters'
root_cause: |
  @actions/http-client@2.2.1 (bundled with actions/checkout v4.x through v6.0.x) reads
  the HTTPS_PROXY / HTTP_PROXY environment variables and extracts the username and password
  directly from the URL without URL-decoding them first. When the proxy URL is set with
  URL-encoded special characters in the credentials — such as %40 for "@", %3A for ":",
  %2F for "/" or %25 for "%" (required for passwords/usernames that contain those
  characters) — the raw encoded form (e.g. user%40domain) is forwarded to the proxy in
  the Proxy-Authorization header. The proxy server receives a literally different credential
  and rejects with 407 Proxy Authentication Required.

  This is a latent bug in actions/http-client that was fixed in version 2.2.2 (toolkit
  PR #1782, merged August 2024), but actions/checkout continued bundling the unfixed
  2.2.1 version through mid-2026, making the issue surface for corporate self-hosted
  runner users whose proxies enforce strict credential matching.

  Common trigger: Zscaler, Squid, or enterprise proxies that require usernames of the
  form user@domain or passwords containing ":", "@", or "/" — all of which must be
  percent-encoded in a URL but must be decoded before use in HTTP Basic Auth headers.

  The same underlying issue affects any GitHub Action that bundles @actions/http-client
  ≤ 2.2.1 including actions/artifact and other toolkit-based actions.
fix: |
  Option 1 — Workaround: pre-encode proxy env var without encoding separators (recommended):
  Set the proxy URL with URL-encoded special characters in the credential portion but
  ensure the encoding matches what the proxy server expects. Use the decoded form if
  the proxy accepts it directly via a non-URL proxy env var:
    HTTPS_PROXY=https://rawuser:rawpassword@proxy.corp.example.com:8080
  If the password contains "@" use %40 only if the proxy accepts it; otherwise some
  tools support using the decoded form directly when the proxy doesn't parse it as a URL.

  Option 2 — Workaround: use git config insteadOf / credential helper (for checkout):
  Configure git credential storage separately so actions/checkout uses git-native auth
  instead of going through http-client for the initial authentication:
    git config --global credential.helper store
    echo "https://user:password@github.com" > ~/.git-credentials

  Option 3 — Use a newer checkout version once http-client@2.2.3 is bundled:
  Track actions/checkout releases for a version that bumps the bundled http-client
  dependency to 2.2.3+. Once released, upgrading actions/checkout resolves the issue.

  Option 4 — Self-hosted: set proxy credentials via git config instead of env var:
  For repository checkouts on self-hosted runners behind a proxy, configure git-level
  proxy auth which does not go through http-client:
    git config --global http.proxy https://user:password@proxy:8080
    git config --global https.proxy https://user:password@proxy:8080
fix_code:
  - language: yaml
    label: 'Option 4 — Configure git-level proxy auth in workflow to bypass http-client URL-encoding bug'
    code: |
      jobs:
        build:
          runs-on: self-hosted
          steps:
            - name: Configure git proxy (bypasses http-client URL encoding bug)
              run: |
                git config --global http.proxy "https://${{ secrets.PROXY_USER }}:${{ secrets.PROXY_PASS }}@proxy.corp.example.com:8080"
                git config --global https.proxy "https://${{ secrets.PROXY_USER }}:${{ secrets.PROXY_PASS }}@proxy.corp.example.com:8080"
              # Note: secrets values are NOT URL-encoded — git handles them natively

            - uses: actions/checkout@v4
              # No HTTP_PROXY env var needed — git-level config takes precedence

            - name: Cleanup proxy config
              if: always()
              run: |
                git config --global --unset http.proxy || true
                git config --global --unset https.proxy || true
  - language: yaml
    label: 'Option 1 — Use plain (non-URL-encoded) proxy env var when proxy accepts decoded credentials'
    code: |
      jobs:
        build:
          runs-on: self-hosted
          env:
            # If password is "p@ss:word/2024", set it decoded — avoid percent-encoding in env var
            HTTPS_PROXY: 'https://user:p@ss:word%2F2024@proxy.corp.example.com:8080'
            # Use %2F only for "/" since ":" and "@" in passwords still confuse the URL parser
            # Best practice: use a proxy password without special characters when possible
          steps:
            - uses: actions/checkout@v4
prevention:
  - 'Prefer proxy passwords that do not contain "@", ":", "/", or "%" — these characters require URL-encoding in proxy URLs but the encoding is not reliably decoded by all GitHub Actions versions.'
  - 'On self-hosted runners, configure proxy auth via git config (http.proxy / https.proxy) rather than HTTPS_PROXY environment variable to avoid the http-client URL-decoding bug.'
  - 'Monitor actions/checkout and actions/toolkit releases for the bundled @actions/http-client version bump to ≥2.2.2. The fix was committed in toolkit PR #1782 (Aug 2024) but checkout was slow to adopt it.'
  - 'When debugging 407 errors on corporate proxies, check that the percent-encoded form of your credentials matches what the proxy server expects in the Authorization header (some proxies expect decoded, others accept encoded).'
docs:
  - url: 'https://github.com/actions/toolkit/issues/1779'
    label: 'actions/toolkit#1779 — URL-encoding not handled for proxy username in http-client (original report Jul 2024)'
  - url: 'https://github.com/actions/toolkit/pull/1782'
    label: 'actions/toolkit#1782 — Fix: Handle Encoded URL for Proxy Username and Password (merged Aug 2024, in http-client@2.2.2)'
  - url: 'https://github.com/actions/checkout/issues/2444'
    label: 'actions/checkout#2444 — actions/http-client@2.2.1 does not handle URL-encoded proxy credentials (May 2026)'
  - url: 'https://github.com/google-github-actions/auth/issues/429'
    label: 'google-github-actions/auth#429 — Related: URL-encoded proxy credentials rejected via http-client'
