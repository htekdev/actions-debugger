id: runner-environment-510
title: 'windows-11-arm Label Migrating to VS2026 in Early September 2026 — VS2022 Workflows Will Break'
category: runner-environment
severity: warning
tags:
  - windows-11-arm
  - vs2026
  - label-migration
  - arm64
  - toolchain
  - migration
patterns:
  - regex: 'MSB8036.*v143.*cannot be found|build tools for v143.*not found'
    flags: 'i'
  - regex: 'LNK1104.*MSVCP143\.lib|cannot open file.*MSVCP143'
    flags: 'i'
  - regex: 'windows-11-arm.*VS2026|windows-11-arm.*Visual Studio 2026'
    flags: 'i'
error_messages:
  - "MSB8036: The build tools for v143 (Platform Toolset = 'v143') cannot be found."
  - "LINK : fatal error LNK1104: cannot open file 'MSVCP143.lib'"
  - "error : VSINSTALLDIR environment variable is not set."
root_cause: |
  Starting early September 2026, the `windows-11-arm` runner label will migrate from the
  Windows 11 ARM64 with Visual Studio 2022 image to the new Windows 11 ARM64 with
  Visual Studio 2026 image. GitHub announced the public preview of `windows-11-vs2026-arm`
  on June 11, 2026 (GitHub Changelog), and explicitly stated:
  "At the end of the public preview in early September, the existing windows-11-arm image
  label will migrate to the vs2026 image."

  This mirrors the earlier windows-latest migration to VS2026 that completed in June 2026.
  Workflows that use `windows-11-arm` without testing VS2026 compatibility will encounter
  the same class of breaking changes as the windows-latest migration:

  - MSVC toolset changes (VS2026 ships a newer C++ toolchain than VS2022)
  - Hardcoded VS2022 installation paths (e.g. C:\Program Files\Microsoft Visual Studio\2022\)
    are no longer valid under VS2026
  - CMake generator "Visual Studio 17 2022" must be updated to "Visual Studio 18 2026"
  - Node.js native addon builds (node-gyp) may report "unknown Visual Studio version"
  - Platform toolsets v141/v142 may not be available in the VS2026 image

  The migration is gradual: `windows-11-vs2026-arm` is available NOW for early testing.
  Teams that have not tested on VS2026 will hit failures when the label switches automatically.
fix: |
  Before September 2026, test your workflows on `windows-11-vs2026-arm` to identify issues.

  1. Add `windows-11-vs2026-arm` to your CI matrix now and resolve all failures before
     the label automatically switches.

  2. If not yet ready for VS2026: pin `runs-on` to `windows-2022` temporarily to stay
     on VS2022 toolchain while you migrate.

  3. Fix hardcoded VS2022 paths: use `vswhere.exe` to resolve VS installation directory
     at runtime instead of hardcoding a version-specific path.

  4. Update CMake generator: change "Visual Studio 17 2022" to auto-detect or specify
     "Visual Studio 18 2026".

  5. For node-gyp builds: ensure the windows-build-tools or VS component used is
     compatible with VS2026.
fix_code:
  - language: yaml
    label: 'Add windows-11-vs2026-arm to test matrix to catch VS2026 issues early'
    code: |
      jobs:
        build:
          strategy:
            fail-fast: false
            matrix:
              # Test both images before label migration (early September 2026)
              os: [windows-11-arm, windows-11-vs2026-arm]
          runs-on: ${{ matrix.os }}
          steps:
            - uses: actions/checkout@v4
            - name: Build
              run: cmake -B build && cmake --build build --config Release
  - language: yaml
    label: 'Pin to windows-2022 while migrating to VS2026 toolchain'
    code: |
      jobs:
        build:
          # Temporarily pin to VS2022 while testing VS2026 compatibility
          # windows-11-arm will switch to VS2026 in early September 2026
          runs-on: windows-2022
          # TODO: switch back to windows-11-arm after VS2026 migration is validated
  - language: yaml
    label: 'Use vswhere to resolve VS install path dynamically'
    code: |
      - name: Locate Visual Studio installation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          echo "VSINSTALLDIR=$vsPath" >> $env:GITHUB_ENV
prevention:
  - 'Test on windows-11-vs2026-arm NOW — the migration happens in early September 2026 with no automatic warning in workflow files'
  - 'Avoid hardcoding Visual Studio version numbers or install paths — use vswhere.exe to locate VS at runtime'
  - 'Subscribe to GitHub Changelog and watch the runner-images repository for the exact migration date announcement'
  - 'Run the same fix matrix used for windows-latest after its VS2026 migration — the breaking changes are identical'
docs:
  - url: 'https://github.blog/changelog/2026-06-11-new-runner-images-in-public-preview/'
    label: 'GitHub Changelog June 11, 2026: windows-11-vs2026-arm public preview; windows-11-arm migration date'
  - url: 'https://github.blog/changelog/2026-05-14-github-actions-upcoming-image-migrations/'
    label: 'GitHub Changelog May 2026: Upcoming image migrations overview'
  - url: 'https://github.com/actions/runner-images'
    label: 'actions/runner-images: image README and migration announcements'