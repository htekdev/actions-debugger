id: runner-environment-451
title: '`windows-11-arm` runner: `py` launcher selects x64 Python over ARM64 Python installed by `setup-python`'
category: runner-environment
severity: error
tags:
  - windows-11-arm
  - arm64
  - python
  - setup-python
  - py-launcher
  - architecture
  - regression
patterns:
  - regex: 'windows-11-arm.*py.*x64|py.*launcher.*x64.*arm64|setup-python.*arm64.*py.*wrong'
    flags: 'i'
  - regex: 'py.*-3\.\d+.*x64.*instead.*arm|py.*launcher.*selects.*x64'
    flags: 'i'
error_messages:
  - "py -3.13 selects x64 Python instead of arm64 Python"
  - "Python architecture: x64 (expected arm64)"
  - "Python platform.machine(): AMD64 (setup-python installed arm64)"
root_cause: |
  On `windows-11-arm` runner images starting around version 0.0.7, an x64 Python binary was added
  to the base image. The Windows `py` launcher uses a priority registry that favors the x64 entry
  over the ARM64 Python installed by `actions/setup-python`. As a result, `py -3.x` selects the
  pre-installed x64 Python even after `setup-python` successfully installs an ARM64 Python for the
  same version.

  This is a regression from image 0.0.3, where ARM64 Python was correctly selected. The `py`
  launcher resolves Python installations from the Windows Registry (PEP 514), and the x64 entry
  for the same version wins over the ARM64 entry due to how the launcher prioritizes architecture
  matches when the calling process itself is x64 (WoW64).

  Workflows that use `py -3.x` to invoke Python (common in scripts, Makefile targets, and
  poetry/uv) will silently run x64 Python even though ARM64 Python was intended.
fix: |
  Avoid `py -3.x` on `windows-11-arm` runners. Use `python` or `python3` directly instead,
  which will resolve to the `setup-python`-installed ARM64 Python via PATH prepend.

  Alternatively, call Python via its full path after setup-python outputs the installation
  directory, or use the `python-path` output from `setup-python` v6+.
fix_code:
  - language: yaml
    label: 'Use python directly instead of py launcher'
    code: |
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Don't do this on windows-11-arm:
      # - run: py -3.13 -m pytest
      #   shell: cmd

      # Do this instead:
      - run: python -m pytest
        shell: bash
  - language: yaml
    label: 'Use python-path output for explicit path'
    code: |
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

      - run: '"${{ steps.setup-python.outputs.python-path }}" -m pytest'
        shell: cmd
prevention:
  - "Use `python` or `python3` instead of the `py` launcher on `windows-11-arm` runners"
  - "Add `architecture: arm64` to setup-python inputs to be explicit about the target"
  - "Avoid `runs-on: windows-11-arm` matrix entries that share `py -x.x` invocations with x64 jobs"
  - "Check Python architecture in CI with `python -c \"import platform; print(platform.machine())\"`"
docs:
  - url: 'https://github.com/actions/runner-images/issues/14074'
    label: 'runner-images#14074: py selects x64 Python over arm64 on windows-11-arm'
  - url: 'https://github.com/astral-sh/uv/pull/14655'
    label: 'uv#14655: downstream fix for py launcher ARM64 regression'
  - url: 'https://peps.python.org/pep-0514/'
    label: 'PEP 514 — Python registration in the Windows registry'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories'
    label: 'GitHub-hosted runners — windows-11-arm'
