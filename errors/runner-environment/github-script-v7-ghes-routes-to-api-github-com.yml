id: runner-environment-315
title: "github-script@v7.0.0 Routes to api.github.com Instead of GHES Enterprise API"
category: runner-environment
severity: error
tags:
  - github-script
  - ghes
  - enterprise
  - api-url
  - v7
  - github-enterprise-server
patterns:
  - regex: 'RequestError.*HttpError.*Not Found.*api\.github\.com'
    flags: "i"
  - regex: 'url:.*https://api\.github\.com/repos/.*status: 404'
    flags: "i"
  - regex: 'github-script.*v7.*api\.github\.com.*enterprise'
    flags: "i"
error_messages:
  - "RequestError [HttpError]: Not Found"
  - "status: 404, response: { url: 'https://api.github.com/repos/org/repo/issues/123', status: 404, data: { message: 'Not Found' } }"
  - "HttpError: Not Found\n  at /opt/actions-runner/.../dist/index.js"
root_cause: |
  In actions/github-script@v7.0.0, a code change to support the `base-url` input parameter
  set `baseUrl` on the Octokit instance to `undefined` when the input was not provided,
  overriding the default resolution from the `GITHUB_API_URL` environment variable that
  Eclipse Temurin's @actions/github toolkit uses. On GitHub Enterprise Server (GHES),
  `GITHUB_API_URL` is set to the enterprise API endpoint (e.g.,
  `https://github.example.com/api/v3`). With v7.0.0, this value was ignored and Octokit
  defaulted to `https://api.github.com`, causing all API requests to hit the public GitHub
  API instead of the enterprise instance. Resources that exist only on the enterprise return
  404 Not Found.
  Fixed in github-script v7.0.1 (released November 2023).
fix: |
  Upgrade to `actions/github-script@v7` (the v7 tag now points to v7.0.1+).
  If pinning to a specific commit/SHA, ensure it is v7.0.1 or later.
  As an immediate workaround on any v7.x version, explicitly pass
  `base-url: ${{ github.api_url }}` to force the correct enterprise endpoint.
fix_code:
  - language: yaml
    label: "Use v7 tag (points to v7.0.1+ with fix)"
    code: |
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
  - language: yaml
    label: "Explicit base-url workaround (any v7.x)"
    code: |
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-url: ${{ github.api_url }}   # Forces enterprise API endpoint
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
prevention:
  - "Always use the action's version tag (`@v7`) rather than pinning to commit SHAs to receive patch fixes automatically"
  - "On GHES, test API-making actions after upgrading major versions to verify the enterprise API endpoint is used"
  - "Verify the `base-url` sent in network calls when debugging 404 errors on GHES — check if they go to api.github.com"
docs:
  - url: "https://github.com/actions/github-script/issues/436"
    label: "actions/github-script#436: Routes to api.github.com on GHES after upgrading to v7"
  - url: "https://github.com/actions/github-script/releases/tag/v7.0.1"
    label: "actions/github-script v7.0.1 release (fix)"
  - url: "https://docs.github.com/en/enterprise-server@latest/actions/writing-workflows/choosing-what-your-workflow-does/using-github-cli-in-workflows"
    label: "GitHub Docs: GITHUB_API_URL in enterprise workflows"
