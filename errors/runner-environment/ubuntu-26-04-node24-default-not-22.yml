id: runner-environment-460
title: 'Ubuntu 26.04 Default Node.js Changed from 22 to 24 — Workflows Without setup-node Get Node 24'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - nodejs
  - node24
  - runner-image
  - breaking-change
  - setup-node
patterns:
  - regex: 'node.*v24\.[0-9]+\.[0-9]+'
    flags: 'i'
  - regex: 'requires node.?>=? ?2[45]\.|node version.*24.*expected|ERR_UNSUPPORTED_NODE_VERSION.*v24'
    flags: 'i'
  - regex: 'Cannot find module|MODULE_NOT_FOUND.*node_modules.*native.*ubuntu-26'
    flags: 'i'
error_messages:
  - "v24.0.0"
  - "node: /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.38' not found (compiled for older node)"
  - "Error: This package requires Node.js 22 or older; found Node.js 24.x"
root_cause: |
  Ubuntu 26.04 runner images (announced June 11, 2026 as public preview) ship with
  Node.js 24.x as the pre-installed default, replacing Node.js 22.x which is the
  system Node on ubuntu-24.04. The system PATH on ubuntu-26.04 resolves `node` and
  `npm` to their v24.x counterparts.

  Workflows that do NOT use `actions/setup-node` to pin a Node.js version will
  silently receive Node 24 when running on ubuntu-26.04. Key breaking changes
  between Node 22 and Node 24 include:

  - `punycode` built-in module removed (DEP0040 graduated to removal)
  - `--openssl-legacy-provider` no longer available (removed in Node 23)
  - V8 engine updated to v13.x — bytecode format and some JIT behaviors differ,
    affecting pre-compiled native addons (.node files) built for Node 22
  - `url.parse()` now emits errors for invalid URLs (was silent in Node 22)
  - Some deprecated `Buffer` allocation patterns now throw synchronously
  - `require('http2')`, `require('crypto')` APIs have stricter enforcement

  Source: actions/runner-images#14226 (Ubuntu 26.04 public preview announcement,
  June 11, 2026) — software differences table shows Node.js default changed from
  22.* to 24.* between ubuntu-24.04 and ubuntu-26.04.
fix: |
  Always pin an explicit Node.js version using actions/setup-node. Never rely on
  the runner's pre-installed system Node, which changes between ubuntu-24.04
  (Node 22) and ubuntu-26.04 (Node 24).

  If you need Node 22 behavior on ubuntu-26.04, set node-version: '22' explicitly.
  If you are ready to adopt Node 24, test thoroughly before committing.
fix_code:
  - language: yaml
    label: 'Pin Node.js version with setup-node (recommended)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4

            # Always pin explicitly — default Node.js differs:
            # ubuntu-24.04 = 22.x, ubuntu-26.04 = 24.x
            - uses: actions/setup-node@v4
              with:
                node-version: '22'   # or '24' once your code is compatible
                cache: 'npm'

            - run: node --version
            - run: npm ci
            - run: npm test

  - language: yaml
    label: 'Pin Node.js via .nvmrc or .node-version file'
    code: |
      jobs:
        build:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version-file: '.nvmrc'   # reads version from .nvmrc
                cache: 'npm'
            - run: npm ci && npm test

prevention:
  - 'Always use `actions/setup-node` with an explicit `node-version` or `node-version-file` — the pre-installed Node.js version changes between runner image major versions.'
  - 'When migrating from `ubuntu-24.04` to `ubuntu-26.04`, audit all steps that invoke `node`, `npm`, or `npx` directly without a prior `setup-node` step.'
  - 'Test workflows on `ubuntu-26.04` in a draft PR before updating production YAML — use `runs-on: ubuntu-26.04` explicitly during testing to surface Node 24 incompatibilities early.'
  - 'Check for native addons (.node files) compiled for a specific Node version — they must be rebuilt for Node 24 on ubuntu-26.04.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226: Ubuntu 26.04 public preview announcement — software differences table'
  - url: 'https://github.com/actions/setup-node'
    label: 'actions/setup-node — pin Node.js versions in workflows'
  - url: 'https://nodejs.org/en/blog/release/v24.0.0'
    label: 'Node.js 24.0.0 release notes — breaking changes from Node.js 22'
