id: runner-environment-349
title: 'go.mod `tool` Directive (Go 1.24) Fails to Parse on Go 1.23 Runner — "unknown directive: tool"'
category: runner-environment
severity: error
tags:
  - golang
  - go-mod
  - go1.24
  - tool-directive
  - setup-go
  - runner-image-update
  - go-modules
patterns:
  - regex: 'go: errors parsing go\.mod:.*unknown directive: tool'
    flags: 'i'
  - regex: 'go\.mod:\d+: unknown directive: tool'
    flags: 'i'
  - regex: 'unknown directive: tool'
    flags: 'i'
error_messages:
  - "go: errors parsing go.mod: go.mod:12: unknown directive: tool"
  - "go.mod:15: unknown directive: tool"
root_cause: |
  Go 1.24 (released February 2025) introduced the `tool` directive in `go.mod` for
  declaring tool dependencies via `go get -tool golang.org/x/tools/cmd/stringer`.
  The directive adds lines like:

    tool (
      golang.org/x/tools/cmd/stringer
      golang.org/x/vuln/cmd/govulncheck
    )

  When a repository adopts the `tool` directive and the CI workflow runs with Go 1.23 or
  earlier — either via `go-version: '1.23'` in actions/setup-go, or by relying on the
  ubuntu-24.04 preinstalled Go 1.23 (documented in runner-environment-282) — the `go`
  command fails to parse go.mod because it does not recognise `tool` as a valid directive.
  The build, `go mod tidy`, and `go test ./...` all abort with the parse error before any
  user code runs.

  The issue was documented in golang/go#74739 (opened May 2026, significant activity as
  repos adopted Go 1.24 tool management) and in cli/cli#9489 showing real CI impact.
fix: |
  Upgrade the CI Go version to 1.24 or later using actions/setup-go. The simplest
  approach is to read the Go version from go.mod (which will declare `go 1.24`) so the
  setup-go action automatically selects the correct version:

    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

  Alternatively pin an explicit version:

    - uses: actions/setup-go@v6
      with:
        go-version: '1.24'

  Do NOT rely on the preinstalled ubuntu-24.04 Go (which is 1.23 as of June 2026) when
  go.mod contains `tool` directives.
fix_code:
  - language: yaml
    label: "Use go-version-file to auto-resolve version from go.mod (recommended)"
    code: |
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'   # reads `go 1.24` directive, installs correct version
          cache: true
  - language: yaml
    label: "Pin explicit Go 1.24+ version"
    code: |
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
prevention:
  - "Always use actions/setup-go with go-version-file: go.mod rather than relying on the preinstalled Go on ubuntu-24.04"
  - "When adding tool directives to go.mod, update CI workflows to require Go >=1.24 at the same time"
  - "Check go-version: inputs against the minimum Go version in go.mod — they must be >=1.24 when tool directives are present"
  - "Add CODEOWNERS or CI check that blocks go.mod tool directive adoption without CI Go version alignment"
docs:
  - url: "https://go.dev/blog/go1.24"
    label: "Go 1.24 release notes — tool directive"
  - url: "https://go.dev/doc/toolchain"
    label: "Go Toolchain documentation (GOTOOLCHAIN, toolchain directive)"
  - url: "https://github.com/golang/go/issues/74739"
    label: "golang/go#74739 — errors parsing go.mod: unknown directive: tool"
  - url: "https://github.com/cli/cli/issues/9489"
    label: "cli/cli#9489 — real-world CI impact of go.mod tool directive on older Go"
  - url: "https://github.com/actions/setup-go"
    label: "actions/setup-go — go-version-file input"
