id: runner-environment-445
title: 'setup-node corepack fails with "Cannot find matching keyid" — outdated npm registry signing keys in bundled corepack version'
category: runner-environment
severity: error
tags:
  - setup-node
  - corepack
  - npm
  - pnpm
  - yarn
  - keyid
  - signature-verification
  - package-manager

patterns:
  - regex: 'Cannot find matching keyid'
    flags: 'i'
  - regex: 'Error: Cannot find matching keyid.*signatures.*keys'
    flags: 'i'
  - regex: 'corepack\.cjs.*keyid.*null.*signature.*null.*throw'
    flags: 'i'
  - regex: 'fetchLatestStableVersion.*Cannot find matching keyid'
    flags: 'i'

error_messages:
  - "Error: Cannot find matching keyid: {\"signatures\":[{\"sig\":\"MEQCIHGqHbvc2zImUPEPFpT4grh6rMYslel+lAjFArx8+RUdAiBfnJA+bgmUvO5Lctfkq+46KKDQdx/8RhLPge3pA+EdHA==\",\"keyid\":\"SHA256:DhQ8wR5APBvFHLF/+Tc+AYvPOdTpcIDqOhxsBHRwC7U\"}],\"keys\":[{\"expires\":null,\"keyid\":\"SHA256:jl3bwswu80PjjokCgh0o2w5c2U4LhQAE57gj9cz1kzA\",\"keytype\":\"ecdsa-sha2-nistp256\",\"scheme\":\"ecdsa-sha2-nistp256\",\"key\":\"MFkw...\"}]}"
  - "if (key == null || signature == null) throw new Error(`Cannot find matching keyid: ${JSON.stringify({ signatures, keys })}`);"

root_cause: |
  corepack verifies the npm registry's package manifest signatures using ECDSA key pairs.
  When npm rotated its registry signing keys in early 2025, the old key
  (SHA256:jl3bwswu80PjjokCgh0o2w5c2U4LhQAE57gj9cz1kzA) was replaced with a new one
  (SHA256:DhQ8wR5APBvFHLF/+Tc+AYvPOdTpcIDqOhxsBHRwC7U).

  corepack versions prior to v0.31.0 only know about the old key. When npm signs
  manifests with the new key and corepack tries to verify the signature, it cannot
  match the keyid to any known key in its hardcoded list and throws:
    "Cannot find matching keyid"

  actions/setup-node@v4 bundles an older corepack version (pre-0.31.0) alongside the
  Node.js installation from the toolcache. When workflows invoke `corepack` to install
  pnpm or yarn, the bundled corepack attempts to fetch and verify the latest package
  manager version from the npm registry — hitting the new signature it cannot verify.

  This affects any workflow that:
  1. Uses setup-node with a Node.js version that ships an older corepack
  2. Calls `corepack prepare`, `corepack enable`, or `corepack install` without a
     pinned version that bypasses registry signature verification

fix: |
  Option 1 — Pin the package manager version so corepack skips registry signature
  verification (recommended for reproducibility):
    corepack enable
    corepack prepare pnpm@9.15.0 --activate

  Option 2 — Upgrade corepack to v0.31.0+ before using it:
    npm install -g corepack@latest

  Option 3 — Set the COREPACK_INTEGRITY_KEYS environment variable to empty string to
  bypass signature verification (not recommended for production):
    env:
      COREPACK_INTEGRITY_KEYS: ''

  Option 4 — Upgrade to actions/setup-node@v5 which bundles corepack v0.31.0+.

fix_code:
  - language: yaml
    label: 'Pin package manager version in corepack (avoids registry lookup + signature check)'
    code: |
      - name: Enable corepack with pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
  - language: yaml
    label: 'Upgrade corepack before use'
    code: |
      - name: Upgrade corepack to fix keyid mismatch
        run: npm install -g corepack@latest
      - name: Enable corepack
        run: corepack enable
  - language: yaml
    label: 'Skip signature verification via environment variable (emergency workaround only)'
    code: |
      - name: Enable corepack (signature check disabled)
        env:
          COREPACK_INTEGRITY_KEYS: ''
        run: |
          corepack enable
          corepack prepare --activate

prevention:
  - 'Always pin the package manager version in corepack invocations (e.g., corepack prepare pnpm@X.Y.Z --activate) to avoid live registry lookups and signature checks.'
  - 'Define "packageManager" in package.json with an exact version (e.g., "pnpm@9.15.0+sha512...") so corepack uses that version without querying the registry.'
  - 'Use actions/setup-node@v5 or later which bundles corepack v0.31.0+ with updated npm registry keys.'
  - 'Monitor corepack releases when npm announces key rotation — bundled corepack versions may lag behind.'

docs:
  - url: 'https://github.com/actions/setup-node/issues/1222'
    label: 'actions/setup-node#1222 — Update to use latest corepack version with updated npm registry keys (Feb 2025, 33 reactions)'
  - url: 'https://github.com/nodejs/corepack/releases/tag/v0.31.0'
    label: 'corepack v0.31.0 — Updated npm registry signing keys'
  - url: 'https://github.com/nodejs/corepack/pull/614'
    label: 'corepack PR#614 — Updated npm registry keys fix'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows'
    label: 'GitHub Actions — Caching dependencies'
