id: re-425
title: "Node.js 20 JavaScript Actions Forced to Node.js 24 Runtime (September 16, 2026 Hard Cut-off)"
category: runner-environment
severity: warning
tags:
  - node20
  - node24
  - deprecation
  - javascript-actions
  - action-runtime
  - migration
patterns:
  - regex: 'Node\.js 20 actions are deprecated.*will be forced to run with Node\.js 24'
    flags: 'i'
  - regex: 'Actions will be forced to run with Node\.js 24 by default starting'
    flags: 'i'
  - regex: 'Node\.js 20 will be removed from the runner on September 16'
    flags: 'i'
error_messages:
  - "Warning: Node.js 20 actions are deprecated. The following actions are running on Node.js 20 and may not work as expected: actions/checkout@v4. Actions will be forced to run with Node.js 24 by default starting June 16th, 2026. Node.js 20 will be removed from the runner on September 16th, 2026."
  - "Node.js 20 actions are deprecated. The following actions are running on Node.js 20 and may not work as expected: <list>. Actions will be forced to run with Node.js 24 by default starting June 16th, 2026."
root_cause: |
  GitHub deprecated Node.js 20 as the JavaScript action runtime in September 2025, with a two-phase
  enforcement schedule:

  - **Phase 1 – Forced default (June 16, 2026):** The runner automatically runs all `node20` actions on
    Node.js 24. Previously deprecated warnings become per-run warnings for every affected action reference.
    The date was originally June 2, 2026 and shifted to June 16 via actions/runner PR #4462.
  - **Phase 2 – Removal (September 16, 2026):** Node.js 20 is removed from the runner entirely. Actions
    declaring `using: node20` in `action.yml` will fail to execute; `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true`
    is the emergency opt-out but is not intended for long-term use.

  The forced migration can surface compatibility breaks in actions that have not been updated for Node.js 24:
  ES module `require()` restrictions, deprecated built-in APIs (`fs.promises.exists`, legacy crypto APIs),
  native addons compiled against the Node.js 20 ABI, and behaviour changes in V8 garbage collection or
  buffer handling may all cause downstream action failures after June 16, 2026.

  Common sources of warnings: pinned action versions using old major-version tags (`actions/checkout@v4`,
  `actions/setup-node@v4`, `actions/cache@v4`, `actions/upload-artifact@v4`) and third-party actions that
  have not yet released a `node24`-compatible version.
fix: |
  **Preferred — update action versions to their node24-native releases:**

  | Action | Old (node20) | New (node24) |
  |--------|-------------|--------------|
  | actions/checkout | @v4 | @v6 |
  | actions/setup-node | @v4 | @v6 |
  | actions/cache | @v4 | @v5 |
  | actions/upload-artifact | @v4 | @v7 |
  | actions/download-artifact | @v4 | @v8 |
  | actions/setup-python | @v5 | @v6 |
  | actions/setup-java | @v4 | @v5 |

  For third-party actions that have not yet shipped a node24 release, set
  `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` at the workflow level to opt into the forced runtime early
  and surface any compatibility breaks before the deadline. Note: this changes the warning text but does
  NOT silence it (see silent-failures-192).

  **Temporary post-September-16 workaround (not recommended for production):**
  Set `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true` at the workflow or runner level to continue running
  `node20` actions after the hard cut-off. This setting should be removed as soon as the upstream action
  ships a node24-compatible release.
fix_code:
  - language: yaml
    label: "Upgrade to Node.js 24-native action versions"
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6          # was @v4 (node20)
            - uses: actions/setup-node@v6        # was @v4 (node20)
              with:
                node-version: '22'
            - uses: actions/cache@v5             # was @v4 (node20)
              with:
                path: ~/.npm
                key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
            - uses: actions/upload-artifact@v7   # was @v4 (node20)
              with:
                name: build-output
                path: dist/
  - language: yaml
    label: "Temporary opt-in to force node24 now (exposes compatibility breaks before the deadline)"
    code: |
      # Opt-in early to force node24 runtime for all JS actions
      # WARNING: This changes the warning text but does NOT silence it
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4   # runs on Node.js 24, still warns until @v6
  - language: yaml
    label: "Emergency post-September-16 opt-out (remove as soon as upstream updates)"
    code: |
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'  # allows node20 after Sep 16, 2026

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: outdated/action@v1   # still uses node20
prevention:
  - "Subscribe to the GitHub Changelog and pin action major versions so deprecation notices are surfaced early."
  - "Audit all workflows for node20 actions using: `grep -r 'uses:' .github/workflows/` then cross-reference each action's action.yml for `using: node20`."
  - "For self-maintained actions, update `runs.using` in `action.yml` from `node20` to `node24` and run tests with Node.js 24 locally before the deadline."
  - "Use Dependabot or Renovate to automatically keep action versions up-to-date so node-runtime upgrades are applied when maintainers ship them."
  - "Set `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` in a test branch today to discover breakages before the June 16 forced-default date."
docs:
  - url: "https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/"
    label: "GitHub Changelog: Deprecation of Node.js 20 on GitHub Actions runners (Sep 2025)"
  - url: "https://github.com/actions/runner/pull/4462"
    label: "actions/runner PR #4462: Update Node 24 default date to June 16th, 2026"
  - url: "https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runs-for-javascript-actions"
    label: "GitHub Docs: Metadata syntax — runs.using for JavaScript actions"
