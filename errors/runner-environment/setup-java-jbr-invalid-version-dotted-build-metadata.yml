id: runner-environment-424
title: 'setup-java JetBrains Runtime (JBR) Distribution Fails With "Invalid Version" on Non-Semver Build Numbers'
category: runner-environment
severity: error
tags:
  - setup-java
  - jetbrains
  - jbr
  - version-parsing
  - java
  - invalid-version
  - distribution
patterns:
  - regex: 'Java setup process failed due to: Invalid Version: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\+'
    flags: 'i'
  - regex: 'Invalid Version: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+\.[0-9]+'
    flags: 'i'
  - regex: 'setup-java.+distribution.*jetbrains.+Invalid Version'
    flags: 'si'
error_messages:
  - 'Error: Java setup process failed due to: Invalid Version: 17.0.8.1+1080.1'
  - 'Error: Java setup process failed due to: Invalid Version: 25.0.3+480.61'
root_cause: |
  `actions/setup-java` uses the `semver` library to parse and compare Java version numbers.
  The JetBrains Runtime (JBR) distribution uses a non-standard version format that includes
  a multi-part build number after the `+` separator, such as `17.0.8.1+1080.1` or
  `25.0.3+480.61`.

  Standard semver build metadata (the `+` portion) must consist of alphanumerics and hyphens
  with no embedded dots. JBR's build metadata like `1080.1` and `480.61` contains a dot,
  which semver parsers reject as malformed.

  The `isVersionSatisfies` function in `setup-java` calls `semver.coerce()` or `semver.valid()`
  on the candidate version string. When the JBR version string cannot be coerced to a valid
  semver, the function throws:

    Error: Java setup process failed due to: Invalid Version: 17.0.8.1+1080.1

  The error occurs at the version satisfaction check during tool cache lookup, before any
  download or installation attempt. Both Windows and Ubuntu runners are affected.

  Affected JBR version format: `MAJOR.MINOR.PATCH.BUILD+META.SUB` where `META.SUB` (e.g.,
  `1080.1`) is the JBR build metadata with a dot separator.

  Source: actions/setup-java#1008 (May 2026, labeled bug, fix proposed in PR#1009 —
  `reject non-semver candidate versions in isVersionSatisfies`).
fix: |
  **Workaround 1 — use only the major.minor.patch portion of the version:**
  Specify the Java version number without the build metadata suffix. `setup-java` will resolve
  the latest matching JBR release for that version:

    java-version: "17"          # latest JBR 17
    java-version: "17.0.8"      # latest JBR 17.0.8 patch
    java-version: "25"          # latest JBR 25

  **Workaround 2 — use a version range:**
  Use a semver-compatible range expression to pin to a specific release:

    java-version: ">=17.0.8 <17.0.9"

  **Long-term fix:** Pin to a setup-java version once actions/setup-java PR#1009
  is merged and released — it fixes the `isVersionSatisfies` function to handle
  non-semver JBR build metadata strings without throwing.
fix_code:
  - language: yaml
    label: 'Broken — exact JBR version with multi-part build metadata fails'
    code: |
      # ❌ BROKEN: JBR version "25.0.3+480.61" has a dotted build number — semver rejects it
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25.0.3+480.61"     # Error: Java setup process failed due to: Invalid Version
  - language: yaml
    label: 'Fixed — use major.minor.patch without build metadata'
    code: |
      # ✅ FIXED: Omit the +BUILD suffix — setup-java resolves the latest JBR 25.0.3 build
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25.0.3"            # resolves to latest JBR 25.0.3.x

      # Or specify just the major version for maximum flexibility:
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25"                # resolves to latest JBR 25.x
  - language: yaml
    label: 'Fixed — use version range for approximate pinning'
    code: |
      # ✅ FIXED: use semver-compatible range to stay close to the desired build
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: ">=17.0.8 <17.0.9"  # any JBR 17.0.8.x
prevention:
  - 'When using `distribution: jetbrains` in setup-java, do not copy the full JBR version string (e.g., from release notes) that includes a dotted build suffix like `+1080.1` or `+480.61`.'
  - 'Specify only the major.minor.patch portion of the JBR version (e.g., "17.0.8" instead of "17.0.8.1+1080.1") — setup-java resolves the latest build for that patch.'
  - 'Track actions/setup-java releases for a version that includes PR#1009 to handle JBR non-semver versions correctly without workarounds.'
docs:
  - url: 'https://github.com/actions/setup-java/issues/1008'
    label: 'actions/setup-java#1008 — Error parsing JBR version (May 2026)'
  - url: 'https://github.com/actions/setup-java/pull/1009'
    label: 'actions/setup-java PR#1009 — Fix: reject non-semver candidate versions in isVersionSatisfies'
  - url: 'https://github.com/actions/setup-java?tab=readme-ov-file#supported-distributions'
    label: 'setup-java README — Supported distributions including JetBrains Runtime'
