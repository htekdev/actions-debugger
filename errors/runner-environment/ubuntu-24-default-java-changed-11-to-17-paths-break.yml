id: runner-environment-281
title: 'ubuntu-24.04 Default Java Changed from OpenJDK 11 to OpenJDK 17 — Hardcoded JDK 11 Paths and `JAVA_HOME` Break'
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - java
  - openjdk
  - java-11
  - java-17
  - setup-java
  - maven
  - gradle
  - migration
patterns:
  - regex: '/usr/lib/jvm/java-11-openjdk.*No such file or directory'
    flags: 'i'
  - regex: 'error: Source option 11 is no longer supported\. Use 17 or later'
    flags: 'i'
  - regex: 'Cannot find JDK.*version.*11|JDK 11.*not.*found|java-11.*not.*found'
    flags: 'i'
  - regex: 'JAVA_HOME.*java-11.*invalid|JAVA_HOME is set to an invalid directory.*java-11'
    flags: 'i'
error_messages:
  - 'bash: /usr/lib/jvm/java-11-openjdk-amd64/bin/java: No such file or directory'
  - 'error: Source option 11 is no longer supported. Use 17 or later.'
  - 'JAVA_HOME is set to an invalid directory: /usr/lib/jvm/java-11-openjdk-amd64'
  - 'Cannot find JDK version 11 in JAVA_HOME_11_X64'
root_cause: |
  When GitHub began rolling out Ubuntu 24.04 as `ubuntu-latest` (December 2024 -
  January 2025), the default Java Development Kit changed:

  - ubuntu-22.04: default JDK = OpenJDK **11**, with 8, 17, 21 also available
  - ubuntu-24.04: default JDK = OpenJDK **17**, with 8, 11, 21, 25 also available

  This change (confirmed in runner-images#9848) affects workflows in several ways:

  1. **Hardcoded JDK 11 path**: Scripts referencing
     `/usr/lib/jvm/java-11-openjdk-amd64/` directly fail because this path is
     not the default location on ubuntu-24.04 (Java 17 is at that convention,
     not Java 11).

  2. **`JAVA_HOME` env var points to Java 17**: Any `JAVA_HOME`-dependent build
     tool that was relying on the implicit Java 11 now gets Java 17. While Java 17
     is backward-compatible, stricter deprecation warnings become errors in some
     cases, and tools that parse `JAVA_HOME` paths to infer the version may misfire.

  3. **Compiler source/target 11 rejection in newer toolchains**: With `javac`
     from Java 21+ or certain newer JDK toolchains, `-source 11 -target 11` may
     emit "error: Source option 11 is no longer supported. Use 17 or later."
     This does not apply to all JDK 17 scenarios but can appear when using
     `-source`/`-target` flags that reference older versions than the JDK
     two-version-behind cutoff.

  4. **`JAVA_HOME_11_X64` env var resolves to empty**: On ubuntu-24.04 runners
     that do not have Java 11 pre-installed in the toolcache, this env var is
     empty. Scripts that use it without checking fail silently or with an invalid
     `JAVA_HOME`.
fix: |
  Use `actions/setup-java` with an explicit `java-version` to pin the exact JDK
  version. This is the canonical, portable approach that works across all runner OS
  versions and is immune to runner image default changes.
fix_code:
  - language: yaml
    label: 'Pin Java 11 with setup-java (most portable fix)'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                java-version: '11'
                distribution: 'temurin'

            - name: Build with Maven
              run: mvn -B package --no-transfer-progress

            - name: Build with Gradle
              run: ./gradlew build
  - language: yaml
    label: 'Use matrix to test multiple Java versions'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04
          strategy:
            matrix:
              java: ['11', '17', '21']
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                java-version: ${{ matrix.java }}
                distribution: 'temurin'
            - run: mvn -B verify
prevention:
  - 'Always use `actions/setup-java` with an explicit `java-version` — never rely on the runner image default.'
  - 'Avoid hardcoding JDK installation paths like `/usr/lib/jvm/java-11-openjdk-amd64/`; use `$JAVA_HOME` env var set by `setup-java`.'
  - 'Use `$JAVA_HOME_11_X64` env var from the runner (if Java 11 is pre-installed) as a fallback, but prefer `setup-java` for reliability.'
  - 'Check the runner-images README for your ubuntu version to verify which Java versions are pre-installed before migrating.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/9848'
    label: 'runner-images#9848 — Ubuntu 24.04 available: default Java changed from 11 to 17'
  - url: 'https://github.com/actions/setup-java'
    label: 'actions/setup-java — Official action to pin Java version in workflows'
  - url: 'https://github.blog/changelog/2024-09-25-actions-new-images-and-ubuntu-latest-changes/'
    label: 'GitHub Changelog — ubuntu-latest switches to Ubuntu 24.04 (September 2024)'
