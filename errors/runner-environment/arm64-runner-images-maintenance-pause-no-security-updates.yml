id: runner-environment-304
title: 'ubuntu-24.04-arm and ubuntu-22.04-arm receive no updates during Arm64 image maintenance transfer (May–June 2026)'
category: runner-environment
severity: warning
tags:
  - arm64
  - ubuntu-arm
  - security
  - runner-image
  - maintenance
  - no-updates
patterns:
  - regex: 'ubuntu-24\.04-arm|ubuntu-22\.04-arm'
    flags: 'i'
  - regex: 'CVE.*arm.*runner|vulnerability.*arm64.*runner'
    flags: 'i'
  - regex: 'arm.*runner.*image.*not.*updated'
    flags: 'i'
error_messages:
  - 'ubuntu-24.04-arm runner image has not been updated'
  - 'No release notes found for ubuntu-24.04-arm'
  - 'CVE-XXXX-XXXXX: affected package present on ubuntu-24.04-arm runner'
root_cause: |
  As of May 14, 2026, GitHub is migrating the Arm64 runner images (ubuntu-24.04-arm
  and ubuntu-22.04-arm) from being maintained by Arm Limited, LLC to being fully
  managed by GitHub. During the migration period, these images are temporarily frozen:
  - No package updates are applied to the images
  - No security patches are applied
  - No new release notes appear in actions/runner-images for these images
  - Bug fixes and CVE mitigations are not delivered

  Workflows that depend on ubuntu-24.04-arm or ubuntu-22.04-arm are silently running
  on frozen images with potentially outdated packages and unpatched vulnerabilities.
  There is no in-workflow indicator that the image has not been updated — the runner
  starts normally and all steps execute as usual.

  The partner-runner-images repository (previously hosting Arm64 images) will be
  archived after the transition is complete. After the migration, all support moves
  to actions/runner-images.

  Source: GitHub Changelog, May 14 2026; GitHub Actions Upcoming image migrations.
fix: |
  During the maintenance pause, mitigations include:

  1. Explicitly update critical packages at the start of affected workflows:
       - run: sudo apt-get update && sudo apt-get upgrade -y

  2. If security compliance requires up-to-date images, temporarily switch to
     self-hosted ARM64 runners that you control and can patch independently.

  3. Monitor the actions/runner-images repository for the announcement that Arm64
     image maintenance has resumed under GitHub management — GitHub will post an
     issue similar to the original migration announcement when the transition completes.

  4. If a critical CVE is discovered in a package on the frozen image, open an issue
     in actions/runner-images (not actions/partner-runner-images) per the migration
     guidance.
fix_code:
  - language: yaml
    label: 'Explicitly upgrade packages on ARM64 runner during maintenance freeze'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04-arm
          steps:
            - name: Update packages (ARM64 image maintenance freeze workaround)
              # Remove this step once GitHub announces maintenance has resumed
              run: |
                sudo apt-get update -qq
                sudo apt-get upgrade -y --no-install-recommends
            - uses: actions/checkout@v4
            - name: Build
              run: make build
  - language: yaml
    label: 'Self-hosted ARM64 runner as fallback during maintenance pause'
    code: |
      jobs:
        build:
          # Switch to self-hosted ARM64 runner for security-sensitive builds
          # during ubuntu-24.04-arm maintenance freeze
          runs-on: [self-hosted, linux, arm64, patched]
          steps:
            - uses: actions/checkout@v4
            - run: make build
prevention:
  - 'Subscribe to github.blog/changelog and actions/runner-images issues for Arm64 image maintenance announcements'
  - 'For security-sensitive workflows on ARM64, use self-hosted runners you control and patch yourself'
  - 'Add an explicit apt-get update step as a defense-in-depth measure on any image that may have frozen packages'
  - 'After the transition completes, monitor actions/runner-images (not partner-runner-images) for new ARM64 release notes'
docs:
  - url: 'https://github.blog/changelog/2026-05-14-github-actions-upcoming-image-migrations/'
    label: 'GitHub Changelog: Upcoming image migrations — Arm64 maintenance transfer (May 14, 2026)'
  - url: 'https://github.com/actions/runner-images'
    label: 'actions/runner-images: GitHub-managed runner image repository (new Arm64 home)'
  - url: 'https://github.com/actions/partner-runner-images'
    label: 'actions/partner-runner-images: Being archived after Arm64 migration completes'
