id: runner-environment-476
title: 'Ubuntu ARM64 larger/partner runners missing Docker — "Unable to locate executable file: docker"'
category: runner-environment
severity: error
tags:
  - ubuntu
  - arm64
  - docker
  - larger-runners
  - partner-runners
  - docker-buildx
  - ecr
patterns:
  - regex: 'Unable to locate executable file: docker'
    flags: 'i'
  - regex: 'failed to connect to the docker API at unix:///var/run/docker\.sock: connect: no such file or directory'
    flags: 'i'
  - regex: 'failed to initialize builder.*unix:///var/run/docker\.sock'
    flags: 'i'
error_messages:
  - "Unable to locate executable file: docker."
  - "ERROR: failed to initialize builder ... failed to connect to the docker API at unix:///var/run/docker.sock: connect: no such file or directory"
  - "ERROR: failed to initialize builder: could not create builder: failed to connect to the docker API at unix:///var/run/docker.sock: connect: no such file or directory"
root_cause: |
  On GitHub-hosted Ubuntu ARM64 runners — particularly **partner runner images** (exposed via
  `runs-on: ubuntu-24.04-arm`, `runs-on: ubuntu-22.04-arm`, and GitHub Actions larger runners
  such as 8-core, 16-core, 32-core, and 64-core ARM64 variants) — Docker may be absent or
  mis-configured in some image versions.

  The `partner-runner-images` repository documents Docker as pre-installed, but certain
  image builds (particularly older variants and some larger-runner pool images) shipped
  without Docker or with the Docker daemon socket absent from `/var/run/docker.sock`.

  This causes any step that invokes `docker`, `docker/setup-buildx-action`, `docker/login-action`,
  `aws-actions/amazon-ecr-login`, or any Docker-dependent CLI to fail immediately.

  The issue was partially fixed for standard 2-core and 4-core ARM64 runners in June 2026
  (image version ~20260611+). However, some **64-core ARM64 larger runners** continued to
  exhibit the same `docker.sock` missing symptom even after the standard-runner fix was
  deployed, suggesting the larger runner pool images are on a slower rollout cadence.

  Root causes vary by pool:
  - **Partner images** — Docker was missing from initial ARM64 image builds, corrected in the
    June 2026 image update cycle.
  - **Larger runners (64-core)** — still potentially affected after the 32-core fix shipped,
    indicating the fix did not propagate to all pool sizes simultaneously.
fix: |
  **Option 1 — Re-run the failing job (short-term):**
  The image rollout is incremental. Re-running the job may land it on an updated host where
  Docker is present. This is only reliable once the fix has been fully deployed across all pool
  sizes.

  **Option 2 — Install Docker in the workflow:**
  If Docker is absent, add an explicit installation step before the first Docker-dependent step:

    - name: Install Docker
      run: |
        sudo apt-get update -y
        sudo apt-get install -y docker.io
        sudo systemctl start docker
        sudo usermod -aG docker runner

  **Option 3 — Use a self-hosted ARM64 runner with Docker pre-installed:**
  For consistent Docker availability, use a self-hosted ARM64 runner whose image is fully
  controlled and includes Docker.

  **Option 4 — Check runner image version:**
  Add a diagnostic step to confirm the Docker socket presence:

    - name: Check Docker availability
      run: |
        echo "Runner image version:" && cat /etc/image-release 2>/dev/null || true
        which docker && docker version || echo "Docker not found on PATH"
        ls -l /var/run/docker.sock 2>/dev/null || echo "docker.sock absent"
fix_code:
  - language: yaml
    label: 'Failing — Ubuntu ARM64 runner missing Docker'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04-arm     # Docker may be absent on partner/larger ARM runners
          steps:
            - uses: docker/setup-buildx-action@v3  # fails: Unable to locate executable file: docker

  - language: yaml
    label: 'Workaround — install Docker explicitly if absent'
    code: |
      jobs:
        build:
          runs-on: ubuntu-24.04-arm
          steps:
            - name: Install Docker if absent
              run: |
                if ! command -v docker &>/dev/null; then
                  sudo apt-get update -y
                  sudo apt-get install -y docker.io
                  sudo systemctl start docker
                  sudo usermod -aG docker runner
                fi

            - uses: docker/setup-buildx-action@v3

  - language: yaml
    label: 'Diagnostic — check runner image and Docker availability'
    code: |
      jobs:
        diagnose:
          runs-on: ubuntu-24.04-arm
          steps:
            - name: Runner and Docker diagnostic
              run: |
                uname -m
                cat /etc/image-release 2>/dev/null || true
                which docker && docker version || echo "docker not found"
                ls -l /var/run/docker.sock 2>/dev/null || echo "docker.sock absent"
prevention:
  - "Pin to a known-good image version using a specific `runs-on` image tag if your ARM64 workflow requires Docker and you experience intermittent failures."
  - "Add a `docker version` or `docker info` step early in ARM64 workflows to fail fast with a clear error rather than a confusing downstream failure."
  - "For production ARM64 + Docker workloads, prefer self-hosted runners where the image is fully controlled and validated."
  - "Monitor runner-images release notes for ARM64 image updates that confirm Docker availability across all pool sizes."
docs:
  - url: 'https://github.com/actions/runner-images/issues/14051'
    label: 'runner-images#14051: Ubuntu 24.04 ARM64 missing Docker (June 2026, 7 reactions)'
  - url: 'https://github.com/actions/partner-runner-images/blob/main/images/Ubuntu2404-Readme.md'
    label: 'Partner runner images: Ubuntu 24.04 ARM64 README (Docker listed as installed)'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/using-larger-runners/about-larger-runners'
    label: 'GitHub Docs: About larger runners'
