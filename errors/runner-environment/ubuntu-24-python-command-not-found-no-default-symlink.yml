id: runner-environment-297
title: "ubuntu-24.04 'python' command not found — no default python symlink"
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - python
  - command-not-found
  - version-bump
  - symlink
patterns:
  - regex: "python: command not found"
    flags: i
  - regex: "'/usr/bin/env': 'python': No such file or directory"
    flags: i
  - regex: '/usr/bin/env.*python.*No such file or directory'
    flags: i
error_messages:
  - "/usr/bin/env: 'python': No such file or directory"
  - "bash: python: command not found"
  - "make[1]: python: command not found"
  - "Error: Process completed with exit code 127."
root_cause: |
  ubuntu-22.04 runner images included the `python-is-python3` package which creates a
  /usr/bin/python symlink pointing to /usr/bin/python3. ubuntu-24.04 does NOT install
  `python-is-python3` by default — only `python3` and `python3.12` are in PATH.

  Scripts, Makefiles, and third-party tools that invoke the bare `python` command
  (not `python3`) fail with "command not found" (exit code 127) on ubuntu-24.04.
  Common failure scenarios include:
  - Makefile rules using `python setup.py` or `python -m pytest`
  - Shell scripts with `#!/usr/bin/env python` shebang lines
  - Native build systems (node-gyp, CMake, Meson, Bazel) that locate Python via
    the bare `python` binary name
  - Third-party actions or tools that assume `python` resolves to Python 3

  Note: actions/setup-python installs Python at a versioned path and adds `python3`
  and `pythonX.Y` to PATH but does NOT create a bare `python` symlink by default.
fix: |
  Install python-is-python3 explicitly to restore the python → python3 symlink, or
  use actions/setup-python and update scripts to use python3 instead of python.
fix_code:
  - language: yaml
    label: "Install python-is-python3 to restore the python symlink on ubuntu-24.04"
    code: |
      - name: Ensure python command is available
        run: sudo apt-get install -y python-is-python3
  - language: yaml
    label: "Use actions/setup-python which provides the python binary"
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # actions/setup-python adds python, python3, and python3.12 to PATH
prevention:
  - "Always use `python3` in scripts and Makefiles rather than the bare `python` command."
  - "Add `python-is-python3` to your apt install step when migrating from ubuntu-22.04."
  - "Audit Makefiles, scripts, and action config files for bare `python` invocations."
  - "Use actions/setup-python@v5 which provides a `python` alias in addition to `python3`."
docs:
  - url: "https://github.com/actions/setup-python"
    label: "actions/setup-python — official Python environment setup action"
  - url: "https://packages.ubuntu.com/noble/python-is-python3"
    label: "python-is-python3 Ubuntu package"
  - url: "https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md"
    label: "ubuntu-24.04 runner image README — Python tooling"
