id: runner-environment-410
title: 'macOS-26 iOS Simulator Runtime Removed by 3-Version Xcode Policy — "iOS 26.x is not installed"'
category: runner-environment
severity: error
tags:
  - macos-26
  - macos-latest
  - xcode
  - ios
  - simulator
  - runner-image
  - sdk-policy
  - breaking-change
patterns:
  - regex: 'iOS 2[6-9]\.[0-9]+ is not installed\. Please download and install the platform'
    flags: 'i'
  - regex: 'Unable to find a destination matching.*platform:iOS.*iOS 2[6-9]\.[0-9]+ is not installed'
    flags: 'i'
  - regex: 'Ineligible destinations.*iphoneos.*iOS 26\.(0|1|2|3).*not installed'
    flags: 'i'
  - regex: 'xcodebuild: error: Unable to find a destination.*iOS.*26\.(0|1|2)'
    flags: 'i'
  - regex: 'simulator runtime.*iOS 26\.[0-3].*not available|Could not find.*runtime.*iOS.26\.[0-3]'
    flags: 'i'
error_messages:
  - "xcodebuild: error: Unable to find a destination matching the provided destination specifier:"
  - "{ platform:iOS, id:dvtdevice-DVTiPhonePlaceholder-iphoneos:placeholder, name:Any iOS Device, error:iOS 26.1 is not installed. Please download and install the platform from Xcode > Settings > Components. }"
  - "Ineligible destinations for the \"dev\" scheme: { platform:iOS, ... error:iOS 26.1 is not installed. }"
  - "error: iOS 26.2 is not installed. Please download and install the platform from Xcode > Settings > Components."
root_cause: |
  GitHub's runner-image support policy retains simulator runtimes for only the **3 most
  recent major.minor Xcode versions** installed on an image. When a new Xcode version reaches
  GA, its simulator runtimes are added and the oldest set is removed to keep image size
  manageable.

  On macOS-26, Xcode 26.5 went from Release Candidate to GA around May 20, 2026. Once the
  runner images were updated to include Xcode 26.5, the iOS/tvOS/watchOS simulator runtimes
  for **Xcode 26.1 and 26.2** were removed — only three versions (Xcode 26.2, 26.4.1, 26.5)
  retain full platform tools at any one time.

  Workflows that pin Xcode via `setup-xcode` to version 26.1.x will still have the Xcode app
  on disk, but the iOS Simulator runtime for iOS 26.1 is gone. Any `xcodebuild` invocation
  that requires a simulator destination (e.g., `-destination 'platform=iOS Simulator,OS=26.1'`)
  will fail with "iOS 26.1 is not installed."

  This is a recurrence of the same policy applied to macOS-15 (see runner-environment-045),
  but with different Xcode version numbers. The policy is documented in the runner-images
  support policy: https://github.com/actions/runner-images#support-policy

  Source: actions/runner-images#14146 (reported May 22, 2026)
fix: |
  **Option 1 — Pin to a Xcode version that retains full platform tools** (recommended):
  Check the macOS-26 runner README for the currently supported 3 Xcode versions with full
  simulator runtimes, then pin to one of those versions:

  ```yaml
  - name: Select Xcode 26.4.1 (has simulator runtimes)
    run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
  ```

  **Option 2 — Use `maxim-lobanov/setup-xcode` and pick a supported version**:
  ```yaml
  - uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: '26.5'   # or '26.4.1' — check README for what has platform tools
  ```

  **Option 3 — Build for generic device instead of simulator**:
  If your CI only needs to compile (not run tests on simulator), avoid the simulator
  destination entirely:
  ```yaml
  - run: |
      xcodebuild build \
        -scheme MyApp \
        -destination 'generic/platform=iOS' \
        CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
  ```

  **Option 4 — Download missing simulator runtime** (slow, fragile):
  You can install the missing runtime on demand, but this adds 5-10 minutes to each run:
  ```yaml
  - run: xcodebuild -downloadPlatform iOS
  ```
fix_code:
  - language: yaml
    label: "Pin to a Xcode version with full iOS simulator runtimes (Option 1)"
    code: |
      jobs:
        test-ios:
          runs-on: macos-latest   # macos-26
          steps:
            - uses: actions/checkout@v4

            # Check macos-26 README for the current 3 Xcode versions with platform tools.
            # As of June 2026 on macos-26: 26.2, 26.4.1, and 26.5 have full simulator runtimes.
            - name: Select Xcode with simulator runtimes
              run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

            - name: Run iOS simulator tests
              run: |
                xcodebuild test \
                  -scheme MyApp \
                  -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4' \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO

  - language: yaml
    label: "Use setup-xcode action to pin a supported Xcode version (Option 2)"
    code: |
      jobs:
        test-ios:
          runs-on: macos-latest   # macos-26
          steps:
            - uses: actions/checkout@v4

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                xcode-version: '26.5'  # Pinned to a version with full simulator runtimes

            - name: Run iOS tests
              run: |
                xcodebuild test \
                  -scheme MyApp \
                  -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro'
prevention:
  - "Always check the macOS-26 runner README before writing xcodebuild destinations — it lists which Xcode versions have full simulator runtimes."
  - "When `setup-xcode` pins to an older Xcode version (e.g., 26.1.x), verify that the corresponding iOS Simulator runtime is still available on the current runner image."
  - "Prefer using `OS=latest` in xcodebuild destinations instead of hardcoding a specific iOS version, so that your workflow automatically uses an available runtime."
  - "Subscribe to runner-images releases and announcements to know when the 3-version policy rotates and removes older simulator runtimes."
  - "Test on `macos-26` explicitly rather than `macos-latest` during transitions — macos-latest switches images at different times than macos-26."
