id: runner-environment-450
title: "setup-java fails with Invalid Version when using JetBrains Runtime (JBR) extended version notation"
category: runner-environment
severity: error
tags:
  - setup-java
  - jetbrains
  - JBR
  - version
  - distribution
  - Invalid-Version
patterns:
  - regex: 'Invalid Version.*\d+\.\d+\.\d+\.\d+\+\d+\.\d+'
    flags: i
  - regex: 'Java setup process failed.*Invalid Version'
    flags: i
  - regex: 'Error: Invalid Version: \d+\.\d+\.\d+\.\d+\+\d+'
    flags: i
error_messages:
  - "Error: Java setup process failed due to: Invalid Version: 17.0.8.1+1080.1"
  - "Error: Java setup process failed due to: Invalid Version:"
root_cause: |
  JetBrains Runtime (JBR) uses an extended version numbering scheme with **four-part
  version segments** and a build qualifier: `{major}.{minor}.{patch}.{sub}+{build}.{qualifier}`
  (e.g., `17.0.8.1+1080.1` or `25.0.3+480.61`).

  `actions/setup-java` v5 parses the `java-version` input against the standard
  semantic versioning pattern (three-part semver: `{major}.{minor}.{patch}`). The
  fourth sub-version segment (`17.0.8.**1**`) causes the semver parser to reject the
  version string with `Invalid Version`.

  This affects the `jetbrains` distribution specifically because JBR's version
  catalogue uses this extended notation. Using the same version string you see in
  JBR release names (e.g., `jbr-17.0.8.1+1080.1`) in `java-version:` triggers the
  parse failure immediately on both Ubuntu and Windows hosted runners.

  Tracked in actions/setup-java#1008 (May 2026).
fix: |
  Use only the **major version** (or a three-part semver) in `java-version:` for
  JetBrains Runtime — do not include the four-part version or build qualifier:

  ```yaml
  # WRONG — fails with Invalid Version
  java-version: "17.0.8.1+1080.1"

  # CORRECT — resolves to the latest JBR 17 release
  java-version: "17"

  # CORRECT — three-part version (resolves to latest matching)
  java-version: "17.0.8"
  ```
fix_code:
  - language: yaml
    label: "Fix: Use major version for JetBrains Runtime"
    code: |
      - name: Set up JBR 17
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '17'      # Major version only — not "17.0.8.1+1080.1"

      - name: Set up JBR 25 (latest)
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'      # NOT "25.0.3+480.61"
  - language: yaml
    label: "Fix: Three-part semver also works"
    code: |
      - name: Set up JBR 17.0.8
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '17.0.8'  # Three-part semver OK; four-part with sub-version fails
prevention:
  - "Always use major-only version strings (e.g. '17', '21', '25') with the jetbrains distribution"
  - "Do not copy the full JBR release tag (e.g. '17.0.8.1+1080.1') into java-version — strip it to the three-part version"
  - "Check the JetBrains Runtime GitHub releases for available versions before pinning"
docs:
  - url: "https://github.com/actions/setup-java/issues/1008"
    label: "actions/setup-java#1008 — Error parsing JBR version"
  - url: "https://github.com/JetBrains/JetBrainsRuntime/releases"
    label: "JetBrains Runtime releases"
  - url: "https://github.com/actions/setup-java#supported-distributions"
    label: "setup-java supported distributions and version formats"
