id: runner-environment-358
title: 'Node 24 V8 Maglev JIT silently crashes JavaScript actions on Windows x64 self-hosted runners (pre-v2.335.0)'
category: runner-environment
severity: error
tags:
  - node24
  - windows
  - maglev
  - v8-jit
  - self-hosted-runner
  - silent-crash
  - exit-code
patterns:
  - regex: 'Node Action run completed with exit code -1073740791'
    flags: 'i'
  - regex: 'Process completed with exit code -1073740791'
    flags: 'i'
  - regex: 'runner.*completed.*exit.*-1073740791|exit.*-1073740791.*windows'
    flags: 'i'
  - regex: 'STATUS_STACK_BUFFER_OVERRUN|0xC0000409'
    flags: 'i'
error_messages:
  - "##[debug]Node Action run completed with exit code -1073740791"
  - "Process completed with exit code -1073740791"
root_cause: |
  Node.js 24 ships with V8's Maglev JIT compiler enabled by default. On Windows x64, the
  Maglev JIT occasionally compiles hot code paths to machine code that triggers a
  STATUS_STACK_BUFFER_OVERRUN exception (Windows Structured Exception 0xC0000409,
  exit code -1073740791). The crash is deterministic for certain Node build/V8 versions
  but appears intermittent from a workflow perspective because it depends on which
  functions get JIT-compiled.

  This affects any JavaScript action running on Node 24 (actions built with `using: node24`
  in their action.yml) on Windows x64 self-hosted runners. The action process crashes
  mid-execution with no actionable error output — the step simply fails with exit code
  -1073740791 and no explanation.

  GitHub-hosted runners are protected by runner v2.335.0 (released June 8, 2026), which
  automatically prepends `--no-maglev` to all Node 24 invocations on Windows x64.
  Self-hosted runners not yet updated to v2.335.0 remain vulnerable.

  Root cause tracked in nodejs/node#62260 (opened March 2026, still open as of June 2026).
fix: |
  Update self-hosted runners to v2.335.0 or later. The runner now automatically passes
  `--no-maglev` to all Node 24 process invocations on Windows x64, preventing the Maglev
  JIT from compiling the affected code paths.

  As a machine-level workaround on older runners, set the environment variable before
  starting the runner service:

    ACTIONS_RUNNER_DISABLE_NODE_MAGLEV=1

  Or add it as a step-level env var in the workflow (if downgrading the runner is not
  immediately possible):

    env:
      ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: '1'
fix_code:
  - language: yaml
    label: "Step-level workaround on pre-2.335.0 self-hosted runners"
    code: |
      - name: Some Node 24 action step
        uses: actions/some-action@v3
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: '1'
  - language: yaml
    label: "Re-enable Maglev once runner is updated to v2.335.0+"
    code: |
      # After updating self-hosted runner to v2.335.0+:
      # Remove ACTIONS_RUNNER_DISABLE_NODE_MAGLEV env var.
      # The runner automatically disables Maglev on Windows x64 for Node 24.
      #
      # To re-enable Maglev if needed (not recommended):
      #   env:
      #     ACTIONS_RUNNER_REENABLE_NODE_MAGLEV: '1'
prevention:
  - "Keep self-hosted runners updated to the latest release — runner v2.335.0+ automatically mitigates this crash on Windows x64 Node 24"
  - "Monitor https://github.com/actions/runner/releases for runner updates that include Node runtime fixes"
  - "Use ubuntu-latest or macos-latest GitHub-hosted runners for Node 24 actions when possible, as they always run the latest patched runner version"
  - "If crashes are intermittent and reproduce only on Windows, suspect Node 24 / V8 JIT issues and check the runner version first"
docs:
  - url: "https://github.com/nodejs/node/issues/62260"
    label: "nodejs/node #62260 — V8 Maglev JIT causes STATUS_STACK_BUFFER_OVERRUN on Windows"
  - url: "https://github.com/actions/runner/pull/4447"
    label: "actions/runner PR #4447 — Add --no-maglev workaround for Node 24 on Windows x64"
  - url: "https://github.com/actions/runner/releases/tag/v2.335.0"
    label: "actions/runner v2.335.0 release notes"
  - url: "https://github.com/SwiftyLab/setup-swift/issues/506"
    label: "Real-world report: SwiftyLab/setup-swift #506 — Windows setup occasionally failing"
