id: runner-environment-401
title: 'fetch-tags: true fatal error on tag push trigger — "Cannot fetch both <sha> and refs/tags/<tag>"'
category: runner-environment
severity: error
tags:
  - checkout
  - fetch-tags
  - git-tags
  - tag-trigger
  - refspec
  - push-tags
patterns:
  - regex: 'Cannot fetch both .{1,80} and refs/tags/.{1,60} to refs/tags/'
    flags: 'i'
  - regex: 'fatal: Cannot fetch both'
    flags: 'i'
error_messages:
  - "Error: fatal: Cannot fetch both <sha> and refs/tags/<tag> to refs/tags/<tag>"
  - "fatal: Cannot fetch both abc123def456 and refs/tags/v1.0.0 to refs/tags/v1.0.0"
root_cause: |
  When a workflow is triggered by a tag push (`on: push: tags: '*'`) and `actions/checkout`
  uses `fetch-tags: true`, the action builds a refspec list that tries to fetch the same
  destination `refs/tags/<tag>` from two different sources simultaneously:

  1. The main checkout refspec maps `github.ref` (already `refs/tags/<tag>` on a tag push)
     to the local tag ref `refs/tags/<tag>` via its SHA.
  2. The `fetch-tags: true` option adds an explicit `refs/tags/<tag>:refs/tags/<tag>` refspec.

  Git rejects this because a single destination refspec cannot be written from two different
  sources in the same `git fetch` invocation. The fatal error "Cannot fetch both <sha> and
  refs/tags/<tag> to refs/tags/<tag>" is emitted immediately and the checkout step fails.

  This affected checkout@v3.6.0 through v6.0.1. The root cause was fixed in
  `actions/checkout@v6.0.2` (PR #2356), which detects when the trigger ref is already a tag
  and avoids adding a duplicate tag refspec to the fetch list.

  Workflows triggered by branch pushes or other events are not affected — only tag push
  triggers combined with `fetch-tags: true` cause the conflict.
fix: |
  Upgrade to `actions/checkout@v6` (v6.0.2 or later). The fix removes the duplicate tag
  refspec when the workflow is already triggered by a tag push.

  If you must remain on checkout@v4 or v5, remove `fetch-tags: true` from tag-push workflows.
  When the trigger is `on: push: tags:`, the pushed tag is already present in the checkout
  without needing `fetch-tags: true`. To fetch all other historical tags as well, add an
  explicit `git fetch --tags` step after checkout.
fix_code:
  - language: yaml
    label: 'Upgrade to checkout@v6 — the definitive fix'
    code: |
      on:
        push:
          tags: '*'

      jobs:
        release:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v6
              with:
                fetch-tags: true
                fetch-depth: 0
  - language: yaml
    label: 'Workaround for checkout@v4/v5 — remove fetch-tags on tag push, fetch manually'
    code: |
      on:
        push:
          tags: '*'

      jobs:
        release:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
                # Do NOT use fetch-tags: true on tag push triggers with checkout < v6.0.2
                # The pushed tag is already available; fetch all other tags explicitly:
            - name: Fetch all tags
              run: git fetch --tags --force
prevention:
  - 'Use actions/checkout@v6 (v6.0.2+) which fixes the duplicate refspec issue on tag triggers'
  - 'Do not combine fetch-tags: true with tag push triggers on checkout@v3/v4/v5'
  - 'On tag push workflows, the triggered tag is always present — only historical tags need explicit fetching'
  - 'Use git fetch --tags after checkout as a safe, version-agnostic way to fetch all tags'
docs:
  - url: 'https://github.com/actions/checkout/issues/1467'
    label: 'actions/checkout#1467: Can''t fetch with fetch-tags when triggered by tag'
  - url: 'https://github.com/actions/checkout/pull/2356'
    label: 'actions/checkout PR #2356: Fix duplicate tag refspec on tag push trigger'
  - url: 'https://github.com/actions/checkout/releases/tag/v6.0.2'
    label: 'actions/checkout v6.0.2 release notes'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-git-checkout'
    label: 'GitHub Docs: Using git checkout in workflows'
