id: runner-environment-338
title: 'pnpm 11.x requires Node.js >=22.13 — fails with ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite on Node 20'
category: runner-environment
severity: error
tags:
  - pnpm
  - node
  - setup-node
  - node-sqlite
  - version-incompatibility
  - pnpm-11
patterns:
  - regex: 'ERR_UNKNOWN_BUILTIN_MODULE.*node:sqlite|No such built-in module: node:sqlite'
    flags: 'i'
  - regex: 'warn: This version of pnpm requires at least Node\.js v22\.13'
    flags: 'i'
  - regex: 'This version of pnpm requires at least Node\.js v22\.13'
    flags: 'i'
error_messages:
  - 'Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite'
  - 'warn: This version of pnpm requires at least Node.js v22.13'
  - 'warn: The current version of Node.js is v20.20.2'
  - 'node:internal/modules/cjs/loader:1031'
root_cause: |
  pnpm 11.x (released December 2024) internally uses the `node:sqlite` built-in
  module, which was introduced in Node.js 22.5.0. pnpm 11 also declares a hard
  engine requirement of Node.js >=22.13.0.

  When a workflow pins `node-version: '20'` (or any Node version below 22.13) via
  `actions/setup-node`, then installs or invokes pnpm 11.x via `pnpm/action-setup`,
  `corepack`, or `npm install -g pnpm@latest`, pnpm fails immediately on startup.
  Node.js 20 does not include `node:sqlite`; pnpm's internal module resolver throws
  `ERR_UNKNOWN_BUILTIN_MODULE` and aborts before any pnpm command can execute.

  This became widespread in 2026 as pnpm 11 adoption grew, especially for repos
  using a `packageManager` field in `package.json` (which pins the pnpm version
  automatically) or `pnpm/action-setup` with `version: latest`.

  Note: Node.js 20 reached end-of-life on April 30, 2026 and was removed from the
  GitHub-hosted runner toolcache in May 2026 (runner-images#14029). Workflows still
  requesting Node 20 via `actions/setup-node` will download it on demand, which adds
  latency and does not fix the pnpm 11 incompatibility.

  Sources: ncipollo/release-action#613 (May 2026), andrewschristison/pondlog@373bec1
  (May 2026), xerrors/Yuxi#684 (May 2026), nodejs/node#62425.
fix: |
  Upgrade the `node-version` in your `actions/setup-node` step to `'22'` (>=22.13)
  or `'24'`. Node.js 22 is the Maintenance LTS and Node.js 24 is the active LTS for
  GitHub Actions in 2026; both are pre-installed in the runner toolcache.

  If your application code must target Node 20, you can still upgrade the CI
  node-version to 22 for the pnpm install step and then use a `.nvmrc` or
  matrix to test application logic against Node 20.

  Alternatively, pin pnpm 10.x (`version: '10'`) which still supports Node 18
  and 20 and does not use `node:sqlite`.
fix_code:
  - language: yaml
    label: 'Upgrade node-version to 22 or 24 (recommended)'
    code: |
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # was: '20' — pnpm 11.x requires Node >=22.13
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
  - language: yaml
    label: 'Pin pnpm 10.x if Node 20 must be kept'
    code: |
      # pnpm 10.x supports Node 18 and 20 — no node:sqlite dependency
      - uses: pnpm/action-setup@v4
        with:
          version: '10'        # stay on pnpm 10.x until Node is upgraded
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
prevention:
  - 'Pin Node.js >=22.13 in setup-node when using pnpm 11.x or any tool that requires Node 22 built-ins.'
  - 'Read the pnpm changelog when upgrading major versions — pnpm 11 bumped the minimum Node.js requirement from 18 to 22.13.'
  - 'Use the `packageManager` field in `package.json` to pin a specific pnpm version and prevent unexpected major version upgrades via `version: latest`.'
  - 'When using `corepack`, ensure the pinned pnpm version matches the Node.js version in your workflow.'
docs:
  - url: 'https://github.com/ncipollo/release-action/issues/613'
    label: 'ncipollo/release-action#613 — pnpm 11 node:sqlite incompatibility with Node 20 (May 2026)'
  - url: 'https://github.com/nodejs/node/issues/62425'
    label: 'nodejs/node#62425 — node:sqlite built-in added in Node.js 22.5'
  - url: 'https://github.com/actions/runner-images/issues/14029'
    label: 'runner-images#14029 — Node.js 20 removed from runner toolcache (May 2026)'
  - url: 'https://pnpm.io/installation#compatibility'
    label: 'pnpm docs — Node.js compatibility'
