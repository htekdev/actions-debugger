id: runner-environment-472
title: 'setup-dotnet 5.3.0 global.json with rollForward: latestFeature Causes TypeError: Cannot read properties of undefined'
category: runner-environment
severity: error
tags:
  - setup-dotnet
  - global-json
  - rollForward
  - latestFeature
  - dotnet
  - semver
  - type-error
patterns:
  - regex: 'Cannot read properties of undefined.*reading.*substring'
    flags: 'i'
  - regex: "TypeError.*Cannot read properties of undefined"
    flags: 'i'
  - regex: 'setup-dotnet.*reading.*substring|setup.dotnet.*undefined.*substring'
    flags: 'i'
error_messages:
  - "Error: Cannot read properties of undefined (reading 'substring')"
  - "TypeError: Cannot read properties of undefined (reading 'substring')"
root_cause: |
  In `actions/setup-dotnet` v3.5.0 (which introduced the version resolution changes in
  PR #538), the `resolveVersionInput` function attempts to call `.substring()` on the
  result of version parsing when `rollForward: latestFeature` is specified in `global.json`.

  When a `global.json` specifies only major.minor (e.g., `"version": "8.0"`) without a
  patch number, combined with `"rollForward": "latestFeature"`, the internal version
  resolution code reaches a code path where the patch component is `undefined`. The
  function then tries to call `.substring()` on this `undefined` value:

  ```json
  {
    "sdk": {
      "version": "8.0",
      "rollForward": "latestFeature"
    }
  }
  ```

  This causes an unhandled TypeError:
  ```
  Error: Cannot read properties of undefined (reading 'substring')
  ```

  The `latestFeature` rollForward policy instructs the SDK to use the latest feature
  band (i.e., latest 8.x.x), but the version string `"8.0"` does not include the
  minor feature component, causing the version parser to return `undefined` for the
  feature/patch portion that the resolution code expects to call `.substring()` on.

  Affected: `actions/setup-dotnet` v3.5.0 through at least v5.3.x with `global.json`
  using `rollForward: latestFeature` and a version string with fewer than 3 components
  (major.minor only, no patch).

  Reported in actions/setup-dotnet#739. Confirmed on Ubuntu, macOS, and Windows runners.
fix: |
  **Option 1 (recommended): Pin a full 3-part version in global.json**

  Specify a complete major.minor.patch version to satisfy the version parser even when
  `latestFeature` rollForward is used. The rollForward policy will still upgrade to the
  latest feature band:

  ```json
  {
    "sdk": {
      "version": "8.0.100",
      "rollForward": "latestFeature"
    }
  }
  ```

  **Option 2: Use a different rollForward policy with major.minor**

  Switch to `latestMinor` or `latestMajor` which may handle 2-part versions more gracefully,
  or use `feature` which is similar to `latestFeature` but resolves differently:

  ```json
  {
    "sdk": {
      "version": "8.0.100",
      "rollForward": "feature"
    }
  }
  ```

  **Option 3: Specify dotnet-version directly in the action input**

  Bypass global.json version resolution by specifying the version explicitly in the
  workflow step, overriding the global.json rollForward behavior:

  ```yaml
  - uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'
      # global-json-file not set — avoids rollForward resolution bug
  ```

  **Option 4: Pin to setup-dotnet < 3.5.0**

  If the above options are not immediately possible, pin to the last unaffected version:

  ```yaml
  - uses: actions/setup-dotnet@v3.4.0
    with:
      global-json-file: global.json
  ```
fix_code:
  - language: json
    label: 'global.json — fix: use full 3-part version with latestFeature'
    code: |
      {
        "sdk": {
          "version": "8.0.100",
          "rollForward": "latestFeature"
        }
      }
  - language: yaml
    label: 'Workflow — bypass global.json rollForward using dotnet-version input'
    code: |
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
prevention:
  - 'Always specify a full 3-part version (major.minor.patch) in global.json when using rollForward: latestFeature'
  - 'Validate global.json format before committing: major.minor only (e.g., "8.0") is insufficient for some rollForward policies in setup-dotnet >= 3.5.0'
  - 'Test setup-dotnet steps locally with act or in CI before upgrading the action version'
  - 'Monitor actions/setup-dotnet release notes for version resolution behavior changes'
docs:
  - url: 'https://github.com/actions/setup-dotnet/issues/739'
    label: 'actions/setup-dotnet#739 — 5.3.0 breaks global.json with latestFeature'
  - url: 'https://github.com/actions/setup-dotnet/pull/538'
    label: 'actions/setup-dotnet PR#538 — version resolution change that introduced the bug'
  - url: 'https://learn.microsoft.com/en-us/dotnet/core/tools/global-json#rollforward'
    label: 'Microsoft docs — global.json rollForward policy reference'
