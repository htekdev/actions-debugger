id: runner-environment-403
title: "setup-python cache: pip Fails — No requirements.txt or pyproject.toml Found"
category: runner-environment
severity: error
tags:
  - setup-python
  - pip
  - cache
  - pyproject-toml
  - requirements-txt
  - monorepo
patterns:
  - regex: 'No file in .+ matched to \[\*\*/requirements\.txt'
    flags: "i"
  - regex: 'make sure you have checked out the target repository'
    flags: "i"
error_messages:
  - "Error: No file in /home/runner/work/REPO/REPO matched to [**/requirements.txt or **/pyproject.toml], make sure you have checked out the target repository"
  - "Error: No file in /home/runner/work/REPO/REPO matched to [**/requirements.txt], make sure you have checked out the target repository"
root_cause: |
  The `cache: pip` input in `actions/setup-python` triggers a dependency-file search
  across the repository for `**/requirements.txt` and/or `**/pyproject.toml`. If neither
  file is found, the action throws a hard error during the setup phase and the job fails.

  Common scenarios where no file is found:
  - Repository uses `setup.py` only (without `pyproject.toml`)
  - Monorepo where the Python project is in a subdirectory not matched by the default glob
  - Non-Python repo that installs a Python tool but has no Python dependency manifest
  - `actions/checkout` ran with a sparse-checkout pattern that excluded dependency files
  - Reusable workflow running in a different repo context that lacks the caller's files
fix: |
  Add a `cache-dependency-path` input pointing to the correct dependency file(s), or
  disable `cache: pip` if the repo has no Python dependency manifest.
fix_code:
  - language: yaml
    label: "Specify cache-dependency-path for monorepo or non-root layout"
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
  - language: yaml
    label: "Point directly at a single dependency file"
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements.txt'
  - language: yaml
    label: "Disable pip cache when no dependency manifest exists"
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Do not set cache: pip — no requirements.txt or pyproject.toml in this repo
prevention:
  - "Always pair `cache: pip` with `cache-dependency-path` in monorepos or non-standard directory layouts."
  - "Run `actions/checkout` before `actions/setup-python` — the action cannot locate dependency files in an unchecked-out workspace."
  - "If the project uses only `setup.py`, add a minimal `pyproject.toml` or use `cache-dependency-path: setup.py`."
  - "Verify the glob pattern in `cache-dependency-path` by running `find . -name 'requirements*.txt' -o -name 'pyproject.toml'` locally."
docs:
  - url: "https://github.com/actions/setup-python/issues/502"
    label: "Cache pip from pyproject.toml without requirements.txt (setup-python#502)"
  - url: "https://github.com/actions/setup-python/issues/807"
    label: "Do not fail when caching on non-Python repositories (setup-python#807)"
  - url: "https://github.com/actions/setup-python#caching-packages-dependencies"
    label: "setup-python — Caching packages dependencies"
