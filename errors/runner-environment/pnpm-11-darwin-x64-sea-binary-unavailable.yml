id: runner-environment-378
title: "pnpm 11 via pnpm/action-setup fails on Intel macOS — @pnpm/exe has no working darwin-x64 binary"
category: runner-environment
severity: error
tags:
  - pnpm
  - pnpm-11
  - macos
  - intel
  - darwin-x64
  - sea
  - action-setup
  - segfault
  - binary-not-available
patterns:
  - regex: '@pnpm/exe does not ship a working binary for Intel macOS'
    flags: 'i'
  - regex: 'pnpm.*darwin.x64.*not.*available|darwin.x64.*pnpm.*not.*ship'
    flags: 'i'
  - regex: 'Segmentation fault.*11'
    flags: 'i'
error_messages:
  - "npm error @pnpm/exe does not ship a working binary for Intel macOS"
  - "Segmentation fault: 11"
root_cause: |
  pnpm 11.0.0–11.0.4 used Node.js SEA (Single Executable Application) to build standalone
  binaries. On Intel macOS (darwin-x64), the SEA mechanism triggers a crash in the macOS
  Rosetta-or-native path due to an upstream Node.js SEA bug (nodejs/node#62893). The
  executable segfaults immediately at startup before executing any pnpm logic.

  In pnpm 11.0.5 (released May 4, 2026), the darwin-x64 artifact was dropped entirely from
  @pnpm/exe and from the GitHub release page. As a result, pnpm/action-setup with any
  version that resolves to 11.0.5 or later fails when run on Intel macOS runners because
  there is no binary to install, and the action surfaces:
    "npm error @pnpm/exe does not ship a working binary for Intel macOS"

  Affected runners: macos-13 (Intel x64), macos-14 x64, macos-15 x64.
  Not affected: ARM64 runners (macos-14, macos-15, macos-26, macos-latest on arm64).

  pnpm lockfile format 9.0 is forward/backward compatible between pnpm 10 and 11, so
  pinning CI to pnpm 10 is safe for projects developed locally with pnpm 11.
fix: |
  Pin pnpm to a 10.x version in pnpm/action-setup for any job that may run on Intel macOS.
  Lockfile 9.0 (pnpm 10 default) is compatible between pnpm 10 and 11, so CI on 10 stays
  compatible with local development on 11.x.

  If you need pnpm 11 specifically, restrict the Intel macOS lane to an ARM64 runner instead,
  or wait until the upstream nodejs/node#62893 SEA bug is resolved and pnpm restores the
  darwin-x64 artifact.
fix_code:
  - language: yaml
    label: "Pin pnpm to 10.x to avoid darwin-x64 SEA binary failure"
    code: |
      - uses: pnpm/action-setup@v6
        with:
          version: '10'  # pnpm 11 drops darwin-x64 binary (nodejs SEA bug)

  - language: yaml
    label: "Matrix workaround: conditionally pin pnpm 10 for Intel macOS lanes"
    code: |
      jobs:
        build:
          runs-on: ${{ matrix.os }}
          strategy:
            matrix:
              os: [ubuntu-latest, macos-latest, macos-13]
          steps:
            - uses: pnpm/action-setup@v6
              with:
                # macos-13 is Intel x64; pin 10.x to avoid darwin-x64 SEA crash
                # macos-latest on macos-26+ is ARM64 — pnpm 11 works
                version: ${{ startsWith(matrix.os, 'macos-13') && '10' || '11' }}

prevention:
  - "Track pnpm/pnpm#11423 and nodejs/node#62893 for when darwin-x64 support is restored in pnpm 11"
  - "Avoid version: 'latest' in pnpm/action-setup — pin an explicit major to control upgrade timing"
  - "pnpm lockfile format 9.0 is compatible between pnpm 10 and 11 — pinning to 10 in CI is safe"
  - "Use ARM64 macOS runners (macos-14, macos-15, macos-26) for pnpm 11 builds where possible"
docs:
  - url: "https://github.com/pnpm/pnpm/issues/11423"
    label: "pnpm/pnpm#11423: pnpm 11.0.3 standalone executable segfaults on Intel macOS (upstream Node.js SEA bug)"
  - url: "https://github.com/pnpm/pnpm/releases/tag/v11.0.5"
    label: "pnpm v11.0.5 release notes: dropped darwin-x64 artifact from @pnpm/exe"
  - url: "https://github.com/nodejs/node/issues/62893"
    label: "nodejs/node#62893: upstream Node.js SEA binary crash on Intel macOS"
