id: runner-environment-404
title: "Larger Runner Multi-Label Syntax Deprecated — Workflows Queue or Fail After May 2024"
category: runner-environment
severity: error
tags:
  - larger-runners
  - runs-on
  - labels
  - deprecation
  - github-hosted
  - runner-groups
patterns:
  - regex: "couldn't find a runner matching the supplied labels"
    flags: "i"
  - regex: 'no runner matching the supplied labels was found'
    flags: "i"
error_messages:
  - "Couldn't find a runner matching the supplied labels: [ubuntu-latest-8-cores, production]"
  - "No runner matching the supplied labels was found."
root_cause: |
  GitHub deprecated multi-label support for larger GitHub-hosted runners effective
  May 15, 2024. Prior to this date, workflows could combine a larger runner's generated
  label with additional custom labels to route jobs:

    runs-on: [ubuntu-latest-8-cores, linux, production]

  After May 15, 2024, only a single label is supported for larger runners. Any workflow
  still using a `runs-on` array with a larger runner label plus other labels will either:
  1. Fail immediately with "Couldn't find a runner matching the supplied labels"
  2. Queue indefinitely because no registered runner satisfies all supplied labels

  Note: GitHub had already removed the ability to ADD or MANAGE custom labels on larger
  runners in February 2023. The May 2024 change removed the ability to USE them at all.
  Runner groups are the replacement mechanism for access control and routing.
fix: |
  Remove additional labels from `runs-on` arrays containing larger runner labels.
  Use a single label, or switch to runner group syntax for organizational routing.
fix_code:
  - language: yaml
    label: "BEFORE (broken after May 15 2024) — multi-label larger runner"
    code: |
      jobs:
        build:
          runs-on: [ubuntu-latest-8-cores, production, linux]  # ❌ multi-label deprecated
  - language: yaml
    label: "AFTER — single larger runner label"
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest-8-cores   # ✅ single label
  - language: yaml
    label: "AFTER — runner group syntax (recommended for access control)"
    code: |
      jobs:
        build:
          runs-on:
            group: production-runners           # ✅ group-based routing
            labels: ubuntu-latest-8-cores
prevention:
  - "Audit all workflow files for `runs-on` arrays containing larger runner labels combined with custom labels."
  - "Migrate to runner groups for team-level access control — groups are the replacement for multi-label routing."
  - "Search for `runs-on: [` patterns in your `.github/workflows/` directory to find affected workflows."
docs:
  - url: "https://github.blog/changelog/2024-04-16-deprecation-of-multi-label-larger-runners/"
    label: "GitHub Changelog: Deprecation of multi-label larger runners (April 16, 2024)"
  - url: "https://docs.github.com/en/actions/how-tos/manage-runners/larger-runners/use-larger-runners"
    label: "Running jobs on larger runners"
  - url: "https://docs.github.com/en/actions/how-tos/manage-runners/manage-runner-groups-for-an-organization"
    label: "Managing runner groups for an organization"
