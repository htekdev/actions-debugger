id: re-504
title: 'Ubuntu 26.04: setup-python only pre-caches Python 3.14 — older versions always trigger a live download'
category: runner-environment
severity: warning
tags:
  - ubuntu-26.04
  - setup-python
  - toolcache
  - python
  - slow-ci
  - cache-miss
  - runner-image
  - migration
patterns:
  - regex: 'Downloading Python (3\.10|3\.11|3\.12|3\.13)\.[0-9]+ - ubuntu-26'
    flags: 'i'
  - regex: 'Python (3\.10|3\.11|3\.12|3\.13).*not.*toolcache.*ubuntu-26|ubuntu-26.*Python.*(3\.10|3\.11|3\.12|3\.13).*not.*cached'
    flags: 'i'
  - regex: 'No pre-built Python (3\.10|3\.11|3\.12|3\.13) found|Downloading cpython.*3\.(10|11|12|13)'
    flags: 'i'
error_messages:
  - 'Downloading Python 3.12.x - ubuntu-26.04-x64'
  - 'Python 3.11 not found in toolcache; downloading from python.org'
  - 'No pre-cached Python 3.10 found for ubuntu-26.04; installing from source'
root_cause: |
  The Ubuntu 26.04 GitHub Actions runner image (public preview, June 11 2026)
  ships with only Python 3.14 pre-installed in the toolcache. The following
  Python versions are NOT pre-cached and trigger a live network download when
  requested via `actions/setup-python`:
    - Python 3.10.x
    - Python 3.11.x
    - Python 3.12.x
    - Python 3.13.x

  By contrast, the ubuntu-24.04 image pre-caches Python 3.10, 3.11, 3.12
  (default), 3.13, and 3.14. Workflows that pin `python-version: '3.12'` or
  any older version via `setup-python` on ubuntu-26.04 will trigger a
  download from GitHub Toolcache servers on every job run.

  The download itself typically succeeds and produces the correct Python version,
  but the impact is:
    - 30–120 seconds of additional download time per job, depending on the
      Python version and runner network conditions
    - Increased sensitivity to GitHub Toolcache server availability
    - Higher CI costs on paid runners proportional to download time

  This is expected to be resolved as the ubuntu-26.04 image matures beyond
  public preview and GitHub populates the toolcache with additional Python
  versions.

  Source: actions/runner-images#14226 (Ubuntu 26.04 public preview
  announcement, June 11, 2026) — Python row shows "3.14.* (default)" only.
fix: |
  **Option 1 — Stay on ubuntu-24.04** (recommended for stable Python toolcache):
  Ubuntu 24.04 pre-caches Python 3.10–3.14. Workflows requiring specific
  Python versions incur no download overhead.

  **Option 2 — Pin python-version: '3.14'** on ubuntu-26.04:
  Python 3.14 is the only pre-cached version. If your workflow can target
  Python 3.14, there is no download delay.

  **Option 3 — Use pip caching to amortize download cost**:
  If you must use an older Python version on ubuntu-26.04, add
  `cache: 'pip'` to `setup-python` to cache installed packages and reduce
  total CI time, even though the Python binary itself downloads each run.
fix_code:
  - language: yaml
    label: 'Pin to ubuntu-24.04 for consistent Python toolcache (no download for 3.10–3.13)'
    code: |
      jobs:
        test:
          # ubuntu-26.04 only pre-caches Python 3.14 — use ubuntu-24.04 for 3.10/3.11/3.12/3.13
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'   # pre-cached on ubuntu-24.04, instant
                cache: 'pip'
            - run: pip install -r requirements.txt
            - run: pytest
  - language: yaml
    label: 'Use Python 3.14 on ubuntu-26.04 to avoid toolcache download'
    code: |
      jobs:
        test:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.14'   # only pre-cached version on ubuntu-26.04 at preview launch
                cache: 'pip'
            - run: pip install -r requirements.txt
            - run: pytest
  - language: yaml
    label: 'Matrix test across Python versions — pin runner per version for speed'
    code: |
      jobs:
        test:
          strategy:
            matrix:
              include:
                - python-version: '3.12'
                  runs-on: ubuntu-24.04    # pre-cached — no download
                - python-version: '3.13'
                  runs-on: ubuntu-24.04    # pre-cached — no download
                - python-version: '3.14'
                  runs-on: ubuntu-26.04    # pre-cached on ubuntu-26.04
          runs-on: ${{ matrix.runs-on }}
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
                cache: 'pip'
            - run: pytest
prevention:
  - 'On ubuntu-26.04, only Python 3.14 is pre-cached in the toolcache at public preview launch (June 2026); use ubuntu-24.04 for older versions.'
  - 'Add `cache: pip` to setup-python to reduce total job time even when the Python binary must be downloaded.'
  - 'Monitor runner-images announcements for when ubuntu-26.04 toolcache is updated to include Python 3.10–3.13.'
  - 'Use explicit ubuntu-24.04 or ubuntu-26.04 labels instead of ubuntu-latest to control which toolcache versions are available.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226 — Ubuntu 26.04 public preview announcement — Python toolcache row'
  - url: 'https://github.com/actions/setup-python'
    label: 'actions/setup-python — Python version management in GitHub Actions'
  - url: 'https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#caching-dependencies'
    label: 'GitHub Docs — Caching Python dependencies'
