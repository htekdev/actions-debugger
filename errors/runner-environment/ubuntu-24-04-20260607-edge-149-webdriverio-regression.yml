id: runner-environment-440
title: 'Ubuntu 24.04 Image 20260607 Updates Edge to 149 — WebdriverIO and Selenium Edge Tests Fail'
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - microsoft-edge
  - edge
  - webdriverio
  - selenium
  - browser-testing
  - regression
  - edgedriver
  - image-20260607
patterns:
  - regex: 'session not created.*Microsoft Edge|Edge.*session.*not.*created|EdgeDriver.*session.*failed'
    flags: 'i'
  - regex: 'Microsoft Edge.*149\.0\.4022|EdgeDriver.*149\.0\.4022'
    flags: 'i'
  - regex: 'Unable to connect to EdgeDriver|edge.*unable.*receive.*message|edgedriver.*timed.out'
    flags: 'i'
  - regex: 'WebDriverException.*Edge|edge.*DevTools.*unreachable|edge.*connect.*ECONNREFUSED'
    flags: 'i'
error_messages:
  - 'SessionNotCreatedException: Message: session not created from tab crashed'
  - 'Error: Failed to create Edge session.'
  - 'Unable to connect to EdgeDriver server at localhost:9515'
  - 'Error: connect ECONNREFUSED 127.0.0.1:9515'
  - 'WebDriver exception: Edge crashed during startup'
root_cause: |
  The ubuntu-24.04 runner image 20260607.184.1 (deployed June 8, 2026) bumped
  Microsoft Edge from 148.0.3967.83 to 149.0.4022.52 and Microsoft Edge
  WebDriver from 148.0.3967.83 to 149.0.4022.52.

  Edge 149.0.4022.52 introduced a regression that causes WebdriverIO,
  Selenium, and other WebDriver protocol-based browser automation frameworks
  to fail when launching an Edge browser session. The EdgeDriver process
  starts but the browser either crashes during startup or the DevTools Protocol
  endpoint fails to become available within the session creation timeout,
  resulting in a "session not created" or connection refused error.

  This is distinct from the Chrome 148 regression (ubuntu-24.04 image
  20260525.161.1, documented separately): that update actually shipped Chrome
  149 as a fix, but introduced Edge 149 which carries its own regression.

  Workflows that had pinned to ubuntu-24.04 to avoid the Chrome 148 regression
  and then upgraded to 20260607 may find their Edge test suites now failing
  unexpectedly.

  Affected image: ubuntu-24.04 version 20260607.184.1+
  Unaffected image: ubuntu-24.04 version 20260525.161.1 (Edge 148.0.3967.83)
fix: |
  Option 1 — Pin to a working Edge version using a browser installation step:
  Use a browser installer action to override the image-bundled Edge with a
  known-good version. `microsoft-edge-dev` or a pinned stable version may be
  used until the regression is resolved.

  Option 2 — Run Edge tests on an alternative OS image temporarily:
  Switch Edge-specific test jobs to `ubuntu-22.04` which ships a different
  Edge version that may not exhibit this regression.

  Option 3 — Skip Edge-specific tests until a fixed image is deployed:
  Add a conditional to your Edge test matrix to skip on the affected image
  version and restore when GitHub deploys a fixed image.

  Option 4 — Use Chrome/Chromium as the test browser where possible:
  Chrome 149 (also in 20260607) is NOT affected by this regression. Migrating
  Edge-specific test runs to Chrome/Chromium is a temporary mitigation.
fix_code:
  - language: yaml
    label: 'Skip Edge tests on affected image version'
    code: |
      jobs:
        edge-tests:
          runs-on: ubuntu-24.04
          # Skip on 20260607 image until Edge 149 regression is resolved
          if: ${{ !contains(env.RUNNER_IMAGE_VERSION, '20260607') }}
          steps:
            - uses: actions/checkout@v4
            - name: Run Edge tests
              run: npm run test:edge
  - language: yaml
    label: 'Use Chrome instead of Edge for automated tests'
    code: |
      # In wdio.conf.js / selenium configuration, switch browser to Chrome
      # until Edge 149 regression is fixed
      capabilities: [{
        browserName: 'chrome',  # was 'MicrosoftEdge'
        'goog:chromeOptions': {
          args: ['--no-sandbox', '--headless', '--disable-gpu']
        }
      }]
  - language: yaml
    label: 'Use ubuntu-22.04 for Edge tests temporarily'
    code: |
      jobs:
        edge-tests:
          runs-on: ubuntu-22.04  # Use 22.04 until 24.04 Edge 149 regression is fixed
          steps:
            - uses: actions/checkout@v4
            - name: Run Edge tests
              run: npm run test:edge
prevention:
  - 'Add the runner image version to your workflow annotations so regressions can be quickly correlated to image updates.'
  - 'Subscribe to runner-images release notifications to get advance notice of browser version changes.'
  - 'Run a separate matrix entry for each browser so a regression in one browser does not block unrelated CI jobs.'
  - 'Check runner-images issues for "MicrosoftEdge" or "EdgeDriver" regressions when browser automation tests break after an image update.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14223'
    label: 'runner-images#14223 — Ubuntu 24.04 20260607 breaks WebdriverIO in Edge'
  - url: 'https://github.com/actions/runner-images/releases/tag/ubuntu24%2F20260607.184'
    label: 'Ubuntu 24.04 20260607.184.1 release notes'
  - url: 'https://github.com/actions/runner-images/pull/14193'
    label: 'runner-images PR #14193 — Ubuntu 24.04 20260607 image update (change log)'
