  - url: 'https://github.com/actions/runner-images/issues/14105'
    label: 'runner-images#14105 — [Ubuntu] Docker on Ubuntu 24.04 requires update to v29 (pending, May 2026)'
  - url: 'https://github.com/containerd/containerd/issues/12683'
    label: 'containerd#12683 — Go 1.24 os.DirFS stricter path validation in containerd v2.2'
