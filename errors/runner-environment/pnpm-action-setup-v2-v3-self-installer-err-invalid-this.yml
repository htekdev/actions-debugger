id: runner-environment-364
title: 'pnpm/action-setup@v2/v3 Self-Installer Crashes with ERR_INVALID_THIS — "Value of this must be of type URLSearchParams"'
category: runner-environment
severity: error
tags:
  - pnpm
  - action-setup
  - self-installer
  - npm-registry
  - node
  - v2
  - v3
  - package-manager
patterns:
  - regex: 'ERR_PNPM_META_FETCH_FAIL.*GET.*registry\.npmjs\.org/pnpm'
    flags: 'i'
  - regex: 'Value of "this" must be of type URLSearchParams'
    flags: 'i'
  - regex: 'Running self-installer\.\.\.'
    flags: 'i'
  - regex: 'self-installer exits with code 1'
    flags: 'i'
error_messages:
  - 'Running self-installer...'
  - 'WARN  GET https://registry.npmjs.org/pnpm error (ERR_INVALID_THIS). Will retry in 10 seconds. 2 retries left.'
  - 'WARN  GET https://registry.npmjs.org/pnpm error (ERR_INVALID_THIS). Will retry in 1 minute. 1 retries left.'
  - 'ERR_PNPM_META_FETCH_FAIL  GET https://registry.npmjs.org/pnpm: Value of "this" must be of type URLSearchParams'
  - 'Error: Something went wrong, self-installer exits with code 1'
root_cause: |
  pnpm/action-setup@v2 and v3 use a "self-installer" script that downloads pnpm directly from
  the npm registry via a bundled npm version. After Node.js internals changed the URLSearchParams
  binding semantics, the old bundled npm in the self-installer started throwing
  `ERR_INVALID_THIS: Value of "this" must be of type URLSearchParams` when constructing
  registry request URLs.

  This manifests as repeated retry warnings followed by a fatal `ERR_PNPM_META_FETCH_FAIL`
  error fetching pnpm's metadata from `registry.npmjs.org`. The action then exits with code 1.

  pnpm/action-setup v4 removed the bundled self-installer entirely and instead delegates to the
  system Node.js + npm for installation, eliminating this category of failure. Because v3 uses
  the same broken self-installer, any workflow pinned to `pnpm/action-setup@v2` or
  `pnpm/action-setup@v3` is vulnerable.

  Tracked in: pnpm/action-setup#135 (July 2024).
fix: |
  Upgrade to `pnpm/action-setup@v4` (or later). v4 no longer uses the bundled self-installer
  and resolves the ERR_INVALID_THIS failure.

  Optionally pair with `actions/setup-node` using `cache: 'pnpm'` for faster installs.
fix_code:
  - language: yaml
    label: 'WRONG — pnpm/action-setup@v2/v3 with broken self-installer'
    code: |
      - name: Install pnpm
        uses: pnpm/action-setup@v2   # ❌ self-installer breaks with ERR_INVALID_THIS
        with:
          version: 9

      # or
      - name: Install pnpm
        uses: pnpm/action-setup@v3   # ❌ same broken self-installer
        with:
          version: 9
  - language: yaml
    label: 'RIGHT — upgrade to pnpm/action-setup@v4 (no self-installer)'
    code: |
      - name: Install pnpm
        uses: pnpm/action-setup@v4   # ✅ no bundled self-installer, uses system npm
        with:
          version: 9

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'              # ✅ optionally enable pnpm cache
prevention:
  - 'Pin to pnpm/action-setup@v4 or later — v2 and v3 use a bundled self-installer that is broken by Node.js URLSearchParams changes.'
  - 'Use Dependabot or Renovate to keep third-party actions on their latest major version.'
  - 'If pnpm version must be pinned, set it via the `version` input on v4 — it still works correctly.'
docs:
  - url: 'https://github.com/pnpm/action-setup'
    label: 'pnpm/action-setup — README and version history'
  - url: 'https://github.com/pnpm/action-setup/issues/135'
    label: 'pnpm/action-setup#135 — self-installer ERR_INVALID_THIS failure (July 2024)'
  - url: 'https://stackoverflow.com/questions/78703676/pnpm-action-setup-self-installer-issue'
    label: 'Stack Overflow — pnpm/action-setup self installer issue (Score 6, Views 5.6k)'
