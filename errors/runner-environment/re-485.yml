id: re-485
title: 'Self-Hosted Runner `installdependencies.sh` Cannot Find `libicu76` on Debian 13 (Trixie)'
category: runner-environment
severity: error
tags:
  - self-hosted
  - debian
  - libicu
  - dotnet
  - installdependencies
  - debian-13
  - trixie
  - runner-setup
patterns:
  - regex: 'Libicu.s dependencies is missing for Dotnet Core'
    flags: 'i'
  - regex: 'installdependencies\.sh.*libicu.*not.*found|libicu.*installdependencies'
    flags: 'i'
  - regex: 'E: Package .libicu[0-9]+. has no installation candidate'
    flags: 'i'
  - regex: 'Unable to locate package libicu[0-9]+'
    flags: 'i'
error_messages:
  - "Libicu's dependencies is missing for Dotnet Core 6.0"
  - "E: Package 'libicu72' has no installation candidate"
  - "Unable to locate package libicu72"
  - "sudo ./bin/installdependencies.sh"
root_cause: |
  The GitHub Actions runner ships with a `bin/installdependencies.sh` script that
  installs system dependencies required for the runner process (which uses .NET 6.0).
  The script targets specific `libicu` package versions by name:

  ```
  libicu60, libicu63, libicu67, libicu70, libicu72, libicu74
  ```

  Debian 13 "Trixie" ships with `libicu76` — a newer version not listed in the
  `installdependencies.sh` script. When the script runs `apt-get install libicu72`
  on Debian 13, it fails because that package does not exist in the Trixie
  APT repositories.

  The failure occurs at the self-hosted runner **setup** step (`./config.sh`) when it
  detects that `libicu` is not installed and instructs the user to run
  `sudo ./bin/installdependencies.sh`.

  The root cause is that `installdependencies.sh` does not dynamically detect the
  available `libicu` package version — it hard-codes version numbers that lag behind
  the latest Debian stable release.

  This was filed in actions/runner#4097 and confirmed for Debian 13.1 x86_64.
fix: |
  **Option 1 (manual install):** Install `libicu76` directly before running
  `installdependencies.sh`:
  ```
  sudo apt-get update
  sudo apt-get install -y libicu76
  ```
  The runner will detect `libicu76` at runtime even though the setup script doesn't
  list it, because .NET 6.0 loads `libicu` by name without requiring a specific version.

  **Option 2 (use a Debian 12 base):** Run the self-hosted runner on Debian 12
  (Bookworm), which ships with `libicu72` and is fully supported by the runner's
  `installdependencies.sh` script.

  **Option 3 (use the runner Docker image):** Use the official
  `ghcr.io/actions/actions-runner` image which bundles all required dependencies
  for ARC (Actions Runner Controller) deployments.
fix_code:
  - language: yaml
    label: 'WORKAROUND — pre-install libicu76 before running installdependencies.sh on Debian 13'
    code: |
      # On your Debian 13 self-hosted runner machine (run once during setup):
      # sudo apt-get update
      # sudo apt-get install -y libicu76
      # ./config.sh --url https://github.com/ORG/REPO --token TOKEN
      # ./run.sh

      # In your workflow (for documentation/validation):
      - name: Verify runner ICU library
        run: ldconfig -p | grep libicu  # Should show libicu76

  - language: yaml
    label: 'ALTERNATIVE — use official ARC runner image (includes all deps)'
    code: |
      # In your ARC HorizontalRunnerAutoscaler / RunnerSet configuration:
      # spec:
      #   template:
      #     spec:
      #       containers:
      #       - name: runner
      #         image: ghcr.io/actions/actions-runner:latest  # ✓ includes libicu
      #         imagePullPolicy: Always

      # Standard workflow step — no changes needed:
      - name: Run build
        run: make build

prevention:
  - 'Before provisioning a new Debian-based self-hosted runner, check `apt-cache search libicu` to find the available ICU version and pre-install it if needed.'
  - 'Pin self-hosted runner base OS to Debian 12 (Bookworm) or Ubuntu 22.04/24.04 until `installdependencies.sh` adds support for `libicu76`.'
  - 'When upgrading the OS of an existing self-hosted runner host, re-run `sudo ./bin/installdependencies.sh` and check for package installation errors.'
  - 'Check actions/runner releases for updated `installdependencies.sh` that adds Debian 13 support before upgrading to Trixie.'
docs:
  - url: 'https://github.com/actions/runner/issues/4097'
    label: 'actions/runner#4097: libicu dependency missing on Debian 13 (Trixie) — installdependencies.sh fails'
  - url: 'https://github.com/actions/runner/blob/main/src/Misc/installdependencies.sh'
    label: 'actions/runner: installdependencies.sh source — lists supported libicu versions'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners#supported-architectures-and-operating-systems-for-self-hosted-runners'
    label: 'GitHub Docs: Supported OS for self-hosted runners'
  - url: 'https://packages.debian.org/trixie/libicu76'
    label: 'Debian 13 Trixie: libicu76 package'
