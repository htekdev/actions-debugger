id: runner-environment-270
title: "ubuntu-24.04 runner removes wkhtmltopdf — PDF generation workflows fail with command not found"
category: runner-environment
severity: error
tags:
  - ubuntu-24.04
  - wkhtmltopdf
  - tool-removal
  - pdf-generation
  - ubuntu-latest
  - migration
patterns:
  - regex: 'wkhtmltopdf.*command not found|wkhtmltopdf.*No such file'
    flags: 'i'
  - regex: 'wkhtmltoimage.*command not found'
    flags: 'i'
  - regex: 'exec.*wkhtmltopdf.*executable file not found'
    flags: 'i'
error_messages:
  - "/bin/sh: 1: wkhtmltopdf: not found"
  - "wkhtmltopdf: command not found"
  - "Error: Unable to find wkhtmltopdf executable"
  - "exec: \"wkhtmltopdf\": executable file not found in $PATH"
root_cause: |
  wkhtmltopdf (WebKit HTML to PDF converter) was pre-installed on GitHub-hosted ubuntu-18.04 and
  ubuntu-22.04 runner images. It was removed from ubuntu-24.04 as part of GitHub's regular
  audit of pre-installed tools: wkhtmltopdf is archived/unmaintained upstream (last release
  0.12.6.1, 2022), no longer packaged in Ubuntu 24.04 Noble Numbat's default apt repositories,
  and its Qt WebKit dependency is incompatible with ubuntu-24.04's system libraries.

  Workflows that invoke `wkhtmltopdf` directly in a `run:` step silently relied on the
  pre-installed binary and fail immediately upon ubuntu-latest migrating to ubuntu-24.04.
  The failure is a hard "command not found" — no ambiguity, but the root cause (tool removal,
  not a script bug) is non-obvious to developers who have never managed the runner image
  installed software list.
fix: |
  Several alternatives exist depending on your use case:

  **Option 1 (recommended): Use Puppeteer/Playwright for headless Chrome PDF generation.**
  More actively maintained, supports modern web standards, available as npm packages.

  **Option 2: Install wkhtmltopdf from a pre-built static binary.**
  The wkhtmltopdf project provides static binaries at https://wkhtmltopdf.org/downloads.html
  that bundle their own Qt WebKit and work on ubuntu-24.04.

  **Option 3: Use gotenberg or weasyprint as server-side alternatives.**

  **Option 4: Pin to ubuntu-22.04 (temporary — ubuntu-22.04 is also being retired).**
  Only use as a short-term workaround while migrating to a maintained PDF solution.
fix_code:
  - language: yaml
    label: "Install wkhtmltopdf from static binary on ubuntu-24.04"
    code: |
      jobs:
        generate-pdf:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - name: Install wkhtmltopdf static binary
              run: |
                wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
                sudo apt-get install -y ./wkhtmltox_0.12.6.1-3.jammy_amd64.deb
                wkhtmltopdf --version
            - name: Generate PDF
              run: wkhtmltopdf input.html output.pdf
  - language: yaml
    label: "Use Puppeteer for PDF generation (modern alternative)"
    code: |
      jobs:
        generate-pdf:
          runs-on: ubuntu-24.04
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - run: npm install puppeteer
            - name: Generate PDF via Puppeteer
              run: |
                node -e "
                  const puppeteer = require('puppeteer');
                  (async () => {
                    const browser = await puppeteer.launch({args:['--no-sandbox']});
                    const page = await browser.newPage();
                    await page.goto('file://' + process.cwd() + '/input.html');
                    await page.pdf({path:'output.pdf', format:'A4'});
                    await browser.close();
                  })();
                "
prevention:
  - "Audit pre-installed tool usage by reviewing the ubuntu-24.04 runner image Readme (actions/runner-images) before migrating from ubuntu-22.04."
  - "Avoid relying on unlisted/undocumented pre-installed tools — only use tools explicitly listed in the runner image Readme or installed via your workflow steps."
  - "For PDF generation in CI, prefer maintained libraries (Puppeteer, Playwright, WeasyPrint) over archived tools like wkhtmltopdf."
docs:
  - url: "https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md"
    label: "ubuntu-24.04 runner image installed software (official list)"
  - url: "https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md"
    label: "ubuntu-22.04 runner image installed software (comparison)"
  - url: "https://wkhtmltopdf.org/downloads.html"
    label: "wkhtmltopdf static binary downloads"
