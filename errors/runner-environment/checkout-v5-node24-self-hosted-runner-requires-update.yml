id: re-506
title: "actions/checkout v5+ requires self-hosted runner v2.327.1+ for Node 24 support"
category: runner-environment
severity: error
tags:
  - checkout
  - self-hosted-runner
  - node24
  - runner-version
  - breaking-change
patterns:
  - regex: "'using: node24' is not supported, use 'docker', 'node12', 'node16' or 'node20' instead"
    flags: "i"
  - regex: "System\.ArgumentOutOfRangeException.*using: node24.*is not supported"
    flags: "i"
  - regex: "node24.*is not supported, use.*node12.*node16.*node20"
    flags: "i"
error_messages:
  - "Parameter ''using: node24' is not supported, use 'docker', 'node12', 'node16' or 'node20' instead.'"
  - "System.ArgumentOutOfRangeException: Specified argument was out of the range of valid values. (Parameter ''using: node24' is not supported, use 'docker', 'node12', 'node16' or 'node20' instead.')"
root_cause: |
  actions/checkout v5 (released August 2025) and v6 switched the underlying Node.js runtime from
  Node 20 to Node 24. The runner process that executes the action uses a built-in Node version
  that must be declared in the action's action.yml as `using: node24`. Older self-hosted runners
  (versions prior to v2.327.1, released July 25, 2025) do not include a Node 24 runtime and
  cannot execute node24-based actions. The runner throws an ArgumentOutOfRangeException immediately
  when parsing the action manifest, before any action code runs. GitHub-hosted runners are
  automatically kept up to date and are unaffected. Self-hosted runners only auto-update within
  30 days of a new runner version, so runners that haven't been explicitly refreshed may remain on
  older versions past the window when major actions start requiring node24.
fix: |
  Update the self-hosted runner software to v2.327.1 or later, which bundles Node 24 support.
  Self-hosted runners auto-update every 24 hours — allow a scheduled update cycle or trigger
  a manual update.

  If immediate update is not possible:
  - Pin the checkout action to v4 (`actions/checkout@v4`) which uses Node 20.
  - Rebuild custom runner container images with Node 24 pre-installed.

  Note: Runner v2.327.1 was released July 25, 2025. Per GitHub's policy, self-hosted runners
  must update within 30 days of a new release, so outdated runners should be treated as a
  maintenance issue, not just a workaround.
fix_code:
  - language: yaml
    label: "Pin checkout to v4 while updating self-hosted runner"
    code: |
      # Temporary workaround: pin to v4 until runner is updated
      - uses: actions/checkout@v4

  - language: yaml
    label: "Correct: use checkout v5+ once runner is updated to v2.327.1+"
    code: |
      # After runner is updated to v2.327.1+, use v5 or v6:
      - uses: actions/checkout@v5

  - language: yaml
    label: "Verify runner version in a diagnostic step"
    code: |
      - name: Check runner version
        run: echo "Runner version ${{ runner.version }}"
prevention:
  - "Keep self-hosted runners updated to the latest version — runners auto-update daily but verify patch cadence for long-lived runner hosts."
  - "Pin major-version tags (e.g., `actions/checkout@v5`) rather than `@main` or floating refs to avoid unexpected runtime bumps."
  - "When using custom runner images, install both Node 20 and Node 24 to survive major action version transitions."
  - "Monitor actions/checkout release notes before bumping to a new major version — breaking runtime requirements are noted in the changelog."
  - "Use Dependabot or Renovate for automated action version management, but validate self-hosted runner compatibility before merging major bumps."
docs:
  - url: "https://github.com/actions/checkout/releases/tag/v5.0.0"
    label: "actions/checkout v5.0.0 release notes"
  - url: "https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners#runner-software-updates-on-self-hosted-runners"
    label: "Self-hosted runner software update policy"
  - url: "https://github.com/actions/runner/releases/tag/v2.327.1"
    label: "actions/runner v2.327.1 release (adds Node 24)"
  - url: "https://github.com/actions/checkout/issues/2240"
    label: "GitHub issue: Breaking change with v5 release"
