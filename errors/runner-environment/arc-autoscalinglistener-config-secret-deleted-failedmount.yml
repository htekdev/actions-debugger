id: runner-environment-293
title: 'ARC v0.14.0/v0.14.1 AutoscalingListener Pod FailedMount — Config Secret Deleted During Pod Restart'
category: runner-environment
severity: error
tags:
  - arc
  - actions-runner-controller
  - kubernetes
  - autoscaling-listener
  - failedmount
  - config-secret
  - race-condition
  - pod-restart
patterns:
  - regex: 'FailedMount.*listener.config|listener.*config.*secret.*not found|Unable to attach.*listener-config'
    flags: 'i'
  - regex: 'MountVolume\.SetUp failed.*listener.*secret.*not found|secret.*listener.*config.*not found'
    flags: 'i'
  - regex: 'ContainerCreating.*autoscaling.listener.*secret|listener.*pod.*FailedMount'
    flags: 'i'
error_messages:
  - "Warning  FailedMount  Unable to attach or mount volumes: unmounted volumes=[listener-config-secret], failed to sync secret cache: timed out waiting for the condition"
  - "MountVolume.SetUp failed for volume \"listener-config-secret\" : secret \"<release>-gha-rs-listener-config\" not found"
  - "AutoscalingListener pod stuck in ContainerCreating after restart"
root_cause: |
  In ARC v0.14.0 and v0.14.1, when the AutoscalingListener pod terminates for
  any reason (crash, OOM, job cancellation, manual deletion), the controller's
  `autoscalinglistener_controller.go` **deletes the listener config Secret and the
  pod in the same reconcile pass**.

  The Secret deletion race:
  1. Pod exits (any cause: crash, scaling adjustment, etc.)
  2. Controller reconcile fires: deletes the config Secret AND the old pod
  3. Kubernetes schedules a new listener pod (spec references the config Secret)
  4. New pod starts BEFORE the controller's next reconcile recreates the Secret
  5. Kubernetes cannot mount the Secret → `FailedMount` warning
  6. Pod stuck in `ContainerCreating` until the Secret is recreated (1-120 sec)

  This introduces intermittent downtime: jobs arriving during the window between
  Secret deletion and recreation are not picked up. In high-churn environments
  (frequent scale-up/down, many cancellations) the window recurs regularly.

  The root issue is that the listener config Secret was treated as a disposable
  per-pod credential when it should be a durable reconciled object. Fixed in
  ARC v0.14.2 (PR#4492, May 11, 2026) by:
  - **No longer deleting the config Secret during pod termination**
  - **Adding in-place reconciliation (create/update) with drift detection**
  - **Restarting the listener pod only when Secret content actually changes**

  Source: actions/actions-runner-controller PR#4492 fixing issue #4450 (May 2026).
fix: |
  **Immediate mitigation: Wait for controller self-heal**

  In most cases the FailedMount resolves automatically within 1-2 minutes as
  the controller's next reconcile recreates the config Secret. Monitor:

  ```bash
  kubectl get pods -n <runner-namespace> -w
  kubectl describe pod -n <runner-namespace> -l \
    actions.github.com/scale-set-name=<release>
  ```

  **If stuck for more than 5 minutes: Force reconcile by patching the AutoscalingRunnerSet**

  ```bash
  # Add/remove a harmless annotation to trigger reconcile
  kubectl annotate autoscalingrunnersets <release> \
    -n <runner-namespace> \
    arc.troubleshoot/force-reconcile=$(date +%s) \
    --overwrite
  ```

  **Permanent fix: Upgrade to ARC v0.14.2+**

  The v0.14.2 release includes the Secret lifecycle fix. After upgrade, the
  config Secret is preserved across listener pod restarts and only updated
  when the Secret content drifts.

  ```bash
  helm upgrade gha-runner-scale-set-controller \
    oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
    --version 0.14.2 \
    --namespace arc-systems \
    -f controller_values.yaml
  ```
fix_code:
  - language: yaml
    label: 'Diagnose: check AutoscalingListener pod events for FailedMount'
    code: |
      # Get the AutoscalingListener pod name
      kubectl get pods -n <runner-namespace> -l \
        actions.github.com/scale-set-name=<release>

      # Describe to see FailedMount events
      kubectl describe pod <listener-pod-name> -n <runner-namespace>

      # Expected FailedMount output:
      # Warning FailedMount ... Unable to attach or mount volumes:
      #   unmounted volumes=[listener-config-secret],
      #   failed to sync secret cache: timed out waiting for the condition

      # Check if the config Secret exists
      kubectl get secret -n <runner-namespace> \
        -l actions.github.com/scale-set-name=<release>
  - language: yaml
    label: 'Upgrade ARC to v0.14.2+ (permanent fix for Secret lifecycle)'
    code: |
      # Upgrade controller
      helm upgrade gha-runner-scale-set-controller \
        oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
        --version 0.14.2 \
        --namespace arc-systems \
        -f controller_values.yaml

      # Upgrade runner scale set
      helm upgrade <release> \
        oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
        --version 0.14.2 \
        --namespace <runner-namespace> \
        -f runner_scale_set_values.yaml
prevention:
  - "Upgrade to ARC v0.14.2+ which fixes the config Secret deletion-during-restart race"
  - "Monitor AutoscalingListener pod events in high-churn environments (many job cancellations); FailedMount spikes indicate this race"
  - "Set up a Kubernetes alert for FailedMount events on pods with label actions.github.com/scale-set-name"
  - "After any ARC upgrade, validate that listener pods survive a restart without FailedMount by deleting and watching the listener pod"
docs:
  - url: 'https://github.com/actions/actions-runner-controller/pull/4492'
    label: 'ARC PR#4492 — Fix secret reconciliation updates for the listener pod (v0.14.2)'
  - url: 'https://github.com/actions/actions-runner-controller/releases/tag/gha-runner-scale-set-0.14.2'
    label: 'ARC v0.14.2 Release Notes'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller/troubleshooting-actions-runner-controller-errors'
    label: 'ARC Troubleshooting Guide'
