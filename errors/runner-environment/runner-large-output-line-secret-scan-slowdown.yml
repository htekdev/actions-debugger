id: runner-environment-366
title: 'GitHub Actions runner secret-masking loop causes extreme slowdown for steps that print very long output lines (>10 000 chars)'
category: runner-environment
severity: warning
tags:
  - runner
  - secret-masking
  - performance
  - long-line
  - cosign
  - trivy
  - grype
  - json
  - slowdown
  - known-unsolved
patterns:
  - regex: 'cosign\s+verify(?:-attestation|-blob|-image)?[^\n]*>>'
    flags: 'i'
  - regex: '(?:trivy|grype|syft|snyk)\s+.*--format\s+json'
    flags: 'i'
  - regex: 'jq\s+[''"]?\.'
    flags: 'i'
error_messages:
  - "(no error — the step silently takes 5–15 minutes on output that should complete in under 1 second)"
  - "Error: The operation was canceled. (if the job timeout is hit while the step is hung)"
root_cause: |
  The GitHub Actions runner processes every line of a step's stdout and stderr through a secret-masking
  pipeline before writing it to the log service. The masking pipeline applies a regex over the entire line
  content to redact any registered secret values. Because the regex engine processes characters linearly,
  lines that are extremely long (tens or hundreds of thousands of characters) cause O(n) — and in some
  cases O(n²) via catastrophic backtracking — slowdowns that hold the step in a "printing" state for
  minutes even though the underlying command has already exited.

  This issue was reported in actions/runner#1031 (first observed 2021) and remains unfixed as of June 2026.

  Common triggers in real-world workflows:
  - `cosign verify-attestation` prints the full attestation payload as a single JSON line (300 000+ chars)
  - Security scanners (trivy, grype, syft, snyk) with `--format json` emit multi-MB single-line JSON blobs
  - `jq` compressing output with no newlines: `jq -c . large-file.json`
  - Base64-encoded payloads piped directly to stdout (e.g., `base64 -w0 large-file`)
  - Any `echo "$LONG_VAR"` where the variable content spans many kilobytes

  The hang manifests as a workflow step that appears stuck with no further log output — the runner is alive
  but is blocked inside the log-processing loop. If the job's `timeout-minutes` is reached, the job is
  killed and you see "The operation was canceled."
fix: |
  Redirect the long-line output away from the runner's log pipeline to avoid the masking loop:

  1. **Redirect stdout to a file** instead of printing to the terminal:
     ```
     cosign verify-attestation ... > attestation.json
     ```

  2. **Upload the file as an artifact** if the content is needed for later review:
     ```
     uses: actions/upload-artifact@v4
     with:
       name: attestation
       path: attestation.json
     ```

  3. **Pipe through a line-wrapping filter** (e.g., `fold -w 2000`) so no single line exceeds ~10 000 chars —
     the runner processes each logical newline-delimited chunk independently.

  4. **Use the `--output-file` flag** when available (cosign, trivy, grype all support it) to write results
     to a file rather than stdout.

  5. **Suppress output entirely** with `> /dev/null 2>&1` when you only care about the exit code.
fix_code:
  - language: yaml
    label: "cosign verify-attestation: redirect payload to file, upload as artifact"
    code: |
      - name: Verify attestation
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}:${{ github.sha }} \
            > attestation.json   # redirect to file — avoids runner log-scan hang
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: attestation-payload
          path: attestation.json
  - language: yaml
    label: "Security scanner with --output-file flag (trivy, grype, syft)"
    code: |
      - name: Scan image
        run: |
          trivy image \
            --format json \
            --output trivy-results.json \   # write to file, not stdout
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
prevention:
  - "Never pipe large JSON blobs (>10 KB) to stdout inside a workflow step — always use --output-file."
  - "Wrap cosign, trivy, grype, syft calls with output redirection to a file as a standard practice."
  - "Add `fold -w 2000` or equivalent when you cannot control the tool's output format."
  - "Monitor step durations in CI — a step that normally takes <1 s but occasionally takes >5 min is a sign of the long-line slowdown."
  - "Set `timeout-minutes` at the job level to bound runaway hangs from becoming 6-hour blockages."
docs:
  - url: "https://github.com/actions/runner/issues/1031"
    label: "actions/runner#1031 — Log lines with many characters cause performance issues (open since 2021)"
  - url: "https://github.com/sigstore/cosign/issues/3602"
    label: "sigstore/cosign#3602 — cosign verify-attestation hangs for 8+ minutes on large payloads in GitHub Actions"
  - url: "https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/using-artifact-attestations-to-establish-provenance-for-builds"
    label: "GitHub Docs — Using artifact attestations"
