id: runner-environment-357
title: 'codecov/codecov-action v6 fails with "no valid OpenPGP data found" after keybase.io/codecovsecurity account migration'
category: runner-environment
severity: error
tags:
  - codecov
  - gpg
  - keybase
  - coverage-upload
  - third-party-action
  - signature-verification
patterns:
  - regex: 'gpg: no valid OpenPGP data found'
    flags: 'i'
  - regex: 'gpg: Can''t check signature: No public key'
    flags: 'i'
  - regex: 'gpg: BAD signature from.*Codecov'
    flags: 'i'
  - regex: 'Could not verify signature\. Please contact Codecov'
    flags: 'i'
  - regex: 'Could not verify SHASUM\. Please contact Codecov'
    flags: 'i'
  - regex: 'SELF-SIGNED PUBLIC KEY NOT FOUND'
    flags: 'i'
error_messages:
  - "gpg: no valid OpenPGP data found."
  - "gpg: Total number processed: 0"
  - "gpg: Can't check signature: No public key"
  - "==> Could not verify signature. Please contact Codecov if problem continues"
  - "==> Could not verify SHASUM. Please contact Codecov if problem continues"
  - "gpg: BAD signature from \"Codecov Uploader (Codecov Uploader Verification Key)\" [unknown]"
  - "Exiting..."
root_cause: |
  The Codecov team lost access to their keybase.io/codecovsecurity account and migrated
  the GPG signing key to keybase.io/codecovsecops (June 7, 2026). As part of the migration
  they bricked the old keybase.io/codecovsecurity account, which now returns HTTP 404 with
  body "SELF-SIGNED PUBLIC KEY NOT FOUND" instead of the GPG public key.

  codecov/codecov-action v6.0.1 and earlier (and v5.x) download the Codecov CLI binary
  and verify its integrity by fetching the public GPG key from the now-bricked URL:
    https://keybase.io/codecovsecurity/pgp_keys.asc

  The action's codecov.sh wrapper script uses `curl -s` without `--fail`, so the 404
  response body is piped directly into `gpg --import`. Since the body is plain text
  ("SELF-SIGNED PUBLIC KEY NOT FOUND"), GPG reports "no valid OpenPGP data found" and
  imports nothing. The subsequent signature verification then fails with "Can't check
  signature: No public key" because the key was never imported.

  Earlier in April 2026 the same mechanism caused intermittent "BAD signature" errors
  due to a CDN cache/version-bump race condition; the June 7 breakage is permanent for
  unpatched versions since the account is now intentionally bricked.
fix: |
  Upgrade to codecov/codecov-action v7.0.0 or v6.0.2 — both point to the same commit
  which uses the new keybase.io/codecovsecops key.

  Alternatively, add `use_pypi: true` to the action inputs to bypass the Keybase GPG
  verification path (installs the Codecov CLI from PyPI instead):

  ```yaml
  - uses: codecov/codecov-action@v7
  ```

  Or as a short-term bypass without changing major version:
  ```yaml
  - uses: codecov/codecov-action@v6.0.2
  ```

  Or use use_pypi workaround with existing pinned version:
  ```yaml
  - uses: codecov/codecov-action@v6.0.1
    with:
      use_pypi: true
  ```
fix_code:
  - language: yaml
    label: "Upgrade to v7 (recommended)"
    code: |
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  - language: yaml
    label: "Stay on v6 patch that fixes the issue"
    code: |
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  - language: yaml
    label: "Bypass with use_pypi workaround (no version upgrade required)"
    code: |
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
prevention:
  - "Pin to the Codecov action by release tag or SHA rather than a floating major version label (e.g. @v7.0.0 or @<full-sha>) to avoid unexpected breakage from third-party changes"
  - "Set fail_ci_if_error: false on the Codecov step to prevent coverage upload failures from blocking the entire CI pipeline"
  - "Monitor codecov.io/status and the codecov/codecov-action repository for announcements before major CI deployments"
  - "Consider adding `use_pypi: true` as a default to decouple CI from Keybase GPG verification"
docs:
  - url: "https://github.com/codecov/codecov-action/issues/1956"
    label: "codecov/codecov-action #1956 — Keybase migration announcement (Jun 7, 2026)"
  - url: "https://github.com/codecov/codecov-action/issues/1955"
    label: "codecov/codecov-action #1955 — GPG public key import returns invalid OpenPGP data"
  - url: "https://github.com/codecov/codecov-action/issues/1940"
    label: "codecov/codecov-action #1940 — Intermittent GPG signature failures (precursor)"
  - url: "https://github.com/codecov/codecov-action/releases/tag/v7.0.0"
    label: "codecov/codecov-action v7.0.0 release"
