id: runner-environment-459
title: 'Third-party actions using `node20` runtime emit Node.js 20 deprecation warning'
category: runner-environment
severity: warning
tags:
  - node20
  - node24
  - deprecated
  - eol
  - runtime
  - actions-update
patterns:
  - regex: 'Node\.js 20 actions are deprecated'
    flags: i
  - regex: 'Please update the following actions to use Node\.js 24'
    flags: i
  - regex: 'node20.*runtime.*deprecated'
    flags: i
error_messages:
  - 'Node.js 20 actions are deprecated. Please update the following actions to use Node.js 24: actions/checkout@v3'
  - 'Warning: Node.js 20 actions are deprecated. Please update the following actions to use Node.js 24:'
root_cause: |
  The GitHub Actions runner emits a deprecation warning when it executes an action whose `action.yml`
  specifies `using: node20`. Node.js 20 reached End of Life on 2026-04-30 and GitHub began surfacing
  this warning in mid-2025 to encourage action maintainers and users to migrate to Node.js 24.

  The warning appears for EVERY workflow run that uses any action pinned to a `node20` runtime version
  (e.g. `actions/checkout@v3`, `actions/setup-node@v3`). Older pinned versions of popular first-party
  and third-party actions are the most common culprits. The workflow does not fail — the action still
  executes — but the warning clogs logs and will eventually become an error when GitHub enforces the
  deprecation.
fix: |
  Update affected actions to their latest major versions that target Node.js 24. For first-party
  GitHub Actions, this means bumping to v4 or later (e.g. `actions/checkout@v4`,
  `actions/setup-node@v4`). For third-party actions, check the action's release notes for a
  version that uses `using: node24`.

  If you are an action author, update your `action.yml` to use `using: node24` and republish.
fix_code:
  - language: yaml
    label: 'Update first-party actions to node24-compatible versions'
    code: |
      steps:
        - uses: actions/checkout@v4         # v4+ uses node20→node24
        - uses: actions/setup-node@v4       # v4+ uses node24
        - uses: actions/setup-python@v5     # v5+ uses node24
        - uses: actions/upload-artifact@v4  # v4+ uses node24
        - uses: actions/cache@v4            # v4+ uses node24
  - language: yaml
    label: 'Find actions still using node20 in your workflow'
    code: |
      # Run this locally to find outdated action pins in your workflows:
      grep -r "uses:" .github/workflows/ | grep -E "@v[123]$|@v[123]\."
prevention:
  - 'Use Dependabot or Renovate to automatically update action versions across your workflows.'
  - 'Pin actions to major version tags (e.g. @v4) rather than exact versions to receive automatic patch updates.'
  - 'Subscribe to the GitHub Changelog to track Node.js runtime deprecation announcements.'
docs:
  - url: https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runs-for-javascript-actions
    label: 'GitHub Actions metadata syntax: using: node24'
  - url: https://github.blog/changelog/2025-05-08-github-actions-deprecating-node-js-16-and-node-js-20-actions/
    label: GitHub Changelog — Deprecating Node.js 16 and 20 actions
