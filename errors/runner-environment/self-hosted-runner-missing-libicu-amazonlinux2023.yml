id: runner-environment-473
title: 'Self-hosted runner fails to start on AmazonLinux 2023 / RHEL 9 — missing libicu'
category: runner-environment
severity: error
tags:
  - self-hosted
  - amazon-linux-2023
  - rhel9
  - libicu
  - dotnet
  - globalization
  - linux
patterns:
  - regex: "Couldn't find a valid ICU package installed on the system"
    flags: 'i'
  - regex: 'Libicu.*dependencies is missing for Dotnet Core'
    flags: 'i'
  - regex: 'Process terminated\. Couldn.*ICU'
    flags: 'i'
  - regex: 'installdependencies\.sh.*install.*Dotnet Core'
    flags: 'i'
error_messages:
  - "Couldn't find a valid ICU package installed on the system. Please install libicu using your package manager and try again."
  - "Libicu's dependencies is missing for Dotnet Core 6.0"
  - "Execute sudo ./bin/installdependencies.sh to install any missing Dotnet Core 6.0 dependencies."
  - "Exiting with unknown error code: 134"
root_cause: |
  The GitHub Actions self-hosted runner application is built on .NET, which requires
  the International Components for Unicode (ICU) library for globalization/culture support.
  Amazon Linux 2023 (AL2023), RHEL 9, and some other minimal Linux distributions do not
  ship with libicu preinstalled.

  When `run.sh` (or `runsvc.sh`) starts the `Runner.Listener` binary, the .NET runtime
  fails immediately at startup with a fatal globalization error:
    "Couldn't find a valid ICU package installed on the system"

  The process aborts (exit code 134 = SIGABRT) before the runner can connect to GitHub,
  so the runner never appears as online in the repository settings.

  This is documented in actions/runner#2511 and affects AL2023 (ami-*), Rocky Linux 9,
  AlmaLinux 9, and other systems built on RHEL 9 base packages.
fix: |
  Option 1 — Install libicu (recommended):
    On Amazon Linux 2023 / RHEL 9:
      sudo dnf install -y libicu
    On Ubuntu/Debian (should already be present, but if missing):
      sudo apt-get install -y libicu-dev

  Option 2 — Enable .NET invariant globalization mode (no-ICU fallback):
    Set the environment variable before starting the runner, or add it to
    the runner's .env file:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
    This disables full Unicode culture support but allows the runner to start.
    Not recommended if any workflow steps rely on locale-sensitive string operations.

  Option 3 — Run the bundled dependency installer:
    sudo ./bin/installdependencies.sh
    This script installs .NET dependencies including libicu automatically.
fix_code:
  - language: bash
    label: 'Install libicu on Amazon Linux 2023 / RHEL 9'
    code: |
      sudo dnf install -y libicu
      # Then start the runner
      ./run.sh
  - language: bash
    label: 'Enable .NET invariant globalization as a workaround'
    code: |
      # Add to /path/to/actions-runner/.env
      echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> .env
      ./run.sh
  - language: bash
    label: 'Use the bundled dependency installer'
    code: |
      sudo ./bin/installdependencies.sh
      ./run.sh
prevention:
  - "When provisioning a self-hosted runner on a new OS, run `sudo ./bin/installdependencies.sh` before the first `./run.sh`."
  - "For Amazon Linux 2023 / RHEL 9 runner AMIs or container images, add `dnf install -y libicu` to the instance bootstrap or Dockerfile."
  - "Check runner startup logs in `_diag/Runner_*.log` — a 134 exit code immediately after `run.sh` almost always indicates a .NET dependency failure."
docs:
  - url: 'https://github.com/actions/runner/issues/2511'
    label: 'runner#2511 — Runner not working on AmazonLinux2023 due to missing ICU package'
  - url: 'https://aka.ms/dotnet-missing-libicu'
    label: 'Microsoft — .NET missing libicu troubleshooting'
  - url: 'https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners#supported-architectures-and-operating-systems-for-self-hosted-runners'
    label: 'GitHub Docs — Supported OS for self-hosted runners'
