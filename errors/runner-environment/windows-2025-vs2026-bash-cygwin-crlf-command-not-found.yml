    label: 'runner-images#14319: Wrong line endings causing errors in Bash shell on windows-2025-vs2026 (June 30, 2026)'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell'
    label: 'GitHub Docs: workflow syntax — step shell override'
  - url: 'https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-vs2026-Readme.md'
    label: 'windows-2025-vs2026 image README — installed software and PATH configuration'
