id: re-483
title: 'setup-python Fails: "no such option: --root-user-action" with Bundled pip 22.0.x'
category: runner-environment
severity: error
tags:
  - setup-python
  - pip
  - windows
  - python-3-9
  - version-mismatch
  - pip-upgrade
  - root-user-action
patterns:
  - regex: 'no such option: --root-user-action'
    flags: 'i'
  - regex: 'ERROR: unknown option --root-user-action'
    flags: 'i'
  - regex: 'pip.*--root-user-action.*no such option'
    flags: 'i'
error_messages:
  - "ERROR: no such option: --root-user-action"
  - "Usage:\n  pip install [options] <requirement specifier> ...\n\nno such option: --root-user-action"
root_cause: |
  actions/setup-python@v4 and later versions internally invoke pip with the
  `--root-user-action=ignore` flag when upgrading pip after installation. This
  flag was introduced in pip 22.1.0 to suppress the "running pip as root" warning.

  On Windows runners using Python 3.9.x (specifically 3.9.13), the bundled pip
  version is 22.0.4 — which predates the flag. When setup-python tries to run:

    pip install --upgrade pip --root-user-action=ignore

  pip 22.0.4 responds with "no such option: --root-user-action" and exits with a
  non-zero code, causing the entire setup-python step to fail.

  The root cause is a pip version mismatch: Python 3.9.x bundles an older pip
  that does not yet support the flag added in pip 22.1.0. This primarily manifests
  on Windows where pip is not independently managed, and on older Python patch
  versions that ship with pip 22.0.x.
fix: |
  Option 1 (recommended): Use Python 3.10+ or a newer 3.9 patch version that
  bundles pip >= 22.1.0. Python 3.9.14+ updated the bundled pip.

  Option 2: Pre-upgrade pip using the python ensurepip module before calling
  setup-python, or add a step after checkout to bootstrap pip manually:
    - run: python -m pip install --upgrade pip
      # This uses the system pip without --root-user-action

  Option 3: Pin setup-python to an older version that does not pass
  --root-user-action. Check the setup-python release notes for versions that
  do not include this flag.

  Option 4: Use python-version: '3.9.14' or later which ships with pip >= 22.1.
fix_code:
  - language: yaml
    label: 'Use Python 3.10+ to avoid the old pip version'
    code: |
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # 3.10+ ships pip >= 22.1.0
  - language: yaml
    label: 'Pin Python 3.9.14+ which bundles pip >= 22.1.0'
    code: |
      - name: Set up Python 3.9.14+
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.14'  # 3.9.14 ships pip 22.1.x
prevention:
  - 'Prefer Python 3.10+ in new workflows; 3.10+ ships with pip >= 22.1.0.'
  - 'When pinning Python 3.9, use 3.9.14 or later to get pip >= 22.1.0.'
  - 'Test workflows on Windows runners when mixing Python version pinning with setup-python.'
  - 'Monitor setup-python release notes for pip-related upgrade behavior changes.'
docs:
  - url: 'https://github.com/actions/setup-python/issues/853'
    label: 'setup-python#853 — no such option: --root-user-action on Windows'
  - url: 'https://pip.pypa.io/en/stable/news/#v22-1'
    label: 'pip 22.1 release notes — --root-user-action option added'
  - url: 'https://github.com/actions/setup-python'
    label: 'actions/setup-python — official documentation'
