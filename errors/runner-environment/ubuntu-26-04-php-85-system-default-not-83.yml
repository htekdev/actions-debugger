id: runner-environment-463
title: 'Ubuntu 26.04 Ships PHP 8.5 as System Default — Breaking Changes from PHP 8.3 on ubuntu-24.04'
category: runner-environment
severity: error
tags:
  - ubuntu-26.04
  - php
  - php-85
  - runner-image
  - breaking-change
  - setup-php
patterns:
  - regex: 'PHP 8\.5\.[0-9]+ \(cli\)'
    flags: 'i'
  - regex: 'Deprecated:.*has been removed.*PHP 8\.[45]|Fatal error:.*removed.*PHP 8\.5'
    flags: 'i'
  - regex: 'Call to undefined function .*\(\) in|PHP Fatal error.*8\.5|Deprecated since PHP 8\.[345]'
    flags: 'i'
error_messages:
  - "PHP 8.5.0 (cli) (built: Jun 11 2026)"
  - "PHP Fatal error:  Uncaught Error: Call to undefined function each()"
  - "Deprecated:  Calling get_class() without arguments is deprecated in PHP 8.1"
  - "Fatal error: Uncaught Error: Access to an undeclared static property"
root_cause: |
  Ubuntu 26.04 runner images (announced June 11, 2026 as public preview) ship with
  PHP 8.5 as the system PHP, replacing PHP 8.3 which is the default on ubuntu-24.04.
  Invoking `php` without using `shivammathur/setup-php` (or `ondrej/php` PPA) to
  pin a version will silently receive PHP 8.5 on ubuntu-26.04.

  PHP 8.5 contains breaking changes relative to PHP 8.3:

  - Functions and features deprecated in PHP 8.2 and 8.3 now produce fatal errors
    in PHP 8.5 (deprecation promotions):
    • `mb_convert_encoding()` with non-string encodings
    • `get_class()` / `get_parent_class()` without arguments
    • `ReflectionProperty::getValue()` without arguments
    • Various string/array function signatures tightened
  - The `each()` function removed in PHP 8.0 remains absent — code using it fails
  - Composer 1.x is incompatible with PHP 8.5; only Composer 2.x is supported
  - INI directives: `precision` and `serialize_precision` defaults adjusted
  - OPcache: new defaults affect PCRE caching behavior
  - ext/intl: ICU library updated to a version with changed locale behavior

  Workflows that invoke `composer install`, `phpunit`, or `php artisan` directly
  without setup-php on ubuntu-26.04 will use PHP 8.5.

  Source: actions/runner-images#14226 (Ubuntu 26.04 public preview announcement,
  June 11, 2026) — PHP row shows "8.5.*" for ubuntu-26.04 vs "8.3.*" for ubuntu-24.04.
fix: |
  Use shivammathur/setup-php to pin an explicit PHP version. Never rely on the
  system PHP binary on hosted runners — its version changes between OS generations.
fix_code:
  - language: yaml
    label: 'Pin PHP with setup-php (recommended)'
    code: |
      jobs:
        test:
          runs-on: ubuntu-26.04
          steps:
            - uses: actions/checkout@v4

            # ubuntu-24.04 = PHP 8.3 system, ubuntu-26.04 = PHP 8.5 system
            # Always pin explicitly to avoid unexpected version changes
            - uses: shivammathur/setup-php@v2
              with:
                php-version: '8.3'   # or '8.4' / '8.5' once tested
                extensions: mbstring, intl, pdo, xml
                coverage: xdebug
                tools: composer:v2

            - run: php --version
            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/phpunit

  - language: yaml
    label: 'Matrix test across PHP versions to catch 8.5 issues'
    code: |
      jobs:
        test:
          runs-on: ubuntu-26.04
          strategy:
            matrix:
              php-version: ['8.3', '8.4', '8.5']
          steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                php-version: ${{ matrix.php-version }}
                extensions: mbstring, intl
                tools: composer:v2
            - run: composer install --no-interaction
            - run: vendor/bin/phpunit

prevention:
  - 'Always use `shivammathur/setup-php` with an explicit `php-version` — the system PHP differs between ubuntu-24.04 (8.3) and ubuntu-26.04 (8.5).'
  - 'Run `php --version` as an early workflow step to confirm the active PHP version and catch unintended upgrades quickly.'
  - 'Before migrating to ubuntu-26.04, test your code against PHP 8.4 and 8.5 locally — functions deprecated in PHP 8.2/8.3 become fatal errors in PHP 8.5.'
  - 'Ensure you are using Composer 2.x — Composer 1.x is not compatible with PHP 8.5.'
docs:
  - url: 'https://github.com/actions/runner-images/issues/14226'
    label: 'runner-images#14226: Ubuntu 26.04 public preview — PHP version differences table'
  - url: 'https://github.com/shivammathur/setup-php'
    label: 'shivammathur/setup-php — manage PHP versions in GitHub Actions'
  - url: 'https://www.php.net/manual/en/migration85.php'
    label: 'PHP 8.5 migration guide — incompatible changes from 8.3'
  - url: 'https://www.php.net/manual/en/migration84.php'
    label: 'PHP 8.4 migration guide — intermediate breaking changes'
