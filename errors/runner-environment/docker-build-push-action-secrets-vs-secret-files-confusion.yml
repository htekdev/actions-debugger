id: runner-environment-365
title: 'docker/build-push-action `secrets` vs `secret-files` Confusion — File Path in `secrets` Input Is Not Passed to BuildKit'
category: runner-environment
severity: error
tags:
  - docker
  - build-push-action
  - buildkit
  - secrets
  - secret-files
  - mount-type-secret
  - dockerfile
  - buildx
patterns:
  - regex: '--mount=type=secret.*file.*not found|mount.*secret.*cannot find'
    flags: 'i'
  - regex: 'secret.*id=.*src=.*build.push.action'
    flags: 'i'
error_messages:
  - '(no clear error from BuildKit — pip install or other tool fails because /run/secrets/<id> is empty or absent)'
  - 'ERROR [build 3/3] RUN pip install --no-cache-dir -r requirements.txt'
  - 'failed to solve: failed to read dockerfile: open /tmp/buildkit-mount...: no such file or directory'
root_cause: |
  `docker/build-push-action` exposes two distinct secret inputs that are commonly confused:

  - **`secrets:`** — accepts **inline key=value content**, NOT a file path. The value is
    the secret content itself (e.g., `secrets: "id=mytoken,value=abc123"` or multi-line
    `id=name\ncontents...`). Passing a filesystem path here makes BuildKit write the literal
    path string as the secret content — the file is never read.

  - **`secret-files:`** — accepts **key=path pairs** where path is a filesystem path to
    a file whose contents are mounted as the secret. This is the correct input for
    `--mount=type=secret,id=pip,target=/etc/pip.conf` patterns.

  Additionally, within the `secrets:` / `secret-files:` inputs, `${{ env.GITHUB_WORKSPACE }}`
  is NOT evaluated as an expression — only `${{ github.workspace }}` resolves correctly.
  Using `$GITHUB_WORKSPACE` as a shell variable (without `${{ }}`) also does not work in
  the action's `with:` block.

  This is a common mistake because Docker CLI uses `--secret id=pip,src=<path>` with a
  file path, but the `build-push-action` separates these into different inputs with
  different semantics.

  Tracked in: docker/build-push-action#1326.
fix: |
  Use `secret-files:` (not `secrets:`) when the secret content lives in a file.
  Use `${{ github.workspace }}` (not `${{ env.GITHUB_WORKSPACE }}`) for path resolution.

  If passing the secret content inline (e.g., a config file written in a prior step),
  use `secrets:` with the content, not the path.
fix_code:
  - language: yaml
    label: 'WRONG — passing a file path to secrets: (path treated as literal content)'
    code: |
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          secrets: |
            id=pip,src=${{ env.GITHUB_WORKSPACE }}/.config/pip/pip.conf  # ❌ wrong input
            # Dockerfile RUN --mount=type=secret,id=pip will see the literal
            # path string as the secret, not the file contents.
  - language: yaml
    label: 'RIGHT — use secret-files: for file-based secrets with github.workspace'
    code: |
      - name: Write pip config
        run: |
          mkdir -p ${{ github.workspace }}/.config/pip
          echo "[global]" > ${{ github.workspace }}/.config/pip/pip.conf
          echo "extra-index-url = ${{ secrets.PYPI_TOKEN }}" >> ${{ github.workspace }}/.config/pip/pip.conf

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          secret-files: |
            pip=${{ github.workspace }}/.config/pip/pip.conf  # ✅ correct input for file-based secrets
          # Dockerfile: RUN --mount=type=secret,id=pip,target=/etc/pip.conf pip install ...
  - language: yaml
    label: 'ALTERNATIVE — pass secret content inline with secrets: (no file needed)'
    code: |
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          secrets: |
            pip=[global]
            extra-index-url = ${{ secrets.PYPI_TOKEN }}
            # ✅ correct: inline multi-line content via secrets:
            # Dockerfile: RUN --mount=type=secret,id=pip ...
            #   cat /run/secrets/pip will show the ini content
prevention:
  - 'Use `secret-files:` for secrets stored in files on the runner filesystem; use `secrets:` for inline key=value content.'
  - 'Always use `${{ github.workspace }}` for path expressions inside `with:` blocks — `${{ env.GITHUB_WORKSPACE }}` and bare `$GITHUB_WORKSPACE` are not evaluated correctly by docker/build-push-action.'
  - 'Test the Dockerfile locally with `docker buildx build --secret id=<id>,src=<path>` to verify the secret mount works before adding the GitHub Actions wrapper.'
  - 'Read docker/build-push-action inputs documentation carefully — the action API differs from the `docker buildx build` CLI flags.'
docs:
  - url: 'https://docs.docker.com/build/ci/github-actions/secrets/'
    label: 'Docker Docs — GitHub Actions secrets with build-push-action'
  - url: 'https://github.com/docker/build-push-action'
    label: 'docker/build-push-action — README and inputs reference'
  - url: 'https://github.com/docker/build-push-action/issues/1326'
    label: 'docker/build-push-action#1326 — secrets vs secret-files confusion with GITHUB_WORKSPACE'
  - url: 'https://stackoverflow.com/questions/79450537/docker-build-does-not-pass-secret-via-mount-type-secret'
    label: 'Stack Overflow — Docker Build does not pass secret via --mount=type=secret (Score 4, Views 560)'
