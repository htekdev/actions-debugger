id: runner-environment-474
title: "action.yml 'using: node22' not supported — ArgumentOutOfRangeException on older runners"
category: runner-environment
severity: error
tags:
  - action-yml
  - node22
  - runs-using
  - javascript-action
  - runner-version
  - self-hosted
  - ghes
patterns:
  - regex: "'using: node22' is not supported"
    flags: 'i'
  - regex: 'using.*node22.*not supported.*use.*docker.*node12.*node16.*node20'
    flags: 'i'
  - regex: 'System\.ArgumentOutOfRangeException.*using.*node22'
    flags: 'i'
  - regex: 'ActionManifestManager\.ConvertRuns.*node22'
    flags: 'i'
error_messages:
  - "System.ArgumentOutOfRangeException: Specified argument was out of the range of valid values. (Parameter ''using: node22' is not supported, use 'docker', 'node12', 'node16' or 'node20' instead.')"
  - "Error: System.ArgumentOutOfRangeException"
root_cause: |
  GitHub Actions JavaScript actions specify their Node.js runtime in `action.yml`
  via the `runs.using` field (e.g., `using: 'node20'`). Node.js 22 became LTS on
  October 29, 2024, but the runner did not add support for `using: node22` until
  runner v2.322.0 (released December 2025).

  Any action specifying `using: 'node22'` on a runner older than v2.322 (including
  all GitHub Enterprise Server versions before 3.15 and self-hosted runners pinned
  to older versions) causes the `ActionManifestManager.ConvertRuns` method to throw
  `System.ArgumentOutOfRangeException` and fail the job immediately.

  This was reported in actions/runner#3600 with 74 reactions and was closed after
  node22 support was added. GitHub-hosted runners were updated automatically, but
  self-hosted runners and GHES environments require manual runner upgrades.
fix: |
  Option 1 — Upgrade the runner to v2.322 or later (recommended):
    GitHub-hosted runners are updated automatically.
    Self-hosted runners: upgrade to the latest runner release.
    GHES: upgrade to a version that includes runner v2.322+ support.

  Option 2 — Use node20 in action.yml as a fallback:
    Change `using: 'node22'` to `using: 'node20'` in your `action.yml`.
    Node.js 20 is available across all runner versions that support node20.
    Node.js 22 code is largely compatible with Node.js 20 unless you rely on v22-specific APIs.
fix_code:
  - language: yaml
    label: 'action.yml — use node20 for maximum compatibility, or node22 after runner upgrade'
    code: |
      # For runners >= v2.322 (GitHub-hosted after Dec 2025, or updated self-hosted):
      runs:
        using: 'node22'
        main: 'dist/index.js'

      # For older runners or GHES < 3.15: use node20 instead
      runs:
        using: 'node20'
        main: 'dist/index.js'
prevention:
  - "Before publishing an action with `using: node22`, verify your target runner version supports it (v2.322+)."
  - "For actions targeting GHES environments, check the GHES release notes for the bundled runner version before upgrading `runs.using`."
  - "Pin `using: 'node20'` in actions intended for broad compatibility including self-hosted and GHES runners."
  - "Monitor GitHub Actions runner release notes when upgrading the `using` runtime in your actions."
docs:
  - url: 'https://github.com/actions/runner/issues/3600'
    label: 'runner#3600 — Support node22 in runs.using for JavaScript actions (74 reactions, fixed v2.322)'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions#runs-for-javascript-actions'
    label: 'GitHub Docs — runs for JavaScript actions (supported Node.js versions)'
  - url: 'https://docs.github.com/en/enterprise-server@latest/admin/release-notes'
    label: 'GitHub Enterprise Server release notes'
