id: runner-environment-377
title: 'Kotlin 2.4.0 on Runner: KtLint Fails with "Extensions storage is not registered"'
category: runner-environment
severity: error
tags:
  - kotlin
  - kotlin-2.4
  - ktlint
  - gradle
  - android
  - linting
  - runner-update
patterns:
  - regex: 'Extensions storage is not registered'
    flags: 'i'
  - regex: 'KotlinCoreEnvironment.*Extensions storage'
    flags: 'is'
  - regex: 'com\.pinterest\.ktlint.*IllegalStateException'
    flags: 'is'
  - regex: 'KtlintKotlinCompiler.*clinit'
    flags: 'is'
error_messages:
  - 'java.lang.IllegalStateException: Extensions storage is not registered'
  - 'at org.jetbrains.kotlin.cli.jvm.compiler.KotlinCoreEnvironment$Companion.registerExtensionsFromPlugins'
  - 'at com.pinterest.ktlint.rule.engine.core.api.KtlintKotlinCompilerKt.initPsiFileFactory'
  - 'at com.pinterest.ktlint.rule.engine.core.api.KtlintKotlinCompiler.<clinit>'
root_cause: |
  Kotlin 2.4.0 changed how `CompilerConfiguration` instances are created. Previously, calling
  the `CompilerConfiguration()` constructor was sufficient to get a fully initialized
  configuration. In 2.4.0, configuration services are now only registered when calling the new
  `CompilerConfiguration.create()` factory function — the bare constructor no longer registers
  required services.

  KtLint (as of 1.8.0) calls the `CompilerConfiguration` constructor directly when creating its
  `KotlinCoreEnvironment` (in `KtlintKotlinCompiler.kt`). Because services are not registered,
  all downstream code that expects them (including `registerExtensionsFromPlugins`) throws
  `IllegalStateException: Extensions storage is not registered`.

  This is tracked in:
  - ktlint/ktlint#3289 (open, reported April 2026)
  - KT-85969 (Kotlin YouTrack — "KtLint incompatible with Kotlin 2.4.0")

  Runner images that updated Kotlin from 2.3.21 to 2.4.0 in June 2026 expose this:
  - ubuntu-24.04 ≥ 20260607.184.1
  - windows-2025 ≥ 20260607.161.1
  - windows-2025-vs2026 ≥ 20260608.135.2

  Any project that runs `./gradlew ktlintCheck` (or any ktlint Gradle task) on these images
  will fail with the stack trace above.

  Note: This affects the **KtLint Gradle Plugin** more broadly than KtLint Core. The plugin
  upgrades the embedded Kotlin compiler to the runner's version, which is now 2.4.0.
fix: |
  **Option A (recommended): Pin Kotlin to 2.3.21 in your Gradle build until ktlint ships
  a fixed release.**

  In your root `build.gradle.kts` or `gradle/libs.versions.toml`, override the embedded
  Kotlin version that ktlint uses:

  **Option B: Pin the runner image to a pre-2.4.0 Kotlin image (temporary workaround).**
  Use `runs-on: ubuntu-22.04` or a specific version of ubuntu-24.04 before 20260607.

  **Option C: Wait for ktlint 1.8.1+ which will fix the `KotlinCoreEnvironment` setup
  to use `CompilerConfiguration.create()` instead of the constructor.**

  The fix is tracked upstream in ktlint/ktlint#3289. Once merged, upgrading to the fixed
  ktlint version will resolve the issue without any pinning.
fix_code:
  - language: yaml
    label: 'Pin Kotlin version to 2.3.21 in ktlint Gradle plugin config (build.gradle.kts)'
    code: |
      # In your Gradle ktlint plugin configuration, override the embedded Kotlin compiler:
      # build.gradle.kts
      ktlint {
          version.set("1.8.0")
          # Override the Kotlin compiler version used by ktlint to avoid 2.4.0 incompatibility
          additionalEditorconfig.set(mapOf("ij_kotlin_imports_layout" to "*"))
      }

      # Alternative: force ktlint Gradle plugin to use an older embedded Kotlin
      configurations.named("ktlint") {
          resolutionStrategy {
              force("org.jetbrains.kotlin:kotlin-compiler-embeddable:2.3.21")
          }
      }
  - language: yaml
    label: 'Temporary runner pin in workflow YAML to avoid Kotlin 2.4.0'
    code: |
      jobs:
        lint:
          # Temporary: pin to ubuntu-24.04 image before Kotlin 2.4.0 rollout
          # Remove once ktlint ships a fix for KT-85969
          runs-on: ubuntu-22.04
          steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: 21
            - name: Run ktlint
              run: ./gradlew ktlintCheck
prevention:
  - 'Pin Kotlin version explicitly in gradle/libs.versions.toml to control which compiler ktlint embeds'
  - 'Subscribe to ktlint release notes for a fix to KT-85969 / ktlint#3289'
  - 'Use a specific ubuntu-24.04 image version (runs-on: ubuntu-24.04@<version>) in critical lint jobs to avoid surprise bumps'
  - 'Test with newer Kotlin versions in a canary CI job before the runner automatically updates'
docs:
  - url: 'https://github.com/ktlint/ktlint/issues/3289'
    label: 'KtLint is incompatible with Kotlin 2.4.0 — ktlint/ktlint#3289'
  - url: 'https://youtrack.jetbrains.com/issue/KT-85969'
    label: 'KT-85969: KtLint incompatible with Kotlin 2.4.0-Beta2 (parsing errors / Extensions storage issue)'
  - url: 'https://github.com/actions/runner-images/releases/tag/ubuntu24%2F20260607.184'
    label: 'Ubuntu 24.04 20260607.184 release notes — Kotlin 2.3.21 → 2.4.0'
