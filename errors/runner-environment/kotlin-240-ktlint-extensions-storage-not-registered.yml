id: runner-environment-382
title: 'Kotlin 2.4.0 on Runner: KtLint Fails with "Extensions storage is not registered"'
category: runner-environment
severity: error
tags:
  - kotlin
  - kotlin-2.4
  - ktlint
  - gradle
  - android
  - linting
  - runner-update
patterns:
  - regex: 'Extensions storage is not registered'
    flags: 'i'
  - regex: 'KotlinCoreEnvironment.*Extensions storage'
    flags: 'is'
  - regex: 'com\.pinterest\.ktlint.*IllegalStateException'
    flags: 'is'
  - regex: 'KtlintKotlinCompiler.*clinit'
    flags: 'is'
error_messages:
  - 'java.lang.IllegalStateException: Extensions storage is not registered'
  - 'at org.jetbrains.kotlin.cli.jvm.compiler.KotlinCoreEnvironment$Companion.registerExtensionsFromPlugins'
  - 'at com.pinterest.ktlint.rule.engine.core.api.KtlintKotlinCompilerKt.initPsiFileFactory'
  - 'at com.pinterest.ktlint.rule.engine.core.api.KtlintKotlinCompiler.<clinit>'
root_cause: |
  Kotlin 2.4.0 changed how `CompilerConfiguration` instances are created. Previously, calling
  the `CompilerConfiguration()` constructor was sufficient to get a fully initialized
  configuration. In 2.4.0, configuration services are now only registered when calling the new
  `CompilerConfiguration.create()` factory function — the bare constructor no longer registers
  required services.

  KtLint (as of 1.8.0) calls the `CompilerConfiguration` constructor directly when creating its
  `KotlinCoreEnvironment` (in `KtlintKotlinCompiler.kt`). Because services are not registered,
  all downstream code that expects them (including `registerExtensionsFromPlugins`) throws
  `IllegalStateException: Extensions storage is not registered`.

  This is tracked in:
  - ktlint/ktlint#3289 (open, reported April 2026)
  - KT-85969 (Kotlin YouTrack — "KtLint incompatible with Kotlin 2.4.0")

  Runner images that updated Kotlin from 2.3.21 to 2.4.0 in June 2026 expose this:
  - ubuntu-24.04 >= 20260607.184.1
  - windows-2025 >= 20260607.161.1
  - windows-2025-vs2026 >= 20260608.135.2

  Any project that runs `./gradlew ktlintCheck` (or any ktlint Gradle task) on these images
  will fail with the stack trace above.

  Note: The KtLint Gradle Plugin upgrades the embedded Kotlin compiler to the runner's version
  (now 2.4.0), which is how the incompatibility manifests in CI.
fix: |
  **Option A (recommended): Pin Kotlin to 2.3.21 in Gradle until ktlint ships a fix.**

  Override the embedded Kotlin compiler version that the ktlint Gradle plugin uses by adding
  a resolution strategy to your Gradle build configuration.

  **Option B: Pin the runner image.**
  Use `runs-on: ubuntu-22.04` or a specific ubuntu-24.04 image version tag that still ships
  Kotlin 2.3.21 (images before ubuntu-24.04 20260607.184).

  **Option C: Wait for ktlint 1.8.1+ which fixes the KotlinCoreEnvironment setup.**
  The fix is tracked upstream in ktlint/ktlint#3289. Once merged and released, upgrading
  to the fixed ktlint version will resolve the issue without any pinning.
fix_code:
  - language: yaml
    label: 'Temporary runner pin to avoid Kotlin 2.4.0 until ktlint fix ships'
    code: |
      jobs:
        lint:
          # Pin to ubuntu-22.04 until ktlint releases a fix for KT-85969
          # Remove once ktlint ships compatibility with Kotlin 2.4.0
          runs-on: ubuntu-22.04
          steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: 21
            - name: Run ktlint
              run: ./gradlew ktlintCheck
  - language: yaml
    label: 'Force older embedded Kotlin in ktlint via Gradle resolution strategy'
    code: |
      # In build.gradle.kts — override the Kotlin compiler embedded in ktlint
      # to avoid the 2.4.0 incompatibility while a fix is in progress
      configurations.named("ktlint") {
          resolutionStrategy {
              force("org.jetbrains.kotlin:kotlin-compiler-embeddable:2.3.21")
          }
      }
prevention:
  - 'Pin Kotlin version explicitly to control which compiler ktlint embeds'
  - 'Subscribe to ktlint release notes for a fix to KT-85969'
  - 'Test with newer Kotlin versions in a canary CI job before runner images auto-update'
  - 'Use a specific ubuntu-24.04 image version in critical lint jobs to avoid surprise bumps'
docs:
  - url: 'https://github.com/ktlint/ktlint/issues/3289'
    label: 'KtLint is incompatible with Kotlin 2.4.0 — ktlint/ktlint#3289'
  - url: 'https://youtrack.jetbrains.com/issue/KT-85969'
    label: 'KT-85969: KtLint incompatible with Kotlin 2.4.0 (Extensions storage issue)'
  - url: 'https://github.com/actions/runner-images/releases/tag/ubuntu24%2F20260607.184'
    label: 'Ubuntu 24.04 20260607.184 release notes — Kotlin 2.3.21 to 2.4.0'
