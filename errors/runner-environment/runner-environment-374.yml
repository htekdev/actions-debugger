id: runner-environment-374
title: 'setup-go v4/v5 Falls Back to storage.googleapis.com/golang Which Returns 403 (Anonymous Access Revoked)'
category: runner-environment
severity: error
tags:
  - setup-go
  - go
  - download
  - fallback
  - 403
  - google-cloud-storage
patterns:
  - regex: 'Failed to download version .+: Error: Unexpected HTTP response: 403'
    flags: 'i'
  - regex: 'Acquiring go[\d.]+ from https://storage\.googleapis\.com/golang/'
    flags: 'i'
  - regex: 'Not found in manifest\.\s+Falling back to download directly from Go'
    flags: 'i'
error_messages:
  - "Error: Failed to download version 1.24.11: Error: Unexpected HTTP response: 403"
  - "Error: Failed to download version ^1.20.0: Error: Unexpected HTTP response: 403"
  - "Not found in manifest.  Falling back to download directly from Go"
  - "Acquiring go1.25.3 from https://storage.googleapis.com/golang/go1.25.3.linux-amd64.tar.gz"
root_cause: |
  `actions/setup-go` v4 and older v5 versions (before v5.5.2) fall back to downloading
  Go directly from `storage.googleapis.com/golang` when the requested version is not
  found in the `actions/go-versions` manifest. Historically this Google Cloud Storage
  bucket was publicly readable (anonymous access allowed).

  In late 2025, Google revoked anonymous (unauthenticated) access to this bucket,
  causing any fallback download attempt to return HTTP 403 Forbidden. This affects:

  - Any workflow using `setup-go@v4` or `setup-go@v5` (< v5.5.2)
  - Go versions not yet listed in the `actions/go-versions` manifest (e.g., very
    recent patch releases or older versions removed from the manifest)
  - GitHub Enterprise Server (GHES) instances that bundle older action versions

  The log sequence that triggers this:
  1. `Not found in manifest.  Falling back to download directly from Go`
  2. `Acquiring go<version> from https://storage.googleapis.com/golang/...`
  3. `Error: Unexpected HTTP response: 403`

  `setup-go@v6` changed the fallback URL to `go.dev/dl` which still allows
  anonymous downloads, and v5.5.2 backported the same fix.

  Reference: actions/setup-go#664 (Oct 2025, 15+ reactions),
  actions/setup-go#688 (Dec 2025, 12 reactions),
  fix PRs: actions/setup-go#665 (v6), #689 (v5 backport).
fix: |
  Option A (recommended): Upgrade to `actions/setup-go@v6`. Version 6 changed the
  fallback download source from the Google Cloud Storage bucket to `go.dev/dl`.

  Option B: If you must stay on v5, upgrade to v5.5.2 or later, which includes the
  backported fallback URL fix (PR #689).

  Option C (temporary): Pin to a Go version that is already in the `actions/go-versions`
  manifest by specifying an exact version. Check which versions are available at
  https://github.com/actions/go-versions/blob/main/versions-manifest.json.

  Option D: If you see this on GHES, the bundled action version may be too old.
  Reference the action from the marketplace by SHA or upgrade to the latest GHES version.
fix_code:
  - language: yaml
    label: 'Option A: Upgrade to setup-go@v6'
    code: |
      - name: Set up Go
        uses: actions/setup-go@v6       # v6 uses go.dev/dl fallback, not GCS
        with:
          go-version: '1.24'
  - language: yaml
    label: 'Option B: Use v5.5.2+ if staying on v5'
    code: |
      - name: Set up Go
        uses: actions/setup-go@v5.5.2   # v5.5.2 backports the fallback URL fix
        with:
          go-version: '1.24'
  - language: yaml
    label: 'Option C: Pin to exact version confirmed in go-versions manifest'
    code: |
      # Check https://github.com/actions/go-versions/blob/main/versions-manifest.json
      # to confirm your desired version is listed before using this workaround
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.11'   # Exact version — bypasses fallback if in manifest
prevention:
  - 'Upgrade to actions/setup-go@v6 or v5.5.2+ to avoid the deprecated GCS fallback URL'
  - 'Specify an exact Go version (e.g., 1.24.11 not ^1.20.0) to reduce the chance of a manifest miss triggering the fallback'
  - 'Monitor actions/setup-go releases — GCS fallback failures often affect many users simultaneously when a new Go patch is released before the manifest is updated'
  - 'On GHES, ensure your bundled action versions are current or override the action source in your workflows'
docs:
  - url: 'https://github.com/actions/setup-go/releases/tag/v6.0.0'
    label: 'actions/setup-go v6.0.0 release notes'
  - url: 'https://github.com/actions/setup-go/issues/664'
    label: 'actions/setup-go#664: storage.googleapis.com 403 on fallback'
  - url: 'https://github.com/actions/setup-go/issues/688'
    label: 'actions/setup-go#688: fallback URL no longer available (Dec 2025)'
  - url: 'https://github.com/actions/go-versions/blob/main/versions-manifest.json'
    label: 'actions/go-versions: available versions manifest'
