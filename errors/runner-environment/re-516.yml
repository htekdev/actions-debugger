id: re-516
title: 'GitHub-Hosted RHEL 9/10 Runner Fails on `apt-get` — Package Manager Is `dnf`, Not `apt`'
category: runner-environment
severity: error
tags:
  - rhel
  - rhel-9
  - rhel-10
  - apt-get
  - dnf
  - package-manager
  - runner-image
  - larger-runners
patterns:
  - regex: 'apt-get.*command not found'
    flags: 'i'
  - regex: 'apt-get.*No such file or directory'
    flags: 'i'
  - regex: 'E: Unable to locate package'
    flags: 'i'
  - regex: 'bash.*apt-get.*127'
    flags: 'i'
error_messages:
  - '/bin/bash: apt-get: command not found'
  - 'bash: line 1: apt-get: command not found'
  - 'E: Unable to locate package <name>'
  - 'Process completed with exit code 127.'
root_cause: |
  GitHub added GitHub-hosted larger runners with Red Hat Enterprise Linux (RHEL) 9
  and RHEL 10 images in public preview on June 25, 2026. RHEL is RPM-based and uses
  `dnf` (RHEL 9/10) or `yum` as its package manager. `apt-get` is a Debian/Ubuntu
  tool and does not exist on RHEL images.

  Workflows that hard-code `sudo apt-get install ...` to install dependencies fail
  immediately on RHEL-based runners with exit code 127 ("command not found"). This
  is especially common in workflows copy-pasted from Ubuntu-based examples,
  action README snippets, and CI setup guides that assume a Debian-based system.

  Beyond the package manager, pre-installed tool availability differs from Ubuntu
  runners: package names may differ (e.g., `libssl-dev` on Ubuntu vs
  `openssl-devel` on RHEL), and some tools available by default on Ubuntu
  runners may not be pre-installed on RHEL images in public preview.
fix: |
  Use `dnf` instead of `apt-get` on RHEL 9/10 runners. Use OS-release detection
  or separate job matrix entries to support both Ubuntu and RHEL runners in the
  same workflow.

  Check the RHEL runner software list at actions/runner-images to confirm which
  tools are pre-installed before adding installation steps.
fix_code:
  - language: yaml
    label: 'Detect OS and use the correct package manager'
    code: |
      steps:
        - name: Install dependencies
          run: |
            . /etc/os-release
            case "$ID" in
              rhel|centos|fedora)
                sudo dnf install -y openssl-devel jq curl ;;
              ubuntu|debian)
                sudo apt-get update && sudo apt-get install -y libssl-dev jq curl ;;
              *)
                echo "Unsupported OS: $ID" && exit 1 ;;
            esac

  - language: yaml
    label: 'Matrix strategy for Ubuntu and RHEL runners'
    code: |
      jobs:
        test:
          strategy:
            matrix:
              runner: [ubuntu-latest, rhel-9-latest]
          runs-on: ${{ matrix.runner }}
          steps:
            - name: Install dependencies
              run: |
                if command -v dnf &>/dev/null; then
                  sudo dnf install -y openssl-devel
                else
                  sudo apt-get install -y libssl-dev
                fi

prevention:
  - 'Never hard-code apt-get in workflows that may target non-Debian runners — use OS-detection or matrix conditionals'
  - 'Review the actions/runner-images software list for RHEL before adding package installation steps'
  - 'Test workflows against new runner image labels in a separate non-blocking job before making them the default runner'
docs:
  - url: 'https://github.blog/changelog/2026-06-25-red-hat-enterprise-linux-runner-images-public-preview/'
    label: 'GitHub Changelog — Red Hat Enterprise Linux runner images public preview (June 25, 2026)'
  - url: 'https://github.com/actions/runner-images'
    label: 'actions/runner-images — GitHub-hosted runner software lists'
  - url: 'https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-larger-runners'
    label: 'GitHub Docs — About larger runners'