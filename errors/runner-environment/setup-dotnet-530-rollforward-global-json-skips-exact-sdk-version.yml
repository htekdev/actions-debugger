id: runner-environment-453
title: '`setup-dotnet` v5.3.0 skips exact SDK install when `rollForward` is set in `global.json`'
category: runner-environment
severity: error
tags:
  - setup-dotnet
  - dotnet
  - global-json
  - rollForward
  - sdk-version
  - action-regression
  - v5
patterns:
  - regex: 'setup-dotnet.*5\.3\.[0-9].*rollForward|rollForward.*setup-dotnet.*skip.*install'
    flags: 'i'
  - regex: 'Version.*not.*installed.*rollForward|global\.json.*rollForward.*latestMajor.*skip'
    flags: 'i'
  - regex: 'Acquired dotnet.*\d+\.\d+\.\d+.*instead.*requested'
    flags: 'i'
error_messages:
  - "SDK version '10.0.301' not found, using compatible version '10.0.300'"
  - "Found matching SDK version via rollForward, skipping download"
  - "error MSB1003: Specify a project or solution file."
root_cause: |
  `actions/setup-dotnet` v5.3.0 introduced a change in how it handles `global.json` files that
  contain the `rollForward` field. In v5.2.x, if the exact SDK version specified in `global.json`
  was not already cached on the runner, setup-dotnet would download and install it. In v5.3.0,
  the action now interprets `rollForward` as meaning "an installed compatible version is
  acceptable," and may skip downloading the exact version if a compatible SDK is already present
  on the runner.

  This breaks two scenarios:
  1. Projects using preview SDKs (e.g., `11.0.100-preview.4.x`) with `rollForward: "latestMajor"`
     — the action finds the stable 10.x SDK on the runner and decides it satisfies "latestMajor",
     never installing the preview.
  2. Projects targeting an exact patch version (e.g., `10.0.301`) that is not yet on the runner
     — the action picks up `10.0.300` (already cached) instead of downloading `10.0.301`.

  The result is that CI runs with a different SDK than the project declares, causing subtle build
  differences, version-specific API failures, or hard failures when the resolved SDK doesn't
  support required language features.
fix: |
  Pin setup-dotnet to v5.2.x until the v5.3.x rollForward handling is fixed, or remove
  `rollForward` from `global.json` when using setup-dotnet.

  Alternatively, explicitly pass the desired SDK version to the `dotnet-version` input to
  override global.json resolution.
fix_code:
  - language: yaml
    label: 'Pin to v5.2.x to avoid rollForward regression'
    code: |
      - uses: actions/setup-dotnet@v5
        # Pin to 5.2.x to avoid rollForward skipping behavior in 5.3.x
        # See: https://github.com/actions/setup-dotnet/issues/740
        with:
          global-json-file: global.json
  - language: yaml
    label: 'Explicitly specify SDK version to bypass rollForward logic'
    code: |
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.301'  # Explicit version bypasses global.json rollForward
  - language: yaml
    label: 'Remove rollForward from global.json as workaround'
    code: |
      # global.json — remove rollForward if you need exact SDK installation:
      # {
      #   "sdk": {
      #     "version": "10.0.301"
      #     // "rollForward": "latestMajor"  <-- remove this line
      #   }
      # }

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
prevention:
  - "Pin `actions/setup-dotnet` to a specific patch version to avoid unexpected behavior changes"
  - "Test SDK version resolution in CI by checking `dotnet --version` after setup"
  - "Prefer explicit `dotnet-version` input over global.json for CI SDK pinning"
  - "Use `dotnet --list-sdks` step to verify the installed SDK version matches expectations"
docs:
  - url: 'https://github.com/actions/setup-dotnet/issues/740'
    label: 'setup-dotnet#740: v5.3.0 breaks exact SDK versions when rollForward present'
  - url: 'https://github.com/actions/setup-dotnet/issues/739'
    label: 'setup-dotnet#739: v5.3.0 breaks global.json with latestFeature'
  - url: 'https://learn.microsoft.com/en-us/dotnet/core/tools/global-json#rollforward'
    label: 'global.json rollForward documentation'
  - url: 'https://github.com/actions/setup-dotnet'
    label: 'actions/setup-dotnet action'
