id: runner-environment-314
title: "setup-java Temurin LTS Version `.LTS` Suffix Not Found When Pinning Exact Build Metadata"
category: runner-environment
severity: error
tags:
  - setup-java
  - temurin
  - java-version
  - lts
  - semver
  - version-file
patterns:
  - regex: 'Could not find satisfied version for SemVer.*\+[0-9]+\''
    flags: "i"
  - regex: 'Could not find satisfied version for SemVer.*21\.[0-9]+\.[0-9]+\+[0-9]'
    flags: "i"
  - regex: 'Available versions:.*\.0\.LTS'
    flags: "i"
error_messages:
  - "Error: Could not find satisfied version for SemVer '21.0.6+7'. Available versions: 21.0.6+7.0.LTS, ..."
  - "Error: Could not find satisfied version for SemVer '17.0.11+9'. Available versions: 17.0.11+9.0.LTS, ..."
  - "Error: Could not find satisfied version for SemVer '21.0.5+11'. Available versions: 21.0.5+11.0.LTS, ..."
root_cause: |
  Adoptium appends a `.0.LTS` suffix to the build metadata of Long-Term Support (LTS) Java
  releases (8, 11, 17, 21, 25, ...) in their API. When a `.java-version` file or workflow
  specifies an exact build version like `21.0.6+7`, setup-java performs a strict SemVer
  comparison and cannot match `21.0.6+7.0.LTS`. The LTS suffix is treated as distinct
  build metadata, so no version satisfies the request and the step fails.
  Non-LTS releases (e.g., Java 22) are unaffected. This is a known open issue in
  setup-java with no planned fix on the action side; users must adjust their version strings.
fix: |
  Use only the major version in `java-version` (e.g., `'21'`) to let setup-java resolve
  the latest available patch. If an exact version is required, append the `.0.LTS` suffix
  to match what Adoptium's API returns (e.g., `21.0.6+7.0.LTS`). Alternatively, pin
  using the Temurin SDKMAN format in `.sdkmanrc` or use `check-latest: true`.
fix_code:
  - language: yaml
    label: "Use major version only (recommended)"
    code: |
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'    # Resolves latest 21.x available
  - language: yaml
    label: "Pin with LTS suffix in .java-version file"
    code: |
      # In .java-version file — include the .LTS suffix for LTS releases:
      # temurin-21.0.6+7.0.LTS
      - name: Set up JDK from .java-version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
prevention:
  - "Avoid pinning to the exact build metadata string for LTS releases; use major version only"
  - "If pinning is required, check the Adoptium API for the exact version string including `.0.LTS` suffix"
  - "Non-LTS Java versions (22, 23, 24) do not have the `.LTS` suffix issue"
  - "Use `check-latest: true` to always get the newest available patch for the major version"
docs:
  - url: "https://github.com/actions/setup-java/issues/803"
    label: "actions/setup-java#803: Temurin LTS suffix version file mismatch (open)"
  - url: "https://api.adoptium.net/q/swagger-ui/#/Assets/getLatestAssets"
    label: "Adoptium API: version strings include .LTS suffix for LTS releases"
  - url: "https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#supported-version-syntax"
    label: "setup-java: Supported version syntax"
