id: silent-failures-193
title: 'Reusable Workflow Environment-Scoped Secrets Silently Resolve to Empty String Without "secrets: inherit" on Caller'
category: silent-failures
severity: silent-failure
tags:
  - reusable-workflow
  - secrets
  - environment
  - workflow-call
  - silent-empty
  - secrets-inherit
patterns:
  - regex: 'MY_SECRET length: 0|secrets.*reusable.*empty|env.*secret.*inherit'
    flags: 'i'
  - regex: 'EMPTY.*env.*secret|secret.*reusable.*workflow.*missing'
    flags: 'i'
error_messages:
  - 'env:\n  MY_SECRET:\n(blank after the colon — not masked, because value is empty string)'
  - 'MY_SECRET length: 0'
root_cause: |
  When a reusable workflow (called via `workflow_call`) declares `environment:` on its job,
  GitHub Actions docs state: "If a called workflow needs to access environment secrets, the
  environment must be defined in the called workflow." This wording implies that declaring
  the environment in the called workflow is sufficient for env-scoped secrets to resolve.

  In practice it is not. The runner's secret resolution scope for a `workflow_call`-invoked
  workflow is determined by what the CALLING workflow passes, not what the called workflow
  declares. Environment-scoped secrets are part of the caller's repository permission
  context. Without `secrets: inherit` (or explicit `secrets:` forwarding) on the caller's
  `uses:` block, environment-scoped secrets are simply absent from the called workflow's
  secret namespace — and resolve to empty string `""` with NO error or warning emitted.

  The silent-failure aspect: the step runs without error, environment protection rules ARE
  applied (deployments appear in the env protection review queue), and `vars` from the
  environment DO resolve correctly — but secrets are empty. This is confusing because the
  environment binding partially works.

  Root cause reported as actions/runner#4453 (May 2026) with real-world impact: a
  production multi-tenant matrix pipeline shipped broken for over a week because Kubernetes
  Secrets were still in-cluster from prior runs, masking the empty injections.

  The docs have a companion issue filed (github/docs#44458) to clarify the requirement.
fix: |
  Add `secrets: inherit` to the caller's `uses:` block so the calling workflow forwards
  its entire secret namespace (including environment-scoped secrets) to the called workflow.

  If you need to limit what secrets are passed (e.g., for third-party reusable workflows),
  use an explicit secrets forwarding block instead of `secrets: inherit`.

  Note: `secrets: inherit` is safe for first-party reusable workflows within the same
  repository and for trusted organization workflows. Avoid it when calling external/
  third-party reusable workflows to prevent leaking secrets.
fix_code:
  - language: yaml
    label: 'Fix — add secrets: inherit to the caller uses block'
    code: |
      # caller.yml
      on: workflow_dispatch
      jobs:
        call-it:
          uses: ./.github/workflows/reusable.yml
          with:
            target_environment: my-env
          secrets: inherit   # ← required for env-scoped secrets to resolve in callee

      ---
      # reusable.yml
      on:
        workflow_call:
          inputs:
            target_environment:
              required: true
              type: string
      jobs:
        worker:
          runs-on: ubuntu-latest
          environment: ${{ inputs.target_environment }}
          steps:
            - name: Use env-scoped secret
              env:
                MY_SECRET: ${{ secrets.MY_SECRET }}
              run: echo "Secret present: ${{ secrets.MY_SECRET != '' }}"
  - language: yaml
    label: 'Alternative — explicit secrets forwarding (safer for cross-org callers)'
    code: |
      # caller.yml
      on: workflow_dispatch
      jobs:
        call-it:
          uses: ./.github/workflows/reusable.yml
          with:
            target_environment: my-env
          secrets:
            MY_SECRET: ${{ secrets.MY_SECRET }}   # explicit forwarding — only passes what's needed
            DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
prevention:
  - 'Whenever a reusable workflow needs environment-scoped secrets, always add `secrets: inherit` (or explicit secret forwarding) to the caller''s `uses:` block — the called workflow''s environment declaration alone is not sufficient.'
  - 'Add a smoke-test step in reusable workflows that asserts required secrets are non-empty: `[ -n "$MY_SECRET" ] || (echo "FATAL: MY_SECRET is empty — did you add secrets: inherit to the caller?" && exit 1)`. This surfaces the failure immediately instead of silently using empty values downstream.'
  - 'Review GitHub docs issue github/docs#44458 for any clarification on environment-scoped secret forwarding semantics once published.'
  - 'For multi-tenant matrix pipelines that iterate over environments: test each tenant slot in a dry-run mode that asserts secrets are populated before enabling production deployments.'
docs:
  - url: 'https://github.com/actions/runner/issues/4453'
    label: 'actions/runner#4453 — Environment-scoped secrets unreachable from reusable workflow without secrets: inherit (May 2026)'
  - url: 'https://github.com/github/docs/issues/44458'
    label: 'github/docs#44458 — Docs bug: reusable workflow env-scope secrets section missing the secrets: inherit requirement'
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#using-inputs-and-secrets-in-a-reusable-workflow'
    label: 'GitHub Docs — Using inputs and secrets in a reusable workflow'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idsecretsinherit'
    label: 'GitHub Docs — workflow syntax: jobs.<job_id>.secrets: inherit'
