    label: 'actions/checkout#2199 — fetch-tags: true doesn''t work without fetch-depth: 0 (12 reactions)'
  - url: 'https://github.com/actions/checkout/issues/701'
    label: 'actions/checkout#701 — fetch-tags: true with shallow clone only fetches reachable tags'
  - url: 'https://git-scm.com/docs/git-fetch#Documentation/git-fetch.txt---tags'
    label: 'git-fetch --tags documentation — tags fetched only for reachable objects'
  - url: 'https://github.com/actions/checkout#usage'
    label: 'actions/checkout README — fetch-tags and fetch-depth input documentation'
