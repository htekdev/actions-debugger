id: silent-failures-126
title: 'Org-level secret with "Selected repositories" policy silently evaluates to empty string in unregistered repos'
category: silent-failures
severity: silent-failure
tags:
  - org-secrets
  - organization
  - selected-repositories
  - secret-access
  - empty-string
  - silent-failure
  - permissions
patterns:
  - regex: 'secrets\.[A-Z_]+.*empty|empty.*secrets\.[A-Z_]+'
    flags: 'i'
  - regex: 'Input required and not supplied.*token|Input required.*not supplied.*key'
    flags: 'i'
  - regex: 'secrets\.NUGET|secrets\.NPM_TOKEN|secrets\.DOCKER_PASSWORD|secrets\.AWS_SECRET'
    flags: 'i'
error_messages:
  - "Error: Input required and not supplied: token"
  - "Error: NUGET_FEED_URL is empty or undefined"
  - "error: Source parameter was not specified."
  - "Error: username or password is empty"
  - "##[warning]Secret not found: ORG_SECRET_NAME (not accessible to this repository)"
root_cause: |
  GitHub organization-level secrets have an **access policy** that controls which
  repositories in the organization can use them. There are three policy options:

  1. **All repositories** — every repo in the org can use the secret.
  2. **Private repositories** — only private repos can use the secret.
  3. **Selected repositories** — only the specific repos added to the list can use it.

  When a repository is NOT in the "Selected repositories" list for a given org secret,
  GitHub **silently evaluates `${{ secrets.ORG_SECRET_NAME }}` as an empty string `""`**
  instead of throwing an error. The workflow run completes with exit code 0 (or fails due
  to a downstream tool receiving an empty credential), but no annotation or error message
  in the Actions UI explicitly says "this secret is not accessible to this repository."

  **Why it's silent:**
  - GitHub's secrets masking runs at the runner level and the runner never receives the
    secret value — but the expression evaluation does not throw.
  - The empty string is valid YAML and passes type-checking, so the workflow schema
    validation does not catch it.
  - Tools that receive an empty secret may produce confusing errors (e.g., "source
    parameter was not specified", "username is empty", "auth token is invalid") that don't
    mention secrets at all.

  **Common scenario:**
  - An org secret is created for an internal service (npm private registry token, NuGet
    feed credentials, Docker Hub credentials) and set to "Selected repositories."
  - A new repository is created and a workflow is written referencing the secret.
  - The org admin forgot to add the new repo to the secret's allowed-repository list.
  - The workflow runs successfully but fails to authenticate, with no clear error.
fix: |
  **Fix (org admin action required): Add the repository to the org secret's access list.**

  1. Go to the organization Settings → Secrets and variables → Actions.
  2. Find the secret and click the pencil (edit) icon.
  3. Under "Repository access", change from "Selected repositories" to either:
     - "All repositories" (if all repos in the org should access it), OR
     - Click "Add a repository" to add the specific repo to the selected list.
  4. Save the secret. Re-run the failed workflow — the secret will now be injected.

  **Verify access from a workflow (diagnostic):**
  Add a temporary debug step to confirm whether the secret is accessible. Never print
  the secret value directly — check its length instead.
fix_code:
  - language: yaml
    label: 'Diagnostic step — check if an org secret is accessible (non-revealing)'
    code: |
      jobs:
        debug:
          runs-on: ubuntu-latest
          steps:
            - name: Check secret accessibility (does NOT reveal secret value)
              run: |
                if [ -z "${{ secrets.ORG_SECRET_NAME }}" ]; then
                  echo "::error::Secret ORG_SECRET_NAME is empty — check org secret repository access policy"
                  exit 1
                else
                  echo "Secret is accessible (length: ${#SECRET_VAL})"
                fi
              env:
                SECRET_VAL: ${{ secrets.ORG_SECRET_NAME }}
  - language: yaml
    label: 'Pattern: guard against empty secret before using it'
    code: |
      jobs:
        publish:
          runs-on: ubuntu-latest
          steps:
            - name: Validate required secrets are present
              run: |
                missing=false
                [ -z "$NUGET_API_KEY" ] && echo "::error::NUGET_API_KEY is empty" && missing=true
                [ -z "$NUGET_URL" ] && echo "::error::NUGET_URL is empty" && missing=true
                [ "$missing" = "true" ] && exit 1 || echo "All secrets present"
              env:
                NUGET_API_KEY: ${{ secrets.NUGET_FEED_API_KEY }}
                NUGET_URL: ${{ secrets.NUGET_FEED_URL }}

            - name: Push NuGet package
              run: |
                dotnet nuget push "*.nupkg" \
                  --api-key "$NUGET_API_KEY" \
                  --source "$NUGET_URL"
              env:
                NUGET_API_KEY: ${{ secrets.NUGET_FEED_API_KEY }}
                NUGET_URL: ${{ secrets.NUGET_FEED_URL }}
prevention:
  - 'After creating a new repository that uses org-level secrets, immediately check the secret access list in org Settings → Secrets → Actions and add the new repo if the policy is "Selected repositories".'
  - 'Add a validation step at the start of any workflow that uses org secrets to fail fast with a clear error message if the secret is empty — this avoids confusing downstream tool errors.'
  - 'Consider changing frequently-used org secrets from "Selected repositories" to "Private repositories" or "All repositories" to reduce the ops burden of manually adding new repos.'
  - 'Document which org secrets each workflow requires in the workflow file header comments, so when a workflow is copied to a new repo, the secret access requirement is obvious.'
docs:
  - url: 'https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions#creating-secrets-for-an-organization'
    label: 'GitHub docs — Creating secrets for an organization (access policy)'
  - url: 'https://stackoverflow.com/questions/62289587/usage-of-github-organization-secret-in-a-github-workflow'
    label: 'Stack Overflow #62289587 — Using organization secret in a workflow (6 votes, 13,898 views)'
  - url: 'https://docs.github.com/en/organizations/managing-organization-settings/disabling-or-limiting-github-actions-for-your-organization#managing-access-to-organization-secrets-and-variables'
    label: 'GitHub docs — Managing access to organization secrets'
