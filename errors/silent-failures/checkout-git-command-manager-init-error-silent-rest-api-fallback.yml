    label: 'actions/checkout#2435 — Errors from initializing the gitCommandManager are ignored and never displayed (May 2026)'
  - url: 'https://github.com/actions/checkout/blob/900f2210b1d28bbbd0bd22d17926b9e224e8f231/src/git-source-provider.ts#L366-L371'
    label: 'actions/checkout git-source-provider.ts — catch block that silently swallows git init errors'
  - url: 'https://git-scm.com/docs/git-sparse-checkout'
    label: 'git sparse-checkout documentation — requires git ≥ 2.25 (basic) or ≥ 2.28 (cone mode)'
  - url: 'https://github.com/actions/checkout/blob/main/README.md#sparse-checkout'
    label: 'actions/checkout README — sparse-checkout configuration reference'
