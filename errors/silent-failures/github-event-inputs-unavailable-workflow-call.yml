id: silent-failures-086
title: 'github.event.inputs unavailable in workflow_call — use inputs context instead'
category: silent-failures
severity: silent-failure
tags:
  - workflow_call
  - reusable-workflow
  - inputs
  - github-event-inputs
  - context
  - silent-failure
patterns:
  - regex: 'github\.event\.inputs\.'
    flags: 'g'
error_messages:
  - ''
root_cause: |
  GitHub Actions provides two ways to access inputs. For workflow_dispatch events,
  inputs are accessible via both ${{ inputs.name }} and
  ${{ github.event.inputs.name }}. However, when a workflow is triggered via
  workflow_call (reusable workflow), only ${{ inputs.name }} works. The
  github.event object is empty for workflow_call events because there is no
  underlying dispatch event with a payload. Any expression referencing
  github.event.inputs in a reusable workflow silently evaluates to an empty
  string — no error, no warning is emitted. Logic that branches on input values
  (if conditions, run commands, environment variables) produces incorrect results
  without any indication of why. Developers who write a workflow that supports
  both workflow_dispatch and workflow_call often test it manually via the UI (where
  github.event.inputs works) and only discover the failure when the workflow is
  called programmatically.
fix: |
  Always use ${{ inputs.name }} to access inputs in any workflow. The inputs
  context is populated for both workflow_dispatch and workflow_call events, making
  it the safe universal accessor. Replace all github.event.inputs references with
  inputs in reusable workflows.
fix_code:
  - language: yaml
    label: 'Wrong — github.event.inputs is empty in workflow_call'
    code: |
      # WRONG — github.event.inputs returns '' when called via workflow_call
      jobs:
        deploy:
          steps:
            - name: Deploy
              run: echo "Target env ${{ github.event.inputs.environment }}"
  - language: yaml
    label: 'Correct — inputs context works for workflow_dispatch and workflow_call'
    code: |
      on:
        workflow_dispatch:
          inputs:
            environment:
              required: true
              type: string
        workflow_call:
          inputs:
            environment:
              required: true
              type: string
      jobs:
        deploy:
          steps:
            - name: Deploy
              run: echo "Target env ${{ inputs.environment }}"
prevention:
  - 'Use ${{ inputs.name }} exclusively — it works for both workflow_dispatch and workflow_call'
  - 'Avoid ${{ github.event.inputs.name }} in any workflow that may be called as a reusable workflow'
  - 'Run actionlint — it flags github.event.inputs usage as incorrect in workflow_call contexts'
  - 'Test reusable workflows by calling them programmatically, not just via the UI dispatch button'
docs:
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#using-inputs-and-secrets-in-a-reusable-workflow'
    label: 'GitHub Docs: Using inputs in a reusable workflow'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/contexts#inputs-context'
    label: 'GitHub Docs: inputs context'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/contexts#github-context'
    label: 'GitHub Docs: github context — github.event.inputs only for workflow_dispatch'
