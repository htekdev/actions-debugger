id: silent-failures-182
title: "github.ref Includes 'refs/heads/' Prefix — Branch Name Comparison Always False"
category: silent-failures
severity: silent-failure
tags:
  - github-ref
  - ref-name
  - context
  - if-condition
  - branch
  - expressions
patterns:
  - regex: 'github\.ref\s*==\s*[''"](?!refs/)[a-zA-Z0-9._-]'
    flags: ""
error_messages:
  - "# No log error — step or job is silently skipped because 'refs/heads/main' != 'main'"
root_cause: |
  `github.ref` contains the full git reference path, including the `refs/heads/` prefix
  for branches and `refs/tags/` for tags. For example, on the `main` branch:

    github.ref = "refs/heads/main"   (NOT "main")

  Developers frequently compare `github.ref` against a bare branch name:

    if: github.ref == 'main'

  This comparison is always `false` because `"refs/heads/main" != "main"`. The step or
  job is silently skipped — no error or warning is emitted. The workflow runs to
  completion with the expected deployment/release step invisibly excluded.

  The same silent failure occurs in:
  - Docker image tag expressions: `${{ github.ref }}` produces `refs/heads/main` in the tag
  - Cache key expressions: the key contains the literal string `refs/heads/feature-branch`
  - Deployment environment selection: `if: github.ref == 'release'` never triggers
  - String manipulation expecting just the branch name portion

  `github.ref_name` was added in mid-2022 to return just the short name (`main`, `v1.0`)
  without the ref prefix. Many older workflows and tutorials still use `github.ref` for
  comparisons.
fix: |
  Use `github.ref_name` when you want just the branch or tag name.
  Use the full `refs/heads/` or `refs/tags/` prefix when comparing with `github.ref`.
fix_code:
  - language: yaml
    label: "WRONG — github.ref does not equal bare branch name"
    code: |
      steps:
        - name: Deploy to production
          if: github.ref == 'main'         # ❌ always false — github.ref is 'refs/heads/main'
          run: ./deploy.sh

        - name: Push release image
          run: docker build -t myapp:${{ github.ref }} .  # ❌ tag = 'refs/heads/main'
  - language: yaml
    label: "CORRECT — use github.ref_name for branch/tag name comparisons"
    code: |
      steps:
        - name: Deploy to production
          if: github.ref_name == 'main'    # ✅ ref_name is 'main'
          run: ./deploy.sh

        - name: Push release image
          run: docker build -t myapp:${{ github.ref_name }} .  # ✅ tag = 'main'
  - language: yaml
    label: "CORRECT — use full refs/heads/ prefix when comparing with github.ref"
    code: |
      steps:
        - name: Deploy to production
          if: github.ref == 'refs/heads/main'    # ✅ full path comparison
          run: ./deploy.sh
        - name: Tag release
          if: startsWith(github.ref, 'refs/tags/')   # ✅ detect tag pushes
          run: ./release.sh
prevention:
  - "Prefer `github.ref_name` for branch/tag name comparisons, Docker tags, and cache keys — it never includes the `refs/heads/` or `refs/tags/` prefix."
  - "Use `startsWith(github.ref, 'refs/heads/')` or `startsWith(github.ref, 'refs/tags/')` to distinguish branch vs tag pushes."
  - "Search for `github.ref ==` patterns in your workflows — any comparison without the `refs/` prefix is likely a bug."
  - "Use `actionlint` — it does not catch this specific logic error; manually verify with a debug step printing `github.ref` and `github.ref_name`."
docs:
  - url: "https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context"
    label: "github context — github.ref and github.ref_name"
  - url: "https://docs.github.com/en/actions/learn-github-actions/expressions"
    label: "Expressions"
  - url: "https://docs.github.com/en/actions/learn-github-actions/variables#default-environment-variables"
    label: "Default environment variables (GITHUB_REF, GITHUB_REF_NAME)"
