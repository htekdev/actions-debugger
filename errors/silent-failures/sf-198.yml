id: sf-198
title: '`actions/stale` v10 silently skips all pull requests when `only-issue-types`
  is set — PRs have no `issue_type` so their type resolves to `undefined`'
category: silent-failures
severity: silent-failure
tags:
  - actions-stale
  - only-issue-types
  - pull-request
  - stale
  - silent-skip
  - configuration
patterns:
  - regex: 'Skipping this pull request because its type.*undefined.*is not in onlyIssueTypes'
    flags: 'i'
  - regex: 'pull request.*type.*undefined.*onlyIssueTypes'
    flags: 'i'
  - regex: 'onlyIssueTypes.*undefined.*pull'
    flags: 'i'
error_messages:
  - "Skipping this pull request because its type ('undefined') is not in onlyIssueTypes
    (bug)"
  - "Skipping this pull request because its type ('undefined') is not in onlyIssueTypes
    (feature)"
  - "Skipping this pull request because its type ('undefined') is not in onlyIssueTypes"
root_cause: |
  In `actions/stale` v10, the `only-issue-types` configuration option is intended
  to filter *GitHub Issues* by their `issue_type` field (e.g., only stale issues
  of type `bug` or `feature`). However, due to a bug in the action, this filter
  is also applied to **pull requests**, which do not have an `issue_type` field.

  When `only-issue-types` is set to any value (e.g., `bug`), the stale action
  evaluates every PR against the filter. Because PRs have no `issue_type`, their
  type resolves to `'undefined'`. The string `'undefined'` is never present in the
  `only-issue-types` list, so **every PR is silently skipped** — stale labels are
  never applied, PRs are never closed, and no error is surfaced.

  The workflow run succeeds with exit code 0, and the log shows individual
  `Skipping this pull request because its type ('undefined') is not in onlyIssueTypes`
  messages, but these are easy to miss in verbose output.

  Root bug location: `src/classes/issues-processor.ts` — the `onlyIssueTypes`
  guard is applied unconditionally to both issues and PRs instead of being
  restricted to issues only.

  Tracked in: actions/stale#1331 (open as of June 2026, fix pending).
fix: |
  **Option 1 (Recommended) — Remove `only-issue-types` if you also want PRs staled:**
  If your intent is to stale PRs as well as specific issue types, remove
  `only-issue-types` from your config entirely, or set it to an empty list.

  **Option 2 — Use separate stale workflow jobs for issues and PRs:**
  Split the stale action into two jobs: one for issues (with `only-issue-types`)
  and one for PRs (without `only-issue-types`). This lets you apply type filtering
  only where it's valid.

  **Option 3 — Pin to stale v9 until the bug is fixed:**
  Use `actions/stale@v9` if you need `only-issue-types` filtering for issues
  AND PR staling to work simultaneously.
fix_code:
  - language: yaml
    label: 'Broken — only-issue-types silently skips all PRs'
    code: |
      - uses: actions/stale@v10
        with:
          stale-issue-message: 'This issue is stale because it has been open 30 days.'
          stale-pr-message: 'This PR is stale because it has been open 30 days.'
          days-before-stale: 30
          only-issue-types: 'bug,feature'
          # ✗ All PRs are silently skipped — their type is 'undefined',
          #   which is never in 'bug,feature'.
          # Log: "Skipping this pull request because its type ('undefined')
          #       is not in onlyIssueTypes (bug,feature)"

  - language: yaml
    label: 'Fixed Option 1 — remove only-issue-types so PRs are also processed'
    code: |
      - uses: actions/stale@v10
        with:
          stale-issue-message: 'This issue is stale because it has been open 30 days.'
          stale-pr-message: 'This PR is stale because it has been open 30 days.'
          days-before-stale: 30
          # ✓ No only-issue-types → both issues and PRs are evaluated for staling

  - language: yaml
    label: 'Fixed Option 2 — split into separate jobs for issues and PRs'
    code: |
      jobs:
        stale-issues:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/stale@v10
              with:
                stale-issue-message: 'This issue is stale after 30 days.'
                days-before-stale: 30
                only-issue-types: 'bug,feature'   # ✓ Only issues are evaluated here
                days-before-pr-stale: -1           # ✓ Skip PRs entirely in this job
                days-before-pr-close: -1

        stale-prs:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/stale@v10
              with:
                stale-pr-message: 'This PR is stale after 30 days.'
                days-before-stale: -1              # ✓ Skip issues entirely in this job
                days-before-pr-stale: 30
                # No only-issue-types → PRs are evaluated normally

prevention:
  - 'If you set `only-issue-types`, verify that your PR staling is still working
    by inspecting the stale action log for "Skipping this pull request" messages.'
  - 'Use `days-before-pr-stale: -1` and `days-before-pr-close: -1` in the
    issue-only job to explicitly opt out of PR processing rather than relying on
    implicit filtering.'
  - 'Track actions/stale#1331 for the upstream fix — once merged, `only-issue-types`
    will be restricted to issues only and PRs will be processed normally.'
  - 'Pin to a specific patch version of actions/stale (e.g. `actions/stale@v10.0.0`)
    and update only after reviewing the changelog for this fix.'
docs:
  - url: 'https://github.com/actions/stale/issues/1331'
    label: 'actions/stale#1331: PR check uses only-issue-types — silently skips all
      PRs (open June 2026)'
  - url: 'https://github.com/actions/stale#inputs'
    label: 'actions/stale README: only-issue-types input documentation'
  - url: 'https://docs.github.com/en/issues/tracking-your-work-with-issues/about-issue-types'
    label: 'GitHub Docs: About Issue Types (the feature only-issue-types filters on)'
