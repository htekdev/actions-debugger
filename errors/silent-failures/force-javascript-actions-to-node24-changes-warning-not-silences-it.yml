id: sf-192
title: "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 Changes Warning Text but Does Not Silence It"
category: silent-failures
severity: silent-failure
tags:
  - node20
  - node24
  - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
  - deprecation-warning
  - javascript-actions
  - silent-warning
patterns:
  - regex: 'is running on node20, but will be forced to run on node24'
    flags: 'i'
  - regex: 'target.*Node\.js 20.*forced to run on Node\.js 24'
    flags: 'i'
error_messages:
  - "Warning: actions/checkout@v4 is running on node20, but will be forced to run on node24."
  - "Warning: actions/setup-node@v4 is running on node20, but will be forced to run on node24."
root_cause: |
  Developers commonly set `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` at the workflow level expecting it
  to silence the Node.js 20 deprecation warnings. It does not — it changes the warning text.

  Without the env var, the runner emits:
    "Node.js 20 actions are deprecated. The following actions are running on Node.js 20 and may not
     work as expected: <action>. Actions will be forced to run with Node.js 24 by default starting..."

  With `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true`, the warning changes to:
    "<action> is running on node20, but will be forced to run on node24."

  Both variants call `context.Warning()` in the runner source (`src/Runner.Sdk/IActionRunnerContext.cs`).
  Both produce yellow warning annotations visible in the job log. The count of warnings per job is
  identical — one per affected action reference.

  The **only** way to fully eliminate Node.js 20 deprecation warnings for a specific action is for that
  action to declare `using: node24` in its `action.yml`. Until the action maintainer ships a node24
  release, warnings will persist regardless of any environment variable the consuming workflow sets.

  This leads to a common failure mode: teams set `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true`, see a
  different warning text, assume the problem is "mostly fixed", and are surprised when September 16, 2026
  arrives and the action fails entirely because the node20 runtime is removed.
fix: |
  Stop relying on `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24` to silence warnings. The correct fix is to update
  each action to its node24-native version:

  1. Identify which actions still emit the warning by scanning job logs for "running on node20".
  2. Upgrade each action to a version that declares `using: node24` in its action.yml.
     - `actions/checkout@v4` → `actions/checkout@v6`
     - `actions/setup-node@v4` → `actions/setup-node@v6`
     - `actions/cache@v4` → `actions/cache@v5`
     - `actions/upload-artifact@v4` → `actions/upload-artifact@v7`
  3. For third-party actions without a node24 release, file an upstream issue.

  Use `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true` only as a compatibility test — to verify your workflow
  runs correctly on Node.js 24 before the forced-default deadline — not as a long-term warning suppressor.

  Note: after September 16, 2026, the separate env var `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true`
  is the temporary emergency opt-out for node20 after removal. That is also NOT `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24`.
fix_code:
  - language: yaml
    label: "The only real fix: update action to its node24-native version"
    code: |
      steps:
        - uses: actions/checkout@v6   # v6 declares `using: node24` — warning disappears
        # was: actions/checkout@v4 (using: node20)
        # Setting FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true would still warn for @v4
  - language: yaml
    label: "What FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 actually does (changes text, not silence)"
    code: |
      env:
        # This changes the warning FROM:
        #   "Node.js 20 actions are deprecated... will be forced to run with Node.js 24..."
        # TO:
        #   "<action> is running on node20, but will be forced to run on node24."
        # Both are still warnings. This does NOT silence them.
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4   # still warns — v6 (node24) is the fix
prevention:
  - "Update action versions to their latest node24-native releases (look for `using: node24` in the action's action.yml)."
  - "Search your org's workflows for `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24` — each occurrence flags an action that still needs upgrading, not a problem that is solved."
  - "Use Dependabot or Renovate for automatic action updates so node24 releases are applied as soon as maintainers ship them."
  - "Treat FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 as a diagnostic tool only, not a long-term fix."
docs:
  - url: "https://github.com/actions/runner/pull/4462"
    label: "actions/runner PR #4462: Node 24 default date and warning implementation"
  - url: "https://github.com/open-gsd/gsd-core/issues/445"
    label: "gsd-core#445: FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 doesn't silence warnings"
  - url: "https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/"
    label: "GitHub Changelog: Deprecation of Node.js 20 on GitHub Actions runners"
