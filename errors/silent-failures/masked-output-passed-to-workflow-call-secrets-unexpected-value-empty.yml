id: silent-failures-197
title: 'Masked Job Output Passed to workflow_call secrets: Fails with "Unexpected value ''"'
category: silent-failures
severity: error
tags:
  - reusable-workflow
  - workflow_call
  - secrets
  - masking
  - add-mask
  - job-outputs
  - unexpected-value
patterns:
  - regex: 'Unexpected value\s+[''"]{0,1}[''"]{0,1}'
    flags: 'i'
  - regex: 'Skip output.*may contain secret'
    flags: 'i'
  - regex: 'secrets:\s*\n\s+\w+:\s*\$\{\{\s*needs\.'
    flags: 'im'
error_messages:
  - "Unexpected value ''"
  - "Warning: Skip output 'DOCKER_CONFIG' since it may contain secret."
  - "Error: Unexpected value ''"
root_cause: |
  When a reusable workflow uses `echo "::add-mask::$VALUE"` before writing `$VALUE` to
  `$GITHUB_OUTPUT`, the output value is registered as a masked secret. Any subsequent
  attempt to read that output from a calling workflow returns an empty string `''` instead
  of the real value — GitHub masks it to prevent secret leakage.

  If the calling workflow then passes this empty-string output to the `secrets:` block of
  another reusable workflow:

  ```yaml
  jobs:
    second:
      uses: org/repo/.github/workflows/build.yaml@main
      secrets:
        DOCKER_CONFIG: ${{ needs.first.outputs.DOCKER_CONFIG }}  # '' after masking
  ```

  GitHub validates that `secrets:` values must be non-empty strings (they are expected to
  be references to real encrypted secrets, not empty placeholders). The validator rejects
  the empty value with `Unexpected value ''`, which fails the calling job.

  **The two-step failure chain:**
  1. `::add-mask::$VALUE` is called inside the callee → output `DOCKER_CONFIG` is registered
     as a masked string in the runner's secret registry.
  2. The caller reads `needs.first.outputs.DOCKER_CONFIG` → gets `''` (masked).
  3. The caller tries `secrets: DOCKER_CONFIG: ''` → GitHub rejects with `Unexpected value ''`.

  **Important distinction:**
  - This is NOT a YAML syntax error — the `secrets: KEY: ${{ expr }}` block is valid syntax.
  - This IS a runtime validation error caused by passing a masked (empty) value to `secrets:`.
  - Even without masking, GitHub does not officially support passing dynamic runtime job
    outputs to `secrets:` in `workflow_call` — only real repository/org/environment secrets
    are intended to populate the `secrets:` block.

  Source: Stack Overflow Q#79821969 (Nov 2025, score 3) — Vault-fetched Docker config
  masked before output, then passed as workflow_call secret → "Unexpected value ''" failure.
fix: |
  **Do NOT use `secrets:` to pass dynamic job outputs between reusable workflows.**
  Use `with:` inputs instead, and handle masking inside the receiving workflow.

  **Correct pattern:**
  ```yaml
  jobs:
    second:
      uses: org/repo/.github/workflows/build.yaml@main
      with:
        docker_config: ${{ needs.first.outputs.DOCKER_CONFIG_B64 }}
        # Pass a base64-encoded value if masking is needed — decode + mask inside the callee
  ```

  And inside the receiving workflow, re-mask the decoded value:
  ```yaml
  on:
    workflow_call:
      inputs:
        docker_config:
          type: string
          required: true
  jobs:
    build:
      steps:
        - name: Decode and mask Docker config
          run: |
            CONFIG=$(echo "${{ inputs.docker_config }}" | base64 -d)
            echo "::add-mask::$CONFIG"
            echo "DOCKER_CONFIG=$CONFIG" >> "$GITHUB_ENV"
  ```

  **Why base64?** If you base64-encode the value before writing to `$GITHUB_OUTPUT`
  (before masking), the encoded form is not itself a registered secret and will pass
  through `needs.outputs.*` and `with:` inputs correctly. Re-mask inside the callee.

  **Alternative: use `secrets: inherit`**
  If the secret originates in a repository/org secret store (not computed at runtime),
  use `secrets: inherit` to forward all secrets from the calling workflow to the callee:
  ```yaml
  jobs:
    second:
      uses: org/repo/.github/workflows/build.yaml@main
      secrets: inherit
  ```
fix_code:
  - language: yaml
    label: 'Broken: secrets: KEY: ${{ needs.job.outputs.X }} fails when X is masked'
    code: |
      jobs:
        first:
          uses: org/repo/.github/workflows/secrets.yaml@main
          secrets:
            TOKEN: ${{ secrets.TOKEN }}

        second:
          needs: first
          uses: org/repo/.github/workflows/build.yaml@main
          secrets:
            # ❌ WRONG — DOCKER_CONFIG is masked to '' inside secrets.yaml
            # Passing it to secrets: results in "Unexpected value ''"
            DOCKER_CONFIG: ${{ needs.first.outputs.DOCKER_CONFIG }}
  - language: yaml
    label: 'Fixed: pass base64-encoded value via with: inputs, re-mask inside callee'
    code: |
      # Caller workflow
      jobs:
        first:
          uses: org/repo/.github/workflows/secrets.yaml@main
          secrets:
            TOKEN: ${{ secrets.TOKEN }}

        second:
          needs: first
          uses: org/repo/.github/workflows/build.yaml@main
          with:
            # ✅ CORRECT — pass base64-encoded value via inputs (not secrets)
            docker_config_b64: ${{ needs.first.outputs.DOCKER_CONFIG_B64 }}

      ---
      # secrets.yaml (callee that fetches secrets)
      on:
        workflow_call:
          outputs:
            DOCKER_CONFIG_B64:
              value: ${{ jobs.fetch.outputs.DOCKER_CONFIG_B64 }}
      jobs:
        fetch:
          steps:
            - name: Fetch Docker config from Vault
              id: fetch
              run: |
                DOCKER_CONFIG=$(curl -s ...)
                # Base64-encode BEFORE masking so the encoded form is safe to pass
                B64=$(echo "$DOCKER_CONFIG" | base64 -w 0)
                echo "::add-mask::$DOCKER_CONFIG"  # mask the real value
                echo "DOCKER_CONFIG_B64=$B64" >> "$GITHUB_OUTPUT"

      ---
      # build.yaml (callee that uses the secret)
      on:
        workflow_call:
          inputs:
            docker_config_b64:
              type: string
              required: true
      jobs:
        build:
          steps:
            - name: Decode and re-mask Docker config
              run: |
                CONFIG=$(echo "${{ inputs.docker_config_b64 }}" | base64 -d)
                echo "::add-mask::$CONFIG"
                echo "$CONFIG" | docker login --username ... --password-stdin
  - language: yaml
    label: 'Alternative: secrets: inherit when secrets come from repo/org store'
    code: |
      jobs:
        second:
          needs: first
          uses: org/repo/.github/workflows/build.yaml@main
          secrets: inherit   # forwards all calling workflow secrets to the callee
          # Only works if the secret is a repository/org/environment secret,
          # NOT a dynamically computed value from a job output.
prevention:
  - 'Never pass dynamic job outputs to `secrets:` in a `workflow_call` — use `with:` inputs instead and re-mask inside the callee if needed.'
  - 'If a value must be secret, pass it via `with:` as a base64-encoded string and decode + mask inside the receiving workflow.'
  - 'Check for "Warning: Skip output ... since it may contain secret" in job logs — this is the signal that an output will be empty in the calling workflow.'
  - 'Use `secrets: inherit` for static repo/org/environment secrets; use `with:` inputs for dynamically computed sensitive values.'
  - 'Remember: `secrets:` in `workflow_call` is designed for real encrypted secrets from the repository/org store, not for runtime-computed values.'
docs:
  - url: 'https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow'
    label: 'GitHub Docs — Reusable workflows: using inputs and secrets'
  - url: 'https://stackoverflow.com/questions/79821969/how-to-send-secrets-from-other-job'
    label: 'Stack Overflow — Passing needs.outputs to workflow_call secrets: fails with Unexpected value (Nov 2025)'
  - url: 'https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#passing-secrets-to-nested-workflows'
    label: 'GitHub Docs — Passing secrets to nested workflows (secrets: inherit)'
