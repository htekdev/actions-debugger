    label: 'runner-images#14173: Puppeteer broken on Ubuntu 24.04 20260525 — root cause Node.js 24.16.0 extract-zip'
  - url: 'https://github.com/nodejs/node/issues/63487'
    label: 'nodejs/node#63487: extract-zip/yauzl partial extraction on Node.js 24.16.0'
  - url: 'https://github.com/nodejs/node/issues/63581'
    label: 'nodejs/node#63581: readable-stream.destroy() lifecycle change in Node.js 24.16.0'
  - url: 'https://pptr.dev/guides/configuration'
    label: 'Puppeteer configuration guide — PUPPETEER_CACHE_DIR and browser installation'
  - url: 'https://playwright.dev/docs/browsers'
    label: 'Playwright — Installing browsers documentation'
