id: silent-failures-180
title: 'github.job_workflow_sha returns empty string in reusable workflow jobs — use job.workflow_sha instead'
category: silent-failures
severity: silent-failure
tags:
  - reusable-workflow
  - github-context
  - job-context
  - workflow-sha
  - workflow-call
  - context-property
patterns:
  - regex: 'github\.job_workflow_sha'
    flags: 'i'
  - regex: 'job_workflow_sha.*empty|job_workflow_sha.*undefined|echo.*job_workflow_sha.*$'
    flags: 'i'
error_messages:
  - "# No error — github.job_workflow_sha silently returns empty string in reusable workflow jobs"
  - "github.job_workflow_sha: ''"
  - "echo ${{ github.job_workflow_sha }}  # outputs empty"
root_cause: |
  GitHub documentation historically listed `github.job_workflow_sha` as a context property
  that returns the commit SHA for the reusable workflow file in jobs using reusable workflows.
  However, this property was never reliably populated — it returns an empty string in all
  reusable workflow job contexts regardless of whether the called workflow is local or remote.

  The property was later superseded by new properties added to the `job` context:
  - `job.workflow_sha` — the commit SHA of the reusable workflow file executing the current job
  - `job.workflow_ref` — the full ref (e.g., `owner/repo/.github/workflows/deploy.yml@refs/heads/main`)

  These `job.*` properties are correctly populated inside reusable workflow jobs and reflect
  exactly which version of the called workflow is executing. When workflows use
  `github.job_workflow_sha` for logging, pinning, or security verification, the value is
  always empty, making the check silently ineffective with no warning or error message.

  This affects any workflow that calls a reusable workflow and tries to use
  `github.job_workflow_sha` to verify or log the reusable workflow version.
fix: |
  Replace `github.job_workflow_sha` with `job.workflow_sha` for the reusable workflow
  commit SHA, or `job.workflow_ref` for the full workflow reference path.

  These `job` context properties are populated in reusable workflow jobs and are the
  supported way to identify which version of a reusable workflow is executing.
fix_code:
  - language: yaml
    label: 'Use job.workflow_sha instead of github.job_workflow_sha'
    code: |
      jobs:
        reusable-job:
          runs-on: ubuntu-latest
          steps:
            - name: Show reusable workflow version
              run: |
                # WRONG — always empty in reusable workflow jobs
                echo "github.job_workflow_sha: ${{ github.job_workflow_sha }}"

                # CORRECT — populated in reusable workflow job context
                echo "job.workflow_sha: ${{ job.workflow_sha }}"
                echo "job.workflow_ref: ${{ job.workflow_ref }}"
  - language: yaml
    label: 'Security pin check using job.workflow_sha'
    code: |
      # In a reusable workflow file (called via workflow_call)
      on:
        workflow_call:

      jobs:
        secure-job:
          runs-on: ubuntu-latest
          steps:
            - name: Verify reusable workflow SHA matches expected
              run: |
                EXPECTED_SHA="abc123def456..."
                ACTUAL_SHA="${{ job.workflow_sha }}"
                if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                  echo "::error::Unexpected reusable workflow version: $ACTUAL_SHA"
                  exit 1
                fi
prevention:
  - 'Use job.workflow_sha and job.workflow_ref for reusable workflow version identification — not github.job_workflow_sha'
  - 'Test logging steps that reference github context properties in reusable workflows to verify they are populated'
  - 'When auditing reusable workflow versions, always use the job context properties introduced for this purpose'
docs:
  - url: 'https://github.com/actions/runner/issues/2417'
    label: 'actions/runner#2417: Property job_workflow_sha in context github is not available'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#job-context'
    label: 'GitHub Docs: job context — job.workflow_sha and job.workflow_ref'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#github-context'
    label: 'GitHub Docs: github context properties'
