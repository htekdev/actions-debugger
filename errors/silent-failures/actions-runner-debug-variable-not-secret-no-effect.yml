id: silent-failures-169
title: 'ACTIONS_RUNNER_DEBUG set as repository variable silently has no effect — must be a secret'
category: silent-failures
severity: silent-failure
tags:
  - debug-logging
  - actions-runner-debug
  - actions-step-debug
  - variables
  - secrets
  - troubleshooting
patterns:
  - regex: 'ACTIONS_RUNNER_DEBUG'
    flags: 'i'
  - regex: 'ACTIONS_STEP_DEBUG'
    flags: 'i'
error_messages:
  - 'No debug logs appear despite ACTIONS_RUNNER_DEBUG=true being configured'
  - 'Debug logging not enabled — ACTIONS_RUNNER_DEBUG set as variable, not secret'
  - 'No ##[debug] runner output despite debug variable set'
root_cause: |
  GitHub Actions debug logging is controlled exclusively by two repository SECRETS:
  ACTIONS_RUNNER_DEBUG (enables runner diagnostic logs) and ACTIONS_STEP_DEBUG
  (enables step debug logs). These MUST be created under Settings → Secrets and
  variables → Actions → Repository secrets. If they are instead created as repository
  VARIABLES (the adjacent "Variables" tab in the same settings page), they are silently
  ignored — no debug output is produced, and no error or warning is emitted to explain
  why debug logging isn't working.

  This is a persistently common mistake because the Settings UI places Secrets and
  Variables tabs side-by-side. Developers troubleshooting a difficult CI failure often
  set ACTIONS_RUNNER_DEBUG=true as a variable, see no change in log verbosity, and
  spend significant time searching for other explanations. GitHub's documentation does
  state that secrets are required, but the distinction is easy to miss when the UI
  visually groups secrets and variables together.

  The reason secrets are required (not variables) is that debug output can expose
  sensitive runner internals and step input values; requiring a secret ensures only
  users with write access to secrets can enable verbose logging.
fix: |
  Move ACTIONS_RUNNER_DEBUG and/or ACTIONS_STEP_DEBUG from repository VARIABLES to
  repository SECRETS:

  1. Navigate to Settings → Secrets and variables → Actions
  2. Click the "Secrets" tab (not "Variables")
  3. Click "New repository secret"
  4. Name: ACTIONS_RUNNER_DEBUG, Value: true
  5. Optionally add ACTIONS_STEP_DEBUG: true for step-level debug output
  6. Re-run the failing workflow — debug lines will now appear prefixed with ##[debug]

  Remember to delete the incorrectly-created variable under the "Variables" tab.
  Both settings can coexist but the variable has no effect; removing it avoids
  future confusion.
fix_code:
  - language: yaml
    label: 'No workflow change needed — fix is in repo Settings UI'
    code: |
      # No workflow file change required.
      # Action: Go to Settings → Secrets and variables → Actions → Secrets tab
      # Add repository secret:  ACTIONS_RUNNER_DEBUG = true
      # Add repository secret:  ACTIONS_STEP_DEBUG   = true  (optional, for step logs)
      #
      # These must be SECRETS, not VARIABLES.
      # Once set, re-run the workflow to see verbose ##[debug] output.
  - language: yaml
    label: 'Alternatively: enable debug for a single run via workflow_dispatch input'
    code: |
      on:
        workflow_dispatch:
          inputs:
            debug_enabled:
              description: 'Enable runner debug logging for this run'
              required: false
              default: 'false'
              type: boolean

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - name: Enable debug logging conditionally
              if: ${{ inputs.debug_enabled }}
              run: echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
            - name: Your build step
              run: make build
prevention:
  - 'When enabling debug logging, always use the Secrets tab — not the Variables tab — in Settings → Secrets and variables → Actions'
  - 'If debug logs are absent after setting ACTIONS_RUNNER_DEBUG, immediately check whether it is stored as a secret or a variable'
  - 'Use workflow_dispatch inputs with type: boolean to toggle debug logging per-run without needing to modify secrets'
  - 'Document in your team runbook that Actions debug flags require secrets, not variables, to prevent repeated confusion'
docs:
  - url: 'https://docs.github.com/en/actions/monitoring-and-troubleshooting-workflows/troubleshooting-workflows/enabling-debug-logging'
    label: 'Enabling debug logging — GitHub Docs'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables#defining-configuration-variables-for-multiple-workflows'
    label: 'Variables vs secrets in GitHub Actions — GitHub Docs'
