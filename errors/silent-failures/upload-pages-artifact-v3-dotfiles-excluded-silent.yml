id: silent-failures-133
title: 'upload-pages-artifact@v3 silently excludes dotfiles — .nojekyll, .htaccess, .well-known missing from Pages'
category: silent-failures
severity: silent-failure
tags:
  - upload-pages-artifact
  - pages
  - dotfiles
  - nojekyll
  - htaccess
  - well-known
  - hidden-files
  - jekyll
  - breaking-change
patterns:
  - regex: 'upload-pages-artifact@v3'
    flags: 'i'
  - regex: '\.nojekyll.*missing|missing.*\.nojekyll|jekyll.*process.*pages.*unexpected'
    flags: 'i'
  - regex: '\.htaccess.*not.*found.*pages|\.well-known.*missing.*pages'
    flags: 'i'
error_messages:
  - '--- Jekyll Build Warning: The file .nojekyll was not found in the artifact.'
  - 'Your site appears to be processed by Jekyll unexpectedly'
  - 'GET /.well-known/apple-app-site-association 404'
  - 'Redirect rules in .htaccess are not being applied on GitHub Pages'
root_cause: |
  `actions/upload-pages-artifact@v3` introduced a breaking change in August 2024
  (PR #102): **hidden files (dotfiles — any file or directory starting with `.`) are
  excluded from the uploaded artifact by default.**

  This silently removes critical Pages configuration files from the deployment:

  - **`.nojekyll`** — tells GitHub Pages to skip Jekyll processing. Without it,
    GitHub Pages runs Jekyll on the deployed content, which can transform files,
    break paths, ignore directories starting with `_`, and produce different output
    than the original build.

  - **`.htaccess`** — Apache-style redirect/rewrite rules used by some Pages
    configurations and frameworks. Missing this file silently disables all custom
    redirect rules.

  - **`.well-known/`** — directory containing Apple App Site Association, Google
    Digital Asset Links, security.txt, and other service discovery files. Since
    `.well-known` starts with a dot, the entire directory is excluded.

  - **`.github/`** — any dotfiles or dot-directories in the build output.

  No warning is emitted during upload. The artifact is created successfully with
  those files excluded. The failure only manifests in the deployed site (unexpected
  Jekyll output, broken redirects, 404s on `.well-known` paths).

  Affected versions: `upload-pages-artifact@v3.0.0` through `v3.x.x`.
  Fixed in: `upload-pages-artifact@v4.0.0` which adds `include-hidden-files: true`.
fix: |
  **Option 1** (recommended): Upgrade to `upload-pages-artifact@v4` and set
  `include-hidden-files: true` if your site contains dotfiles.

  **Option 2**: Stay on `upload-pages-artifact@v2` (old artifact backend, still works
  with `deploy-pages@v3`).

  **Option 3**: Use `actions/upload-artifact@v4` with `include-hidden-files: true`
  instead of `upload-pages-artifact`, then deploy with `deploy-pages@v4`. This gives
  you explicit control over hidden file inclusion.

  Note: For most SPA/static site generators (Vite, Next.js static export, Hugo,
  Eleventy), the build output contains `.nojekyll` to prevent Jekyll processing.
  Losing this file is the most common and confusing symptom.
fix_code:
  - language: yaml
    label: 'CORRECT — upgrade to v4 with include-hidden-files'
    code: |
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true   # restores dotfiles (.nojekyll, .htaccess, .well-known/)
  - language: yaml
    label: 'Alternative — use upload-artifact@v4 directly'
    code: |
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  - language: yaml
    label: 'Check if .nojekyll exists in your build output'
    code: |
      - name: Verify .nojekyll present
        run: |
          if [ ! -f "./dist/.nojekyll" ]; then
            echo "WARNING: .nojekyll missing from build output!"
            echo "Jekyll will process your site on GitHub Pages."
            touch ./dist/.nojekyll
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true
prevention:
  - 'When upgrading upload-pages-artifact@v2 → v3 or v4, check whether your site build produces dotfiles'
  - 'Always set include-hidden-files: true in upload-pages-artifact@v4 if your site uses .nojekyll, .htaccess, or .well-known/'
  - 'Verify the deployed site renders correctly after upgrading — Jekyll reprocessing is a common silent failure'
  - 'For frameworks that output .nojekyll (Astro, Next.js, Vite), treat include-hidden-files: true as mandatory'
  - 'Add a CI step to verify critical dotfiles are present in the build artifact before deployment'
docs:
  - url: 'https://github.com/actions/upload-pages-artifact/releases/tag/v3.0.0'
    label: 'actions/upload-pages-artifact v3.0.0 release — breaking change: dotfiles excluded by default'
  - url: 'https://github.com/actions/upload-pages-artifact/pull/102'
    label: 'actions/upload-pages-artifact PR #102 — Remove dotfiles from artifact (the breaking change)'
  - url: 'https://github.com/actions/upload-pages-artifact/releases/tag/v4.0.0'
    label: 'actions/upload-pages-artifact v4.0.0 release — adds include-hidden-files input'
  - url: 'https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages#static-site-generators'
    label: 'GitHub Docs — GitHub Pages and Jekyll static site generation'
