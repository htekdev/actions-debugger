id: silent-failures-165
title: "setup-python@v6 'WARNING: Cache entry deserialization failed' emits red error annotation — macos-26 + Python 3.10"
category: silent-failures
severity: warning
tags:
  - setup-python
  - pip-cache
  - macos-26
  - annotation
  - false-error
patterns:
  - regex: 'Error: WARNING: Cache entry deserialization failed, entry ignored'
    flags: 'i'
  - regex: 'WARNING: Cache entry deserialization failed'
    flags: 'i'
error_messages:
  - 'Error: WARNING: Cache entry deserialization failed, entry ignored.'
root_cause: |
  When using actions/setup-python@v6 with cache: 'pip' on macos-26 (ARM) runners
  with Python 3.10, pip emits a "WARNING: Cache entry deserialization failed, entry
  ignored." message to stderr. The GitHub Actions log formatter matches the
  "WARNING:" prefix and prepends "Error: " — styling it as a hard-error annotation
  in the UI.

  The annotation turns the build UI red even though:
    1. pip handles the malformed cache entry gracefully and continues
    2. The setup-python step exits with code 0 (success)
    3. No actual packages fail to install

  The deserialization failure is triggered by an incompatible or malformed pip wheel
  cache entry specific to the macos-26 ARM image + Python 3.10 toolcache combination.
  Python 3.12 and 3.14 on the same runner do not trigger the warning.
  Reported in actions/setup-python#1317 (May 2026); assigned for investigation.
fix: |
  Option 1 — Upgrade Python version (preferred):
    Use Python 3.12 or 3.14 on macos-26 runners — neither triggers the warning.

  Option 2 — Disable pip caching for macos-26:
    Conditionally skip cache: 'pip' when running on macos-26 to avoid the spurious
    annotation while the upstream fix is pending.

  Option 3 — Purge pip cache before setup-python:
    Add a step before setup-python to clear stale cache entries:
      - run: pip cache purge || true
fix_code:
  - language: yaml
    label: 'Use Python 3.12+ on macos-26 to avoid deserialization warning'
    code: |
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # 3.10 triggers WARNING on macos-26 ARM
          cache: "pip"
  - language: yaml
    label: 'Conditionally disable pip cache on macos-26 runners'
    code: |
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          # Disable pip cache on macos-26 to avoid spurious error annotation
          cache: ${{ startsWith(matrix.os, 'macos-26') && '' || 'pip' }}
  - language: yaml
    label: 'Purge pip cache before setup-python to remove malformed entries'
    code: |
      - name: Clear pip cache
        run: pip cache purge || true
        shell: bash
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
prevention:
  - 'Pin Python 3.12+ when running on macos-26 ARM runners until actions/setup-python#1317 is resolved.'
  - "Treat 'WARNING: Cache entry deserialization failed, entry ignored' as a non-fatal pip warning — verify the step exit code (should be 0) before treating it as a real failure."
  - 'Track actions/setup-python#1317 for an upstream fix in setup-python@v6.'
docs:
  - url: 'https://github.com/actions/setup-python/issues/1317'
    label: "setup-python#1317 — 'Cache entry deserialization failed' turns builds red on macos-26 + Python 3.10 (May 2026)"
  - url: 'https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python'
    label: 'GitHub Docs: Building and testing Python'
