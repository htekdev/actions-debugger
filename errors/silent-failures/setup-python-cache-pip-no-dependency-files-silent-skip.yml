id: silent-failures-211
title: '`actions/setup-python` with `cache: pip` silently skips caching when no requirements file exists'
category: silent-failures
severity: silent-failure
tags:
  - setup-python
  - pip
  - cache
  - requirements-txt
  - dependency-files
  - missing-cache
patterns:
  - regex: 'No dependency files found for pip'
    flags: i
  - regex: 'Supported patterns are:.*requirements'
    flags: i
  - regex: 'setup-python.*cache.*pip.*no.*files|pip.*cache.*dependency.*not.*found'
    flags: i
error_messages:
  - 'Warning: No dependency files found for pip. Supported patterns are: requirements.txt, requirements*.txt, Pipfile.lock, setup.cfg, setup.py, pyproject.toml'
  - 'Warning: No dependency files found for pip.'
root_cause: |
  When `actions/setup-python` is configured with `cache: pip`, it searches the repository for
  dependency files that match known pip patterns: `requirements.txt`, `requirements*.txt`,
  `Pipfile.lock`, `setup.cfg`, `setup.py`, or `pyproject.toml`. If none are found, the action
  emits a warning and proceeds WITHOUT setting up any cache — no cache is saved and no cache is
  restored.

  This is a silent failure: the workflow does not error, the Python environment is still installed,
  but every subsequent run reinstalls all packages from scratch because caching was never activated.
  The warning message is easy to miss in noisy logs and developers often assume caching is working.

  Common triggers:
  - Repository uses `requirements-dev.txt` or `requirements/base.txt` (non-standard paths)
  - Python project uses only a non-pip tool (e.g. conda, uv) with no pip-compatible manifest
  - `cache-dependency-path` input is set to a path that does not exist
fix: |
  Ensure a pip-compatible dependency file exists at a location the action will discover, OR
  use the `cache-dependency-path` input to point directly to your dependency file.

  If you use `pyproject.toml` or `setup.py`, they are auto-discovered. If your requirements file
  uses a non-standard path or name, provide it explicitly via `cache-dependency-path`.
fix_code:
  - language: yaml
    label: 'Use cache-dependency-path to specify a non-standard requirements file path'
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
  - language: yaml
    label: 'Standard discovery (requirements.txt at repo root — auto-found)'
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # requirements.txt must exist at repo root or be specified via cache-dependency-path
  - language: yaml
    label: 'Use pyproject.toml for pip cache key (auto-discovered)'
    code: |
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
prevention:
  - 'Always verify that pip caching is active by checking the setup-python step output for "Cache restored" or "Cache saved" messages.'
  - 'Use `cache-dependency-path` explicitly when your requirements file is not in the standard location to avoid silent cache skips.'
  - 'Add a workflow step early on to verify the dependency file exists: `test -f requirements.txt || exit 1`.'
docs:
  - url: https://github.com/actions/setup-python?tab=readme-ov-file#caching-packages-dependencies
    label: 'actions/setup-python — Caching packages dependencies'
  - url: https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md#caching-packages
    label: 'setup-python advanced usage: caching'
