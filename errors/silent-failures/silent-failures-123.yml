id: "silent-failures-123"
title: "setup-python cache: poetry binds to runner default Python, not setup-python version"
category: "silent-failures"
severity: "error"
tags:
  - "setup-python"
  - "poetry"
  - "python-version"
  - "cache"
  - "virtualenv"
  - "pipx"
patterns:
  - regex: 'Current Python version.*is not allowed by the project'
    flags: "i"
  - regex: 'Please change python executable via the.*env use.*command'
    flags: "i"
  - regex: 'poetry.*install.*failed.*python.*version|python.*version.*mismatch.*poetry'
    flags: "i"
error_messages:
  - "Current Python version (3.12.3) is not allowed by the project (~=3.13)."
  - "Please change python executable via the \"env use\" command."
  - "Error: Process completed with exit code 1."
root_cause: |
  When `actions/setup-python` is configured with `cache: 'poetry'`, it requires poetry
  to be installed and accessible on `PATH` before the action runs — the cache key is
  computed by reading the poetry lock file, and poetry's virtual-environment path must
  be known at cache-restore time.

  The recommended workflow pattern from the setup-python docs is:
    1. `pipx install poetry`
    2. `uses: actions/setup-python` with `cache: 'poetry'`
    3. `poetry install`

  However, when `pipx install poetry` runs (step 1), the `pipx` tool creates poetry's
  own isolated virtual environment using the **runner's pre-installed default Python**
  (e.g., Python 3.12 on ubuntu-24.04), not the version that will be installed in
  step 2. Poetry then creates new virtual environments using this same Python as the
  base interpreter.

  In step 3, if the project's `pyproject.toml` specifies a `python` constraint that
  excludes the default runner Python (e.g., `python = "^3.13"` but the runner has
  Python 3.12), `poetry install` fails with:

    "Current Python version (3.12.x) is not allowed by the project (~=3.13)."

  The fix — running `poetry env use python3.13` — also fails if poetry's internal
  interpreter detection points to 3.12.

  This is a silent ordering dependency between `pipx`, `setup-python`, and poetry's
  virtualenv that is not clearly documented. The issue is amplified when `virtualenv`
  (poetry's dependency) is updated to a version that changes how Python discovery works
  (e.g., virtualenv 20.33.0 in August 2025 introduced a regression that made this
  worse for many users).
fix: |
  Option 1 — Install poetry AFTER setup-python and re-initialize the virtual environment:
    Use `setup-python` first (without `cache: 'poetry'`), then install poetry, then
    set the Python explicitly with `poetry env use python`.

  Option 2 — Bypass `cache: 'poetry'` and manage the virtualenv cache yourself with
    `actions/cache`. This gives full control over the cache key and path.

  Option 3 — Use `poetry config virtualenvs.in-project true` so poetry creates its
    `.venv` inside the project directory, making it trivial to cache independently.
fix_code:
  - language: yaml
    label: "Install poetry after setup-python and pin interpreter explicitly"
    code: |
      steps:
        - uses: actions/checkout@v4

        # Step 1: Install target Python FIRST
        - uses: actions/setup-python@v5
          with:
            python-version: '3.13'
            # Do NOT use cache: poetry here — poetry isn't installed yet

        # Step 2: Install poetry AFTER setup-python has switched the Python
        - name: Install poetry
          run: |
            pipx install poetry
            poetry env use python3.13  # Explicitly bind to the correct version

        # Step 3: Now cache the virtualenv manually
        - name: Cache poetry virtualenv
          uses: actions/cache@v4
          with:
            path: ~/.cache/pypoetry/virtualenvs
            key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

        - run: poetry install
  - language: yaml
    label: "Use in-project venv for a simpler cache setup"
    code: |
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Configure poetry in-project venv
          run: |
            pipx install poetry
            poetry config virtualenvs.in-project true

        - name: Cache .venv directory
          uses: actions/cache@v4
          with:
            path: .venv
            key: ${{ runner.os }}-venv-${{ hashFiles('**/poetry.lock') }}

        - run: poetry install
prevention:
  - "Never use `cache: 'poetry'` in setup-python unless you install poetry in an environment that already has the correct Python active."
  - "After any `pipx install poetry`, always run `poetry env use python<version>` to re-bind to the desired interpreter."
  - "Use `poetry config virtualenvs.in-project true` to keep virtualenvs inside the project directory, making caching more predictable."
  - "Prefer pinning poetry and virtualenv versions in CI to avoid unexpected behavior when upstream packages release breaking changes."
  - "When upgrading virtualenv or poetry, test your CI pipeline immediately — version incompatibilities can break Python discovery silently."
docs:
  - url: "https://github.com/actions/setup-python/issues/1167"
    label: "actions/setup-python#1167 — Issues with poetry caching (32 reactions)"
  - url: "https://github.com/python-poetry/poetry/issues/10490"
    label: "python-poetry#10490 — poetry uses default Python instead of venv Python"
  - url: "https://github.com/pypa/virtualenv/issues/2931"
    label: "pypa/virtualenv#2931 — virtualenv 20.33.0 breaks Poetry in GitHub Actions"
  - url: "https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md#caching-packages"
    label: "setup-python advanced usage — caching packages with poetry"
