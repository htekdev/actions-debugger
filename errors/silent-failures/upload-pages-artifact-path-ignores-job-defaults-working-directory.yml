id: sf-210
title: '`upload-pages-artifact` path input ignores job-level defaults.run.working-directory'
category: silent-failures
severity: error
tags:
  - upload-pages-artifact
  - working-directory
  - path
  - tar
  - defaults
  - pages
  - relative-path
patterns:
  - regex: 'tar:.*Cannot open: No such file or directory'
    flags: 'i'
  - regex: 'actions/upload-pages-artifact.*path.*tar.*Error is not recoverable'
    flags: 'i'
error_messages:
  - "tar: dist: Cannot open: No such file or directory"
  - "tar: Error is not recoverable: exiting now"
  - "Error: Process completed with exit code 2."
root_cause: |
  `actions/upload-pages-artifact` resolves the `path:` input relative to
  `$GITHUB_WORKSPACE` (the repository root), regardless of any
  `defaults.run.working-directory` setting on the job.

  When a job sets:
  ```yaml
  defaults:
    run:
      working-directory: ./docs/user
  ```
  and then uses:
  ```yaml
  - uses: actions/upload-pages-artifact@v3
    with:
      path: "dist"
  ```

  The action's internal `tar` command receives `INPUT_PATH=dist` as an
  environment variable and resolves it against the workspace root, not the
  job's default working directory. The directory `$GITHUB_WORKSPACE/dist`
  does not exist — the actual build output lives at
  `$GITHUB_WORKSPACE/docs/user/dist` — so `tar` exits with
  `Cannot open: No such file or directory`.

  This happens because `defaults.run.working-directory` only affects `run:`
  shell steps. Actions invoked via `uses:` always operate relative to the
  workspace root, not the job default.
fix: |
  Use the full workspace-relative path in the `path:` input of
  `upload-pages-artifact`, not a path relative to `defaults.run.working-directory`.

  Change:
  ```yaml
  - uses: actions/upload-pages-artifact@v3
    with:
      path: "dist"    # wrong — relative to defaults.run.working-directory
  ```
  To:
  ```yaml
  - uses: actions/upload-pages-artifact@v3
    with:
      path: "docs/user/dist"  # correct — relative to $GITHUB_WORKSPACE
  ```

  Alternatively, use `${{ github.workspace }}` for an absolute path:
  ```yaml
  - uses: actions/upload-pages-artifact@v3
    with:
      path: "${{ github.workspace }}/docs/user/dist"
  ```
fix_code:
  - language: yaml
    label: 'Use workspace-relative path in upload-pages-artifact'
    code: |
      jobs:
        build:
          runs-on: ubuntu-latest
          defaults:
            run:
              working-directory: ./docs/user
          steps:
            - uses: actions/checkout@v4

            - name: Build
              run: npm run build   # creates dist/ inside docs/user/

            # WRONG: path is relative to working-directory, not workspace
            # - uses: actions/upload-pages-artifact@v3
            #   with:
            #     path: "dist"

            # CORRECT: path must be relative to $GITHUB_WORKSPACE
            - uses: actions/upload-pages-artifact@v3
              with:
                path: "docs/user/dist"
prevention:
  - 'Always specify `path:` in `upload-pages-artifact` relative to the repository
    root (`$GITHUB_WORKSPACE`), not relative to any `defaults.run.working-directory`
    setting.'
  - 'Remember that `defaults.run.working-directory` only affects `run:` shell steps;
    `uses:` action steps always resolve paths from the workspace root.'
  - 'Test the `path:` value by running `ls $GITHUB_WORKSPACE/<path>` in a `run:`
    step before the upload action to confirm the directory exists.'
docs:
  - url: 'https://github.com/actions/upload-pages-artifact/issues/74'
    label: 'GitHub Issue: working-directory is being ignored (upload-pages-artifact#74)'
  - url: 'https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#defaultsrun'
    label: 'GitHub Docs: defaults.run — applies only to run: steps, not uses:'
  - url: 'https://github.com/actions/upload-pages-artifact'
    label: 'actions/upload-pages-artifact repository'
