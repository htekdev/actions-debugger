    label: "actions/runner#1042: 'The workflow is not valid' does not result in a failure status (2021, confirmed behavior)"
  - url: "https://github.com/orgs/community/discussions/192051"
    label: "GitHub Community #192051: Invalid Syntax on Workflow does not show as failure in Checks tab (Apr 2026)"
  - url: "https://github.com/pytorch/pytorch/issues/81808"
    label: "pytorch#81808: Workflows fail silently when the workflow file is invalid"
  - url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging"
    label: "GitHub Docs: About protected branches — Require status checks before merging"
  - url: "https://github.com/rhysd/actionlint"
    label: "actionlint — Static checker for GitHub Actions workflow files"
