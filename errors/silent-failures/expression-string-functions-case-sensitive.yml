id: silent-failures-097
title: 'contains() / startsWith() / endsWith() expression functions are case-sensitive — label and string checks silently fail'
category: silent-failures
severity: silent-failure
tags:
  - expressions
  - contains
  - startsWith
  - endsWith
  - case-sensitive
  - labels
  - string-functions
patterns:
  - regex: 'contains\(github\.event\.label\.name'
    flags: 'i'
  - regex: 'startsWith\(github\.'
    flags: 'i'
  - regex: 'endsWith\(github\.'
    flags: 'i'
  - regex: 'if:.*contains\(.*github\.'
    flags: 'i'
error_messages:
  - "if: contains(github.event.label.name, 'bug') evaluates false despite label existing"
  - "startsWith(github.head_ref, 'feature') returns false for 'Feature/my-branch'"
  - "workflow skipped — label condition never matched"
root_cause: |
  The GitHub Actions expression functions `contains()`, `startsWith()`, and `endsWith()` are
  case-sensitive. This is explicitly documented but frequently overlooked, especially when
  matching against user-supplied data like:

  - Issue/PR label names (e.g., 'Bug' vs 'bug')
  - Branch names with mixed case (e.g., 'Feature/my-branch' vs 'feature/')
  - `github.event.action` values (always lowercase, but callers sometimes uppercase)
  - User-defined `workflow_dispatch` inputs

  A workflow like:
  ```yaml
  if: contains(github.event.label.name, 'bug')
  ```
  silently skips when the actual label is named 'Bug', 'BUG', or 'Bug Fix'. There is no
  error message — the condition simply evaluates to `false` and the job/step is skipped.

  This is the most common cause of label-driven workflows that silently never run.
fix: |
  Normalize the string to a known case before comparison using `toLower()`:

  ```yaml
  if: contains(toLower(github.event.label.name), 'bug')
  ```

  For `startsWith()` and `endsWith()`:
  ```yaml
  if: startsWith(toLower(github.head_ref), 'feature/')
  if: endsWith(toLower(github.head_ref), '-hotfix')
  ```

  Alternatively, list all expected case variants explicitly:
  ```yaml
  if: |
    contains(github.event.label.name, 'bug') ||
    contains(github.event.label.name, 'Bug') ||
    contains(github.event.label.name, 'BUG')
  ```

  The cleanest fix is always `toLower()` normalization.
fix_code:
  - language: yaml
    label: 'Broken — case-sensitive label match silently fails'
    code: |
      on:
        issues:
          types: [labeled]

      jobs:
        triage:
          runs-on: ubuntu-latest
          # ❌ Silently skips when label is 'Bug' or 'BUG' — only matches 'bug'
          if: contains(github.event.label.name, 'bug')
          steps:
            - run: echo "Bug label applied"
  - language: yaml
    label: 'Fixed — toLower() normalization before comparison'
    code: |
      on:
        issues:
          types: [labeled]

      jobs:
        triage:
          runs-on: ubuntu-latest
          # ✅ Matches 'bug', 'Bug', 'BUG', 'bug fix', etc.
          if: contains(toLower(github.event.label.name), 'bug')
          steps:
            - run: echo "Bug label applied"
  - language: yaml
    label: 'Fixed — case-insensitive branch prefix check with startsWith'
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          # ✅ Matches 'feature/auth', 'Feature/Auth', 'FEATURE/anything'
          if: startsWith(toLower(github.head_ref), 'feature/')
          steps:
            - run: echo "Feature branch — running deploy preview"
prevention:
  - "Always apply toLower() before contains(), startsWith(), or endsWith() when matching user-supplied or user-created values (labels, branch names, PR titles)."
  - "Prefer lowercase label names in your repository to eliminate case ambiguity at the source."
  - "Test label-driven workflows by adding the label manually and verifying the Actions tab shows the expected run."
  - "Use actionlint to lint workflows — it won't catch case issues but will catch expression syntax errors early."
  - "Document expected label casing in your CONTRIBUTING.md or label descriptions."
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#contains'
    label: 'contains() function — GitHub Actions expression docs'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#startswith'
    label: 'startsWith() function — GitHub Actions expression docs'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#tolower'
    label: 'toLower() function — GitHub Actions expression docs'
