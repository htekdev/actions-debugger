id: silent-failures-207
title: "download-artifact silently downloads only first 100 artifacts when run has >100"
category: silent-failures
severity: silent-failure
tags:
  - download-artifact
  - artifact
  - pagination
  - silent-failure
  - v4
  - v5
patterns:
  - regex: 'Download\s+artifact.*pattern.*matches\s+[0-9]+\s+artifact'
    flags: i
  - regex: 'artifact.*not.*found|no.*artifact.*found.*matching'
    flags: i
error_messages:
  - "Unable to find any artifacts for the associated workflow"
  - "No artifacts found that match the criteria"
root_cause: |
  `actions/download-artifact` v4 and v5 use the GitHub REST API `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts`
  to list available artifacts before downloading. This API endpoint returns paginated results with a default page size
  of **30** and a maximum of **100 per page**. The action's ListArtifacts call uses a hard-coded `perPage: 100` but
  does **not** iterate through subsequent pages.

  When a workflow run produces more than 100 artifacts (common in large matrix builds), the action silently sees
  only the first 100. Artifact name filters then match against this truncated list, so artifacts beyond the 100-item
  cutoff are never downloaded and no error is raised — the step succeeds with fewer files than expected.

  This is a known upstream limitation tracked in actions/download-artifact#441 (Nov 2025).
fix: |
  There is no direct configuration fix in download-artifact v4/v5. Options:

  1. **Reduce artifact count** — Merge matrix outputs into fewer artifacts before upload
     (e.g. upload all build outputs in one artifact per platform).

  2. **Use the GitHub API directly** — Call the paginated `/artifacts` API yourself
     and download each artifact URL manually.

  3. **Run multiple `download-artifact` steps** — If you know artifacts span the
     100-item boundary, use multiple targeted downloads with explicit `name:` filters
     that hit different artifact-name prefixes.

  4. **Track upstream** — Watch actions/download-artifact#441 for a pagination fix.
fix_code:
  - language: yaml
    label: "Fix: Reduce to fewer, larger artifacts to stay under 100"
    code: |
      # Instead of uploading one artifact per matrix job:
      # BAD: 150 jobs × 1 artifact each = 150 artifacts (truncated at 100)
      - name: Upload per-job artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.node }}  # Creates 150 artifacts
          path: dist/

      # GOOD: Group by platform to stay under 100
      - name: Upload grouped artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}   # Creates fewer artifacts
          path: dist/
          overwrite: true
  - language: yaml
    label: "Workaround: Paginated artifact download via GitHub API"
    code: |
      - name: Download all artifacts (pagination-safe)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              }
            );
            console.log(`Found ${artifacts.length} artifacts`);
            for (const artifact of artifacts) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip'
              });
              fs.writeFileSync(`${artifact.name}.zip`, Buffer.from(download.data));
            }
prevention:
  - "Keep matrix build artifact counts under 100 per workflow run"
  - "Upload per-platform or per-group artifacts rather than per-matrix-job artifacts"
  - "Verify artifact count before downloading in large matrix workflows"
  - "Use the GitHub API with pagination when run may produce >100 artifacts"
docs:
  - url: "https://github.com/actions/download-artifact/issues/441"
    label: "actions/download-artifact#441 — unable to handle artifact counts >100"
  - url: "https://docs.github.com/en/rest/actions/artifacts#list-artifacts-for-a-workflow-run"
    label: "GitHub REST API — List artifacts for a workflow run"
