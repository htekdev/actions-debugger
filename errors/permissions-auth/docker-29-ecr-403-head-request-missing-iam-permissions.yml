    label: 'runner-images #13474 — AWS confirmation: ecr:BatchGetImage + ecr:GetDownloadUrlForLayer required'
  - url: 'https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-push-iam.html'
    label: 'AWS ECR docs — Minimum IAM permissions for docker push'
  - url: 'https://docs.docker.com/engine/release-notes/29.1/'
    label: 'Docker Engine 29.1 release notes — containerd image store changes'
