id: permissions-auth-078
title: 'Classic PAT or OAuth App missing workflow scope blocks push to .github/workflows/'
category: permissions-auth
severity: error
tags:
  - classic-pat
  - oauth-app
  - workflow-scope
  - git-push
  - workflow-files
  - personal-access-token
patterns:
  - regex: 'refusing to allow an OAuth App to create or update workflow'
    flags: 'i'
  - regex: 'refusing to allow a Personal Access Token to create or update workflow'
    flags: 'i'
  - regex: 'without `workflow` scope'
    flags: 'i'
  - regex: 'refusing to allow .+ to create or update workflow .+\.github/workflows'
    flags: 'i'
error_messages:
  - "refusing to allow an OAuth App to create or update workflow `.github/workflows/cd.yml` without `workflow` scope"
  - "refusing to allow a Personal Access Token to create or update workflow `.github/workflows/deploy.yml` without `workflow` scope"
  - "! [remote rejected] main -> main (refusing to allow an OAuth App to create or update workflow `.github/workflows/main.yml` without `workflow` scope)"
  - "error: failed to push some refs to 'https://github.com/owner/repo.git'"
root_cause: |
  GitHub requires the `workflow` scope on classic Personal Access Tokens (PATs) — and the
  equivalent permission on OAuth Apps — before any push that creates or modifies files
  under `.github/workflows/`. This restriction was introduced to prevent accidental or
  malicious modification of workflow files by tokens that only have `repo` scope.

  **When this happens:**
  - A classic PAT was created with `repo` scope (and sub-scopes) but NOT `workflow` scope.
  - A third-party Git client (IntelliJ, VS Code, GitHub Desktop, Sourcetree, Tower, etc.)
    is authenticated with a PAT that lacks `workflow` scope.
  - A CI/CD tool or script uses a classic PAT to push code that happens to include changes
    to `.github/workflows/*.yml` files.

  This is different from the `GITHUB_TOKEN` push failure (which requires `contents: write`)
  and from fine-grained PAT failures (which require the "Actions" permission instead).

  **Key distinction from pa-025 (contents:write):**
  - `pa-025` covers GITHUB_TOKEN missing `contents: write` — the error is "Write access to
    repository not granted" and happens in GitHub Actions workflows themselves.
  - This entry covers classic PATs and OAuth Apps — the error is specifically "refusing to
    allow an OAuth App/PAT to create or update workflow ... without `workflow` scope" and
    happens in external git clients or scripts pushing to GitHub.
fix: |
  **Option 1 (recommended): Add `workflow` scope to the classic PAT.**
  1. Go to GitHub Settings → Developer settings → Personal access tokens (classic).
  2. Click the token name or generate a new token.
  3. Select the `workflow` scope (in addition to `repo`).
  4. Save and update your git client with the new token.

  **Option 2: Use a fine-grained PAT with "Actions" read+write permission.**
  Fine-grained PATs use the "Actions" permission for workflow file writes, not `workflow`
  scope. Create a fine-grained PAT with Contents: write AND Actions: write.

  **Option 3: Use GitHub CLI with `workflow` scope.**
  If using `gh auth login`, ensure you select the `workflow` scope during login.

  **Option 4 (for GitHub Apps): Request the `workflows` permission.**
  GitHub Apps require the `Workflows` permission (read+write on Actions workflows).
fix_code:
  - language: yaml
    label: 'Using a classic PAT with workflow scope in a workflow push step'
    code: |
      # In your workflow, if you need to push workflow file changes via a PAT:
      jobs:
        update-workflow:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with:
                # Use a classic PAT with BOTH repo AND workflow scopes
                token: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}

            - name: Modify workflow file
              run: |
                echo "# updated" >> .github/workflows/deploy.yml

            - name: Push changes
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add .github/workflows/
                git commit -m "chore: update workflow"
                git push
  - language: bash
    label: 'Check your PAT scopes with the GitHub API'
    code: |
      # Run this to verify your PAT has the workflow scope:
      curl -sI -H "Authorization: token YOUR_PAT" https://api.github.com | grep -i x-oauth-scopes
      # Output should include "workflow" in the scopes list:
      # X-OAuth-Scopes: repo, workflow
prevention:
  - 'When creating a classic PAT intended for CI/CD that modifies workflow files, always include the `workflow` scope alongside `repo`.'
  - 'When authenticating a git GUI client (IntelliJ, VS Code, Sourcetree) to a repository that contains GitHub Actions workflows, use a PAT with `workflow` scope or the GitHub CLI (`gh auth login`).'
  - 'Audit existing PATs at GitHub Settings → Developer settings → Personal access tokens — tokens without `workflow` scope will silently fail when trying to modify `.github/workflows/` files.'
  - 'For service accounts and bots that need to modify workflow files, prefer GitHub Apps with the Workflows permission over classic PATs.'
