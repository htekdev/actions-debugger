    label: 'Using OpenID Connect with reusable workflows — GitHub Docs'
  - url: 'https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/about-security-hardening-with-openid-connect#understanding-the-oidc-token'
    label: 'About security hardening with OIDC — job_workflow_ref claim'
  - url: 'https://github.com/aws-actions/configure-aws-credentials/issues/1707'
    label: 'configure-aws-credentials#1707 — OIDC failure from co-located v2→v3 reusable workflow bump (Mar 2026)'
  - url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html'
    label: 'AWS: Creating a role for web identity or OIDC federation'
