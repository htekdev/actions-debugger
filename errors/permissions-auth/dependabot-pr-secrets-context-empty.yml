id: permissions-auth-052
title: 'Dependabot pull_request workflows cannot access repository secrets'
category: permissions-auth
severity: error
tags:
  - dependabot
  - secrets
  - pull-request
  - read-only-token
  - supply-chain
  - security
patterns:
  - regex: 'github\.actor\s*==\s*[''"]dependabot\[bot\][''"]'
    flags: 'i'
  - regex: 'triggered by dependabot'
    flags: 'i'
error_messages:
  - "Error: Input required and not supplied: token"
  - "Error: Bad credentials"
  - "Error: 401 Unauthorized"
  - "npm error code E401"
  - "unauthorized: authentication required"
  - "Error: Could not login to Docker registry"
root_cause: |
  Since April 2022, GitHub security-hardened workflows triggered by Dependabot
  pull requests: the secrets context is entirely empty — every secret evaluates
  to an empty string regardless of repository or organization secret configuration.
  This prevents supply-chain attacks where a malicious dependency update could
  exfiltrate CI secrets. Additionally, the GITHUB_TOKEN issued to Dependabot PRs
  is read-only by default (contents: read, metadata: read). Steps that reference
  secrets.NPM_TOKEN, secrets.DOCKER_HUB_TOKEN, secrets.CODECOV_TOKEN, or any
  other custom secret silently receive empty strings, causing 401 authentication
  failures in publish steps, Docker pushes, coverage uploads, and any step that
  requires external authentication. The workflow log shows the step running but
  the auth failure appears only in the step's output, not as a clear "secret is
  empty" message.
fix: |
  Option 1 (recommended): Guard secret-dependent steps with
  if: github.actor != 'dependabot[bot]' — Dependabot PRs only need build and
  test validation, not publish or deploy steps.
  Option 2: Use pull_request_target with explicit permission grants for
  Dependabot — use with caution, as pull_request_target runs in the base
  branch context with write access.
  Option 3: Use a separate workflow triggered on pull_request_review to
  handle the auto-approve and auto-merge pattern after CI passes.
fix_code:
  - language: yaml
    label: 'Skip secret-dependent steps for Dependabot PRs'
    code: |
      jobs:
        build:
          steps:
            - name: Build and test
              run: npm ci && npm test
            - name: Publish coverage
              # Dependabot PRs have no secrets — skip steps that require them
              if: github.actor != 'dependabot[bot]'
              run: npx codecov
              env:
                CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  - language: yaml
    label: 'Auto-approve Dependabot PRs using GITHUB_TOKEN only'
    code: |
      on:
        pull_request:
      permissions:
        pull-requests: write
        contents: write
      jobs:
        dependabot-auto-approve:
          if: github.actor == 'dependabot[bot]'
          steps:
            - name: Approve PR
              run: gh pr review --approve "$PR_URL"
              env:
                PR_URL: ${{ github.event.pull_request.html_url }}
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
prevention:
  - 'Design Dependabot-aware workflows: build and test must succeed using only GITHUB_TOKEN'
  - "Use if: github.actor != 'dependabot[bot]' to guard all steps requiring custom secrets"
  - 'Enable auto-merge for Dependabot via repository settings rather than workflow-level secrets'
  - 'Review GitHub changelog for Dependabot security updates affecting workflow behavior'
docs:
  - url: 'https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions'
    label: 'GitHub Docs: Automating Dependabot with GitHub Actions'
  - url: 'https://github.blog/changelog/2021-10-06-github-actions-workflows-triggered-by-dependabot-prs-will-run-with-read-only-permissions/'
    label: 'GitHub Changelog: Dependabot PRs run with read-only permissions'
  - url: 'https://docs.github.com/en/code-security/dependabot/working-with-dependabot/configuring-access-to-private-registries-for-dependabot'
    label: 'GitHub Docs: Configuring access to private registries for Dependabot'
