id: permissions-auth-095
title: 'checkout@v6 Credentials Inaccessible Inside docker run — includeIf.gitdir Path Not Mounted in Custom Containers'
category: permissions-auth
severity: error
tags:
  - checkout
  - docker
  - credentials
  - persist-credentials
  - includeIf
  - v6
  - git-auth
patterns:
  - regex: 'fatal: could not read Username for .https://github\.com.: No such device or address'
    flags: 'i'
  - regex: 'remote: HTTP Basic: Access denied'
    flags: 'i'
  - regex: 'fatal: Authentication failed for .https://github\.com'
    flags: 'i'
  - regex: 'error: could not lock config file.*git-credentials.*No such file or directory'
    flags: 'i'
error_messages:
  - "fatal: could not read Username for 'https://github.com': No such device or address"
  - "remote: HTTP Basic: Access denied"
  - "fatal: Authentication failed for 'https://github.com/'"
  - "error: could not lock config file /github/runner_temp/git-credentials-abc123.config: No such file or directory"
root_cause: |
  `actions/checkout@v6` changed the credential storage mechanism from HTTP Authorization
  headers in `.git/config` to a path-scoped `includeIf.gitdir` directive. The credentials
  file is written to `$RUNNER_TEMP` on the host, and `.git/config` references it via:

      [includeIf "gitdir:/home/runner/work/repo/repo/.git"]
          path = /home/runner/work/_temp/git-credentials-abc123.config

  This worked transparently on v5 because credentials were stored directly in `.git/config`
  as HTTP Authorization headers accessible from any context.

  With v6, two conditions must both hold true for credentials to work inside a custom
  `docker run` invoked from a `run:` step or composite action:

  1. **$RUNNER_TEMP must be mounted** — the credentials file lives in `$RUNNER_TEMP` on the
     host and is not available inside the container unless explicitly volume-mounted.
  2. **includeIf path must match** — `includeIf.gitdir` triggers only when the git directory
     path matches the configured pattern. Inside a container, the workspace path may differ
     from the host path, so the condition never triggers and the credentials file is never
     loaded.

  This is distinct from the Docker container action pattern (using: docker in action.yml)
  where GitHub's runner manages the container and mounts $RUNNER_TEMP automatically.
  The breakage only affects workflows that manually invoke `docker run` from `run:` steps
  or from composite actions that call docker themselves.

  The v6 README requirement of "runner version v2.329.0+" applies to runner-managed
  Docker container actions, not to user-invoked `docker run` calls.

  Sources: actions/checkout#2359 (Jan 2026, 12 reactions, open)
fix: |
  Option 1 — Downgrade to checkout@v5 (recommended until v6 fix lands):

      uses: actions/checkout@v5

  v5 stores credentials as HTTP Authorization headers in `.git/config` which is accessible
  from any `docker run` container that mounts the workspace.

  Option 2 — Mount $RUNNER_TEMP and use a path the includeIf can match:

  Mount `$RUNNER_TEMP` to `/github/runner_temp` inside the container, and ensure the
  workspace is checked out at a path the `includeIf.gitdir` condition will match:

      docker run \
        -v "$GITHUB_WORKSPACE:/github/workspace" \
        -v "$RUNNER_TEMP:/github/runner_temp" \
        myimage bash -c "cd /github/workspace && git fetch origin"

  Option 3 — Pass the token explicitly to docker and use it in-container:

      docker run \
        -e GH_TOKEN=${{ github.token }} \
        myimage bash -c "git push https://x-access-token:${GH_TOKEN}@github.com/org/repo.git"
fix_code:
  - language: yaml
    label: 'Downgrade to checkout@v5 to restore docker run compatibility'
    code: |
      steps:
        - name: Checkout
          uses: actions/checkout@v5   # v5 uses HTTP auth headers in .git/config — works in docker run
          with:
            fetch-depth: 0
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push in Docker
          run: |
            docker run \
              -v "$GITHUB_WORKSPACE:/workspace" \
              myimage bash -c "cd /workspace && git push origin HEAD"

  - language: yaml
    label: 'Mount $RUNNER_TEMP into docker run so v6 credentials are accessible'
    code: |
      steps:
        - name: Checkout
          uses: actions/checkout@v6
          with:
            persist-credentials: true

        - name: Run docker with credentials mounted
          run: |
            docker run \
              -v "$GITHUB_WORKSPACE:/github/workspace" \
              -v "$RUNNER_TEMP:/github/runner_temp" \
              myimage bash -c "cd /github/workspace && git fetch origin"
          # Note: workspace must be mounted to the same path used in .git/config
          # for includeIf.gitdir to match inside the container

  - language: yaml
    label: 'Pass token explicitly to docker — no credential mounting needed'
    code: |
      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Run docker with inline token
          run: |
            docker run \
              -e GH_TOKEN=${{ github.token }} \
              myimage bash -c |
                git remote set-url origin \
                  "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
                git push origin HEAD
prevention:
  - 'Before upgrading from checkout@v5 to v6, audit all run: steps and composite actions for docker run commands that use git operations'
  - 'If your workflow uses docker run with git credentials, test on v6 before rolling out to production branches'
  - 'Use checkout@v5 for any workflow where custom docker run commands need git access until checkout#2359 is resolved'
  - 'For new workflows requiring docker run with git, prefer passing the token explicitly via -e GH_TOKEN=${{ github.token }} instead of relying on credential mounting'
docs:
  - url: 'https://github.com/actions/checkout/issues/2359'
    label: 'checkout#2359: checkout@v6 credentials do not work with docker run in scripts (Jan 2026, open)'
  - url: 'https://github.com/actions/checkout/releases/tag/v6.0.0'
    label: 'checkout v6.0.0 release notes — includeIf.gitdir credential change'
  - url: 'https://github.com/actions/checkout/issues/2386'
    label: 'checkout#2386: Related report of v6 credential failure with custom Docker containers'
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-docker-container-action'
    label: 'GitHub Docs: Creating a Docker container action (runner-managed containers)'
