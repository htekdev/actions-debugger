id: permissions-auth-108
title: 'create-github-app-token v3.1.0 — app-id input deprecated, migrate to client-id before v4 removes it'
category: permissions-auth
severity: warning
tags:
  - create-github-app-token
  - app-id
  - client-id
  - deprecated
  - v3.1
  - github-app
  - token
patterns:
  - regex: 'Input .app-id. (is deprecated|has been deprecated).*use .client-id. instead'
    flags: 'i'
  - regex: 'app-id.*deprecated.*client-id|deprecated.*app-id.*please use.*client-id'
    flags: 'i'
error_messages:
  - "Input 'app-id' is deprecated. Please use 'client-id' instead."
  - "Warning: Input 'app-id' has been deprecated. Please use 'client-id' instead."
root_cause: |
  In create-github-app-token v3.1.0 (released April 11, 2026), the `app-id` input
  was deprecated in favour of a new `client-id` input. The GitHub App settings page
  now prominently displays the "Client ID" (previously only the numeric "App ID"),
  and the action was updated to accept both identifiers while deprecating the older name.

  The rename aligns with GitHub's updated API terminology — the GitHub App
  "Client ID" is the stable, human-readable identifier (a string like
  "Iv23liMQnZUnjprcJuIm") while the numeric "App ID" is the internal integer.

  In v3.1.x, using `app-id` still works but emits a deprecation warning annotation
  on every workflow run. The input will be **removed in v4.0.0**; after that,
  workflows pinned to `create-github-app-token@v4` or later that still supply
  `app-id` will fail with a missing-identifier error.

  Both the numeric App ID and the string Client ID are accepted as values for
  `client-id` in v3.1.0+, so the migration is a simple key rename with no value
  change required.
fix: |
  Rename `app-id:` to `client-id:` in all workflow steps that use
  `actions/create-github-app-token`. The value itself does not change — both the
  numeric App ID and the string Client ID are accepted.

  If you have the App ID stored in a secret (e.g., `secrets.APP_ID`), rename the
  secret to `CLIENT_ID` or leave the secret name and just update the input key:
    - Old:  app-id: ${{ secrets.APP_ID }}
    - New:  client-id: ${{ secrets.APP_ID }}

  The secret name does not need to change; only the input key in the workflow YAML
  needs updating.
fix_code:
  - language: yaml
    label: 'Rename app-id to client-id (value unchanged)'
    code: |
      # Before (v3.0.x and earlier)
      - uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # After (v3.1.0+ and v4+)
      - uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}      # key renamed; same value works
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
  - language: yaml
    label: 'Scanning and updating all occurrences across a repo'
    code: |
      # One-liner to find all uses of app-id in workflow files
      # Run in repo root to see what needs updating:
      grep -rn 'app-id:' .github/workflows/

      # Update all instances (GNU sed):
      find .github/workflows/ -name '*.yml' -exec \
        sed -i 's/app-id:/client-id:/g' {} \;
prevention:
  - "When upgrading to create-github-app-token v4 or later, ensure all workflow files use `client-id:` not `app-id:` — the old input is removed in v4."
  - "Run a repository-wide search for `app-id:` in `.github/workflows/` before pinning to v4 to catch all occurrences."
  - "Keep the secret name (e.g., `secrets.APP_ID`) unchanged — only the input key in the YAML needs updating."
  - "Both numeric App ID integers and string Client IDs (e.g., 'Iv23liMQnZUnjprcJuIm') are accepted as values for `client-id` in v3.1.0+."
docs:
  - url: 'https://github.com/actions/create-github-app-token/releases/tag/v3.1.0'
    label: 'create-github-app-token v3.1.0 release notes — client-id added, app-id deprecated'
  - url: 'https://github.com/actions/create-github-app-token/pull/353'
    label: 'create-github-app-token PR #353 — add client-id input and deprecate app-id'
  - url: 'https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app'
    label: 'GitHub Docs — Registering a GitHub App (Client ID vs App ID)'
