    label: "GitHub Docs — Publishing Docker images"
  - url: "https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry"
    label: "GitHub Docs — Working with the Container Registry"
  - url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token"
    label: "GitHub Docs — GITHUB_TOKEN permissions reference"
  - url: "https://stackoverflow.com/questions/69014742/github-denied-permission-denied-write-package"
    label: "Stack Overflow #69014742 — denied: permission_denied: write_package"
  - url: "https://github.com/orgs/community/discussions/26274"
    label: "GitHub Community Discussion #26274 — GHCR push permission denied"
