id: permissions-auth-116
title: '`gh pr edit` fails with Resource not accessible when `repository-projects: read` is absent'
category: permissions-auth
severity: error
tags:
  - gh-cli
  - pr-edit
  - repository-projects
  - graphql
  - permissions
patterns:
  - regex: 'Resource not accessible by integration \(repository\.pullRequest\.projectCards'
    flags: i
  - regex: 'GraphQL: Resource not accessible by integration.*projectCards'
    flags: i
error_messages:
  - 'GraphQL: Resource not accessible by integration (repository.pullRequest.projectCards.nodes)'
  - 'Error: GraphQL: Resource not accessible by integration (repository.pullRequest.projectCards.nodes)'
root_cause: |
  The `gh pr edit` command always fetches project card information via GraphQL even when the edit
  does not involve projects. The query unconditionally fetches `repository.pullRequest.projectCards.nodes`
  to display existing project associations. When the workflow's `permissions` block is explicitly
  scoped (e.g. `pull-requests: write` only), the GITHUB_TOKEN is restricted and cannot query project
  cards, causing a 403-level GraphQL error.

  This is a design issue in the GitHub CLI: it does not skip the project card fetch when no project
  changes are requested. The error appears even if the user never specifies `--project` in the command.

  Source: cli/cli#6274 (75 reactions, open as of 2026)
fix: |
  Add `repository-projects: read` to the workflow permissions block. Even if you are not editing
  project assignments, the `gh pr edit` command internally queries project card data and requires
  this permission to succeed.

  Alternatively, use the REST API directly via `gh api` to edit only the fields you need, avoiding
  the GraphQL project card fetch entirely.
fix_code:
  - language: yaml
    label: 'Add repository-projects: read to workflow permissions'
    code: |
      permissions:
        pull-requests: write
        repository-projects: read  # required even if not editing projects
  - language: yaml
    label: 'Alternatively, use REST API to avoid the project card query'
    code: |
      - name: Update PR labels
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            --method POST \
            --field 'labels[]=my-label'
        env:
          GH_TOKEN: ${{ github.token }}
prevention:
  - 'When scoping workflow permissions, always test `gh pr edit` in a dry-run first to surface hidden permission requirements.'
  - 'Prefer `gh api` with explicit REST endpoints over `gh pr edit` when only mutating specific fields, to avoid the hidden project card query.'
  - 'Track cli/cli#6274 for a potential fix where `gh pr edit` skips project card fetch when no project changes are requested.'
docs:
  - url: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
    label: Controlling permissions for GITHUB_TOKEN
  - url: https://github.com/cli/cli/issues/6274
    label: 'cli/cli#6274: gh pr edit requires repository-projects: read even without --project'
