id: permissions-auth-106
title: "create-github-app-token v3.1.x Fails for Enterprise Installations — No Enterprise Installation Found"
category: permissions-auth
severity: error
tags:
  - create-github-app-token
  - enterprise
  - installation-token
  - v3
  - regression
  - github-app
patterns:
  - regex: 'No enterprise installation found matching the enterprise slug'
    flags: 'i'
  - regex: 'Failed to create token for enterprise.*attempt \d+\):\s*No enterprise installation'
    flags: 'i'
  - regex: 'Creating enterprise installation token for enterprise.*\nFailed to create token'
    flags: 'i'
error_messages:
  - "No enterprise installation found matching the enterprise slug \"<slug>\"."
  - "Failed to create token for enterprise \"<slug>\" (attempt 1): No enterprise installation found matching the enterprise slug \"<slug>\"."
  - "Error: No enterprise installation found matching the enterprise slug \"<slug>\"."
root_cause: |
  `actions/create-github-app-token` v3.0.0–v3.1.x contained a regression that broke
  enterprise-level GitHub App installation token generation. Even when the GitHub App is
  correctly installed on the enterprise and the `owner:` input is set to the enterprise
  slug, the action fails with "No enterprise installation found matching the enterprise
  slug".

  The bug was introduced during the v3 rewrite of the enterprise token lookup path.
  The action incorrectly resolved the enterprise slug against the API endpoint, causing
  it to find zero installations even when the app is properly installed.

  This regression was fixed in v3.2.0 (released May 2026). Users pinned to `@v3` or
  `@v3.1.x` hit this error when attempting to use the enterprise token feature
  documented in the action's README.
fix: |
  Upgrade to actions/create-github-app-token@v3.2.0 or later.

  The enterprise installation token flow was fixed in v3.2.0. Simply bump the version
  pin to resolve the error.

  If you cannot immediately upgrade, use the exact SHA pin for v3.2.0:
  actions/create-github-app-token@v3.2.0
fix_code:
  - language: yaml
    label: 'Broken — v3.1.x enterprise token fails'
    code: |
      # ❌ Breaks for enterprise installations on v3.1.x
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: my-enterprise   # enterprise slug
  - language: yaml
    label: 'Fixed — upgrade to v3.2.0 or later'
    code: |
      # ✅ Works — enterprise installation token restored in v3.2.0
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: my-enterprise   # enterprise slug
prevention:
  - 'Pin to actions/create-github-app-token@v3.2.0 or later when using enterprise-level GitHub App installations.'
  - 'Test enterprise App token generation in a separate validation workflow before rolling out widely.'
  - 'Check the actions/create-github-app-token release notes when bumping the major version — enterprise support has had multiple regressions.'
docs:
  - url: 'https://github.com/actions/create-github-app-token/issues/373'
    label: "actions/create-github-app-token #373 — Can't Create a token for an enterprise installation"
  - url: 'https://github.com/actions/create-github-app-token/releases/tag/v3.2.0'
    label: 'actions/create-github-app-token v3.2.0 release notes'
  - url: 'https://github.com/actions/create-github-app-token#create-a-token-for-an-enterprise-installation'
    label: 'create-github-app-token README — Enterprise installation token'
