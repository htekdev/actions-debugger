id: caching-artifacts-105
title: "docker/build-push-action Gzip Build-Record Artifact Conflicts With download-artifact — 'Not a valid zip file'"
category: caching-artifacts
severity: error
tags:
  - download-artifact
  - docker
  - build-push-action
  - gzip
  - zip
  - format-conflict
  - build-record
patterns:
  - regex: 'Failed to download artifact after \d+ retries? due to Not a valid zip file'
    flags: 'i'
  - regex: 'Not a valid zip file'
    flags: 'i'
error_messages:
  - '##[debug]Failed to download artifact after 1 retries due to Not a valid zip file. Retrying in 5 seconds...'
  - 'Failed to download artifact after 1 retries due to Not a valid zip file'
root_cause: |
  When docker/build-push-action runs in a workflow job, it automatically uploads a build
  record artifact to the GitHub Actions run via the Artifact API as a gzip-compressed tar
  archive (.tar.gz). This happens silently even if the developer did not explicitly use
  upload-artifact.

  The actions/download-artifact action only supports zip-format artifacts (i.e., artifacts
  created by actions/upload-artifact). When a subsequent job calls download-artifact without
  specifying an explicit name filter, it may attempt to download the docker build-record
  artifact. Because that artifact is gzip not zip, download-artifact throws "Not a valid zip
  file" and fails after its retry limit.

  This is documented in docker/build-push-action as expected behavior when DOCKER_BUILDKIT
  build summaries are enabled. The artifact appears in the run's artifact list but is
  incompatible with download-artifact.
fix: |
  Disable the automatic docker build record upload by setting DOCKER_BUILD_RECORD_UPLOAD=false
  as an environment variable on the docker/build-push-action step. If you need the build
  provenance record, use the name or pattern input on download-artifact to explicitly target
  only the artifacts you created with upload-artifact.
fix_code:
  - language: yaml
    label: 'Disable docker build record upload to prevent gzip/zip format conflict'
    code: |
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'  # prevents gzip artifact that breaks download-artifact
        with:
          context: .
          push: true
          tags: myimage:latest
  - language: yaml
    label: 'Alternatively, use explicit artifact name on download-artifact'
    code: |
      - uses: actions/download-artifact@v4
        with:
          name: my-build-output  # explicit name prevents targeting docker build-record artifact
          path: ./dist
prevention:
  - 'Always set DOCKER_BUILD_RECORD_UPLOAD=false on docker/build-push-action in workflows that also use download-artifact'
  - 'Use explicit name or pattern inputs on download-artifact instead of downloading all artifacts when docker/build-push-action is present in the run'
  - 'If you see a docker-build-record artifact in the run summary and a "Not a valid zip file" error, these two issues are linked — disable the build record upload'
  - 'The error persists even after retries because the file format is fundamentally wrong — retrying does not help, disabling DOCKER_BUILD_RECORD_UPLOAD is required'
docs:
  - url: 'https://github.com/actions/download-artifact/issues/377'
    label: 'download-artifact #377: Not a valid zip file — root cause from docker/build-push-action'
  - url: 'https://github.com/docker/build-push-action/blob/master/docs/advanced/cache.md'
    label: 'docker/build-push-action: build cache and record upload behavior'
