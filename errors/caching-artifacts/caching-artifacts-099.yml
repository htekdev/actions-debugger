id: caching-artifacts-099
title: 'upload-artifact@v7 archive:false rejects unrecognized MIME type files with 400 Bad Request'
category: caching-artifacts
severity: error
tags:
  - upload-artifact
  - archive-false
  - mime-type
  - xlsx
  - binary-files
  - v7
patterns:
  - regex: 'Failed to CreateArtifact: Received non-retryable error: Failed request: \(400\) Bad Request: mime_type a valid mime_type is required'
    flags: 'i'
  - regex: 'mime_type a valid mime_type is required for this artifact version'
    flags: 'i'
error_messages:
  - 'Error: Failed to CreateArtifact: Received non-retryable error: Failed request: (400) Bad Request: mime_type a valid mime_type is required for this artifact version'
root_cause: |
  When `archive: false` is set on `actions/upload-artifact@v7`, each file is uploaded
  individually as a raw blob rather than wrapped in a zip archive. The v7 artifact
  backend requires a valid MIME type to be declared for every raw file upload. For
  common file types like `.xlsx` (application/vnd.openxmlformats-officedocument.
  spreadsheetml.sheet), `.pdf`, `.bin`, or other binary/Office formats whose MIME
  type is not in the action's internal lookup table, the MIME type resolves to an
  empty string or an invalid value. The backend enforces that a valid MIME type is
  present and returns a non-retryable 400 Bad Request when validation fails.

  The classic zip-based upload (default `archive: true`) is unaffected because the
  entire artifact is wrapped in a single .zip file with a known MIME type. Only
  `archive: false` triggers per-file MIME type validation.
fix: |
  Option 1 (recommended): Remove `archive: false` and let the action use the default
  zip-based upload. The artifact is downloaded as a zip and extracted on the consumer
  side.

  Option 2: Wrap files in a zip yourself before uploading with `archive: false`:
    - name: Zip artifact before upload
      run: zip artifact.zip report.xlsx

  Option 3: Rename the file to a well-known extension before upload if the content
  allows it (e.g., saving xlsx as a CSV if xlsx is not required).

  Note: If `archive: false` support for xlsx/binary files is required, track
  actions/upload-artifact#765 for an upstream fix.
fix_code:
  - language: yaml
    label: 'Remove archive:false to use default zip upload (safest fix)'
    code: |
      - name: Upload report
        uses: actions/upload-artifact@v4  # or v7 without archive:false
        with:
          name: excel-report
          path: report.xlsx
          # archive: false  <-- remove this line
  - language: yaml
    label: 'Pre-zip the file before uploading with archive:false'
    code: |
      - name: Zip before upload
        run: zip report.zip report.xlsx

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: excel-report
          path: report.zip
          archive: false
prevention:
  - 'Only use archive:false with plain text files, images, or files whose MIME types are well-known (text/plain, application/json, image/png, etc.).'
  - 'Test archive:false uploads locally before relying on them in CI for binary file types.'
  - 'Prefer the default archive:true (zip-based) upload for binary formats like xlsx, docx, pdf unless raw file access is strictly required.'
  - 'Check actions/upload-artifact release notes before adopting archive:false in new workflows.'
docs:
  - url: 'https://github.com/actions/upload-artifact/issues/765'
    label: 'GitHub Issue: Uploading an xlsx file with archive:false fails (upload-artifact#765)'
  - url: 'https://github.com/actions/upload-artifact/blob/main/README.md'
    label: 'upload-artifact README — archive input documentation'
