id: caching-artifacts-110
title: 'actions/deploy-pages@v4 incompatible with upload-pages-artifact@v1/v2 — Artifact not found'
category: caching-artifacts
severity: error
tags:
  - deploy-pages
  - upload-pages-artifact
  - pages
  - artifact
  - v4
  - breaking-change
  - version-mismatch
patterns:
  - regex: 'Artifact .github-pages. (was not found|not found) for this workflow run'
    flags: 'i'
  - regex: 'Error: Fetching artifact metadata failed.*github-pages'
    flags: 'i'
  - regex: 'deploy-pages.*artifact.*not found|artifact.*not found.*deploy-pages'
    flags: 'i'
  - regex: 'No artifact named .github-pages. was found'
    flags: 'i'
error_messages:
  - "Error: Artifact 'github-pages' was not found for this workflow run."
  - "Error: Fetching artifact metadata failed. Is githubstatus.com reporting issues with API requests, Pages or Actions? Please re-run the deployment at a later time."
  - "No artifact named 'github-pages' was found for workflow run ID"
root_cause: |
  `actions/deploy-pages@v4` (released December 2023) migrated to the new GitHub
  Actions artifact backend (artifacts v4). It locates the Pages artifact by
  **artifact ID**, not by name, using the v4 artifact REST API.

  `actions/upload-pages-artifact@v1` and `@v2` use the old artifact backend
  (actions/upload-artifact@v3 internally). Artifacts uploaded with the old backend
  are NOT visible to the v4 artifact API — they exist in a different storage
  backend and do not have v4-style artifact IDs.

  When `deploy-pages@v4` looks for the `github-pages` artifact via the v4 API,
  it finds nothing and reports "Artifact not found".

  Affected combinations:
  - `upload-pages-artifact@v1` + `deploy-pages@v4` ❌
  - `upload-pages-artifact@v2` + `deploy-pages@v4` ❌
  - `upload-artifact@v3` (manual artifact) + `deploy-pages@v4` ❌

  Compatible combinations:
  - `upload-pages-artifact@v3` + `deploy-pages@v4` ✅
  - `upload-pages-artifact@v4` + `deploy-pages@v4` ✅
  - `upload-artifact@v4` + `deploy-pages@v4` ✅

  The error is often encountered after Dependabot bumps `deploy-pages` from v3 to v4
  but leaves `upload-pages-artifact` at v2 — the two actions get out of sync.
fix: |
  Upgrade BOTH the upload and deploy actions together. They must use matching backends.
  The safest approach is to use `upload-pages-artifact@v3` (or v4) with `deploy-pages@v4`.

  Alternatively, if you cannot upgrade yet, keep both pinned to the v3 generation:
  - `upload-pages-artifact@v2` + `deploy-pages@v3`
fix_code:
  - language: yaml
    label: 'WRONG — mismatched versions (deploy@v4 with old upload@v2)'
    code: |
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2   # old backend
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4            # new backend — cannot find the artifact!
  - language: yaml
    label: 'CORRECT — matching v4-generation actions'
    code: |
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3   # v4 backend ✅
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4            # v4 backend ✅
  - language: yaml
    label: 'Full working Pages deployment workflow'
    code: |
      name: Deploy GitHub Pages
      on:
        push:
          branches: [main]

      permissions:
        contents: read
        pages: write
        id-token: write

      concurrency:
        group: "pages"
        cancel-in-progress: false

      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Build site
              run: npm run build  # or your build command
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3   # must be v3+
              with:
                path: ./dist

        deploy:
          needs: build
          runs-on: ubuntu-latest
          environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
          steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4             # must be v4+
prevention:
  - 'When upgrading deploy-pages@v3 → v4, simultaneously upgrade upload-pages-artifact@v2 → v3 in the same PR'
  - 'Pin Dependabot to bump both actions together using the grouped Dependabot config'
  - 'Check the deploy-pages CHANGELOG for artifact backend compatibility requirements before each major upgrade'
  - 'Use `actions/upload-pages-artifact@v3` or newer as the baseline — it uses the modern artifact backend required by deploy-pages@v4'
docs:
  - url: 'https://github.com/actions/deploy-pages/releases/tag/v4.0.0'
    label: 'actions/deploy-pages v4.0.0 release notes — artifact compatibility requirement'
  - url: 'https://github.com/actions/upload-pages-artifact/releases/tag/v3.0.0'
    label: 'actions/upload-pages-artifact v3.0.0 release notes — upgrade to upload-artifact@v4'
  - url: 'https://github.blog/news-insights/product-news/get-started-with-v4-of-github-actions-artifacts/'
    label: 'GitHub Blog — Get started with v4 of GitHub Actions Artifacts'
