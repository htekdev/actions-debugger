id: caching-artifacts-106
title: "upload-artifact v7 archive:false Fails — HTTP 400 'mime_type a valid mime_type is required'"
category: caching-artifacts
severity: error
tags:
  - upload-artifact
  - v7
  - archive
  - mime-type
  - 400-bad-request
  - binary-files
  - xlsx
patterns:
  - regex: 'mime_type a valid mime_type is required for this artifact version'
    flags: 'i'
  - regex: 'Failed to CreateArtifact.*mime_type.*required'
    flags: 'i'
  - regex: 'Received non-retryable error.*\(400\) Bad Request.*mime_type'
    flags: 'i'
error_messages:
  - 'Failed to CreateArtifact: Received non-retryable error: Failed request: (400) Bad Request: mime_type a valid mime_type is required for this artifact version'
root_cause: |
  The actions/upload-artifact v7 action introduced an archive: false input for uploading
  single files directly to the GitHub Artifact API without zipping them. When archive: false
  is used, the Artifact API requires a valid MIME type for the file being uploaded. The
  @actions/artifact package has a MIME type lookup table, but file types with unrecognized
  extensions (e.g., .xlsx, .7z, .parquet, custom binary formats) have no mapping in the
  table.

  When the MIME type cannot be determined, the CreateArtifact API call is sent with an empty
  or invalid mime_type field, which the server rejects with HTTP 400 Bad Request and the
  message "mime_type a valid mime_type is required for this artifact version". The error is
  marked as non-retryable, so the upload fails immediately with no fallback.

  This issue does NOT affect archive: true (the default), because zipped artifacts are
  always uploaded as application/zip regardless of the inner file types.
fix: |
  Use the default archive: true mode (omit the archive input entirely) for file types with
  unrecognized MIME types. The file will be wrapped in a zip, which avoids the MIME type
  lookup. If you specifically need unarchived uploads for a recognized file type, ensure
  the file extension matches a MIME type known to the actions/artifact package.
fix_code:
  - language: yaml
    label: 'Use default archive mode (omit archive:false) to avoid MIME type errors'
    code: |
      - uses: actions/upload-artifact@v7
        with:
          name: my-report
          path: report.xlsx
          # Do NOT set archive: false for binary files with uncommon extensions.
          # Default (archive: true) zips the file and bypasses MIME type validation.
  - language: yaml
    label: 'Rename file to a recognized extension before using archive:false'
    code: |
      - name: Rename binary file to recognized extension
        run: cp report.xlsx report.xlsx.dat

      - uses: actions/upload-artifact@v7
        with:
          name: my-report
          path: report.xlsx.dat
          archive: false
prevention:
  - 'Avoid archive: false for file types with uncommon or binary extensions (.xlsx, .7z, .parquet, .bin, etc.) — use the default archive: true instead'
  - 'Use archive: false only for file types with well-known MIME mappings (e.g., .txt, .json, .png, .pdf) where the @actions/artifact package can resolve the MIME type'
  - 'Test upload steps with archive: false in a draft PR or staging workflow before relying on them in production'
  - 'Check the @actions/artifact changelog for MIME type table expansions that may add support for your specific file type in future versions'
docs:
  - url: 'https://github.com/actions/toolkit/issues/2324'
    label: 'actions/toolkit #2324: CreateArtifact returns 400 mime_type error for some file types with archive:false'
  - url: 'https://github.com/actions/upload-artifact'
    label: 'actions/upload-artifact v7 — archive input documentation'
