    label: 'actions/upload-artifact#740 — [bug] V4 - Upload progress stalled. (Nov 2025)'
  - url: 'https://github.com/actions/upload-artifact/issues/527'
    label: 'actions/upload-artifact#527 — [bug] v4 hangs uploading from mac runners (16 reactions, 2024-2026)'
