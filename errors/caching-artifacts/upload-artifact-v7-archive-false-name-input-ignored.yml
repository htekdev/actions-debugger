id: caching-artifacts-096
title: 'upload-artifact@v7 archive:false ignores name input and uses filename as artifact name'
category: caching-artifacts
severity: error
tags:
  - upload-artifact
  - v7
  - archive
  - artifact-name
  - non-zipped
  - naming
patterns:
  - regex: 'no artifact.*found.*name|Unable to find.*artifact.*named'
    flags: 'i'
  - regex: 'artifact.*not.*found.*download.*name'
    flags: 'i'
error_messages:
  - "Unable to find any artifacts for the associated workflow"
  - "no artifacts found for the associated workflow and the artifact name provided"
root_cause: |
  actions/upload-artifact@v7 introduced the archive: false input (February 2026, GitHub Changelog
  2026-02-26) to support non-zipped single-file artifact uploads. When archive: false is used, the
  action ignores the name: input entirely and registers the artifact using the uploaded file's
  filename (including extension) as the artifact name in the artifact service instead.

  For example, uploading a file named report.html with name: my-report and archive: false registers
  the artifact as "report.html", not "my-report". Downstream jobs that call actions/download-artifact
  with name: my-report fail because no artifact with that name exists.

  The step exits 0 and shows no upload error — the artifact does appear in the GitHub Actions UI,
  but under the filename, not the intended name. The failure surfaces only in the downstream
  download step, far from the actual cause.

  This behavior was reported in actions/upload-artifact#785 (March 2026) and is tied to how the
  non-archive upload path handles artifact metadata registration. The archive: true (default) path
  correctly honors the name: input.
fix: |
  Option 1: Rename the file to match the intended artifact name before the upload step so that
  the filename becomes the artifact name downstream consumers expect.

  Option 2: Remove archive: false and use the default archive: true behavior, which honors the
  name: input and supports multiple-file uploads. The artifact is delivered as a zip.

  Option 3: Pin upload-artifact@v7 to a patched release once the bug is fixed upstream
  (track actions/upload-artifact#785 for status).
fix_code:
  - language: yaml
    label: 'Option 1 — rename file to match intended artifact name before upload'
    code: |
      - name: Rename output to intended artifact name
        run: mv report.html my-report.html

      - name: Upload non-zipped artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-report.html    # Must match the actual filename when archive: false
          path: my-report.html
          archive: false

      # Downstream job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-report.html   # Uses filename — matches what was registered
  - language: yaml
    label: 'Option 2 — use default archive: true (honors name: input)'
    code: |
      - name: Upload artifact (default zip, honors name:)
        uses: actions/upload-artifact@v7
        with:
          name: my-report          # name: input honored correctly
          path: report.html
          # archive: true is the default — remove archive: false

      # Downstream job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-report          # Works correctly
prevention:
  - 'Test upload/download artifact name round-trips in a staging workflow before using archive: false in production pipelines.'
  - 'Set name: to match the exact filename (including extension) when using archive: false until the bug is patched.'
  - 'Add a step after upload that asserts the artifact exists by name before downstream jobs try to consume it.'
  - 'Track actions/upload-artifact#785 for a patch release and update the pinned version when available.'
docs:
  - url: 'https://github.com/actions/upload-artifact/issues/785'
    label: 'actions/upload-artifact#785: archive:false ignores name input (open March 2026)'
  - url: 'https://github.blog/changelog/2026-02-26-github-actions-now-supports-uploading-and-downloading-non-zipped-artifacts'
    label: 'GitHub Changelog 2026-02-26: Non-zipped artifact support announcement'
  - url: 'https://github.com/actions/upload-artifact/releases/tag/v7.0.0'
    label: 'actions/upload-artifact v7.0.0 release notes — archive input introduction'
