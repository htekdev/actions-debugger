id: caching-artifacts-089
title: "download-artifact@v4 run-id Silently Ignored Without github-token"
category: caching-artifacts
severity: silent-failure
tags:
  - download-artifact
  - run-id
  - github-token
  - cross-run
  - artifact-v4
  - silent
patterns:
  - regex: 'download-artifact@v4'
    flags: 'i'
  - regex: 'run-id:\s*\$\{\{[^}]+\}\}'
    flags: 'i'
  - regex: 'No artifacts found'
    flags: 'i'
error_messages:
  - "No artifacts found that match the supplied name and run-id"
  - "Unable to download artifact(s)"
root_cause: |
  In `actions/download-artifact@v4`, the `run-id` input only takes effect when
  `github-token` is also provided. Without an explicit token, the action falls back
  to downloading artifacts from the **current workflow run**, silently ignoring the
  specified `run-id`.

  This is a breaking behaviour change from v3, where `run-id` resolved cross-run
  artifacts using the built-in runner credentials. In v4, cross-run or cross-workflow
  downloads require the caller to explicitly pass a token with `actions:read` scope.

  Common failure scenarios:
  - A deployment workflow downloads an artifact built by a previous CI run by
    `run-id` — without the token the action downloads the (non-existent) artifact
    from the current deployment run, producing "No artifacts found."
  - A matrix fan-out build uploads per-OS artifacts; a summariser job downloads by
    an explicit `run-id` pointing to a sibling run — the token is omitted so the
    download silently reads from the same run, returning stale or unexpected files.
fix: |
  Always pass `github-token` when specifying `run-id` for a different workflow run
  or repository. Use `github.token` for same-repo cross-run downloads (GITHUB_TOKEN
  has `actions:read` on its own repo). Use a PAT or GitHub App token with
  `actions:read` for cross-repository downloads.
fix_code:
  - language: yaml
    label: "Cross-run download — add github-token alongside run-id"
    code: |
      - name: Download artifact from previous CI run
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}   # Required for run-id to resolve
  - language: yaml
    label: "Cross-repository download — use a PAT with actions:read"
    code: |
      - name: Download artifact from other repo
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}  # PAT: actions:read
          repository: org/other-repo
          run-id: ${{ vars.OTHER_REPO_RUN_ID }}
prevention:
  - "Treat `github-token` as mandatory whenever `run-id` references a run other than the current one."
  - "Add a CI lint step that flags `run-id:` usage without an accompanying `github-token:` in the same step."
  - "If migrating from `download-artifact@v3`, audit every step that used `run-id` — the implicit credential is gone in v4."
docs:
  - url: "https://github.com/actions/download-artifact/blob/main/README.md#download-artifacts-from-other-workflow-runs-or-repositories"
    label: "download-artifact README — cross-run and cross-repo downloads"
  - url: "https://github.com/actions/download-artifact/issues/295"
    label: "actions/download-artifact#295 — run-id without github-token downloads wrong artifacts"
