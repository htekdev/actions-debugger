id: caching-artifacts-127
title: "upload-pages-artifact@v5 + deploy-pages@v5 Incompatible -- Immutable Artifact Format Not Consumed by deploy-pages"
category: caching-artifacts
severity: error
tags:
  - pages
  - deploy-pages
  - upload-pages-artifact
  - v5
  - upload-artifact-v7
  - immutable-artifacts
  - breaking-change
patterns:
  - regex: 'deploy-pages.*failed.*artifact|artifact.*not.*found.*deploy-pages'
    flags: 'i'
  - regex: 'No artifact.*github-pages|pages.*deployment.*failed.*artifact'
    flags: 'i'
  - regex: 'upload-pages-artifact.*v5.*deploy-pages.*v5'
    flags: 'i'
error_messages:
  - "Error: No artifact named 'github-pages' was found for the workflow run"
  - "Error: Failed to deploy to GitHub Pages: Artifact not found"
  - "deploy-pages: No artifacts found for deployment"
root_cause: |
  actions/upload-pages-artifact@v5 updated its internal dependency to use
  actions/upload-artifact@v7 (the new immutable-artifacts API). This is documented
  in the v5 release notes: "Update upload-artifact action to version 7".

  actions/upload-artifact@v7 creates artifacts using the new immutable artifacts
  storage API (the Results backend). These artifacts are NOT accessible via the old
  artifact API that actions/deploy-pages@v5 uses when downloading the github-pages
  artifact for deployment.

  actions/deploy-pages@v5 was released with only a Node.js 24 bump and minor
  maintenance changes -- it was NOT updated to consume artifacts from the new
  immutable artifacts API. As a result, upgrading both pages actions to v5 simultaneously
  leaves deploy-pages unable to locate the artifact uploaded by upload-pages-artifact.

  The symptom: the workflow succeeds through the upload step but fails at deployment
  with "No artifact found" or "Artifact not found", because deploy-pages is looking
  in the old artifact storage location.
fix: |
  Option A (recommended): Downgrade upload-pages-artifact back to v4 while keeping
  deploy-pages@v5:

    - uses: actions/upload-pages-artifact@v4   # v4 uses upload-artifact@v4 (old API)
    - uses: actions/deploy-pages@v5

  This pairs the old-API artifact producer with the current deployer until deploy-pages
  is updated to support the new format.

  Option B: Keep both at v4:

    - uses: actions/upload-pages-artifact@v4
    - uses: actions/deploy-pages@v4

  Option C: Watch actions/deploy-pages releases for a version that aligns with
  upload-artifact@v7 / immutable artifacts. Once released, upgrade both simultaneously.
fix_code:
  - language: yaml
    label: "Downgrade upload-pages-artifact to v4 (pairs with deploy-pages@v5)"
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          permissions:
            pages: write
            id-token: write
          steps:
            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v4    # pin to v4
              with:
                path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5             # v5 works with v4 upload
  - language: yaml
    label: "Pin both pages actions to v4 (fully stable combination)"
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          permissions:
            pages: write
            id-token: write
          steps:
            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                path: ./dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
prevention:
  - "When upgrading GitHub Pages actions, check the release notes of both upload-pages-artifact AND deploy-pages for API compatibility before upgrading both simultaneously"
  - "Test a Pages deployment in a branch workflow before merging the version bump"
  - "Pin both actions to the same major version family -- v3/v4 pair or v5/v5+ once deploy-pages ships the matching update"
docs:
  - url: "https://github.com/actions/upload-pages-artifact/releases"
    label: "actions/upload-pages-artifact releases"
  - url: "https://github.com/actions/deploy-pages/releases"
    label: "actions/deploy-pages releases"
  - url: "https://github.com/Azure/awesome-azd/pull/883/files"
    label: "Real-world fix: revert upload-pages-artifact + deploy-pages from v5 to v4 (Azure/awesome-azd)"
  - url: "https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages"
    label: "GitHub Docs -- Using custom workflows with GitHub Pages"
