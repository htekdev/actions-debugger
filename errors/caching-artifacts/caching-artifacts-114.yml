id: caching-artifacts-114
title: "setup-node@v5 Auto-Caches pnpm/yarn When packageManager Is Declared — Path Validation Error When Install Is Skipped"
category: caching-artifacts
severity: error
tags:
  - setup-node
  - caching
  - path-validation
  - pnpm
  - yarn
  - v5
  - package-manager-cache
patterns:
  - regex: 'Path Validation Error: Path\(s\) specified in the action for caching do\(es\) not exist'
    flags: 'i'
  - regex: 'hence no cache is being saved'
    flags: 'i'
error_messages:
  - "Error: Path Validation Error: Path(s) specified in the action for caching do(es) not exist, hence no cache is being saved."
root_cause: |
  `actions/setup-node@v5` introduced automatic caching that activates whenever a
  `packageManager` field is present in `package.json` — even if no `cache:` input is
  set in the workflow. When the setup-node post-run step executes at the end of the
  job, it attempts to save the package manager's global cache directory. If the job
  did not run the install command (e.g., `npm ci`, `pnpm install`, `yarn install`),
  the cache paths do not exist and the action throws a hard error:

    Error: Path Validation Error: Path(s) specified in the action for caching
    do(es) not exist, hence no cache is being saved.

  This error **fails the job**, even though no install was needed and no caching was
  requested explicitly. It is a common surprise for workflows that only read the
  repository (linting, type-checking, docs generation) without installing dependencies.

  **Scope**: pnpm and yarn are most affected. npm auto-caching was limited to jobs
  that explicitly set `cache: npm`; pnpm/yarn triggered automatically from
  `packageManager` alone.

  **Fixed in setup-node@v6** (Oct 2025, PR #1374): auto-caching is now limited to
  npm only; pnpm and yarn require an explicit `cache: pnpm` or `cache: yarn` input.
  Upgrading to v6 is the definitive fix.

  Source: actions/setup-node#1363 (Sep 2025, 5 reactions); actions/toolkit#2128.
fix: |
  **Option 1 (recommended):** Upgrade to `actions/setup-node@v6` or later. Auto-caching
  for pnpm/yarn was removed; only npm auto-caches, and even then only when the `cache:`
  input is explicitly set.

  **Option 2 (v5 workaround):** Disable caching explicitly with `package-manager-cache: false`
  for jobs that don't run install.

  **Option 3 (v5 workaround):** Ensure the install step runs before the post-run cache
  step (i.e., always run `pnpm install` or `yarn install` in the job).
fix_code:
  - language: yaml
    label: "Broken — setup-node@v5 with pnpm packageManager, no install step"
    code: |
      # ❌ BROKEN: package.json declares packageManager: pnpm@x.y.z
      # setup-node@v5 auto-enables pnpm caching, post-run fails because pnpm store doesn't exist

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          # No cache: input — but v5 auto-enables caching for pnpm from package.json

      - name: Type check only (no install)
        run: npx tsc --noEmit   # fails: post-run cache step errors out
  - language: yaml
    label: "Fixed (recommended) — upgrade to setup-node@v6"
    code: |
      # ✅ FIXED: setup-node@v6 does not auto-cache pnpm/yarn
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          # No cache: input = no caching attempt = no path validation error

      - name: Type check only (no install)
        run: npx tsc --noEmit
  - language: yaml
    label: "Fixed (v5 workaround) — disable auto-caching explicitly"
    code: |
      # ✅ FIXED (v5): explicitly disable package manager caching for jobs that skip install
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false   # disables pnpm/yarn auto-cache

      - name: Type check only (no install)
        run: npx tsc --noEmit
prevention:
  - "Prefer `actions/setup-node@v6` for new workflows — auto-caching behavior is more conservative."
  - "In any job that does not run `npm ci` / `pnpm install` / `yarn install`, set `package-manager-cache: false` when using setup-node@v5."
  - "When upgrading setup-node from v4 to v5, audit all jobs that skip install — they may start failing in the post-run step."
  - "Add explicit `cache: pnpm` or `cache: yarn` only in jobs that run the install command."
docs:
  - url: "https://github.com/actions/setup-node/issues/1363"
    label: "actions/setup-node#1363 — v5 fails with Path Validation Error in Post Run steps"
  - url: "https://github.com/actions/toolkit/issues/2128"
    label: "actions/toolkit#2128 — change path validation error to warning"
  - url: "https://github.com/actions/setup-node/pull/1374"
    label: "setup-node PR#1374 — Limit automatic caching to npm (released in v6)"
  - url: "https://github.com/actions/setup-node/releases/tag/v6.0.0"
    label: "setup-node v6.0.0 release notes"
  - url: "https://github.com/actions/setup-node?tab=readme-ov-file#caching-global-packages-data"
    label: "setup-node docs — caching global packages data"
