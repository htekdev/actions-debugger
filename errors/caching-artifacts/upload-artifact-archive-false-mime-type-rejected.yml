id: ca-155
title: "upload-artifact v7 archive:false fails with 'mime_type a valid mime_type is required' for certain file types"
category: caching-artifacts
severity: error
tags:
  - upload-artifact
  - archive-false
  - mime-type
  - xlsx
  - markdown
  - 400-bad-request
patterns:
  - regex: 'mime_type a valid mime_type is required for this artifact version'
    flags: "i"
  - regex: 'Failed to CreateArtifact.*400.*Bad Request.*mime_type'
    flags: "i"
  - regex: 'Received non-retryable error.*Failed request.*400.*mime_type'
    flags: "i"
error_messages:
  - "Error: Failed to CreateArtifact: Received non-retryable error: Failed request: (400) Bad Request: mime_type a valid mime_type is required for this artifact version"
root_cause: |
  actions/upload-artifact v7 introduced `archive: false` mode, which uploads individual files
  directly to the GitHub Artifacts backend API (Blob Storage) without first zipping them into
  an archive. In this mode the action sends each file's MIME type as part of the CreateArtifact
  API request. The backend enforces an allowlist of accepted MIME types. File extensions that
  map to MIME types outside the allowlist are rejected with a 400 Bad Request.

  Commonly affected file types include:
  - `.xlsx` → `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
  - `.md` → `text/markdown`
  - `.7z` → `application/x-7z-compressed`

  The default behavior (`archive: true`, the default) wraps everything in a zip archive and does
  not send individual MIME types, so it is unaffected. Only workflows that explicitly set
  `archive: false` are impacted.
fix: |
  Remove `archive: false` from the upload-artifact step to use the default zip archiving mode,
  which does not send individual file MIME types and avoids the backend restriction.

  If individual file upload is required:
  - Rename offending files to use an extension with an accepted MIME type before uploading,
    then rename back after downloading.
  - Watch actions/upload-artifact issues for a fix to the MIME type allowlist.
fix_code:
  - language: yaml
    label: "Fix: remove archive: false (use default zip mode)"
    code: |
      # Remove archive: false — the default (zip) mode does not trigger mime_type validation
      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: output/

  - language: yaml
    label: "Workaround: rename file before upload if archive: false is required"
    code: |
      # Rename xlsx to zip before upload to bypass MIME type rejection
      - name: Rename for upload
        run: mv report.xlsx report.xlsx.zip

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: report.xlsx.zip
          archive: false

      - name: Restore name after download (in consumer job)
        run: mv report.xlsx.zip report.xlsx
prevention:
  - "Avoid `archive: false` unless individual file access (not zipped) is explicitly required — the default zip mode is more compatible."
  - "Test `archive: false` uploads in CI before relying on specific file extensions to detect MIME type restrictions early."
  - "Track the `archive: false` mode on actions/upload-artifact as it is newer and still stabilising — check release notes before upgrading to v7+."
docs:
  - url: "https://github.com/actions/upload-artifact/issues/765"
    label: "GitHub issue: Uploading xlsx file with archive:false fails"
  - url: "https://github.com/actions/upload-artifact/issues/771"
    label: "GitHub issue: archive:false corrupts non-ASCII filenames"
  - url: "https://github.com/actions/upload-artifact"
    label: "actions/upload-artifact README"
