id: triggers-102
title: "GHES Reusable Workflow 'workflow was not found' — Public Repo Cannot Call Shared Workflow (Must Be Internal)"
category: triggers
severity: error
tags:
  - reusable-workflow
  - ghes
  - github-enterprise-server
  - visibility
  - internal
  - public
  - workflow-not-found
patterns:
  - regex: 'workflow was not found'
    flags: 'i'
  - regex: 'error parsing called workflow.*workflow was not found'
    flags: 'i'
  - regex: 'uses:.*\.github/workflows/.*workflow was not found'
    flags: 'i'
error_messages:
  - "error parsing called workflow \".github/workflows/caller.yml\" -> \"org/shared-workflows/.github/workflows/lint.yml@main\": workflow was not found."
  - "Invalid workflow file: .github/workflows/caller.yml#L8 error parsing called workflow ... workflow was not found."
root_cause: |
  GitHub Enterprise Server (GHES) and GitHub.com enforce repository visibility
  rules when resolving reusable workflows. A repository with **public**
  visibility cannot call a reusable workflow hosted in an **internal**
  repository (or vice versa in certain configurations).

  GHES has three repository visibility levels:
  - **private** — accessible only to collaborators with explicit access
  - **internal** — accessible to all org/enterprise members (similar to
    GitHub.com internal repos)
  - **public** — accessible to everyone including unauthenticated users

  The constraint: a **public** repository cannot consume reusable workflows
  from **internal** or **private** shared-workflow repositories. This is
  because the ACTIONS_ID_TOKEN and workflow resolution scope differs across
  visibility levels. The error message `workflow was not found` is deliberately
  vague — it does not say "access denied", making it hard to diagnose.

  The fix is to change the **calling** (or **called**) repository's visibility
  from public to internal, so both sides share the same visibility tier.

  This is distinct from the "workflow was not found" error caused by a wrong
  file path, ref, or typo in `uses:`.
fix: |
  Change the visibility of the shared-workflow repository from **public** to
  **internal** on GitHub Enterprise Server or GitHub.com:

  **Repository Settings → General → Danger Zone → Change visibility → Internal**

  If both repos need to remain public, the only alternative is to make the
  shared workflow publicly accessible (i.e., the called workflow is in a public
  repo, AND the org allows cross-repo reusable workflow access for public repos).

  On GitHub.com: calling an internal repo's reusable workflow from a public
  repo in the same org will fail for the same reason. Make both repos internal.
fix_code:
  - language: yaml
    label: 'Caller workflow (no change needed — fix is in repo visibility settings)'
    code: |
      # .github/workflows/ci.yml (caller — in a public repo)
      # This will fail if shared-workflows repo is public but has different
      # enterprise visibility rules applied.
      name: CI
      on: [push]
      jobs:
        lint:
          uses: my-org/shared-workflows/.github/workflows/lint.yml@main
          # Fix: change shared-workflows repo visibility to 'internal'
          # via Settings > General > Danger Zone > Change visibility > Internal
  - language: yaml
    label: 'Checklist: verify repo visibility matches between caller and callee'
    code: |
      # Verify visibility via gh CLI:
      #   gh repo view my-org/shared-workflows --json visibility
      # Expected output: {"visibility":"INTERNAL"}
      #
      # If output is {"visibility":"PUBLIC"} and the caller is also PUBLIC
      # but the error still appears, check GHES enterprise policy:
      # Enterprise Settings > Policies > Actions > Access > Allow reusable workflows
prevention:
  - 'Use `internal` visibility for all shared-workflow repositories in an
    enterprise or org — it ensures consistent access for all org members while
    preventing external access.'
  - 'When creating a new shared-workflow repo, set visibility to `internal` at
    creation time to avoid this issue entirely.'
  - 'Document the required visibility in your team''s CI/CD runbook so engineers
    know to check repo visibility when "workflow was not found" errors appear.'
  - 'Add a repository topic tag like `ghes-internal-required` on shared-workflow
    repos as a visible reminder of the visibility requirement.'
docs:
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#access-to-reusable-workflows'
    label: 'Reusing workflows — Access to reusable workflows — GitHub Docs'
  - url: 'https://docs.github.com/en/enterprise-server@latest/repositories/managing-your-repositorys-settings-and-features/managing-repository-settings/setting-repository-visibility'
    label: 'Setting repository visibility — GitHub Enterprise Server Docs'
  - url: 'https://stackoverflow.com/questions/79055798/why-i-get-workflow-was-not-found-for-a-shared-workflow-at-my-github-enterprise'
    label: 'Stack Overflow: workflow was not found for shared workflow on GitHub Enterprise'
