id: triggers-090
title: 'on.issue_comment fires on both issue comments AND pull request comments — no built-in PR-only type filter'
category: triggers
severity: silent-failure
tags:
  - issue-comment
  - pull-request
  - issue
  - trigger-filter
  - unexpected-run
  - if-condition
patterns:
  - regex: 'issue_comment.*trigger.*issue.*not.*pr|issue_comment.*also.*fires.*pull.request'
    flags: 'i'
  - regex: 'comment.*trigger.*run.*issue.*not.*pr|workflow.*runs.*issue.*comment.*but.*not.*pr'
    flags: 'i'
error_messages:
  - 'Workflow triggered by a comment on a plain issue, not a pull request'
  - 'issue_comment event fires even though only PR comments should trigger this workflow'
root_cause: |
  The on.issue_comment event fires whenever a comment is created, edited, or deleted on
  ANY issue OR pull request in the repository. GitHub's API models pull requests as a
  special kind of issue — every PR has an associated issue number and comments on PRs
  appear in the issue_comment webhook payload.

  There is no activity type (like "pull_request_only") to restrict the trigger to PR
  comments only. When developers add on.issue_comment expecting only PR comment-driven
  automation (e.g., a /deploy command bot, a review reminder, a labeler), the workflow
  also runs on every plain issue comment — including automated bot comments, dependency
  update notes, and support questions.

  The distinction between issue and PR comment must be made inside the workflow using
  an if: condition that checks github.event.issue.pull_request. This field is present
  (non-null) when the comment is on a PR, and absent (null/undefined) when the comment
  is on a plain issue.

  Conversely, workflows that intend to trigger on plain issue comments only will also
  run for every PR comment unless explicitly filtered.
fix: |
  Add an if: condition to each job (or the trigger step) to filter by comment context.

  To trigger ONLY for pull request comments:
    if: github.event.issue.pull_request

  To trigger ONLY for plain issue comments (not PRs):
    if: '!github.event.issue.pull_request'

  For PR-comment bots that also need the PR number and HEAD ref, use pull_request_target
  instead of issue_comment when the workflow needs write access, because issue_comment
  from a fork PR still runs in the context of the BASE repository.
fix_code:
  - language: yaml
    label: 'Restrict issue_comment trigger to pull request comments only'
    code: |
      on:
        issue_comment:
          types: [created]

      jobs:
        slash-command:
          # Only run for PR comments, not plain issue comments
          if: github.event.issue.pull_request
          runs-on: ubuntu-latest
          steps:
            - name: Handle /deploy command
              run: echo "PR number is ${{ github.event.issue.number }}"
  - language: yaml
    label: 'Restrict issue_comment trigger to plain issue comments only'
    code: |
      on:
        issue_comment:
          types: [created]

      jobs:
        issue-bot:
          # Only run for plain issue comments, skip PR comments
          if: '!github.event.issue.pull_request'
          runs-on: ubuntu-latest
          steps:
            - name: Handle issue triage comment
              run: echo "Issue ${{ github.event.issue.number }} received a comment"
  - language: yaml
    label: 'Alternative — use pull_request_review_comment for PR inline review comments'
    code: |
      # Note: issue_comment only fires for TOP-LEVEL PR comments (the comment box),
      # NOT for inline code review thread comments. Use pull_request_review_comment
      # for review thread replies.
      on:
        pull_request_review_comment:
          types: [created]
      jobs:
        review-comment-bot:
          runs-on: ubuntu-latest
          steps:
            - run: echo "Review comment on line ${{ github.event.comment.line }}"
prevention:
  - 'Always add if: github.event.issue.pull_request when the workflow should only react to PR comments'
  - 'Add if: !github.event.issue.pull_request when the workflow should only react to issue comments'
  - 'Use pull_request_review_comment trigger (not issue_comment) for inline PR code review thread replies'
  - 'Audit issue_comment workflows that use on.issue_comment without an if: context filter — they run for all comments'
docs:
  - url: 'https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#issue_comment'
    label: 'GitHub Docs: issue_comment event — fires for issues and pull requests'
  - url: 'https://docs.github.com/en/webhooks/webhook-events-and-payloads#issue_comment'
    label: 'GitHub Webhooks: issue_comment payload — pull_request field'
  - url: 'https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_review_comment'
    label: 'GitHub Docs: pull_request_review_comment event for inline review replies'
