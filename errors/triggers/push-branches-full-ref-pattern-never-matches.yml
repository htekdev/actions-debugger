id: triggers-095
title: 'on.push.branches Filter With refs/heads/ Prefix Silently Never Matches'
category: triggers
severity: silent-failure
tags:
  - push
  - branches-filter
  - glob-pattern
  - refs-heads
  - never-triggers
patterns:
  - regex: 'branches:\s*\n\s+-\s+[''"]?refs/heads/'
    flags: 'm'
  - regex: 'refs/heads/[a-zA-Z0-9/_-]+\s*[''"]?\s*$'
    flags: 'm'
error_messages:
  - "(workflow never appears in Actions tab despite push to exact matching branch)"
  - "(no runs created; push event fired but branch filter blocked every push)"
root_cause: |
  The `on.push.branches` (and `on.pull_request.branches`) filter matches against the
  **short branch name** — for example `main` or `feature/login` — NOT against the full
  Git ref format `refs/heads/main`.

  Developers coming from Jenkins, CircleCI, or GitLab CI/CD often write full ref paths in
  branch filters because those systems require them. In GitHub Actions the `branches:`
  array uses glob-style patterns matched against the short name only. Listing
  `refs/heads/main` as a pattern creates a literal glob that tries to match against
  `main` — and since the string `refs/heads/main` never equals `main`, the workflow
  silently never triggers.

  This failure is completely invisible: no error is surfaced, the workflow does not appear
  in the Actions tab, and no check run is created on the commit. Developers often blame
  other parts of the workflow (permissions, paths filters, default branch settings) before
  discovering the branch pattern format is wrong.

  The same misunderstanding also affects `branches-ignore:`, `tags:`, and `tags-ignore:`
  filters — all of which match against the short name, not the full ref.
fix: |
  Remove the `refs/heads/` prefix (and `refs/tags/` for tag filters). Use only the short
  branch or tag name in the pattern array.

  The `branches:` filter supports standard glob syntax: `*` (any chars except `/`),
  `**` (any chars including `/`), `?` (single char), `[...]` (character class), and `!`
  prefix for negation. You never need the `refs/heads/` prefix.
fix_code:
  - language: yaml
    label: 'Wrong: full ref path in branches filter — silently never triggers'
    code: |
      on:
        push:
          branches:
            - refs/heads/main          # WRONG — never matches
            - refs/heads/release/**    # WRONG — never matches
  - language: yaml
    label: 'Correct: short branch name pattern'
    code: |
      on:
        push:
          branches:
            - main                     # matches the main branch
            - 'release/**'             # matches release/1.0, release/2.x, etc.
  - language: yaml
    label: 'Correct: using wildcards for common patterns'
    code: |
      on:
        push:
          branches:
            - main
            - develop
            - 'feature/**'
            - 'hotfix/**'
        pull_request:
          branches:
            - main                     # PR targeting main (base branch, not head)
prevention:
  - "Never include the refs/heads/ or refs/tags/ prefix in branches:/tags: filters."
  - "After adding a branch filter, verify by pushing to the target branch and confirming the workflow appears in the Actions tab."
  - "Use actionlint locally — it validates branch glob patterns and warns on suspicious formats."
  - "Remember that on.pull_request.branches matches the BASE (target) branch, not the head branch of the PR."
  - "For tags, use the tags: filter with short tag names like 'v*' not 'refs/tags/v*'."
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushbranchestagsbranches-ignoretags-ignore'
    label: 'GitHub Docs: on.push branches and tags filter syntax'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet'
    label: 'GitHub Docs: Filter pattern cheat sheet'
