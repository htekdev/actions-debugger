id: tr-111
title: 'on: push with both paths: and paths-ignore: for the same event — paths-ignore: is silently ignored'
category: triggers
severity: silent-failure
tags:
  - paths-filter
  - paths-ignore
  - push
  - pull_request
  - silent-failure
  - never-triggers
  - workflow-not-triggering
patterns:
  - regex: 'paths:\s*\n[\s\S]*?paths-ignore:'
    flags: 'im'
  - regex: 'paths-ignore:[\s\S]*?paths:'
    flags: 'im'
error_messages:
  - '(workflow triggers on paths that should have been excluded — paths-ignore: has no effect when paths: is also defined)'
  - '(workflow triggers unexpectedly on excluded paths)'
root_cause: |
  GitHub Actions does not support specifying both `paths:` and `paths-ignore:` for the same
  event in a single workflow. The official documentation states:

  > "You cannot use both `paths` and `paths-ignore` for the same event in a workflow."

  When both keys are present for the same event (e.g., `on.push`), GitHub evaluates ONLY
  the `paths:` filter and **silently discards** the `paths-ignore:` block. No warning is
  emitted in the workflow run logs, the Actions tab, or the workflow validation step.

  This means the exclusion patterns developers intended to use for `paths-ignore:` are
  never applied — the workflow triggers for all paths matched by `paths:`, including those
  the developer believed were excluded.

  Common mistake:
  ```yaml
  on:
    push:
      paths:
        - 'src/**'
      paths-ignore:        # IGNORED — paths: takes precedence
        - 'src/**/*.md'
        - 'src/generated/**'
  ```
  Developer intent: "Run CI on src/ changes but not markdown or generated files."
  Actual behaviour: Runs on ALL src/ changes, including markdown and generated files.

  The correct approach is to use `paths:` with `!` negation patterns to achieve combined
  include/exclude matching, OR use `paths-ignore:` alone when only exclusion is needed.

  Note: This restriction applies equally to `branches` and `branches-ignore`, and to
  `tags` and `tags-ignore` — only one of each pair may be used per event.
fix: |
  Replace the `paths:` + `paths-ignore:` combination with a single `paths:` block that
  uses `!` negation prefixes for exclusions, or use only `paths-ignore:` if no positive
  include filter is needed.
fix_code:
  - language: yaml
    label: 'Replace paths-ignore: with ! negation inside paths:'
    code: |
      # WRONG — paths-ignore: is silently ignored when paths: is present
      # on:
      #   push:
      #     paths:
      #       - 'src/**'
      #     paths-ignore:
      #       - 'src/**/*.md'
      #       - 'src/generated/**'

      # CORRECT — use ! negation inside paths: for combined include/exclude
      on:
        push:
          paths:
            - 'src/**'
            - '!src/**/*.md'
            - '!src/generated/**'
  - language: yaml
    label: 'Use paths-ignore: alone when excluding without a positive filter'
    code: |
      # If you want "everything EXCEPT docs and generated files":
      on:
        push:
          paths-ignore:
            - 'docs/**'
            - 'src/generated/**'
            - '**/*.md'
  - language: yaml
    label: 'Same restriction applies to branches and tags filters'
    code: |
      # WRONG — branches-ignore: ignored when branches: is present
      # on:
      #   push:
      #     branches:
      #       - 'main'
      #     branches-ignore:
      #       - 'main-deprecated'

      # CORRECT — use ! negation
      on:
        push:
          branches:
            - 'main'
            - '!main-deprecated'
prevention:
  - 'Never specify both `paths:` and `paths-ignore:` for the same event — use `paths:` with `!` negation instead.'
  - 'Run `actionlint` in CI — it warns about combining `paths` and `paths-ignore` on the same event.'
  - 'Review this rule for all four filter pairs: `branches`/`branches-ignore`, `paths`/`paths-ignore`, `tags`/`tags-ignore`.'
  - 'When migrating from `paths-ignore:` to combined include/exclude, convert exclusions to `!`-prefixed entries in `paths:`.'
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore'
    label: 'GitHub Docs: paths and paths-ignore filter syntax'
  - url: 'https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#using-filters-to-target-specific-paths-for-pull-request-or-push-events'
    label: 'GitHub Docs: Using filters to target specific paths'
  - url: 'https://rhysd.github.io/actionlint/'
    label: 'actionlint: static checker for GitHub Actions workflow files'
