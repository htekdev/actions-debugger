id: tr-115
title: 'push/pull_request paths and branches filters require both to match (AND logic, not OR)'
category: triggers
severity: silent-failure
tags:
  - paths
  - branches
  - and-logic
  - trigger-filter
  - workflow-not-running
  - push
  - pull_request
patterns:
  - regex: 'push.*paths.*branches|branches.*paths.*and.*logic'
    flags: 'i'
error_messages:
  - '# no error message — workflow silently does not trigger when only one filter matches'
root_cause: |
  When a workflow uses both a `branches` (or `branches-ignore`) filter AND a `paths`
  (or `paths-ignore`) filter on the same event, GitHub Actions applies AND logic:
  BOTH filters must be satisfied simultaneously for the workflow to trigger.

  Developers commonly assume the filters use OR logic — that if the changed files
  match the `paths` filter the workflow fires regardless of the branch. This is
  incorrect. A push to `feature/my-thing` (not matching `branches: [main]`) that
  modifies `src/app.ts` (matching `paths: ['src/**']`) will NOT trigger the workflow.
  Both conditions must be true at once.

  There is no error message or warning when the workflow is filtered out — it simply
  does not appear in the workflow runs list, making the root cause very hard to debug.

  From the official docs: "If you use both the branches filter and the paths filter,
  the workflow will only run when both filters are satisfied."

  This also applies to:
  - `branches` + `paths-ignore`
  - `branches-ignore` + `paths`
  - `tags` + `paths`
fix: |
  Option 1 — Widen the branches filter to include all branches where you want the
  paths filter to apply.

  Option 2 — Remove the branches filter entirely and use a job-level `if:` condition
  to gate execution based on the branch name. This gives OR logic: the workflow
  triggers on any branch matching the paths filter, and then the if: condition
  controls whether jobs actually run.

  Option 3 — Use two separate workflow files: one for branch-specific triggers, one
  for path-specific triggers.
fix_code:
  - language: yaml
    label: 'Original: paths + branches silently blocks trigger on non-main branches'
    code: |
      # PROBLEM: only triggers when BOTH paths AND branches match simultaneously
      on:
        push:
          branches: [main]
          paths: ['src/**']
  - language: yaml
    label: 'Fix: use if: condition for OR-like behavior'
    code: |
      # Workflow triggers on any push touching src/**; job runs only on main or develop
      on:
        push:
          paths: ['src/**']
      jobs:
        build:
          if: >
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/develop'
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: npm test
  - language: yaml
    label: 'Fix: widen branches filter to cover all intended branches'
    code: |
      on:
        push:
          branches: [main, develop, 'feature/**', 'release/**']
          paths: ['src/**']
prevention:
  - 'Remember: combining paths and branches on the same event uses AND logic, not OR.'
  - 'If a workflow is not appearing in the Actions tab after a push, check whether ALL filters are satisfied simultaneously.'
  - 'For OR-like behavior across branches and paths, remove the branches filter and gate execution with a job-level if: condition.'
  - 'Use act (local runner) or a dry-run branch to verify trigger behavior before merging.'
docs:
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#using-filters'
    label: 'Using filters — GitHub Actions docs'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore'
    label: 'Workflow syntax: on.push.paths — GitHub Actions docs'
