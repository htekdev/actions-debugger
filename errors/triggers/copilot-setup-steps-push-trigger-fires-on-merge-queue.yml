id: triggers-105
title: "copilot-setup-steps push Trigger Fires on Every Merge Queue Addition via gh-readonly-queue/** Branches"
category: triggers
severity: warning
tags:
  - copilot-setup-steps
  - merge-queue
  - push-trigger
  - gh-readonly-queue
  - copilot-cloud-agent
  - unexpected-run
  - cost
patterns:
  - regex: 'push:.*paths.*copilot-setup-steps|copilot-setup-steps.*push.*paths'
    flags: 'i'
  - regex: 'gh-readonly-queue/.*copilot|copilot.*gh-readonly-queue'
    flags: 'i'
error_messages:
  - "copilot-setup-steps.yml triggered on gh-readonly-queue/* branch push"
  - "Workflow run triggered by merge_group push event on copilot-setup-steps"
root_cause: |
  The standard `copilot-setup-steps.yml` documentation example includes a `push` trigger
  scoped to the workflow file path. When a repository uses GitHub's merge queue, every PR
  added to the queue creates a temporary branch named `gh-readonly-queue/<base>/<sha>`.
  GitHub's push event fires for each of these temporary branches.

  If your `copilot-setup-steps.yml` uses:

    on:
      push:
        paths:
          - .github/workflows/copilot-setup-steps.yml

  The workflow will run on every merge queue addition — not just on direct pushes to main.
  On larger runner types (such as custom GitHub-hosted runners), each unnecessary run
  consumes minutes and increases costs proportionally to merge queue throughput.

  The root cause is that `push` with `paths:` alone does not filter by branch name, so
  it fires on all pushes including those to `gh-readonly-queue/**` temp branches.
fix: |
  Add branches-ignore: to exclude merge queue temporary branches from the push trigger.
  Use 'gh-readonly-queue/**' as the ignore pattern.

  Alternatively, switch to a more precise branch filter using 'branches:' + 'paths:'
  to scope the push trigger to only the main/default branch.
fix_code:
  - language: yaml
    label: 'Recommended — add branches-ignore for merge queue branches'
    code: |
      on:
        workflow_dispatch:
        push:
          branches-ignore:
            - 'gh-readonly-queue/**'   # skip merge queue temp branches
          paths:
            - .github/workflows/copilot-setup-steps.yml
        pull_request:
          branches:
            - main
          paths:
            - .github/workflows/copilot-setup-steps.yml
  - language: yaml
    label: 'Alternative — scope push trigger to main branch only'
    code: |
      on:
        workflow_dispatch:
        push:
          branches:
            - main
          paths:
            - .github/workflows/copilot-setup-steps.yml
        pull_request:
          branches:
            - main
          paths:
            - .github/workflows/copilot-setup-steps.yml
prevention:
  - "Always include branches-ignore: ['gh-readonly-queue/**'] in copilot-setup-steps.yml push triggers when using merge queues."
  - 'Use branches: [main] on the push trigger to limit validation runs to the default branch.'
  - 'Monitor Actions billing if using large/custom runner images — merge queue churn multiplies copilot-setup-steps runs.'
docs:
  - url: 'https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment'
    label: 'GitHub Docs — Customize the Copilot cloud agent environment'
  - url: 'https://github.com/github/docs/issues/43246'
    label: 'github/docs #43246 — Note for copilot-setup-steps.yml with merge queue'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#merge_group'
    label: 'GitHub Docs — merge_group trigger event'
