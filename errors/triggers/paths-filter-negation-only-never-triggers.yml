id: triggers-083
title: "paths: Filter With Only Negation Patterns (!...) Never Triggers"
category: triggers
severity: silent-failure
tags:
  - paths-filter
  - negation
  - push
  - pull_request
  - never-triggers
  - paths
patterns:
  - regex: 'paths:\s*\n(\s+-\s+''?!)'
    flags: 'm'
  - regex: '^\s+-\s+''?![^'']*''?\s*$'
    flags: 'm'
error_messages:
  - "(workflow never appears in Actions tab despite matching file changes)"
  - "(no runs created after push — paths filter has only negation entries)"
root_cause: |
  GitHub Actions `paths:` filter requires **at least one positive (non-`!`) pattern**.
  If every pattern in the list starts with `!`, the filter has no positive baseline —
  no file path can ever match, so the workflow **never triggers**.

  This contrasts with `paths-ignore:`, which is designed for pure exclusion. Using
  negation inside `paths:` is intended for "include X but exclude Y from X" scenarios,
  not for excluding everything without a positive anchor.

  From the GitHub docs (workflow syntax):
  > If you define a path with the `!` character, you must also define at least one
  > path without the `!` character. If you only want to exclude paths, use
  > `paths-ignore` instead.

  The failure is completely silent — the workflow simply never appears in the Actions
  tab when matching files change. No error is emitted in logs or the UI.

  Common mistake pattern:
  ```yaml
  on:
    push:
      paths:
        - '!docs/**'     # BUG: only negations — workflow never fires
        - '!*.md'
  ```
  Developer intent is "run on everything except docs and markdown" but the correct
  construct is `paths-ignore:`, not negation-only `paths:`.
fix: |
  Replace all-negation `paths:` with `paths-ignore:`, or prepend at least one
  positive pattern before any negation patterns.
fix_code:
  - language: yaml
    label: "Use paths-ignore: for pure exclusion (most common fix)"
    code: |
      # WRONG — only negations, workflow never fires
      # on:
      #   push:
      #     paths:
      #       - '!docs/**'
      #       - '!*.md'

      # CORRECT — use paths-ignore: for pure exclusion
      on:
        push:
          paths-ignore:
            - 'docs/**'
            - '*.md'
  - language: yaml
    label: "Mixed include/exclude — positive pattern must come first"
    code: |
      on:
        push:
          paths:
            - 'src/**'        # Positive anchor: only src/ changes trigger
            - '!src/**/*.md'  # Negative: exclude markdown inside src/
prevention:
  - "Use `paths-ignore:` when excluding paths — never a negation-only `paths:` list."
  - "Ensure the first entry in any `paths:` list is a positive (non-`!`) pattern."
  - "Run `actionlint` in CI — it warns about filter combinations that can never match."
  - "Test trigger filters with a dry-run push to a scratch branch before merging."
docs:
  - url: "https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore"
    label: "GitHub Docs — paths and paths-ignore filter syntax"
  - url: "https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#using-filters-to-target-specific-paths-for-pull-request-or-push-events"
    label: "GitHub Docs — Using filters to target specific paths"
