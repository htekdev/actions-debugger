id: yaml-syntax-104
title: 'VS Code GitHub Actions extension flags custom environment names as "Value X is not valid" — false positive'
category: yaml-syntax
severity: warning
tags:
  - vscode
  - vs-code
  - ide
  - extension
  - environment-name
  - false-positive
  - schema-validation
  - authoring-tool
patterns:
  - regex: "Value '.*' is not valid.*environment"
    flags: 'i'
  - regex: 'environment.*not valid.*vscode|vscode.*environment.*invalid'
    flags: 'i'
error_messages:
  - "Value 'Production' is not valid"
  - "Value 'staging' is not valid"
  - "The name of the environment used by the job."
root_cause: |
  The GitHub Actions VS Code extension (github/vscode-github-actions) validates
  workflow YAML files against a JSON schema. When using the environment: key in
  a job definition to reference a GitHub environment (deployment protection, secrets,
  variables), the extension shows a red error: "Value 'X' is not valid" for any
  environment name that is not pre-enumerated in the extension's schema.

  The schema validation runs locally in VS Code and has no access to the repository's
  actual GitHub environment configuration. Since GitHub environments are created and
  named in the repository settings (not in the YAML file), the extension cannot know
  which environment names are valid — it only knows about a hardcoded or fetched list.

  The error appears consistently for all valid environment names, including:
  - 'Production', 'Staging', 'Development'
  - Any custom environment name defined in repo/org settings
  - Dynamic environments using expressions: ${{ inputs.environment }}

  The workflow runs correctly on GitHub Actions itself — the error is purely a
  VS Code display issue. This is a known limitation of local schema validation
  without access to the live GitHub environment list.

  The VS Code extension team is aware of this; it is tracked in
  github/vscode-github-actions as a schema/validation issue (SO#79431270, 7 votes).

  Note: actionlint does NOT report this error — actionlint is aware of the
  environment key and validates it correctly without requiring a pre-defined list.
fix: |
  The workflow is correct and will run successfully on GitHub Actions.
  The VS Code validation error is a false positive.

  Workaround options:
  1. Ignore the red underline — the workflow will run correctly on GitHub Actions.
  2. Add a workspace setting to suppress GitHub Actions YAML validation warnings
     for environment names by using VS Code settings to disable schema validation.
  3. Use the GitHub web editor for workflows that use custom environments — the
     web editor uses server-side validation with access to actual environment names.
  4. Run actionlint locally (not the VS Code extension) which does not flag
     valid environment names as errors.
fix_code:
  - language: yaml
    label: 'Workflow that triggers false VS Code error but runs correctly on GitHub'
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          # VS Code extension may flag "Value 'Production' is not valid"
          # This is a false positive — the workflow runs correctly on GitHub Actions
          environment: Production
          steps:
            - run: echo "Deploying to Production"
  - language: yaml
    label: 'Suppress VS Code GitHub Actions validation in workspace settings'
    code: |
      # .vscode/settings.json — add to suppress specific YAML validation warnings
      {
        "yaml.validate": true,
        "github-actions.workflows.pinned.actions": [],
        "github-actions.remote.name": "origin"
      }
      # Note: suppress only if the schema validation cannot be configured per-field
prevention:
  - 'When VS Code flags environment names as invalid, verify the workflow runs correctly on GitHub Actions before changing it.'
  - 'Use actionlint (command-line tool) for authoritative GitHub Actions YAML validation — it does not flag valid environment names.'
  - 'File an issue on github/vscode-github-actions if the false positive is particularly disruptive in your development flow.'
  - 'The GitHub web editor validates against live environment data and shows accurate errors; use it for final validation.'
docs:
  - url: 'https://github.com/github/vscode-github-actions'
    label: 'GitHub Actions VS Code extension — github/vscode-github-actions'
  - url: 'https://stackoverflow.com/questions/79431270'
    label: 'SO#79431270 — GitHub Actions YAML showing invalid environment name error in VS Code (7 votes)'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idenvironment'
    label: 'GitHub Docs — jobs.<job_id>.environment'
  - url: 'https://rhysd.github.io/actionlint/'
    label: 'actionlint — static checker for GitHub Actions workflow files'
