id: ys-117
title: '`secrets: inherit` Combined with Explicit Secret Declarations in `on.workflow_call` Causes Validation Error'
category: yaml-syntax
severity: error
tags:
  - workflow_call
  - secrets
  - inherit
  - reusable-workflow
  - validation-error
  - yaml-syntax
patterns:
  - regex: 'secrets:\s*\n\s+inherit'
    flags: 'si'
  - regex: 'secrets:\s*inherit\s*\n\s+[a-zA-Z_]'
    flags: 'si'
  - regex: 'Unexpected value.*secrets|secrets.*inherit.*explicit'
    flags: 'i'
error_messages:
  - 'Unexpected value ''inherit'''
  - 'Unexpected value ''MY_SECRET'''
  - 'You cannot combine ''inherit'' with explicit secret declarations'
  - 'Invalid workflow file'
root_cause: |
  In a reusable workflow's `on.workflow_call` trigger, the `secrets:` block accepts
  either the keyword `inherit` OR a map of explicit secret declarations — not both.

  `secrets: inherit` is a shorthand that tells GitHub to pass ALL secrets from the
  caller's context to the reusable workflow automatically, without naming them.
  It is mutually exclusive with explicit secret declarations. Combining them causes
  a validation error when the workflow is parsed.

  Incorrect usage:
    on:
      workflow_call:
        secrets:
          inherit        # This is the mutually exclusive shorthand
          MY_SECRET:     # Cannot also declare individual secrets
            required: true

  The confusion arises because `jobs.<job_id>.secrets: inherit` (used in the CALLER)
  is different from `on.workflow_call.secrets: inherit` (used in the CALLED/reusable
  workflow). The `inherit` shorthand in the trigger definition is only valid as the
  SOLE content of the `secrets:` block. Additionally, the `inherit` form at the
  caller site (`jobs.<id>.uses: ./.github/workflows/reusable.yml / secrets: inherit`)
  is valid and distinct from the trigger definition.

  A related mistake is declaring `secrets: inherit` in the reusable workflow's
  `on.workflow_call` block but then referencing individual secret names via
  `${{ secrets.MY_SECRET }}` — this actually works fine and is the correct
  pattern. The error only occurs when you try to DECLARE individual secrets
  alongside `inherit` in the trigger definition.
fix: |
  Choose one of two approaches — do not mix them:

  Option 1 — Use `secrets: inherit` alone (no individual declarations):
  The reusable workflow receives all caller secrets automatically. Reference
  them by name with `${{ secrets.MY_SECRET }}` in steps — they are available
  without being declared.

  Option 2 — Declare individual secrets explicitly (no `inherit`):
  List each secret the workflow needs. The caller must explicitly pass them.

  If you need to document which secrets a workflow uses while also supporting
  `inherit`, use comments in the YAML instead of declarations.
fix_code:
  - language: yaml
    label: 'Incorrect: mixing inherit with explicit declarations'
    code: |
      # BAD: secrets: inherit cannot be combined with named secret declarations
      on:
        workflow_call:
          secrets:
            inherit
            MY_SECRET:
              required: true
            ANOTHER_SECRET:
              description: 'API key'
  - language: yaml
    label: 'Option A: use secrets: inherit alone — all caller secrets are passed through'
    code: |
      on:
        workflow_call:
          secrets:
            inherit
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - run: ./deploy.sh
              env:
                MY_SECRET: ${{ secrets.MY_SECRET }}        # Available even without explicit declaration
                ANOTHER_SECRET: ${{ secrets.ANOTHER_SECRET }}
  - language: yaml
    label: 'Option B: explicit secret declarations (no inherit) — caller must pass each secret'
    code: |
      on:
        workflow_call:
          secrets:
            MY_SECRET:
              required: true
            ANOTHER_SECRET:
              required: false
              description: 'Optional API key for extended features'
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - run: ./deploy.sh
              env:
                MY_SECRET: ${{ secrets.MY_SECRET }}
                ANOTHER_SECRET: ${{ secrets.ANOTHER_SECRET }}
  - language: yaml
    label: 'Caller side: how to use secrets: inherit when calling a reusable workflow'
    code: |
      # In the CALLER workflow (this is valid and separate from the above):
      jobs:
        call-reusable:
          uses: ./.github/workflows/reusable.yml
          secrets: inherit   # Passes ALL caller secrets to the reusable workflow
prevention:
  - 'Use `secrets: inherit` alone in `on.workflow_call` — never add named secret declarations in the same block'
  - 'Prefer `secrets: inherit` in internal/private repos for simplicity; use explicit declarations for public reusable workflows to document their interface'
  - 'Use YAML comments to document which secrets a workflow uses when `secrets: inherit` is the chosen approach'
  - 'Run `actionlint` locally before pushing — it catches `secrets: inherit` + explicit declaration conflicts at commit time'
docs:
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#using-inputs-and-secrets-in-a-reusable-workflow'
    label: 'GitHub Docs: Using inputs and secrets in a reusable workflow'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/passing-information-between-jobs#using-the-secrets-context'
    label: 'GitHub Docs: Using the secrets context'
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#passing-secrets-to-called-workflows'
    label: 'GitHub Docs: Passing secrets to called workflows'
