id: yaml-syntax-104
title: "Composite Action action.yml YAML Indentation Error — Unexpected type MappingToken"
category: yaml-syntax
severity: error
tags:
  - composite-action
  - action-manifest
  - indentation
  - yaml
  - MappingToken
  - action-yml
patterns:
  - regex: 'Unexpected type .{0,30} encountered while reading .action manifest root'
    flags: 'i'
  - regex: 'The type .MappingToken. was expected'
    flags: 'i'
  - regex: 'Failed to load [^\s]+/action\.ya?ml'
    flags: 'i'
  - regex: 'System\.ArgumentException.*MappingToken'
    flags: 'i'
error_messages:
  - "Error: System.ArgumentException: Unexpected type '' encountered while reading 'action manifest root'. The type 'MappingToken' was expected."
  - "Error: System.ArgumentException: Unexpected type 'BasicExpressionToken' encountered while reading 'action manifest root'. The type 'MappingToken' was expected."
  - "Error: Failed to load owner/my-action/v1/action.yaml"
  - "Error: Mapping values are not allowed in this context."
root_cause: |
  The GitHub Actions runner loads composite action manifests via
  `ActionManifestManager.Load()`. This method expects certain YAML keys (like
  `runs`, `steps`, `env`, `inputs`) to contain YAML mapping blocks. If the
  action's `action.yml` or `action.yaml` file has a structural YAML error — most
  commonly wrong indentation, an inline expression where a mapping block is
  expected, or a YAML scalar style mismatch — the token at that position has the
  wrong type (e.g., `BasicExpressionToken` or an empty scalar `''` instead of a
  `MappingToken`), and the runner throws `System.ArgumentException`.

  Common triggers:
  1. **Wrong indentation in composite action `runs.steps`** — a step's fields are
     not indented correctly under `- name:`, causing them to be parsed as a new
     mapping key at the wrong level.
  2. **Assigning an expression directly to `env:`** — `env: ${{ inputs.foo }}`
     is invalid because `env` expects a mapping of key–value pairs, not a single
     expression scalar.
  3. **Using single-quoted YAML tag syntax with expressions** — combining
     `!expr` or leading punctuation with GitHub expression syntax can produce
     an unexpected scalar style that the runner can't parse as a mapping.
  4. **Tabs instead of spaces** — YAML does not permit tab characters for
     indentation; a tab before a key is treated as part of the scalar value.
fix: |
  1. Open the failing `action.yml` or `action.yaml` in a YAML-aware editor.
  2. Verify every key that should contain nested keys (e.g., `env:`, `with:`,
     `steps:`) is followed by an indented block — not an inline scalar or
     expression.
  3. Ensure composite action steps each start with `- name:` (or `- id:`)
     properly indented 2 spaces under `steps:`, with `run:`, `shell:`, and
     `env:` further indented 2 more spaces.
  4. Run `actionlint` or a YAML linter locally before pushing.
  5. If a step needs dynamic `env` values from inputs, set individual keys
     under `env:` rather than assigning the whole mapping from an expression.
fix_code:
  - language: yaml
    label: 'BAD: expression assigned directly to env mapping key'
    code: |
      # action.yml — WRONG
      runs:
        using: composite
        steps:
          - name: Build
            run: make build
            shell: bash
            env: ${{ inputs.build-env }}  # ❌ env expects a mapping, not a scalar
  - language: yaml
    label: 'GOOD: individual env keys under the env block'
    code: |
      # action.yml — CORRECT
      runs:
        using: composite
        steps:
          - name: Build
            run: make build
            shell: bash
            env:
              BUILD_ENV: ${{ inputs.build-env }}  # ✅ env is a proper mapping
              NODE_ENV: production
  - language: yaml
    label: 'GOOD: correct composite action step indentation'
    code: |
      # action.yml — correct indentation structure
      name: My Composite Action
      description: Does something useful
      inputs:
        my-input:
          description: An input value
          required: true
      runs:
        using: composite
        steps:
          - name: Step one         # 10-space indent under steps:
            id: step-one
            shell: bash
            run: echo "${{ inputs.my-input }}"
            env:
              MY_INPUT: ${{ inputs.my-input }}
prevention:
  - 'Run `actionlint` in CI or as a pre-commit hook — it validates composite
    action YAML structure and reports schema violations before push.'
  - 'Use an editor with YAML schema validation (VS Code + YAML extension with
    GitHub Actions schema) to get inline errors as you type.'
  - 'Never assign GitHub expressions directly to YAML mapping keys like `env:`,
    `with:`, or `outputs:` — always provide a nested block with individual keys.'
  - 'Enable "Show whitespace" in your editor to catch accidental tab characters,
    which YAML treats as content, not indentation.'
docs:
  - url: 'https://docs.github.com/en/actions/sharing-automations/creating-actions/metadata-syntax-for-github-actions#runs-for-composite-actions'
    label: 'Composite action metadata syntax — GitHub Docs'
  - url: 'https://github.com/actions/runner/issues/3301'
    label: 'actions/runner #3301 — BasicExpressionToken not MappingToken'
  - url: 'https://stackoverflow.com/questions/78568976/error-on-custom-action-use-unexpected-type-encountered-while-reading-action'
    label: 'Stack Overflow: Unexpected type MappingToken in action manifest'
  - url: 'https://github.com/rhysd/actionlint'
    label: 'actionlint — static checker for GitHub Actions workflow files'
