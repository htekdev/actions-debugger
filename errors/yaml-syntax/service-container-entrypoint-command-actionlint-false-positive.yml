id: yaml-syntax-090
title: 'actionlint rejects valid service container entrypoint and command keys'
category: yaml-syntax
severity: warning
tags:
  - actionlint
  - service-containers
  - entrypoint
  - command
  - false-positive
  - linting
patterns:
  - regex: 'unexpected key "entrypoint" for "services" section'
    flags: 'i'
  - regex: 'unexpected key "command" for "services" section'
    flags: 'i'
error_messages:
  - '.github/workflows/test.yaml:9:9: unexpected key "entrypoint" for "services" section. expected one of "credentials", "env", "image", "options", "ports", "volumes" [syntax-check]'
  - '.github/workflows/test.yaml:10:9: unexpected key "command" for "services" section. expected one of "credentials", "env", "image", "options", "ports", "volumes" [syntax-check]'
root_cause: |
  GitHub Actions introduced service container entrypoint and command overrides in
  early April 2026 (GitHub Changelog: Early April 2026 updates). The new `entrypoint`
  and `command` keys under `jobs.<job_id>.services.<service_id>` allow overriding the
  image's default ENTRYPOINT and CMD, matching Docker Compose semantics.

  actionlint < v1.7.8 (before the fix in rhysd/actionlint PR #641, merged March/April
  2026) does not know about these new keys and rejects them as unknown properties with
  a [syntax-check] error. CI pipelines running actionlint in strict mode (e.g. via
  reviewdog or a dedicated linting job) will fail even though the workflow YAML is
  fully valid at GitHub Actions runtime — a false positive that blocks CI.

  The VS Code GitHub Actions language service extension had a similar gap: the parser
  enforced that only the `cron` key was allowed under schedule items, emitting
  "Invalid format for 'schedule'" when developers added the new `timezone` field
  introduced at the same time.
fix: |
  Upgrade actionlint to v1.7.8 or later, which adds full support for the `entrypoint`
  and `command` keys under service container definitions (rhysd/actionlint#644).

  If an immediate upgrade is not possible, suppress the specific false-positive errors
  using actionlint's ignore configuration or inline ignore comments.
fix_code:
  - language: yaml
    label: 'Valid workflow syntax (GitHub Actions accepts entrypoint and command since April 2026)'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: postgres:16
              # These keys are valid since April 2026 — upgrade actionlint to v1.7.8+
              entrypoint: ["docker-entrypoint.sh"]
              command: ["postgres", "-c", "max_connections=200"]
              env:
                POSTGRES_DB: testdb
              ports:
                - 5432:5432
  - language: yaml
    label: 'Suppress false positive in actionlint config (for actionlint < v1.7.8)'
    code: |
      # .actionlint.yaml
      self-hosted-runner:
        labels: []
      ignore:
        - 'unexpected key "entrypoint" for "services" section'
        - 'unexpected key "command" for "services" section'
prevention:
  - 'Pin actionlint to v1.7.8+ in CI; new GitHub Actions syntax features may lag linter support by days to weeks.'
  - 'When GitHub ships a new workflow syntax feature, check the actionlint and VS Code Actions extension changelogs for corresponding schema updates.'
  - 'Use inline actionlint ignore comments (`# actionlint:ignore:syntax-check`) as a per-line workaround until the linter is updated.'
docs:
  - url: 'https://github.blog/changelog/2026-04-02-github-actions-early-april-2026-updates/'
    label: 'GitHub Changelog: Early April 2026 — service container entrypoint/command'
  - url: 'https://github.com/rhysd/actionlint/issues/644'
    label: 'actionlint#644 — Add support for entrypoint and command for service containers'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idservicesservice_idoptions'
    label: 'Workflow syntax: jobs.<job_id>.services.<service_id>'
