id: yaml-syntax-105
title: "Reusable Workflow uses: Missing @ref — 'Invalid value workflow reference: no version specified'"
category: yaml-syntax
severity: error
tags:
  - reusable-workflow
  - uses
  - workflow-reference
  - version
  - ref
  - yaml-syntax
patterns:
  - regex: 'Invalid value.*workflow reference.*no version specified'
    flags: 'i'
  - regex: 'no version specified.*uses:|uses:.*no version specified'
    flags: 'i'
  - regex: 'error parsing called workflow.*no version'
    flags: 'i'
error_messages:
  - "Invalid value 'org/repo/.github/workflows/workflow.yml': no version specified"
  - "Invalid workflow file: .github/workflows/caller.yml#L8 Invalid value 'workflow reference': no version specified"
root_cause: |
  When calling an **external** reusable workflow via the `uses:` key, GitHub
  Actions requires a version ref appended with `@`. The ref can be a branch
  name, a tag, or a full commit SHA. Without it the reference is ambiguous and
  GitHub rejects the workflow at parse time.

  **Affected**: Cross-repo and cross-org `uses:` paths of the form:
  ```
  uses: owner/repo/.github/workflows/file.yml    # ❌ missing @ref
  ```

  **Not affected**: Local workflow references within the same repository use
  a leading `./` and do NOT require `@ref`:
  ```
  uses: ./.github/workflows/local.yml            # ✅ local, no @ref needed
  ```

  This error appears at workflow validation time (before any runner is
  provisioned) and prevents the entire calling workflow from starting.
fix: |
  Add a `@ref` suffix to the external reusable workflow `uses:` path. The ref
  can be:
  - A branch name: `@main`, `@develop`
  - A tag or release: `@v1`, `@v2.3.1`
  - A full commit SHA (most secure and reproducible): `@a1b2c3d4...`

  Use a specific SHA or tag in production pipelines to avoid unexpected changes
  when the upstream workflow is updated.
fix_code:
  - language: yaml
    label: 'BAD: external reusable workflow missing @ref'
    code: |
      jobs:
        lint:
          uses: my-org/shared-workflows/.github/workflows/lint.yml  # ❌ no @ref
  - language: yaml
    label: 'GOOD: external reusable workflow with branch @ref'
    code: |
      jobs:
        lint:
          uses: my-org/shared-workflows/.github/workflows/lint.yml@main  # ✅ branch ref
  - language: yaml
    label: 'GOOD: external reusable workflow pinned to a tag'
    code: |
      jobs:
        lint:
          uses: my-org/shared-workflows/.github/workflows/lint.yml@v1  # ✅ tag ref
  - language: yaml
    label: 'GOOD: local reusable workflow (no @ref required)'
    code: |
      jobs:
        lint:
          uses: ./.github/workflows/lint.yml  # ✅ local path, no @ref needed
prevention:
  - 'Always append `@ref` when referencing external reusable workflows — make
    it a team convention to always pin to a tag or SHA, not a branch, in
    production workflows.'
  - 'Use `actionlint` to statically validate workflow files locally before push;
    it catches missing `@ref` on external `uses:` references.'
  - 'In code review, verify that any `uses:` pointing to an external repository
    includes a `@ref` suffix before approving the PR.'
docs:
  - url: 'https://docs.github.com/en/actions/sharing-automations/reusing-workflows#calling-a-reusable-workflow'
    label: 'Calling a reusable workflow — GitHub Docs'
  - url: 'https://stackoverflow.com/questions/79634417/invalid-value-workflow-reference-no-version-specified-for-github-actions'
    label: 'Stack Overflow: Invalid value workflow reference no version specified'
