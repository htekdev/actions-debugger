id: yaml-syntax-080
title: "actionlint reports 'unknown permission scope models' false positive for GitHub Models API"
category: yaml-syntax
severity: warning
tags:
  - actionlint
  - permissions
  - github-models
  - false-positive
  - models-read
  - ci-lint
  - tooling
patterns:
  - regex: 'unknown permission scope "models"'
    flags: 'i'
  - regex: 'unknown permission scope.*models.*\[permissions\]'
    flags: 'i'
  - regex: 'models:\s*read.*unknown.*permission\|unknown.*permission.*models.*read'
    flags: 'i'
error_messages:
  - ".github/workflows/summary.yml:16:7: unknown permission scope \"models\". all available permission scopes are \"actions\", \"attestations\", \"checks\", \"contents\", \"deployments\", \"discussions\", \"id-token\", \"issues\", \"packages\", \"pages\", \"pull-requests\", \"repository-projects\", \"security-events\", \"statuses\" [permissions]"
  - "unknown permission scope \"models\" [permissions]"
root_cause: |
  GitHub introduced the `models` permission scope for GitHub Models API access
  (changelog: May 15, 2025). Since March 29, 2025, fine-grained Personal Access Tokens
  (PATs) and GitHub Apps must include `models: read` to access the GitHub Models
  playground and API. GITHUB_TOKEN in workflows also requires this permission when
  calling GitHub Models endpoints.

  Workflows correctly declare:
  ```yaml
  permissions:
    models: read
  ```

  However, actionlint v1.7.6 and earlier validate permission scopes against a static
  allowlist that does not include `models`. Any workflow using `permissions: models: read`
  fails actionlint validation with a false positive error, even though the workflow is
  valid and executes correctly at runtime.

  This causes CI pipelines running actionlint as a linter step to fail on perfectly
  valid workflows. The error message's list of "all available permission scopes" omits
  `models` because actionlint's internal schema was not yet updated when GitHub added
  the new permission.

  The fix was merged in actionlint PR #531 and released in actionlint v1.7.7+.

  Source: https://github.com/rhysd/actionlint/issues/548 (6 reactions, Jun 2025 – Nov 2025)
  Source: https://github.blog/changelog/2025-05-15-modelsread-now-required-for-github-models-access/
fix: |
  **Preferred fix:** Upgrade actionlint to v1.7.7 or later. The `models` permission
  scope was added to actionlint's allowlist in PR #531, released Nov 2025.

  **Temporary workaround (if upgrading is not possible):** Suppress the false positive
  using actionlint's `-ignore` flag:

  ```bash
  actionlint -color -ignore 'unknown permission scope "models"'
  ```

  Or add an inline ignore comment in the workflow file (actionlint supports
  `# actionlint ignore` annotations in some contexts — check actionlint docs for the
  exact syntax for your version).

  **Do NOT remove `models: read` from your workflow** — it is required for GitHub
  Models API access and the workflow will fail at runtime if the permission is absent.
fix_code:
  - language: yaml
    label: "Correct workflow syntax — valid at runtime, requires actionlint v1.7.7+ to pass linting"
    code: |
      name: AI Model Inference

      on:
        workflow_dispatch:

      permissions:
        models: read    # Required for GitHub Models API — valid since Mar 29 2025

      jobs:
        inference:
          runs-on: ubuntu-latest
          steps:
            - name: Call GitHub Models API
              uses: actions/ai-inference@v1
              with:
                model: openai/gpt-4o-mini
                prompt: "Summarize the latest changes in this PR"

  - language: yaml
    label: "actionlint CI step — pin to v1.7.7+ to avoid false positive on models permission"
    code: |
      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4

            # Pin actionlint to v1.7.7+ which recognizes 'models' permission scope.
            # Older versions (<=v1.7.6) incorrectly flag 'models: read' as unknown.
            - name: Check workflow files
              uses: rhysd/actionlint@v1.7.7
              # Or: uses: rhysd/actionlint@latest

  - language: yaml
    label: "Workaround: suppress false positive when upgrading actionlint is not immediately possible"
    code: |
      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4

            - name: Install actionlint
              run: |
                bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.6

            - name: Check workflow files
              # Temporarily ignore the models permission false positive until actionlint is upgraded
              run: actionlint -color -ignore 'unknown permission scope "models"'
prevention:
  - "Pin actionlint to v1.7.7 or later in all CI pipelines — this version recognizes the 'models' permission scope."
  - "When adopting new GitHub permission scopes (models, copilot, etc.), verify your actionlint version recognizes them before enabling strict linting."
  - "Monitor the actionlint CHANGELOG and rhysd/actionlint releases when GitHub announces new permission scopes."
  - "Use 'actionlint -ignore' to suppress known false positives as a short-term unblock while upgrading."
docs:
  - url: "https://github.com/rhysd/actionlint/issues/548"
    label: "actionlint#548: Bug report — unknown permission scope 'models' (6 reactions, fixed Nov 2025)"
  - url: "https://github.com/rhysd/actionlint/pull/551"
    label: "actionlint PR#551: Add support for 'models' permissions"
  - url: "https://github.blog/changelog/2025-05-15-modelsread-now-required-for-github-models-access/"
    label: "GitHub Changelog: models:read now required for GitHub Models access (May 15, 2025)"
  - url: "https://docs.github.com/en/github-models"
    label: "GitHub Docs: GitHub Models"
  - url: "https://github.com/rhysd/actionlint/blob/main/docs/checks.md#permissions"
    label: "actionlint docs: permissions check"
