id: yaml-syntax-081
title: 'Non-workflow YAML file placed in .github/workflows/ causes "No event triggers defined in `on`" annotation'
category: yaml-syntax
severity: warning
tags:
  - workflows-directory
  - yaml-file
  - no-event-triggers
  - yamllint
  - workflow-discovery
  - annotation
patterns:
  - regex: 'No event triggers defined in .on.'
    flags: 'i'
  - regex: 'No event triggers defined in `on`'
    flags: 'i'
  - regex: 'no.*trigger.*defined.*\.github/workflows'
    flags: 'i'
error_messages:
  - "No event triggers defined in `on`"
  - "No event triggers defined in `on` (.github/workflows/config.yml)"
  - "invalid workflow file: .github/workflows/markdownList.yml"
root_cause: |
  GitHub Actions scans **every YAML/YML file** in the `.github/workflows/` directory and
  attempts to parse each one as a workflow file. If a YAML file placed in that directory
  does NOT contain a valid `on:` (trigger) block, GitHub reports:

    "No event triggers defined in `on`"

  This annotation appears in the Actions tab of the repository and can be associated with
  the specific non-workflow file OR attributed to a push event, causing confusion because
  other legitimate workflows in the same commit run correctly.

  **Common causes:**
  1. **yamllint / markdownlint config files**: Tools like yamllint or markdownlint store
     their config in `.yamllint.yml` or `.markdownlint.yml` — developers sometimes
     accidentally place these in `.github/workflows/` instead of the `.github/` root.
  2. **Docker Compose / data files**: A `docker-compose.yml` or `values.yml` placed in
     the workflows directory while testing.
  3. **Workflow data files**: A separate YAML data file (e.g., `environment-list.yml`)
     intended to be read by a workflow but accidentally placed in the workflows directory.
  4. **Include/anchor files**: Attempts to share YAML across workflows via anchor files
     placed in the workflows directory (GitHub does not support YAML anchors across files).

  The error is a warning annotation on the push/PR and does NOT fail the run. However:
  - It clutters the Actions tab with errors that are hard to trace to the right file.
  - On first push of a new repository, it can appear before any legitimate workflow is
    configured, confusing developers about workflow setup.
  - actionlint does NOT flag this because it only lints files that look like workflows.
fix: |
  Move the non-workflow YAML file out of `.github/workflows/` to an appropriate location:

  - Config files for linting tools → `.github/` root (e.g., `.github/.yamllint.yml`) or
    the repository root.
  - Docker Compose files → repository root or `docker/` directory.
  - Workflow data files → `.github/` root or a dedicated `config/` directory, then
    reference them from workflow `run:` steps using relative paths from the repo root.
fix_code:
  - language: bash
    label: 'Move a yamllint config out of .github/workflows/ to the repo root'
    code: |
      # WRONG: yamllint config accidentally placed in .github/workflows/
      # .github/workflows/.yamllint.yml  ← GitHub tries to run this as a workflow

      # CORRECT: move it to the repo root or .github/ directory
      mv .github/workflows/.yamllint.yml .yamllint.yml
      # or: mv .github/workflows/.yamllint.yml .github/.yamllint.yml
      git add -A
      git commit -m "fix: move yamllint config out of workflows directory"
  - language: yaml
    label: 'Referencing a data YAML file from a workflow (correct pattern)'
    code: |
      # WRONG: placing data file in .github/workflows/
      # .github/workflows/environment-list.yml  ← triggers "No event triggers" error

      # CORRECT: place data files in .github/ or repo root, reference via path
      # File location: .github/environment-list.yml

      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Read environment list
              run: |
                # Reference the data file from the repo root using relative path
                cat .github/environment-list.yml
prevention:
  - 'Only place files with valid `on:` workflow triggers in `.github/workflows/`. All other YAML (config, data, templates) must live outside this directory.'
  - 'If a linting tool expects its config in a specific location, check whether it supports configuration discovery from parent directories or alternative paths before putting it in `.github/workflows/`.'
  - 'When you see "No event triggers defined in `on`" in the Actions tab, check whether a non-workflow YAML was recently added to `.github/workflows/` — the filename in the annotation (if shown) identifies the file.'
  - 'Run `actionlint` locally before pushing — it validates all YAML files in `.github/workflows/` and reports schema errors that would trigger this warning.'
docs:
  - url: 'https://stackoverflow.com/questions/63014238/github-action-no-event-triggers-defined-in-on'
    label: 'Stack Overflow #63014238 — "No event triggers defined in `on`" (20 votes, 28,377 views)'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#on'
    label: 'GitHub Actions workflow syntax — on (trigger events)'
  - url: 'https://rhysd.github.io/actionlint/'
    label: 'actionlint — static analysis for GitHub Actions workflows'
