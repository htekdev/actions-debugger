id: yaml-syntax-093
title: 'Service container entrypoint: and command: keys silently ignored or rejected on GHES'
category: yaml-syntax
severity: error
tags:
  - service-container
  - entrypoint
  - command
  - ghes
  - schema-validation
  - breaking-change
patterns:
  - regex: 'Unexpected value.*entrypoint'
    flags: 'i'
  - regex: 'Unexpected value.*command.*service'
    flags: 'i'
  - regex: 'Invalid workflow file.*services.*entrypoint'
    flags: 'i'
  - regex: 'Unknown.*key.*entrypoint.*services'
    flags: 'i'
error_messages:
  - "Unexpected value 'entrypoint'"
  - 'Invalid workflow file: .github/workflows/ci.yml'
  - 'unknown key "entrypoint" for "services"'
root_cause: |
  In April 2026, GitHub Actions added entrypoint: and command: keys to the service
  container configuration block (jobs.<id>.services.<id>.entrypoint and
  jobs.<id>.services.<id>.command). These keys override the container's default
  ENTRYPOINT and CMD respectively, matching Docker Compose naming conventions.

  GitHub Enterprise Server (GHES) versions that have not yet received the April 2026
  update do not recognize these keys. Two failure modes occur depending on GHES version:

  1. Schema validation error: GHES validates workflow YAML against a bundled schema.
     On older GHES versions, entrypoint: and command: under services are unknown keys,
     causing a workflow validation failure. The workflow is rejected before any job runs.

  2. Silent ignore: Some GHES versions accept but silently ignore unknown service
     container keys. Workflows using entrypoint: appear to succeed but the container
     uses its default entry point, producing wrong behavior (e.g., database with wrong
     initialization parameters, proxy with wrong command arguments).

  Local workflow linting tools (actionlint, schema validators) may also reject these
  keys if they have not been updated to include the April 2026 schema changes.

  Source: GitHub Changelog, April 2 2026 (Early April 2026 updates).
fix: |
  For GHES: Check your GHES version and verify it includes the April 2026+ Actions
  update that adds entrypoint: and command: support for service containers.

  Workaround for older GHES: Do not use entrypoint: or command: directly. Instead,
  build a custom Docker image with the desired entrypoint baked in, and reference
  that image in your service container definition.

  For actionlint/schema validators: Upgrade to a version that includes these keys
  in the workflow schema.
fix_code:
  - language: yaml
    label: 'Using entrypoint: and command: (GHEC / GHES 3.15+)'
    code: |
      jobs:
        test:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: postgres:16
              entrypoint: ["/bin/sh", "-c"]
              command: ["postgres -c password_encryption=md5"]
              env:
                POSTGRES_PASSWORD: testpass
  - language: yaml
    label: 'Workaround for GHES without entrypoint support — use a custom image'
    code: |
      # Build a custom image with the desired entrypoint pre-configured
      # Dockerfile:
      #   FROM postgres:16
      #   CMD ["postgres", "-c", "password_encryption=md5"]
      #
      # Then reference it in your workflow:
      jobs:
        test:
          runs-on: ubuntu-latest
          services:
            postgres:
              image: ghcr.io/${{ github.repository }}/postgres-custom:latest
              env:
                POSTGRES_PASSWORD: testpass
prevention:
  - 'Check your GHES version before using entrypoint: or command: on service containers — requires GHES with April 2026+ Actions update'
  - 'Upgrade actionlint to include the April 2026 schema update if CI linting rejects these keys'
  - 'For GHES workflows shared with GHEC, test that service container entrypoints behave identically on both platforms'
  - 'Build custom Docker images with desired entrypoints for maximum portability across GHES versions'
docs:
  - url: 'https://github.blog/changelog/2026-04-02-github-actions-early-april-2026-updates/'
    label: 'GitHub Changelog: Early April 2026 updates — service container entrypoint/command (April 2, 2026)'
  - url: 'https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idservicesservice_idoptions'
    label: 'GitHub Docs: Workflow syntax — jobs.<id>.services.<id>.entrypoint'
