id: yaml-syntax-094
title: "Composite Action Step Indentation Error — 'Mapping values are not allowed in this context'"
category: yaml-syntax
severity: error
tags:
  - composite-action
  - action-yml
  - indentation
  - yaml-parse-error
  - MappingToken
patterns:
  - regex: 'Mapping values are not allowed in this context'
    flags: 'i'
  - regex: "Unexpected type '' encountered while reading 'action manifest root'"
    flags: 'i'
  - regex: 'The type .MappingToken. was expected'
    flags: 'i'
  - regex: 'Failed to load .+action\.yml'
    flags: 'i'
error_messages:
  - "Error: (Line: 13, Col: 11): Mapping values are not allowed in this context."
  - "Error: System.ArgumentException: Unexpected type '' encountered while reading 'action manifest root'. The type 'MappingToken' was expected."
  - "Error: Failed to load /home/runner/work/.../action.yml"
root_cause: |
  When a composite action's `action.yml` has step fields (`if:`, `run:`, `shell:`,
  `with:`) at the wrong indentation level, the YAML parser emits "Mapping values are
  not allowed in this context." — followed immediately by the runner throwing:

    System.ArgumentException: Unexpected type '' encountered while reading
    'action manifest root'. The type 'MappingToken' was expected.

  The most common mistake is using 4-space indentation for sibling keys under a step
  instead of 2-space alignment. YAML block mappings require all keys at the same
  logical level to use the same indentation. If `if:` is indented 4 spaces while
  `name:` is indented 2 spaces, the parser sees `if:` as a nested mapping inside
  the value of `name:`, which is a scalar — and scalars cannot contain mapping keys.

  Example broken action.yml step (extra indentation on `if`, `run`, `shell`):

    steps:
      - name: Install dependencies
          if: steps.cache.outputs.cache-hit != 'true'   # ← 4 spaces (wrong)
          run: npm ci                                    # ← 4 spaces (wrong)
          shell: bash                                    # ← 4 spaces (wrong)

  The error fires at action load time, before any step runs, so the entire composite
  action call fails with "Failed to load action.yml".

  Source: Stack Overflow #78568976 (Jun 2024), actions/runner issues referencing
  System.ArgumentException / MappingToken in action.yml parsing.
fix: |
  Ensure all sibling step keys use consistent 2-space indentation relative to the
  list item marker (`- `). Every field under a step (`name:`, `id:`, `uses:`, `run:`,
  `shell:`, `if:`, `with:`, `env:`) must be at the same indentation level.
fix_code:
  - language: yaml
    label: "Broken — inconsistent step indentation causes MappingToken parse error"
    code: |
      # ❌ BROKEN: if/run/shell indented 4 spaces instead of 2
      steps:
        - name: Install dependencies
            if: steps.cache.outputs.cache-hit != 'true'   # wrong: 4-space
            run: npm ci                                    # wrong: 4-space
            shell: bash                                    # wrong: 4-space
  - language: yaml
    label: "Fixed — all step keys at the same 2-space indentation level"
    code: |
      # ✅ FIXED: all step keys at 2-space indentation (aligned with 'name:')
      steps:
        - name: Install dependencies
          if: steps.cache.outputs.cache-hit != 'true'    # correct: 2-space
          run: npm ci                                     # correct: 2-space
          shell: bash                                     # correct: 2-space
  - language: yaml
    label: "Full correct composite action example"
    code: |
      # ✅ Complete correct composite action.yml
      name: "Get and cache dependencies"
      description: "Install Node dependencies with caching."
      runs:
        using: "composite"
        steps:
          - name: Cache dependencies
            id: cache
            uses: actions/cache@v4
            with:
              path: node_modules
              key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
          - name: Install dependencies
            if: steps.cache.outputs.cache-hit != 'true'
            run: npm ci
            shell: bash
prevention:
  - "Use an editor with YAML validation (VS Code + redhat.vscode-yaml) — it highlights indentation errors before push."
  - "Run `actionlint` locally before pushing — it catches action.yml YAML parse errors."
  - "Copy-paste step structure from a known-good action.yml rather than typing indentation manually."
  - "Remember: every step field must be indented exactly 2 spaces relative to the `- name:` list item marker, not 4."
  - "When writing multi-step composite actions, verify each step's keys with `python3 -c \"import yaml; yaml.safe_load(open('action.yml'))\"` for a fast syntax check."
docs:
  - url: "https://docs.github.com/en/actions/creating-actions/creating-a-composite-action"
    label: "Creating a composite action — GitHub Docs"
  - url: "https://stackoverflow.com/questions/78568976/error-on-custom-action-use-unexpected-type-encountered-while-reading-action"
    label: "Stack Overflow #78568976 — Unexpected type MappingToken while reading action manifest root"
  - url: "https://github.com/actions/runner/issues/2289"
    label: "actions/runner#2289 — A mapping was not expected (reusable workflow mapping error)"
