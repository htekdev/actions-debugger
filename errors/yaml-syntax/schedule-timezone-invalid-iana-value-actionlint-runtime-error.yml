id: yaml-syntax-092
title: 'schedule timezone non-IANA value (UTC, EST, local, offset strings) rejected by actionlint v1.7.8+ and GitHub Actions runtime'
category: yaml-syntax
severity: error
tags:
  - schedule
  - cron
  - timezone
  - actionlint
  - iana-timezone
  - linting
  - workflow-validation
patterns:
  - regex: 'invalid timezone .+ in schedule event\. it must be a valid IANA timezone name \[events\]'
    flags: 'i'
  - regex: 'invalid timezone "UTC" in schedule event'
    flags: 'i'
  - regex: 'invalid timezone "EST" in schedule event'
    flags: 'i'
  - regex: 'invalid timezone .+ in schedule event\. it must be a valid IANA timezone name'
    flags: 'i'
error_messages:
  - "invalid timezone \"UTC\" in schedule event. it must be a valid IANA timezone name [events]"
  - "invalid timezone \"EST\" in schedule event. it must be a valid IANA timezone name [events]"
  - "invalid timezone \"US/Eastern\" in schedule event. it must be a valid IANA timezone name [events]"
  - "invalid timezone \"local\" in schedule event. it must be a valid IANA timezone name [events]"
  - "invalid timezone \"Asia/Somewhere\" in schedule event. it must be a valid IANA timezone name [events]"
root_cause: |
  GitHub Actions added `timezone:` support for `on.schedule` cron entries in March 2026
  (GitHub Changelog, Late March 2026 Updates). The value must be a valid IANA timezone
  database name (e.g. "America/New_York", "Europe/London", "Asia/Kolkata").

  actionlint v1.7.8+ (released March 30, 2026, fixing issue #638) validates the `timezone:`
  field value against Go's `time.LoadLocation` — but with additional strictness:

  - **"UTC"** — accepted by Go's time.LoadLocation but NOT a valid IANA timezone name.
    The canonical IANA equivalent is "Etc/UTC". actionlint rejects "UTC" as non-IANA.
  - **"local"** — accepted by Go as the local system timezone but not an IANA name.
  - **Timezone abbreviations** ("EST", "PDT", "IST", "CST") — these are ambiguous 3-letter
    abbreviations, not IANA names. "EST" could be US Eastern Standard Time or Australian EST.
    IANA names are always region/city format: "America/New_York".
  - **POSIX legacy names** ("US/Eastern", "US/Pacific") — deprecated and not part of the
    current IANA database; the authoritative names are "America/New_York", "America/Los_Angeles".
  - **UTC offset strings** ("UTC+5:30", "GMT+05:30") — not IANA names; use "Asia/Kolkata" etc.

  GitHub's own runtime also validates the IANA timezone name at workflow parse time. A workflow
  with an invalid `timezone:` value will fail with a workflow validation error before any job runs.

  Note: If you are on actionlint < v1.7.8, the `timezone:` key is rejected entirely with
  "expected cron key" (covered by yaml-syntax-046). Upgrade actionlint to v1.7.8+ before
  using the timezone feature.
fix: |
  Use a valid IANA timezone database name. Common replacements for non-IANA values:

  | Wrong value         | Correct IANA name        |
  | ------------------- | ------------------------ |
  | UTC                 | Etc/UTC  (or just omit — default is UTC) |
  | GMT                 | Etc/GMT                  |
  | EST                 | America/New_York         |
  | CST                 | America/Chicago          |
  | MST                 | America/Denver           |
  | PST / PDT           | America/Los_Angeles      |
  | US/Eastern          | America/New_York         |
  | US/Pacific          | America/Los_Angeles      |
  | IST                 | Asia/Kolkata (India) OR Asia/Jerusalem OR Europe/Dublin |
  | UTC+5:30            | Asia/Kolkata             |
  | local               | (use an explicit IANA name) |

  Look up the correct IANA name for your city at: https://data.iana.org/time-zones/tzdb-latest.tar.lz
  or use the IANA TZ database list at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

  If you just want UTC behaviour, omit the `timezone:` key entirely — the default is UTC.
fix_code:
  - language: yaml
    label: 'Correct schedule with valid IANA timezone name'
    code: |
      on:
        schedule:
          # Wrong: timezone: "EST"
          # Wrong: timezone: "US/Eastern"
          # Correct: use IANA region/city format
          - cron: '30 9 * * 1-5'
            timezone: 'America/New_York'   # Eastern Time (auto-adjusts for DST)

          # Wrong: timezone: "UTC"
          # Correct: omit timezone for UTC (default) or use canonical IANA name
          - cron: '0 2 * * *'
            timezone: 'Etc/UTC'

          # Wrong: timezone: "IST"
          # Correct: specify unambiguous IANA name
          - cron: '0 12 * * *'
            timezone: 'Asia/Kolkata'       # India Standard Time
  - language: yaml
    label: 'actionlint CI check to catch invalid timezone values before push'
    code: |
      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Run actionlint
              uses: rjw57/actionlint-action@v1
              with:
                # Requires actionlint >= v1.7.8 for timezone validation
                version: 'v1.7.8'
prevention:
  - 'Always use IANA region/city timezone names (e.g. "America/New_York") not abbreviations (EST, PDT) or special values (UTC, local).'
  - 'When the intended timezone is UTC, omit the `timezone:` key entirely — the schedule default is UTC.'
  - 'Consult the IANA TZ database list (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) when choosing a timezone name.'
  - 'Run actionlint v1.7.8+ in your CI pipeline to catch invalid timezone values before they reach GitHub Actions runtime validation.'
  - 'Be aware that IANA timezone names automatically handle DST transitions — e.g. "America/New_York" is EST in winter and EDT in summer. If you want a fixed UTC offset year-round, use an Etc/GMT+N name: "Etc/GMT+5" (note: Etc/GMT offsets have reversed sign convention).'
docs:
  - url: 'https://github.com/blog/changelog/2026-03-19-github-actions-late-march-2026-updates/'
    label: 'GitHub Changelog — Timezone support for scheduled workflows (March 2026)'
  - url: 'https://github.com/rhysd/actionlint/issues/638'
    label: 'actionlint#638 — Add support for timezone for schedule triggers (fixed in v1.7.8)'
  - url: 'https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onschedule'
    label: 'GitHub Actions workflow syntax — on.schedule with timezone field'
  - url: 'https://en.wikipedia.org/wiki/List_of_tz_database_time_zones'
    label: 'IANA TZ database — complete list of valid timezone names'
