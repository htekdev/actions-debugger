id: ys-118
title: '`setup-python` Matrix `python-version: [3.10, 3.9]` — YAML Parses 3.10 as Float 3.1, Wrong Python Installed'
category: yaml-syntax
severity: silent-failure
tags:
  - setup-python
  - matrix
  - yaml-float
  - version-coercion
  - python-version
  - silent-failure
  - yaml-1.1
patterns:
  - regex: 'Version 3\.1\b.*not found|version spec 3\.1\b'
    flags: 'i'
  - regex: 'setup-python.*python-version.*3\.1(?!\d)'
    flags: 'i'
  - regex: 'No Python version found with name 3\.1\b|Unable to find python version.*3\.1\b'
    flags: 'i'
error_messages:
  - "Version 3.1 with arch x64 not found"
  - "Unable to find python version: 3.1 - x64"
  - "Error: The version '3.1' with architecture 'x64' was not found"
  - "No Python version found with name 3.1"
root_cause: |
  YAML 1.1 (used by GitHub Actions) parses bare numeric values as their native type.
  A version string like `3.10` is a valid YAML float literal and is parsed as the
  floating-point number `3.1` (since trailing zeros after the decimal point are
  insignificant in floats). When `setup-python` receives the coerced value `3.1`
  instead of the string `"3.10"`, it attempts to install Python 3.1 — an ancient
  version from 2009 that is not available in the toolcache and fails.

  The same coercion affects all Python version strings whose trailing digits form a
  zero-terminated float:
  - `3.10` → `3.1`
  - `3.20` → `3.2`  (hypothetical future release)
  - `2.10` → `2.1`

  Python versions like `3.9`, `3.11`, `3.12`, `3.13` are NOT affected (no trailing
  zero to strip). The problem surfaces specifically on `3.10` and newer minor releases
  where the minor version is `10` or higher.

  This is the same root cause as the Go matrix version coercion issue (e.g., `1.22` → `1.2`)
  and affects any `actions/setup-*` action that uses unquoted minor versions ≥ 10.
fix: |
  Quote ALL version strings in the matrix definition to force YAML to treat them as
  strings rather than numeric literals. This is the canonical fix recommended in the
  setup-python documentation.

  Use single-quoted or double-quoted strings: `'3.10'` or `"3.10"`.
fix_code:
  - language: yaml
    label: 'BROKEN — 3.10 parsed as float 3.1, installs wrong Python version'
    code: |
      jobs:
        test:
          strategy:
            matrix:
              python-version: [3.10, 3.9, 3.11]  # ✗ 3.10 → float 3.1
          steps:
            - uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
            # Fails: "Version 3.1 with arch x64 not found"

  - language: yaml
    label: 'FIXED — quote all version strings to prevent YAML float coercion'
    code: |
      jobs:
        test:
          strategy:
            matrix:
              python-version: ['3.10', '3.9', '3.11', '3.12']  # ✓ string literals
          steps:
            - uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

  - language: yaml
    label: 'ALTERNATIVE — use python-version-file to avoid hardcoding versions'
    code: |
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version-file: '.python-version'  # reads version from file, always string

prevention:
  - 'Always quote Python version values in matrix definitions: `python-version: [''3.10'', ''3.11'']`'
  - 'Prefer `python-version-file: .python-version` to avoid hardcoding versions entirely.'
  - 'After setup-python runs, verify the installed version with a `run: python --version` step.'
  - 'The same coercion affects `node-version`, `go-version`, `ruby-version`, and any setup action using unquoted minor versions ending in zero.'
  - 'Run actionlint locally — it warns about unquoted numeric matrix values in version fields.'
docs:
  - url: 'https://github.com/actions/setup-python/issues/160'
    label: 'actions/setup-python#160: Python 3.10 not recognized — 3.10 parsed as 3.1 (18 reactions)'
  - url: 'https://github.com/actions/setup-python#supported-version-syntax'
    label: 'setup-python: Supported version syntax'
  - url: 'https://yaml.org/type/float.html'
    label: 'YAML 1.1 float type specification'
  - url: 'https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow'
    label: 'GitHub Docs: Running variations of jobs in a workflow (matrix strategy)'
