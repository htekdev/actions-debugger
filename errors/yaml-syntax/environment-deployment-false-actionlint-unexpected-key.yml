id: yaml-syntax-103
title: "actionlint <v1.7.12 flags `deployment: false` in job environment as unexpected key — false positive"
category: yaml-syntax
severity: warning
tags:
  - actionlint
  - environment
  - deployment
  - false-positive
  - schema-lag
  - local-tooling
patterns:
  - regex: 'unexpected key "deployment" for "environment"'
    flags: 'i'
  - regex: 'unexpected key.*deployment.*environment.*configuration|environment.*unexpected.*key.*deployment'
    flags: 'i'
error_messages:
  - 'unexpected key "deployment" for "environment" configuration object. expected one of "name", "url" [syntax-check]'
root_cause: |
  GitHub Actions added the deployment: false key to job environment blocks on March 19, 2026.
  When set, environment secrets and variables are accessible without creating a GitHub deployment
  record — useful for protecting secrets behind environment approval rules without polluting the
  Deployments tab.

  actionlint did not add support for the new key until v1.7.12 (released March 30, 2026). Any
  actionlint version before v1.7.12 will flag deployment: false as an unknown key because its
  environment-object schema only recognised "name" and "url":

    unexpected key "deployment" for "environment" configuration object. expected one of "name", "url" [syntax-check]

  The workflow is valid and will execute correctly on GitHub Actions — this is a lint tooling
  schema lag. Users who pin actionlint at an older version, or use a CI step that bundles an
  outdated actionlint binary, will see this false positive every time the lint step runs.
fix: |
  Upgrade actionlint to v1.7.12 or later, which added explicit support for deployment: false
  in the environment configuration object.

  If an immediate upgrade is not possible, suppress the specific check on the offending line
  with an actionlint inline annotation, or upgrade the rhysd/actionlint action pin in your
  lint workflow.
fix_code:
  - language: yaml
    label: "Upgrade actionlint step to v1.7.12+ (adds deployment: false support)"
    code: |
      - name: Lint workflow files
        uses: rhysd/actionlint@v1.7.12  # v1.7.12 adds deployment: false support

  - language: yaml
    label: "Correct usage of deployment: false (valid syntax, March 2026+)"
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          environment:
            name: production
            url: ${{ steps.deploy.outputs.url }}
            deployment: false   # access secrets without creating a deployment record
          steps:
            - id: deploy
              run: echo "url=https://example.com" >> "$GITHUB_OUTPUT"
            - run: echo "SECRET is ${{ secrets.MY_SECRET != '' && 'set' || 'empty' }}"

prevention:
  - "Keep actionlint up-to-date so new GitHub Actions YAML keys are not flagged as errors"
  - "Use rhysd/actionlint@v1.7.12 or a later pinned version in your lint workflows"
  - "When GitHub releases new YAML syntax, check the actionlint changelog for a corresponding schema update"
docs:
  - url: "https://github.com/rhysd/actionlint/commit/0ef3e186788c574789a53973ce6bbe68b0847855"
    label: "actionlint commit 0ef3e18: add support for deployment: false in environment objects (v1.7.12)"
  - url: "https://github.blog/changelog/2026-03-19-github-actions-late-march-2026-updates/"
    label: "GitHub Changelog: Late March 2026 updates — environments without auto-deployment"
  - url: "https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-deployments/managing-environments-for-deployment"
    label: "GitHub docs: Managing environments for deployment"
