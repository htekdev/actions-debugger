id: yaml-syntax-114
title: 'configure-pages Throws "TypeError: error must be an instance of Error" on Unknown static_site_generator Value'
category: yaml-syntax
severity: error
tags:
  - actions/configure-pages
  - static_site_generator
  - TypeError
  - yaml-input
  - pages
  - misconfiguration
patterns:
  - regex: 'TypeError: error must be an instance of Error'
    flags: 'i'
  - regex: 'configure.pages.*TypeError.*error.*instance|TypeError.*error.*instance.*configure.pages'
    flags: 'i'
error_messages:
  - "TypeError: error must be an instance of Error"
  - "Error: TypeError: error must be an instance of Error"
root_cause: |
  In `actions/configure-pages`, the `set-pages-config.js` file validates the
  `static_site_generator` input against a known list of generators (e.g., `jekyll`,
  `gatsby`, `next`, `nuxt`, `hugo`, `sveltekit`, etc.). When an unsupported or
  misspelled value is provided, the validation branch throws a raw JavaScript string
  literal instead of an Error object:

    throw `Unknown static site generator: ${generator}`  // string, not Error

  Node.js and `@actions/core`'s error-handling layer expect a proper Error object.
  When `core.setFailed()` receives a non-Error, it internally attempts to call
  `.message` on the thrown value; for a string this returns `undefined`, and the
  subsequent stack-inspection path throws `TypeError: error must be an instance of Error`.

  The net result is a deeply confusing double-error: the workflow fails with
  `TypeError: error must be an instance of Error` — with no mention of the
  `static_site_generator` input — rather than a helpful "Unknown static site generator:
  <value>" message.

  Reported in actions/configure-pages#196 (opened 2026-06-01). The fix is a one-line
  change in `set-pages-config.js` to throw `new Error(...)` instead of a bare string.
fix: |
  Use a supported value for `static_site_generator`. The allowed values are:

    - `jekyll`
    - `gatsby`
    - `next`
    - `nuxt`
    - `hugo`
    - `sveltekit`
    - `mdbook`
    - `astro`
    - `sphinx`
    - `mkdocs`
    - `vuepress`
    - `docusaurus`
    - `hexo`
    - `eleventy`

  If you are intentionally overriding default generator detection (e.g., for a custom
  framework), omit the `static_site_generator` input entirely rather than supplying an
  unrecognised value. `configure-pages` falls back to a generic configuration when the
  input is absent, which works for any static site output.

  If the input is absent from your workflow and you are still seeing this error, check
  whether the value is being set by a calling workflow or from an environment variable.
fix_code:
  - language: yaml
    label: "Use a known static_site_generator value"
    code: |
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: jekyll   # must be a supported value
  - language: yaml
    label: "Omit static_site_generator to use auto-detection"
    code: |
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # No static_site_generator input — configure-pages auto-detects
prevention:
  - "Check the configure-pages README for the current list of supported generators before setting static_site_generator"
  - "Omit the static_site_generator input for custom or unsupported frameworks — the action's generic fallback works for any static output"
  - "Use string interpolation carefully; if static_site_generator is derived from an expression, ensure it resolves to a known value at runtime"
docs:
  - url: "https://github.com/actions/configure-pages/issues/196"
    label: "actions/configure-pages #196 — TypeError: error must be an instance of Error (opened 2026-06-01)"
  - url: "https://github.com/actions/configure-pages?tab=readme-ov-file#usage"
    label: "actions/configure-pages — supported static_site_generator values"
