name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      !contains(github.event.head_commit.message, '[skip publish]') &&
      github.actor != 'dependabot[bot]'
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
        with:
          versionSpec: "6.x"

      - id: gitversion
        uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          # No registry-url: prevents setup-node from creating .npmrc and exporting
          # NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX' (placeholder). Without _authToken
          # in config, npm detects the GitHub Actions OIDC environment and performs its
          # own internal token exchange with the npm registry (Trusted Publisher flow).

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate-errors
      - run: npm run build

      - name: Set package version
        run: npm version ${{ needs.version.outputs.semver }} --no-git-tag-version

      - name: Upgrade npm to v11 for OIDC Trusted Publisher support
        # npm <= v10 has NO built-in OIDC Trusted Publisher support (confirmed via source analysis).
        # npm v11 added lib/utils/oidc.js which automatically:
        #   1. Fetches GitHub OIDC JWT (audience='npm:registry.npmjs.org')
        #   2. Exchanges it at /-/npm/v1/oidc/token/exchange/package/<pkg>
        #   3. Sets the short-lived token in config before the noCreds check
        # Requires: id-token: write permission (already set on this job).
        run: npm install -g npm@11

      - name: Publish to npm
        # npm v11 handles OIDC Trusted Publisher token exchange automatically.
        run: npm publish --access public --provenance

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "v${{ needs.version.outputs.semver }}"
          git push origin "v${{ needs.version.outputs.semver }}"

      - name: Create GitHub Release
        run: gh release create "v${{ needs.version.outputs.semver }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
