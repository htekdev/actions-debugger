name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      !contains(github.event.head_commit.message, '[skip publish]') &&
      github.actor != 'dependabot[bot]'
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
        with:
          versionSpec: "6.x"

      - id: gitversion
        uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          # No registry-url: prevents setup-node from creating .npmrc and exporting
          # NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX' (placeholder). Without _authToken
          # in config, npm detects the GitHub Actions OIDC environment and performs its
          # own internal token exchange with the npm registry (Trusted Publisher flow).

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate-errors
      - run: npm run build

      - name: Set package version
        run: npm version ${{ needs.version.outputs.semver }} --no-git-tag-version

      - name: Debug npm auth environment
        run: |
          echo "=== npm version ===" && npm --version
          echo "=== NODE_AUTH_TOKEN set: $([ -n "${NODE_AUTH_TOKEN}" ] && echo YES || echo NO) ==="
          echo "=== NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN} chars ==="
          echo "=== NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG} ==="
          if [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            echo "=== .npmrc contents (tokens masked) ==="
            sed 's/_authToken=.*//' "${NPM_CONFIG_USERCONFIG}"
          else
            echo "=== No .npmrc file found at NPM_CONFIG_USERCONFIG ==="
          fi
          echo "=== GITHUB_ACTIONS: ${GITHUB_ACTIONS} ==="
          echo "=== ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ] && echo YES || echo NO) ==="
          npm config list 2>&1 | grep -v '_authToken'

      - name: Publish to npm
        id: npm-publish
        continue-on-error: true
        run: npm publish --access public --provenance --verbose 2>&1
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      - name: Show npm debug log
        if: always()
        run: |
          LOG_DIR="$HOME/.npm/_logs"
          LATEST_LOG=$(ls -t "$LOG_DIR"/*.log 2>/dev/null | head -1)
          if [ -n "$LATEST_LOG" ]; then
            echo "=== NPM DEBUG LOG: $LATEST_LOG ==="
            cat "$LATEST_LOG"
          else
            echo "No npm debug log found"
          fi

      - name: Fail if publish failed
        if: steps.npm-publish.outcome == 'failure'
        run: exit 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "v${{ needs.version.outputs.semver }}"
          git push origin "v${{ needs.version.outputs.semver }}"

      - name: Create GitHub Release
        run: gh release create "v${{ needs.version.outputs.semver }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
