name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      !contains(github.event.head_commit.message, '[skip publish]') &&
      github.actor != 'dependabot[bot]'
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
        with:
          versionSpec: "6.x"

      - id: gitversion
        uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate-errors
      - run: npm run build

      - name: Set package version
        run: npm version ${{ needs.version.outputs.semver }} --no-git-tag-version

      - name: Fetch OIDC token for npm Trusted Publisher
        id: npm-auth
        # actions/setup-node sets NODE_AUTH_TOKEN to a placeholder ('XXXXX-XXXXX-XXXXX-XXXXX').
        # npm's OIDC Trusted Publisher auth requires the REAL GitHub OIDC JWT (audience=npm)
        # as NODE_AUTH_TOKEN. npm sends it to the registry; the registry validates the claims
        # against the Trusted Publisher configuration and authorizes the publish.
        # Do NOT remove _authToken from .npmrc — that causes ENEEDAUTH (npm pre-flight fails
        # before ever sending a request, so the OIDC challenge flow never fires).
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" | jq -r '.value')
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm-auth.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag "v${{ needs.version.outputs.semver }}"
          git push origin "v${{ needs.version.outputs.semver }}"

      - name: Create GitHub Release
        run: gh release create "v${{ needs.version.outputs.semver }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
