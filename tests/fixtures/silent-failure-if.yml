# This fixture has an if: condition that always evaluates to true
name: Silent Failure
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conditional step
        if: |
          ${{ github.event_name == 'push' }}
        run: echo "This always runs"
